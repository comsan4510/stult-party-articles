<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">週次KPIレビュー</title><desc id="d">数字、声、次の一手を30分で確認。</desc><rect width="1200" height="650" rx="34" fill="#0d192d"/><g font-family="sans-serif"><text x="62" y="68" fill="#f7f9ff" font-size="34" font-weight="700">週次レビューは30分、一度に一施策</text><g transform="translate(60 120)"><rect width="1080" height="390" rx="26" fill="#132239"/><g font-size="20"><g transform="translate(35 40)"><circle cx="30" cy="25" r="25" fill="#315f61"/><text x="30" y="33" text-anchor="middle" fill="white" font-weight="700">1</text><text x="80" y="33" fill="white">最も落ちた段階はどこか</text></g><g transform="translate(35 105)"><circle cx="30" cy="25" r="25" fill="#314d78"/><text x="30" y="33" text-anchor="middle" fill="white" font-weight="700">2</text><text x="80" y="33" fill="white">良化・悪化した指標は何か</text></g><g transform="translate(35 170)"><circle cx="30" cy="25" r="25" fill="#65503d"/><text x="30" y="33" text-anchor="middle" fill="white" font-weight="700">3</text><text x="80" y="33" fill="white">参加者の声と一致するか</text></g><g transform="translate(35 235)"><circle cx="30" cy="25" r="25" fill="#60446c"/><text x="30" y="33" text-anchor="middle" fill="white" font-weight="700">4</text><text x="80" y="33" fill="white">来週一つだけ何を変えるか</text></g><rect x="620" y="45" width="405" height="270" rx="22" fill="#21334e"/><text x="650" y="90" fill="#76ddd5" font-size="21" font-weight="700">施策カード</text><text x="650" y="140" fill="white">何を変える</text><path d="M650 155H995" stroke="#516a89"/><text x="650" y="200" fill="white">対象KPI</text><path d="M650 215H995" stroke="#516a89"/><text x="650" y="260" fill="white">期間・判断条件</text><path d="M650 275H995" stroke="#516a89"/></g></g><text x="600" y="575" text-anchor="middle" fill="#f2c16c" font-size="20" font-weight="700">数字 → 声 → 一施策 → 次週検証</text></g></svg>

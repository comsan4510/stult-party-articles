<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">参加週別コホート表</title><desc id="d">新規参加者の初回行動と再参加率を週別に比較。</desc><rect width="1200" height="650" rx="34" fill="#0d192d"/><g font-family="sans-serif"><text x="62" y="68" fill="#f7f9ff" font-size="34" font-weight="700">常連の平均に、新規の問題を隠さない</text><g transform="translate(65 120)" text-anchor="middle"><rect width="1070" height="380" rx="22" fill="#132239"/><g font-size="18"><g fill="#76ddd5" font-weight="700"><text x="120" y="55">参加週</text><text x="345" y="55">新規参加</text><text x="570" y="55">初回行動</text><text x="795" y="55">7日再参加</text><text x="970" y="55">率</text></g><g fill="#e0e7f2"><text x="120" y="125">7月 第1週</text><text x="345" y="125">20</text><text x="570" y="125">12</text><text x="795" y="125">6</text><text x="970" y="125">50%</text><text x="120" y="205">7月 第2週</text><text x="345" y="205">18</text><text x="570" y="205">13</text><text x="795" y="205">8</text><text x="970" y="205">62%</text></g><rect x="25" y="245" width="1020" height="80" rx="15" fill="#593f4b"/><g fill="white"><text x="120" y="295">7月 第3週</text><text x="345" y="295">25</text><text x="570" y="295">14</text><text x="795" y="295">5</text><text x="970" y="295">36%</text></g><path d="M25 80H1045M25 160H1045M25 240H1045" stroke="#344d6a"/></g></g><text x="600" y="570" text-anchor="middle" fill="#f2c16c" font-size="20" font-weight="700">落ちた週に変えた導線・招待元・時間帯を確認する</text></g></svg>

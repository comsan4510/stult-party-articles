<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">KPIイベントデータ構造</title><desc id="d">行動イベントの名前と共通項目。</desc><rect width="1200" height="650" rx="34" fill="#0d192d"/><g font-family="sans-serif"><text x="62" y="68" fill="#f7f9ff" font-size="34" font-weight="700">指標ではなく、行動イベントを保存する</text><g transform="translate(60 110)"><rect width="1080" height="430" rx="25" fill="#121f35" stroke="#3c5b7d" stroke-width="2"/><g font-family="monospace" font-size="18"><text x="35" y="55" fill="#76ddd5" font-size="21" font-weight="700">event_name</text><text x="380" y="55" fill="#76ddd5" font-size="21" font-weight="700">common fields</text><g fill="#dbe3f0"><text x="35" y="100">community_joined</text><text x="35" y="140">recruitment_created</text><text x="35" y="180">recruitment_joined</text><text x="35" y="220">first_chat_sent</text><text x="35" y="260">first_voice_joined</text><text x="35" y="300">recruitment_completed</text><text x="380" y="100">event_id</text><text x="380" y="140">occurred_at</text><text x="380" y="180">actor_id</text><text x="380" y="220">community_id</text><text x="680" y="100">recruitment_id</text><text x="680" y="140">game_id</text><text x="680" y="180">source</text></g><path d="M340 25V340" stroke="#344d6a" stroke-width="2"/><rect x="35" y="350" width="970" height="55" rx="15" fill="#22344f"/><text x="520" y="385" text-anchor="middle" fill="#f2c16c" font-family="sans-serif" font-size="18" font-weight="700">event_idで重複排除、occurred_atで本来の順序を再現</text></g></g><text x="600" y="595" text-anchor="middle" fill="#b8c4d8" font-size="19">集計式が変わっても、元イベントから再計算できる</text></g></svg>

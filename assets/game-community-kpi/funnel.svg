<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">コミュニティ参加ファネル</title><desc id="d">参加から再参加までの5段階。</desc><rect width="1200" height="650" rx="34" fill="#0d192d"/><g font-family="sans-serif"><text x="62" y="68" fill="#f7f9ff" font-size="34" font-weight="700">最も減る段階を改善する</text><g text-anchor="middle" font-weight="700"><path d="M150 130H1050L970 210H230z" fill="#315f61"/><text x="600" y="180" fill="white" font-size="22">コミュニティ参加</text><path d="M230 225H970L900 305H300z" fill="#32606f"/><text x="600" y="275" fill="white" font-size="22">募集を見つける</text><path d="M300 320H900L835 400H365z" fill="#314d78"/><text x="600" y="370" fill="white" font-size="22">募集へ参加表明</text><path d="M365 415H835L780 495H420z" fill="#65503d"/><text x="600" y="465" fill="white" font-size="22">チャット・ボイスへ参加</text><path d="M420 510H780L730 590H470z" fill="#60446c"/><text x="600" y="560" fill="white" font-size="22">別の日に再参加</text></g><path d="M1080 145V575" stroke="#e2aa65" stroke-width="4"/><text x="1105" y="365" fill="#f2c16c" font-size="19" transform="rotate(90 1105 365)">離脱が大きい場所を一つ選ぶ</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">5つのKPI計算式</title><desc id="d">募集作成、初回参加、成立、再参加、運営時間の式。</desc><rect width="1200" height="650" rx="34" fill="#0d192d"/><g font-family="sans-serif"><text x="62" y="68" fill="#f7f9ff" font-size="34" font-weight="700">最初は5つだけ追う</text><g transform="translate(60 110)" font-size="18"><g><rect width="520" height="115" rx="20" fill="#315f61"/><text x="28" y="42" fill="#79ddd5" font-size="21" font-weight="700">募集作成率</text><text x="28" y="78" fill="white">募集作成者 ÷ 活動メンバー</text></g><g transform="translate(560)"><rect width="520" height="115" rx="20" fill="#314d78"/><text x="28" y="42" fill="#8bb1ef" font-size="21" font-weight="700">初回参加率</text><text x="28" y="78" fill="white">72時間以内の初回行動者 ÷ 新規参加者</text></g><g transform="translate(0 145)"><rect width="520" height="115" rx="20" fill="#65503d"/><text x="28" y="42" fill="#e5b36f" font-size="21" font-weight="700">募集成立率</text><text x="28" y="78" fill="white">必要人数に達した募集 ÷ 全募集</text></g><g transform="translate(560 145)"><rect width="520" height="115" rx="20" fill="#60446c"/><text x="28" y="42" fill="#ce9de0" font-size="21" font-weight="700">7日再参加率</text><text x="28" y="78" fill="white">7日以内の再活動者 ÷ 初回行動者</text></g><g transform="translate(280 290)"><rect width="520" height="115" rx="20" fill="#3e556d"/><text x="28" y="42" fill="#9dc2e3" font-size="21" font-weight="700">成立1件あたり運営時間</text><text x="28" y="78" fill="white">運営時間 ÷ 成立募集数</text></g></g><text x="600" y="585" text-anchor="middle" fill="#f2c16c" font-size="20" font-weight="700">分母・分子・期間を文章でも固定する</text></g></svg>

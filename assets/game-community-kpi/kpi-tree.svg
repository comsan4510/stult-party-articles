<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">KPIツリー</title><desc id="d">メンバー数と実際の参加価値を分ける。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#7188ac"/></marker></defs><rect width="1200" height="650" rx="34" fill="#0d192d"/><g font-family="sans-serif"><text x="62" y="70" fill="#f7f9ff" font-size="34" font-weight="700">大きさと、動いている価値を分ける</text><rect x="440" y="115" width="320" height="85" rx="24" fill="#273c59"/><text x="600" y="167" text-anchor="middle" fill="white" font-size="24" font-weight="700">コミュニティの健全性</text><path d="M520 200L305 300M680 200L895 300" stroke="#7188ac" stroke-width="4" marker-end="url(#a)"/><g text-anchor="middle"><rect x="130" y="315" width="350" height="190" rx="26" fill="#4d596d"/><text x="305" y="370" fill="white" font-size="24" font-weight="700">入口の規模</text><text x="305" y="420" fill="#c5cede" font-size="20">累計メンバー数</text><text x="305" y="455" fill="#c5cede" font-size="20">新規参加者数</text><rect x="720" y="315" width="350" height="190" rx="26" fill="#315f61" stroke="#77d6ce" stroke-width="3"/><text x="895" y="370" fill="white" font-size="24" font-weight="700">実際の参加価値</text><text x="895" y="420" fill="#c8e5e2" font-size="20">募集成立</text><text x="895" y="455" fill="#c8e5e2" font-size="20">初回参加・再参加</text></g><text x="600" y="575" text-anchor="middle" fill="#f2c16c" font-size="20" font-weight="700">運営改善では右側を主指標にする</text></g></svg>

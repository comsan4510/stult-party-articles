<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">ゲームコミュニティのKPI設計</title><desc id="d">募集から参加、再参加までの流れを測る図。</desc><rect width="1440" height="810" fill="#091426"/><path d="M0 160H1440M0 320H1440M0 480H1440M0 640H1440M240 0V810M480 0V810M720 0V810M960 0V810M1200 0V810" stroke="#243955" opacity=".42"/><g font-family="sans-serif"><text x="82" y="100" fill="#6edbd2" font-size="21" font-weight="700" letter-spacing="4">COMMUNITY OPERATIONS</text><text x="82" y="178" fill="#f7f9ff" font-size="52" font-weight="800">人数より、</text><text x="82" y="245" fill="#f7f9ff" font-size="52" font-weight="800">「募集 → 参加 → 再参加」を測る。</text><g transform="translate(80 345)" text-anchor="middle" font-weight="700"><rect width="1280" height="245" rx="30" fill="#111f35" stroke="#375576" stroke-width="2"/><g transform="translate(85 65)"><circle cx="70" cy="60" r="56" fill="#315f61" stroke="#79d8d0" stroke-width="3"/><text x="70" y="68" fill="white" font-size="21">募集</text></g><path d="M225 125H400" stroke="#7288ab" stroke-width="6"/><g transform="translate(405 65)"><circle cx="70" cy="60" r="56" fill="#314d78" stroke="#7fa9ed" stroke-width="3"/><text x="70" y="68" fill="white" font-size="21">参加</text></g><path d="M545 125H720" stroke="#7288ab" stroke-width="6"/><g transform="translate(725 65)"><circle cx="70" cy="60" r="56" fill="#65503d" stroke="#e1ad68" stroke-width="3"/><text x="70" y="68" fill="white" font-size="21">成立</text></g><path d="M865 125H1040" stroke="#7288ab" stroke-width="6"/><g transform="translate(1045 65)"><circle cx="70" cy="60" r="56" fill="#60446c" stroke="#ca94dd" stroke-width="3"/><text x="70" y="68" fill="white" font-size="21">再参加</text></g></g><rect x="390" y="670" width="660" height="65" rx="32" fill="#1e2f49"/><text x="720" y="713" text-anchor="middle" fill="#f2c16c" font-size="21" font-weight="700">成果 × 定着 × 運営の持続可能性</text></g></svg>

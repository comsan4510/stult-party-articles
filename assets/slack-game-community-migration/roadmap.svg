<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">Slackから14日で移行するロードマップ</title><desc id="d">成功条件、構造作成、少人数テスト、希望者招待、募集切替の手順</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">14-DAY ROADMAP</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">募集を止めず、14日で中心を切り替える</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">小さく試してから、新規募集の作成先を一つにする</text><path d="M135 402H1305" stroke="#29465f" stroke-width="11" stroke-linecap="round"/><g font-family="sans-serif" text-anchor="middle"><g transform="translate(150 402)"><circle r="67" fill="#42304f" stroke="#c991db" stroke-width="4"/><text y="-7" fill="#c991db" font-size="17">DAY 0</text><text y="28" fill="#f4f7fb" font-size="23" font-weight="700">条件固定</text><text y="121" fill="#f4f7fb" font-size="20" font-weight="700">成功を数値化</text></g><g transform="translate(430 402)"><circle r="67" fill="#24395e" stroke="#7da8ef" stroke-width="4"/><text y="-7" fill="#7da8ef" font-size="17">DAY 1–3</text><text y="28" fill="#f4f7fb" font-size="23" font-weight="700">構造作成</text><text y="121" fill="#f4f7fb" font-size="20" font-weight="700">運営者で準備</text></g><g transform="translate(710 402)"><circle r="67" fill="#4a3822" stroke="#f0bd63" stroke-width="4"/><text y="-7" fill="#f0bd63" font-size="17">DAY 4–7</text><text y="28" fill="#f4f7fb" font-size="23" font-weight="700">実地テスト</text><text y="121" fill="#f4f7fb" font-size="20" font-weight="700">5人で遊ぶ</text></g><g transform="translate(990 402)"><circle r="67" fill="#153f49" stroke="#61dbc5" stroke-width="4"/><text y="-7" fill="#61dbc5" font-size="17">DAY 8–10</text><text y="28" fill="#f4f7fb" font-size="23" font-weight="700">希望者招待</text><text y="121" fill="#f4f7fb" font-size="20" font-weight="700">入口を案内</text></g><g transform="translate(1270 402)"><circle r="67" fill="#204235" stroke="#79dfac" stroke-width="4"/><text y="-7" fill="#79dfac" font-size="17">DAY 11–14</text><text y="28" fill="#f4f7fb" font-size="23" font-weight="700">募集切替</text><text y="121" fill="#f4f7fb" font-size="20" font-weight="700">受付を一か所へ</text></g></g><rect x="290" y="655" width="860" height="70" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="699" text-anchor="middle" fill="#f4f7fb" font-family="sans-serif" font-size="22" font-weight="700">Slackは案内・業務用に残し、同じ募集を二重受付しない</text></svg>

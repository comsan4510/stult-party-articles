<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">Slackゲームコミュニティ移行の5つの兆候</title><desc id="d">募集書式、参加者差異、ボイス分散、説明負担、費用判断の兆候</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">FIVE SIGNALS</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">設定を足す前に、分断の兆候を見る</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">二つ以上なら参加者向け活動を別の場所で試す</text><g font-family="sans-serif"><g fill="#10253a" stroke-width="3"><rect x="90" y="238" width="390" height="140" rx="20" stroke="#61dbc5"/><rect x="525" y="238" width="390" height="140" rx="20" stroke="#7da8ef"/><rect x="960" y="238" width="390" height="140" rx="20" stroke="#f0bd63"/><rect x="265" y="420" width="435" height="140" rx="20" stroke="#c991db"/><rect x="740" y="420" width="435" height="140" rx="20" stroke="#79dfac"/></g><g font-size="18" font-weight="700"><text x="122" y="278" fill="#61dbc5">01</text><text x="557" y="278" fill="#7da8ef">02</text><text x="992" y="278" fill="#f0bd63">03</text><text x="297" y="460" fill="#c991db">04</text><text x="772" y="460" fill="#79dfac">05</text></g><g fill="#f4f7fb" font-size="25" font-weight="700"><text x="122" y="325">募集が自由文頼み</text><text x="557" y="325">リアクションと不一致</text><text x="992" y="325">ボイスが別サービス</text><text x="297" y="507">チャンネル説明が長い</text><text x="772" y="507">有料化を判断できない</text></g></g><rect x="300" y="645" width="840" height="70" rx="20" fill="#0e2134" stroke="#29465f"/><text x="720" y="688" text-anchor="middle" fill="#f4f7fb" font-family="sans-serif" font-size="23" font-weight="700">問題の数ではなく、毎週の募集成立を妨げるかで判断</text></svg>

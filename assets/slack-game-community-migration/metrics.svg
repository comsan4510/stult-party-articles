<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">Slack移行後に確認する4つの指標</title><desc id="d">アクティブメンバー移行率、募集移行率、プレイ到達率、二重転記時間</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">MIGRATION METRICS</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">参加人数だけで、移行成功を決めない</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">募集からプレイまでと、運営負担を同時に見る</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(85 270)"><rect width="290" height="330" rx="24" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="145" y="67" fill="#c991db" font-size="18">01</text><text x="145" y="122" fill="#f4f7fb" font-size="26" font-weight="700">活動者移行率</text><text x="145" y="180" fill="#9db0c3" font-size="18">直近30日の</text><text x="145" y="210" fill="#9db0c3" font-size="18">活動メンバーが分母</text><circle cx="145" cy="272" r="27" fill="#42304f"/><path d="M128 272h34" stroke="#c991db" stroke-width="5"/></g><g transform="translate(415 270)"><rect width="290" height="330" rx="24" fill="#10253a" stroke="#7da8ef" stroke-width="3"/><text x="145" y="67" fill="#7da8ef" font-size="18">02</text><text x="145" y="122" fill="#f4f7fb" font-size="26" font-weight="700">募集移行率</text><text x="145" y="180" fill="#9db0c3" font-size="18">新規募集の</text><text x="145" y="210" fill="#9db0c3" font-size="18">作成先を確認</text><circle cx="145" cy="272" r="27" fill="#24395e"/><path d="m130 272 11 12 21-25" fill="none" stroke="#7da8ef" stroke-width="5"/></g><g transform="translate(745 270)"><rect width="290" height="330" rx="24" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="145" y="67" fill="#61dbc5" font-size="18">03</text><text x="145" y="122" fill="#f4f7fb" font-size="26" font-weight="700">プレイ到達率</text><text x="145" y="180" fill="#9db0c3" font-size="18">参加表明から</text><text x="145" y="210" fill="#9db0c3" font-size="18">実際に遊べた割合</text><circle cx="145" cy="272" r="27" fill="#153f49"/><path d="M130 272h30M145 257v30" stroke="#61dbc5" stroke-width="5"/></g><g transform="translate(1075 270)"><rect width="290" height="330" rx="24" fill="#10253a" stroke="#f0bd63" stroke-width="3"/><text x="145" y="67" fill="#f0bd63" font-size="18">04</text><text x="145" y="122" fill="#f4f7fb" font-size="26" font-weight="700">二重転記時間</text><text x="145" y="180" fill="#9db0c3" font-size="18">両方へ書く時間を</text><text x="145" y="210" fill="#9db0c3" font-size="18">週単位で計測</text><circle cx="145" cy="272" r="27" fill="#4a3822"/><path d="M145 254v19l13 8" fill="none" stroke="#f0bd63" stroke-width="5" stroke-linecap="round"/></g></g><rect x="345" y="669" width="750" height="57" rx="28" fill="#153f49"/><text x="720" y="706" text-anchor="middle" fill="#61dbc5" font-family="sans-serif" font-size="21" font-weight="700">移行参加より、実際に遊べる状態を成功とする</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">Slackから持っていくものと残すもの</title><desc id="d">参加者の現在状態を移し、業務履歴と連携をSlackへ残す図</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">MIGRATION SCOPE</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">全ログではなく、現在使うものを移す</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">直近30日の活動と未来の募集を基準に棚卸し</text><g font-family="sans-serif"><g transform="translate(90 255)"><rect width="570" height="390" rx="27" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="40" y="60" fill="#61dbc5" font-size="19" font-weight="700">MOVE</text><text x="40" y="115" fill="#f4f7fb" font-size="32" font-weight="700">Stult Partyへ持っていく</text><text x="40" y="185" fill="#c4d0dc" font-size="21">✓ 直近30日の活動メンバー</text><text x="40" y="238" fill="#c4d0dc" font-size="21">✓ 移行日以降のゲーム募集</text><text x="40" y="291" fill="#c4d0dc" font-size="21">✓ 現行ルールと参加方法</text><text x="40" y="344" fill="#c4d0dc" font-size="21">✓ 必要最小限の会話場所</text></g><g transform="translate(780 255)"><rect width="570" height="390" rx="27" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="40" y="60" fill="#c991db" font-size="19" font-weight="700">KEEP / ARCHIVE</text><text x="40" y="115" fill="#f4f7fb" font-size="32" font-weight="700">Slackへ残す</text><text x="40" y="185" fill="#c4d0dc" font-size="21">✓ 運営会議と業務通知</text><text x="40" y="238" fill="#c4d0dc" font-size="21">✓ 制作物と外部アプリ連携</text><text x="40" y="291" fill="#c4d0dc" font-size="21">✓ 必要な過去資料の正本</text><text x="40" y="344" fill="#c4d0dc" font-size="21">× 終了済み雑談の全複製</text></g></g><path d="M690 450h60" stroke="#7890a8" stroke-width="5" stroke-dasharray="8 8"/><rect x="365" y="704" width="710" height="54" rx="27" fill="#153f49"/><text x="720" y="739" text-anchor="middle" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700">移行対象外を先に決めると、全廃の必要はなくなる</text></svg>

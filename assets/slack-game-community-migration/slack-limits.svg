<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">Slack移行判断に影響する3つの公式仕様</title><desc id="d">フリープランの履歴、ハドル、エクスポート範囲</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">CURRENT LIMITS</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">移行前に確認するSlackの3仕様</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">フリープランとデータ範囲を公式情報で確認</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(80 270)"><rect width="400" height="370" rx="26" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="200" y="72" fill="#c991db" font-size="19" font-weight="700">MESSAGE HISTORY</text><text x="200" y="165" fill="#f4f7fb" font-size="72" font-weight="700">90日</text><text x="200" y="220" fill="#c4d0dc" font-size="21">表示・検索できる履歴</text><text x="200" y="280" fill="#9db0c3" font-size="18">1年以上のデータは</text><text x="200" y="312" fill="#9db0c3" font-size="18">削除対象</text></g><g transform="translate(520 270)"><rect width="400" height="370" rx="26" fill="#10253a" stroke="#f0bd63" stroke-width="3"/><text x="200" y="72" fill="#f0bd63" font-size="19" font-weight="700">FREE HUDDLE</text><text x="200" y="165" fill="#f4f7fb" font-size="72" font-weight="700">2人</text><text x="200" y="220" fill="#c4d0dc" font-size="21">最大参加人数</text><text x="200" y="280" fill="#9db0c3" font-size="18">30分の制限付き</text><text x="200" y="312" fill="#9db0c3" font-size="18">グループプレイとは別用途</text></g><g transform="translate(960 270)"><rect width="400" height="370" rx="26" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="200" y="72" fill="#61dbc5" font-size="19" font-weight="700">EXPORT</text><text x="200" y="154" fill="#f4f7fb" font-size="38" font-weight="700">公開チャンネル</text><text x="200" y="202" fill="#f4f7fb" font-size="28" font-weight="700">JSON</text><text x="200" y="265" fill="#9db0c3" font-size="18">プライベート・DMは</text><text x="200" y="297" fill="#9db0c3" font-size="18">プランと申請条件が異なる</text></g></g><text x="720" y="722" text-anchor="middle" fill="#79dfac" font-family="sans-serif" font-size="21" font-weight="700">料金・仕様は移行実行時にも公式ページで再確認</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">Slackメッセージを募集状態へ変換するモデル</title><desc id="d">Slack投稿からゲーム、開始日時、人数、状態を抽出して未来の募集だけ再作成する</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">STATE MAPPING</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">会話ログではなく、募集の現在状態を移す</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">移行日より後のopen / filledだけを再作成</text><g font-family="sans-serif"><g transform="translate(80 250)"><rect width="420" height="380" rx="26" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="38" y="59" fill="#c991db" font-size="18" font-weight="700">SLACK MESSAGE</text><rect x="38" y="95" width="344" height="210" rx="16" fill="#0e2134"/><text x="65" y="140" fill="#f4f7fb" font-size="20">今週土曜 21:00</text><text x="65" y="183" fill="#f4f7fb" font-size="20">協力ゲーム / あと2人</text><text x="65" y="226" fill="#f4f7fb" font-size="20">ボイス任意</text><text x="65" y="269" fill="#9db0c3" font-size="18">👍 参加　△ 補欠</text><text x="38" y="350" fill="#9db0c3" font-size="17">文章とリアクションに状態が混在</text></g><g transform="translate(555 250)"><rect width="360" height="380" rx="26" fill="#10253a" stroke="#7da8ef" stroke-width="3"/><text x="35" y="59" fill="#7da8ef" font-size="18" font-weight="700">NORMALIZE</text><text x="35" y="119" fill="#f4f7fb" font-size="20">game</text><text x="175" y="119" fill="#9db0c3" font-size="18">協力ゲーム</text><text x="35" y="164" fill="#f4f7fb" font-size="20">starts_at</text><text x="175" y="164" fill="#9db0c3" font-size="18">土曜 21:00</text><text x="35" y="209" fill="#f4f7fb" font-size="20">capacity</text><text x="175" y="209" fill="#9db0c3" font-size="18">あと2人</text><text x="35" y="254" fill="#f4f7fb" font-size="20">voice</text><text x="175" y="254" fill="#9db0c3" font-size="18">任意</text><text x="35" y="299" fill="#f4f7fb" font-size="20">status</text><text x="175" y="299" fill="#79dfac" font-size="18">open</text></g><g transform="translate(970 250)"><rect width="390" height="380" rx="26" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="38" y="59" fill="#61dbc5" font-size="18" font-weight="700">RECREATE</text><text x="38" y="119" fill="#f4f7fb" font-size="29" font-weight="700">Stult Partyの募集</text><text x="38" y="186" fill="#c4d0dc" font-size="20">✓ 日時と人数が構造化</text><text x="38" y="236" fill="#c4d0dc" font-size="20">✓ 参加先を一か所へ</text><text x="38" y="286" fill="#c4d0dc" font-size="20">✓ 終了済み投稿は除外</text><text x="38" y="336" fill="#c4d0dc" font-size="20">✓ 元URLは確認用</text></g></g><g stroke="#7890a8" stroke-width="5"><path d="M500 440h43M915 440h43"/></g><g fill="#7890a8"><path d="m543 440-16-10v20z"/><path d="m958 440-16-10v20z"/></g><rect x="360" y="701" width="720" height="54" rx="27" fill="#153f49"/><text x="720" y="736" text-anchor="middle" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700">メッセージをコピーせず、次の行動に必要な項目を移す</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">Slack運営を継続するか移行するかの全体判断</title><desc id="d">業務コラボレーションはSlackへ、参加者のゲーム活動はStult Partyへ整理する図</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">SPLIT BY PURPOSE</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="42" font-weight="700">Slackを捨てず、ゲーム活動の中心を移す</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">仕事と遊びを、毎週の中心行動で分ける</text>
<g font-family="sans-serif"><g transform="translate(90 250)"><rect width="540" height="380" rx="28" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="45" y="64" fill="#c991db" font-size="19" font-weight="700">KEEP IN SLACK</text><text x="45" y="120" fill="#f4f7fb" font-size="34" font-weight="700">運営バックオフィス</text><text x="45" y="190" fill="#c4d0dc" font-size="22">✓ 運営会議</text><text x="45" y="240" fill="#c4d0dc" font-size="22">✓ 文書・制作物レビュー</text><text x="45" y="290" fill="#c4d0dc" font-size="22">✓ 外部アプリ通知</text><text x="45" y="340" fill="#c4d0dc" font-size="22">✓ 業務履歴の検索</text></g><g transform="translate(810 250)"><rect width="540" height="380" rx="28" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="45" y="64" fill="#61dbc5" font-size="19" font-weight="700">MOVE TO STULT PARTY</text><text x="45" y="120" fill="#f4f7fb" font-size="34" font-weight="700">参加者のゲーム活動</text><text x="45" y="190" fill="#c4d0dc" font-size="22">✓ ゲーム募集</text><text x="45" y="240" fill="#c4d0dc" font-size="22">✓ ゲーム別チャット</text><text x="45" y="290" fill="#c4d0dc" font-size="22">✓ プレイ用ボイス</text><text x="45" y="340" fill="#c4d0dc" font-size="22">✓ 無料で参加導線を検証</text></g></g><path d="M650 440h140" stroke="#7890a8" stroke-width="5"/><path d="m790 440-20-12v24z" fill="#7890a8"/><rect x="315" y="690" width="810" height="65" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="732" text-anchor="middle" fill="#f4f7fb" font-family="sans-serif" font-size="22" font-weight="700">全廃か継続かではなく、役割ごとに置き場所を選ぶ</text></svg>

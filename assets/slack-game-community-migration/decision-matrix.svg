<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">Slack継続・併用・移行の判断表</title><desc id="d">中心行動からSlack継続、併用、Stult Party移行を判断する表</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">DECISION MATRIX</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">人数ではなく、中心行動で決める</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">続ける・分ける・移すの三択で考える</text><g font-family="sans-serif"><g transform="translate(70 240)"><rect width="410" height="450" rx="26" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="35" y="58" fill="#c991db" font-size="18" font-weight="700">KEEP</text><text x="35" y="111" fill="#f4f7fb" font-size="31" font-weight="700">Slackを継続</text><text x="35" y="177" fill="#c4d0dc" font-size="20">中心：共同作業と文書</text><text x="35" y="227" fill="#c4d0dc" font-size="20">音声：短い打ち合わせ</text><text x="35" y="277" fill="#c4d0dc" font-size="20">連携：業務アプリが重要</text><text x="35" y="327" fill="#c4d0dc" font-size="20">費用：業務として判断可能</text><rect x="35" y="370" width="340" height="48" rx="24" fill="#352943"/><text x="205" y="401" text-anchor="middle" fill="#ead6f0" font-size="18" font-weight="700">仕事を進める場</text></g><g transform="translate(515 240)"><rect width="410" height="450" rx="26" fill="#10253a" stroke="#7da8ef" stroke-width="3"/><text x="35" y="58" fill="#7da8ef" font-size="18" font-weight="700">SPLIT</text><text x="35" y="111" fill="#f4f7fb" font-size="31" font-weight="700">二つを併用</text><text x="35" y="177" fill="#c4d0dc" font-size="20">Slack：運営業務</text><text x="35" y="227" fill="#c4d0dc" font-size="20">Stult：参加者活動</text><text x="35" y="277" fill="#c4d0dc" font-size="20">履歴：正本だけSlack</text><text x="35" y="327" fill="#c4d0dc" font-size="20">募集：一か所で受付</text><rect x="35" y="370" width="340" height="48" rx="24" fill="#182e49"/><text x="205" y="401" text-anchor="middle" fill="#d4e2f5" font-size="18" font-weight="700">業務と遊びが混在</text></g><g transform="translate(960 240)"><rect width="410" height="450" rx="26" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="35" y="58" fill="#61dbc5" font-size="18" font-weight="700">MOVE ACTIVITY</text><text x="35" y="111" fill="#f4f7fb" font-size="31" font-weight="700">参加者活動を移行</text><text x="35" y="177" fill="#c4d0dc" font-size="20">中心：ゲーム募集</text><text x="35" y="227" fill="#c4d0dc" font-size="20">音声：複数人でプレイ</text><text x="35" y="277" fill="#c4d0dc" font-size="20">導線：募集からボイス</text><text x="35" y="327" fill="#c4d0dc" font-size="20">費用：無料で検証</text><rect x="35" y="370" width="340" height="48" rx="24" fill="#153f49"/><text x="205" y="401" text-anchor="middle" fill="#d0f1eb" font-size="18" font-weight="700">一緒に遊ぶ場</text></g></g></svg>

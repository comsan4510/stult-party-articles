<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">配信・録画で別々に確認する5つの対象</title><desc id="d">音声、表示名、チャット、ゲーム画面、再利用を別々に確認する図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">FIVE CONSENT SURFACES</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">「配信OK」を5つの対象へ分解する</text><text x="72" y="174" fill="#9db0c3" font-size="22">一つの許可を、別の公開対象や再利用へ広げない</text><g transform="translate(65 270)"><rect width="250" height="300" rx="24" fill="#10253a" stroke="#8fa8c0" stroke-width="3"/><text x="30" y="55" fill="#9db0c3" font-size="17" font-weight="700">01 VOICE</text><text x="30" y="108" fill="#f4f7fb" font-size="28" font-weight="700">音声</text><text x="30" y="170" fill="#c4d0dc" font-size="19">含める</text><text x="30" y="208" fill="#c4d0dc" font-size="19">ミュート</text><text x="30" y="246" fill="#c4d0dc" font-size="19">対象外</text></g><g transform="translate(330 270)"><rect width="250" height="300" rx="24" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="30" y="55" fill="#61dbc5" font-size="17" font-weight="700">02 NAME</text><text x="30" y="108" fill="#f4f7fb" font-size="28" font-weight="700">表示名</text><text x="30" y="170" fill="#c4d0dc" font-size="19">そのまま</text><text x="30" y="208" fill="#c4d0dc" font-size="19">別名・マスク</text><text x="30" y="246" fill="#c4d0dc" font-size="19">対象外</text></g><g transform="translate(595 270)"><rect width="250" height="300" rx="24" fill="#10253a" stroke="#f0b566" stroke-width="3"/><text x="30" y="55" fill="#f0b566" font-size="17" font-weight="700">03 CHAT</text><text x="30" y="108" fill="#f4f7fb" font-size="28" font-weight="700">チャット</text><text x="30" y="170" fill="#c4d0dc" font-size="19">表示</text><text x="30" y="208" fill="#c4d0dc" font-size="19">非表示</text><text x="30" y="246" fill="#c4d0dc" font-size="19">一部マスク</text></g><g transform="translate(860 270)"><rect width="250" height="300" rx="24" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="30" y="55" fill="#c991db" font-size="17" font-weight="700">04 GAME</text><text x="30" y="108" fill="#f4f7fb" font-size="28" font-weight="700">ゲーム画面</text><text x="30" y="170" fill="#c4d0dc" font-size="19">公式規約</text><text x="30" y="208" fill="#c4d0dc" font-size="19">禁止範囲</text><text x="30" y="246" fill="#c4d0dc" font-size="19">収益化条件</text></g><g transform="translate(1125 270)"><rect width="250" height="300" rx="24" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="30" y="55" fill="#61dbc5" font-size="17" font-weight="700">05 REUSE</text><text x="30" y="108" fill="#f4f7fb" font-size="28" font-weight="700">再利用</text><text x="30" y="170" fill="#c4d0dc" font-size="19">アーカイブ</text><text x="30" y="208" fill="#c4d0dc" font-size="19">切り抜き</text><text x="30" y="246" fill="#c4d0dc" font-size="19">告知・宣伝</text></g><text x="720" y="680" text-anchor="middle" fill="#f4f7fb" font-size="22" font-weight="700">回答がない対象は、許可されたものとして扱わない</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">配信・録画ルールを検証する5つの指標</title><desc id="d">条件表示、確認完了、直前変更、意図しない露出、依頼対応を測る図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">STREAMING SAFETY METRICS</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">配信回数ではなく、条件と対応を測る</text><text x="72" y="174" fill="#9db0c3" font-size="22">月1回、認識違いが生まれた場所を確認する</text><g transform="translate(80 270)"><rect width="240" height="310" rx="24" fill="#10253a" stroke="#8fa8c0" stroke-width="3"/><text x="30" y="54" fill="#9db0c3" font-size="17" font-weight="700">01 DISCLOSE</text><text x="30" y="106" fill="#f4f7fb" font-size="26" font-weight="700">条件表示率</text><text x="30" y="170" fill="#c4d0dc" font-size="19">参加前に条件を</text><text x="30" y="208" fill="#c4d0dc" font-size="19">示した割合</text></g><g transform="translate(340 270)"><rect width="240" height="310" rx="24" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="30" y="54" fill="#61dbc5" font-size="17" font-weight="700">02 CONFIRM</text><text x="30" y="106" fill="#f4f7fb" font-size="26" font-weight="700">確認完了率</text><text x="30" y="170" fill="#c4d0dc" font-size="19">5対象の回答が</text><text x="30" y="208" fill="#c4d0dc" font-size="19">揃った割合</text></g><g transform="translate(600 270)"><rect width="240" height="310" rx="24" fill="#10253a" stroke="#f0b566" stroke-width="3"/><text x="30" y="54" fill="#f0b566" font-size="17" font-weight="700">03 CHANGE</text><text x="30" y="106" fill="#f4f7fb" font-size="26" font-weight="700">直前変更</text><text x="30" y="170" fill="#c4d0dc" font-size="19">開始前に条件が</text><text x="30" y="208" fill="#c4d0dc" font-size="19">変わった件数</text></g><g transform="translate(860 270)"><rect width="240" height="310" rx="24" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="30" y="54" fill="#c991db" font-size="17" font-weight="700">04 EXPOSURE</text><text x="30" y="106" fill="#f4f7fb" font-size="26" font-weight="700">意図しない露出</text><text x="30" y="170" fill="#c4d0dc" font-size="19">条件外の情報を</text><text x="30" y="208" fill="#c4d0dc" font-size="19">含めた件数</text></g><g transform="translate(1120 270)"><rect width="240" height="310" rx="24" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="30" y="54" fill="#61dbc5" font-size="17" font-weight="700">05 REMOVE</text><text x="30" y="106" fill="#f4f7fb" font-size="26" font-weight="700">依頼完了時間</text><text x="30" y="170" fill="#c4d0dc" font-size="19">受付から編集・</text><text x="30" y="208" fill="#c4d0dc" font-size="19">削除までの時間</text></g><rect x="300" y="665" width="840" height="64" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="707" text-anchor="middle" fill="#f4f7fb" font-size="22" font-weight="700">ゼロ件でも、相談窓口が見つかるかを確認する</text></g></svg>

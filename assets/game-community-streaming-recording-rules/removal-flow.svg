<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">配信・録画の削除依頼へ対応する5段階</title><desc id="d">受付、拡散停止、照合、対応、再発防止の順で処理する図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">REMOVAL REQUEST FLOW</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">削除依頼を受けたら、まず再利用を止める</text><text x="72" y="174" fill="#9db0c3" font-size="22">公開範囲を広げず、条件と実際の内容を照合する</text><line x1="150" y1="410" x2="1290" y2="410" stroke="#29465f" stroke-width="8"/><g text-anchor="middle"><circle cx="170" cy="410" r="55" fill="#223448" stroke="#8fa8c0" stroke-width="4"/><text x="170" y="420" fill="#f4f7fb" font-size="25" font-weight="700">1</text><text x="170" y="515" fill="#f4f7fb" font-size="24" font-weight="700">受付</text><text x="170" y="552" fill="#9db0c3" font-size="17">URL・該当時刻</text><circle cx="445" cy="410" r="55" fill="#3d3023" stroke="#f0b566" stroke-width="4"/><text x="445" y="420" fill="#f4f7fb" font-size="25" font-weight="700">2</text><text x="445" y="515" fill="#f4f7fb" font-size="24" font-weight="700">拡散停止</text><text x="445" y="552" fill="#9db0c3" font-size="17">切り抜き・再投稿</text><circle cx="720" cy="410" r="55" fill="#10253a" stroke="#61dbc5" stroke-width="4"/><text x="720" y="420" fill="#f4f7fb" font-size="25" font-weight="700">3</text><text x="720" y="515" fill="#f4f7fb" font-size="24" font-weight="700">照合</text><text x="720" y="552" fill="#9db0c3" font-size="17">条件版・公開内容</text><circle cx="995" cy="410" r="55" fill="#143b41" stroke="#61dbc5" stroke-width="4"/><text x="995" y="420" fill="#f4f7fb" font-size="25" font-weight="700">4</text><text x="995" y="515" fill="#f4f7fb" font-size="24" font-weight="700">対応</text><text x="995" y="552" fill="#9db0c3" font-size="17">編集・削除・記録</text><circle cx="1270" cy="410" r="55" fill="#35273c" stroke="#c991db" stroke-width="4"/><text x="1270" y="420" fill="#f4f7fb" font-size="25" font-weight="700">5</text><text x="1270" y="515" fill="#f4f7fb" font-size="24" font-weight="700">再発防止</text><text x="1270" y="552" fill="#9db0c3" font-size="17">ルールへ反映</text></g><rect x="330" y="665" width="780" height="64" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="707" text-anchor="middle" fill="#f4f7fb" font-size="22" font-weight="700">参加していた事実だけで、公開許可を推測しない</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">配信開始10分前の5項目チェック</title><desc id="d">配信開始前に条件、対象、対象外参加、停止合図、画面を確認する図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">10-MINUTE PREFLIGHT</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">配信ボタンを押す前に、5項目を声に出す</text><text x="72" y="174" fill="#9db0c3" font-size="22">直前参加と設定変更を、最後の確認で拾う</text><g transform="translate(100 255)"><rect width="1240" height="390" rx="30" fill="#10253a" stroke="#29465f" stroke-width="3"/><g fill="#f4f7fb" font-size="24" font-weight="700"><circle cx="85" cy="78" r="28" fill="#143b41" stroke="#61dbc5" stroke-width="3"/><text x="85" y="87" text-anchor="middle">1</text><text x="145" y="87">ライブ配信・録画を始めること</text><circle cx="85" cy="143" r="28" fill="#143b41" stroke="#61dbc5" stroke-width="3"/><text x="85" y="152" text-anchor="middle">2</text><text x="145" y="152">配信先とアーカイブの扱い</text><circle cx="85" cy="208" r="28" fill="#3d3023" stroke="#f0b566" stroke-width="3"/><text x="85" y="217" text-anchor="middle">3</text><text x="145" y="217">音声・表示名・チャットの対象</text><circle cx="685" cy="78" r="28" fill="#3d3023" stroke="#f0b566" stroke-width="3"/><text x="685" y="87" text-anchor="middle">4</text><text x="745" y="87">配信対象外で参加する方法</text><circle cx="685" cy="143" r="28" fill="#35273c" stroke="#c991db" stroke-width="3"/><text x="685" y="152" text-anchor="middle">5</text><text x="745" y="152">停止合図と連絡先</text></g><rect x="645" y="200" width="520" height="125" rx="20" fill="#0e2134" stroke="#8fa8c0" stroke-width="3"/><text x="685" y="248" fill="#9db0c3" font-size="18" font-weight="700">PREVIEW</text><text x="685" y="292" fill="#f4f7fb" font-size="22">通知・別チャット・実名が映っていないか</text></g><rect x="390" y="700" width="660" height="58" rx="16" fill="#143b41"/><text x="720" y="738" text-anchor="middle" fill="#61dbc5" font-size="21" font-weight="700">確認が終わるまで配信を開始しない</text></g></svg>

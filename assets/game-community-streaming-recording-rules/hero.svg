<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">配信前の条件提示から公開後の対応までの全体像</title><desc id="d">募集、同意、開始前確認、配信、公開後対応の流れ</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">STREAMING WITH CONSENT</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">公開範囲を選べる募集から、安心な配信は始まる</text><text x="72" y="174" fill="#9db0c3" font-size="22">募集・確認・配信・公開後対応を一つの運営フローにする</text><g text-anchor="middle"><g transform="translate(80 295)"><circle cx="120" cy="120" r="105" fill="#10253a" stroke="#8fa8c0" stroke-width="4"/><text x="120" y="110" fill="#9db0c3" font-size="18" font-weight="700">01 RECRUIT</text><text x="120" y="150" fill="#f4f7fb" font-size="27" font-weight="700">条件表示</text></g><g transform="translate(360 295)"><circle cx="120" cy="120" r="105" fill="#10253a" stroke="#f0b566" stroke-width="4"/><text x="120" y="110" fill="#f0b566" font-size="18" font-weight="700">02 CONSENT</text><text x="120" y="150" fill="#f4f7fb" font-size="27" font-weight="700">個別確認</text></g><g transform="translate(640 295)"><circle cx="120" cy="120" r="105" fill="#10253a" stroke="#61dbc5" stroke-width="4"/><text x="120" y="110" fill="#61dbc5" font-size="18" font-weight="700">03 CHECK</text><text x="120" y="150" fill="#f4f7fb" font-size="27" font-weight="700">開始前確認</text></g><g transform="translate(920 295)"><circle cx="120" cy="120" r="105" fill="#10253a" stroke="#61dbc5" stroke-width="4"/><text x="120" y="110" fill="#61dbc5" font-size="18" font-weight="700">04 STREAM</text><text x="120" y="150" fill="#f4f7fb" font-size="27" font-weight="700">配信・録画</text></g><g transform="translate(1200 295)"><circle cx="120" cy="120" r="105" fill="#10253a" stroke="#c991db" stroke-width="4"/><text x="120" y="110" fill="#c991db" font-size="18" font-weight="700">05 SUPPORT</text><text x="120" y="150" fill="#f4f7fb" font-size="27" font-weight="700">公開後対応</text></g></g><g stroke="#7890a8" stroke-width="5"><path d="M305 415h70"/><path d="M585 415h70"/><path d="M865 415h70"/><path d="M1145 415h70"/></g><rect x="310" y="660" width="820" height="66" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="702" text-anchor="middle" fill="#f4f7fb" font-size="22" font-weight="700">配信なしを含む選択肢を、参加前に見せる</text></g></svg>

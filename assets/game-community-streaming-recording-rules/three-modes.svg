<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">配信なし・録画のみ・ライブ配信の判断表</title><desc id="d">募集を三つの公開モードに分けて条件を示す図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">THREE RECRUITMENT MODES</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">参加前に、公開範囲を見分けられるようにする</text><text x="72" y="174" fill="#9db0c3" font-size="22">配信の有無を説明文の末尾へ埋めない</text><g transform="translate(90 260)"><rect width="390" height="350" rx="28" fill="#10253a" stroke="#8fa8c0" stroke-width="3"/><text x="42" y="62" fill="#9db0c3" font-size="18" font-weight="700">MODE 01</text><text x="42" y="122" fill="#f4f7fb" font-size="34" font-weight="700">配信・録画なし</text><text x="42" y="190" fill="#c4d0dc" font-size="21">公開を望まない人も参加</text><text x="42" y="236" fill="#c4d0dc" font-size="21">カメラ・録画を使わない</text><rect x="42" y="285" width="306" height="44" rx="12" fill="#223448"/><text x="195" y="315" text-anchor="middle" fill="#9db0c3" font-size="19" font-weight="700">PRIVATE PLAY</text></g><g transform="translate(525 260)"><rect width="390" height="350" rx="28" fill="#10253a" stroke="#f0b566" stroke-width="3"/><text x="42" y="62" fill="#f0b566" font-size="18" font-weight="700">MODE 02</text><text x="42" y="122" fill="#f4f7fb" font-size="34" font-weight="700">録画のみ</text><text x="42" y="190" fill="#c4d0dc" font-size="21">閲覧者と保存期間を限定</text><text x="42" y="236" fill="#c4d0dc" font-size="21">公開変更は再確認</text><rect x="42" y="285" width="306" height="44" rx="12" fill="#3d3023"/><text x="195" y="315" text-anchor="middle" fill="#f0b566" font-size="19" font-weight="700">RECORD ONLY</text></g><g transform="translate(960 260)"><rect width="390" height="350" rx="28" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="42" y="62" fill="#61dbc5" font-size="18" font-weight="700">MODE 03</text><text x="42" y="122" fill="#f4f7fb" font-size="34" font-weight="700">ライブ配信あり</text><text x="42" y="190" fill="#c4d0dc" font-size="21">配信先・対象を表示</text><text x="42" y="236" fill="#c4d0dc" font-size="21">アーカイブ・再利用も確認</text><rect x="42" y="285" width="306" height="44" rx="12" fill="#143b41"/><text x="195" y="315" text-anchor="middle" fill="#61dbc5" font-size="19" font-weight="700">LIVE STREAM</text></g><text x="720" y="700" text-anchor="middle" fill="#f4f7fb" font-size="22" font-weight="700">途中でモードを変えるときは、変更後の条件で再確認する</text></g></svg>

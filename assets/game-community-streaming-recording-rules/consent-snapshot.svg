<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">募集単位で保存する配信同意スナップショット</title><desc id="d">募集ID、条件版、参加者の選択を組にして保存する図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">CONSENT SNAPSHOT</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">同意はプロフィールではなく、募集と条件の組で残す</text><text x="72" y="174" fill="#9db0c3" font-size="22">用途が変われば、古い「OK」を使い回さない</text><rect x="90" y="250" width="1260" height="410" rx="30" fill="#10253a" stroke="#29465f" stroke-width="3"/><g transform="translate(135 295)"><rect width="350" height="315" rx="24" fill="#0e2134" stroke="#61dbc5" stroke-width="3"/><text x="35" y="55" fill="#61dbc5" font-size="18" font-weight="700">CONTEXT</text><text x="35" y="110" fill="#f4f7fb" font-size="25" font-weight="700">募集と条件</text><g fill="#c4d0dc" font-size="20"><text x="35" y="166">recruitment_id</text><text x="35" y="208">policy_version</text><text x="35" y="250">配信先・収益化</text><text x="35" y="292">確認日時</text></g></g><path d="M485 452h150" stroke="#7890a8" stroke-width="6"/><path d="m635 452-22-13v26z" fill="#7890a8"/><g transform="translate(635 295)"><rect width="670" height="315" rx="24" fill="#0e2134" stroke="#f0b566" stroke-width="3"/><text x="35" y="55" fill="#f0b566" font-size="18" font-weight="700">PARTICIPANT CHOICES</text><text x="35" y="110" fill="#f4f7fb" font-size="25" font-weight="700">参加者ごとの選択</text><g fill="#c4d0dc" font-size="20"><text x="35" y="166">音声　allow / mute / not_included</text><text x="35" y="208">表示名　allow / mask / not_included</text><text x="35" y="250">アーカイブ　public / limited / none</text><text x="35" y="292">切り抜き　allow / ask_again / deny</text></g></g><rect x="410" y="700" width="620" height="58" rx="16" fill="#3d3023"/><text x="720" y="738" text-anchor="middle" fill="#f0b566" font-size="21" font-weight="700">条件の版が変わったら再確認</text></g></svg>

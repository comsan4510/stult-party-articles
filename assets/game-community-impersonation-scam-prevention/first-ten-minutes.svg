<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">発見後10分の初動</title><desc id="d">告知、証拠保全、接触状況別案内のタイムライン</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">FIRST 10 MINUTES</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">犯人特定より、接触者を減らす</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">短い告知・保全・状況別案内を並行</text><g font-family="sans-serif"><rect x="90" y="270" width="360" height="330" rx="24" fill="#102d40" stroke="#45e0c5" stroke-width="3"/><text x="135" y="330" fill="#45e0c5" font-size="22" font-weight="700">0–2分</text><text x="135" y="380" fill="#fff" font-size="25" font-weight="700">公式性を否定</text><text x="135" y="435" fill="#dbe7ef" font-size="18">リンクを開かない</text><text x="135" y="475" fill="#dbe7ef" font-size="18">公式確認先を掲示</text><rect x="540" y="270" width="360" height="330" rx="24" fill="#102d40" stroke="#ffbd69" stroke-width="3"/><text x="585" y="330" fill="#ffbd69" font-size="22" font-weight="700">2–5分</text><text x="585" y="380" fill="#fff" font-size="25" font-weight="700">保全・制限</text><text x="585" y="435" fill="#dbe7ef" font-size="18">送信者・時刻・実URL</text><text x="585" y="475" fill="#dbe7ef" font-size="18">非公開化・報告</text><rect x="990" y="270" width="360" height="330" rx="24" fill="#102d40" stroke="#f17a8e" stroke-width="3"/><text x="1035" y="330" fill="#f17a8e" font-size="22" font-weight="700">5–10分</text><text x="1035" y="380" fill="#fff" font-size="25" font-weight="700">状況別に案内</text><text x="1035" y="435" fill="#dbe7ef" font-size="18">閲覧・クリック・入力</text><text x="1035" y="475" fill="#dbe7ef" font-size="18">送金で対応を分ける</text></g><line x1="120" y1="675" x2="1320" y2="675" stroke="#34566c" stroke-width="5"/><circle cx="120" cy="675" r="10" fill="#45e0c5"/><circle cx="1320" cy="675" r="10" fill="#f17a8e"/><text x="720" y="725" fill="#fff" font-family="sans-serif" font-size="21" text-anchor="middle">確認した事実と次回更新時刻を伝える</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">予防から復旧までの状態遷移</title><desc id="d">検知、封じ込め、注意喚起、復旧確認、再発防止の状態</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607f94"/></marker></defs><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">INCIDENT STATES</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">「復旧しました」を一つの判断にしない</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">状態ごとに完了条件と担当者を置く</text><g stroke="#607f94" stroke-width="4" marker-end="url(#a)"><line x1="300" y1="405" x2="370" y2="405"/><line x1="560" y1="405" x2="630" y2="405"/><line x1="820" y1="405" x2="890" y2="405"/><line x1="1080" y1="405" x2="1150" y2="405"/></g><g font-family="sans-serif"><g fill="#102d40" stroke-width="3"><rect x="80" y="330" width="220" height="150" rx="20" stroke="#45e0c5"/><rect x="370" y="330" width="190" height="150" rx="20" stroke="#6ca8ff"/><rect x="630" y="330" width="190" height="150" rx="20" stroke="#ffbd69"/><rect x="890" y="330" width="190" height="150" rx="20" stroke="#f17a8e"/><rect x="1150" y="330" width="210" height="150" rx="20" stroke="#7fdb8a"/></g><g text-anchor="middle" font-weight="700"><text x="190" y="390" fill="#45e0c5" font-size="20">DETECTED</text><text x="190" y="430" fill="#fff" font-size="18">検知</text><text x="465" y="390" fill="#6ca8ff" font-size="20">CONTAINED</text><text x="465" y="430" fill="#fff" font-size="18">封じ込め</text><text x="725" y="390" fill="#ffbd69" font-size="20">NOTIFIED</text><text x="725" y="430" fill="#fff" font-size="18">注意喚起</text><text x="985" y="390" fill="#f17a8e" font-size="20">VERIFIED</text><text x="985" y="430" fill="#fff" font-size="18">復旧確認</text><text x="1255" y="390" fill="#7fdb8a" font-size="20">IMPROVED</text><text x="1255" y="430" fill="#fff" font-size="18">再発防止</text></g></g><rect x="320" y="610" width="800" height="76" rx="18" fill="#0d2b3d"/><text x="720" y="657" fill="#fff" font-family="sans-serif" font-size="21" text-anchor="middle">各状態で「誰が・何を確認したか」を残す</text></svg>

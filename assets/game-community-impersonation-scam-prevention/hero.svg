<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">なりすまし対策の全体像</title><desc id="d">疑わしいDMから公式経路へ戻る確認導線</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607f94"/></marker></defs><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">IMPERSONATION DEFENSE</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">DMの見た目ではなく、公式経路で確認する</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">本物を当てさせず、確認手順を固定する</text><g stroke="#607f94" stroke-width="4" marker-end="url(#a)"><line x1="380" y1="410" x2="520" y2="410"/><line x1="900" y1="410" x2="1040" y2="410"/></g><g font-family="sans-serif"><rect x="90" y="300" width="290" height="220" rx="26" fill="#102d40" stroke="#f17a8e" stroke-width="3"/><text x="235" y="365" fill="#f17a8e" font-size="23" text-anchor="middle" font-weight="700">疑わしいDM</text><text x="235" y="415" fill="#fff" font-size="19" text-anchor="middle">急がせる・リンク・送金</text><text x="235" y="455" fill="#a9bed0" font-size="18" text-anchor="middle">その場で判断しない</text><rect x="520" y="300" width="380" height="220" rx="26" fill="#102d40" stroke="#45e0c5" stroke-width="4"/><text x="710" y="365" fill="#45e0c5" font-size="23" text-anchor="middle" font-weight="700">公式確認先へ戻る</text><text x="710" y="415" fill="#fff" font-size="19" text-anchor="middle">公式チャット・URL一覧</text><text x="710" y="455" fill="#a9bed0" font-size="18" text-anchor="middle">別経路で照合</text><rect x="1040" y="300" width="310" height="220" rx="26" fill="#102d40" stroke="#7fdb8a" stroke-width="3"/><text x="1195" y="365" fill="#7fdb8a" font-size="23" text-anchor="middle" font-weight="700">安全な行動</text><text x="1195" y="415" fill="#fff" font-size="19" text-anchor="middle">開かない・入力しない</text><text x="1195" y="455" fill="#a9bed0" font-size="18" text-anchor="middle">通報して共有</text></g><rect x="300" y="625" width="840" height="76" rx="18" fill="#0d2b3d"/><text x="720" y="672" fill="#fff" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="700">参加者の注意力に依存しない</text></svg>

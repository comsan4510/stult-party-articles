<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">なりすまし通報の最小データ構造</title><desc id="d">通報記録に必要な項目と記録しない秘密情報</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">REPORT SCHEMA</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">判定より先に、必要な事実だけを保全</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">秘密情報そのものは集めない</text><g font-family="sans-serif"><rect x="120" y="240" width="750" height="430" rx="26" fill="#102d40" stroke="#45e0c5" stroke-width="3"/><text x="175" y="300" fill="#45e0c5" font-size="22" font-weight="700">記録する</text><g fill="#fff" font-size="19"><text x="175" y="355">report_id　受領日時　返信先</text><text x="175" y="405">送信者ID　受信場所　受信時刻</text><text x="175" y="455">要求行動　実URL</text><text x="175" y="505">リンクを開いたか</text><text x="175" y="555">情報を入力したか（内容は書かない）</text><text x="175" y="605">対応状態　次の一手</text></g><rect x="920" y="240" width="400" height="430" rx="26" fill="#102d40" stroke="#f17a8e" stroke-width="3"/><text x="970" y="300" fill="#f17a8e" font-size="22" font-weight="700">記録しない</text><g fill="#fff" font-size="19"><text x="970" y="370">パスワード</text><text x="970" y="425">認証コード</text><text x="970" y="480">カード番号</text><text x="970" y="535">復旧コード</text><text x="970" y="590">不要な個人情報</text></g></g></svg>

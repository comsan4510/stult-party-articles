<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">偽運営DMが使う5つの誘導</title><desc id="d">ログイン、送金、コード、ファイル、別会話への誘導</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">FIVE LURES</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">文面ではなく「要求された行動」で分類</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">手口が変わっても同じ確認手順を使う</text><g font-family="sans-serif"><g fill="#102d40" stroke="#34566c" stroke-width="2"><rect x="90" y="265" width="240" height="260" rx="22"/><rect x="345" y="265" width="240" height="260" rx="22"/><rect x="600" y="265" width="240" height="260" rx="22"/><rect x="855" y="265" width="240" height="260" rx="22"/><rect x="1110" y="265" width="240" height="260" rx="22"/></g><g text-anchor="middle" font-weight="700"><text x="210" y="335" fill="#45e0c5" font-size="22">ログイン</text><text x="465" y="335" fill="#6ca8ff" font-size="22">送金</text><text x="720" y="335" fill="#ffbd69" font-size="22">コード</text><text x="975" y="335" fill="#f17a8e" font-size="22">ファイル</text><text x="1230" y="335" fill="#ab8cff" font-size="22">別の会話</text></g><g fill="#dbe7ef" font-size="18" text-anchor="middle"><text x="210" y="395">再認証</text><text x="210" y="430">違反確認</text><text x="465" y="395">参加費</text><text x="465" y="430">当選手数料</text><text x="720" y="395">認証コード</text><text x="720" y="430">復旧コード</text><text x="975" y="395">大会資料</text><text x="975" y="430">MOD・画像</text><text x="1230" y="395">外部DM</text><text x="1230" y="430">通話・SNS</text></g></g><rect x="330" y="620" width="780" height="72" rx="18" fill="#0d2b3d" stroke="#f17a8e"/><text x="720" y="665" fill="#fff" font-family="sans-serif" font-size="21" text-anchor="middle">急がされても、公式確認先へ戻る</text></svg>

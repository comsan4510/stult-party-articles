<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">運営権限を分ける設計</title><desc id="d">所有、日常管理、案内投稿、通報受付の権限分離</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">PERMISSION LAYERS</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">一つの運営アカウントへ集めない</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">操作範囲と復旧責任を分ける</text><g font-family="sans-serif"><rect x="180" y="255" width="1080" height="105" rx="20" fill="#102d40" stroke="#f17a8e" stroke-width="3"/><text x="230" y="320" fill="#f17a8e" font-size="22" font-weight="700">所有</text><text x="520" y="320" fill="#fff" font-size="19">所有権移転・復旧・重大設定</text><text x="1010" y="320" fill="#a9bed0" font-size="18">最小人数</text><rect x="240" y="390" width="960" height="105" rx="20" fill="#102d40" stroke="#ffbd69" stroke-width="3"/><text x="290" y="455" fill="#ffbd69" font-size="22" font-weight="700">日常管理</text><text x="560" y="455" fill="#fff" font-size="19">メンバー・設定・運営文書</text><rect x="300" y="525" width="840" height="105" rx="20" fill="#102d40" stroke="#45e0c5" stroke-width="3"/><text x="350" y="590" fill="#45e0c5" font-size="22" font-weight="700">案内・通報</text><text x="640" y="590" fill="#fff" font-size="19">公式告知・受付・一次対応</text></g><rect x="360" y="685" width="720" height="54" rx="15" fill="#0d2b3d"/><text x="720" y="720" fill="#fff" font-family="sans-serif" font-size="19" text-anchor="middle">多要素認証・月次確認・退任時の停止</text></svg>

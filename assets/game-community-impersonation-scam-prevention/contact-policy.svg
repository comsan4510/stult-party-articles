<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">公式連絡ルールの5項目</title><desc id="d">場所、求めない情報、URL、確認方法、通報先</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">OFFICIAL CONTACT POLICY</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">本物の連絡が満たす条件を公開する</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">例外を作らず、参加案内からいつでも確認</text><g font-family="sans-serif"><g fill="#102d40" stroke-width="3"><rect x="90" y="260" width="240" height="300" rx="22" stroke="#45e0c5"/><rect x="345" y="260" width="240" height="300" rx="22" stroke="#6ca8ff"/><rect x="600" y="260" width="240" height="300" rx="22" stroke="#ffbd69"/><rect x="855" y="260" width="240" height="300" rx="22" stroke="#f17a8e"/><rect x="1110" y="260" width="240" height="300" rx="22" stroke="#7fdb8a"/></g><g text-anchor="middle" font-weight="700"><text x="210" y="325" fill="#45e0c5" font-size="21">01 場所</text><text x="210" y="380" fill="#fff" font-size="18">重要連絡を載せる</text><text x="465" y="325" fill="#6ca8ff" font-size="21">02 禁止要求</text><text x="465" y="380" fill="#fff" font-size="18">コード等を求めない</text><text x="720" y="325" fill="#ffbd69" font-size="21">03 URL</text><text x="720" y="380" fill="#fff" font-size="18">正本から開く</text><text x="975" y="325" fill="#f17a8e" font-size="21">04 確認</text><text x="975" y="380" fill="#fff" font-size="18">別経路で照合</text><text x="1230" y="325" fill="#7fdb8a" font-size="21">05 通報</text><text x="1230" y="380" fill="#fff" font-size="18">迷った時点で報告</text></g></g><text x="720" y="670" fill="#fff" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="700">ルールと実際の運用を一致させる</text></svg>

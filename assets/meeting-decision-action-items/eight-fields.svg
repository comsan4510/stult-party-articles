<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#071925"/><text x="60" y="70" fill="#45e0d0" font-family="Arial,'Noto Sans JP',sans-serif" font-size="18" font-weight="700" letter-spacing="3">ACTION ITEM FIELDS</text><text x="60" y="122" fill="#f4f8fb" font-family="Arial,'Noto Sans JP',sans-serif" font-size="34" font-weight="700">実行項目を構成する8フィールド</text><g font-family="Arial,'Noto Sans JP',sans-serif"><rect x="60" y="185" width="250" height="105" rx="14" fill="#102f43" stroke="#c789d9"/><text x="84" y="222" fill="#c789d9" font-size="12" font-weight="700">01 DECISION REF</text><text x="84" y="263" fill="#fff" font-size="21" font-weight="700">決定ID</text><rect x="335" y="185" width="250" height="105" rx="14" fill="#102f43" stroke="#45e0d0"/><text x="359" y="222" fill="#45e0d0" font-size="12" font-weight="700">02 ACTION</text><text x="359" y="263" fill="#fff" font-size="21" font-weight="700">具体的な動作</text><rect x="610" y="185" width="250" height="105" rx="14" fill="#102f43" stroke="#ff6b6b"/><text x="634" y="222" fill="#ff6b6b" font-size="12" font-weight="700">03 OWNER</text><text x="634" y="263" fill="#fff" font-size="21" font-weight="700">責任者</text><rect x="885" y="185" width="250" height="105" rx="14" fill="#102f43" stroke="#ffb53e"/><text x="909" y="222" fill="#ffb53e" font-size="12" font-weight="700">04 DUE</text><text x="909" y="263" fill="#fff" font-size="21" font-weight="700">期限</text><rect x="60" y="335" width="250" height="105" rx="14" fill="#102f43" stroke="#45e0d0"/><text x="84" y="372" fill="#45e0d0" font-size="12" font-weight="700">05 DONE WHEN</text><text x="84" y="413" fill="#fff" font-size="21" font-weight="700">完了条件</text><rect x="335" y="335" width="250" height="105" rx="14" fill="#102f43" stroke="#8ba6b8"/><text x="359" y="372" fill="#8ba6b8" font-size="12" font-weight="700">06 STATUS</text><text x="359" y="413" fill="#fff" font-size="21" font-weight="700">状態</text><rect x="610" y="335" width="250" height="105" rx="14" fill="#102f43" stroke="#c789d9"/><text x="634" y="372" fill="#c789d9" font-size="12" font-weight="700">07 NEXT CHECK</text><text x="634" y="413" fill="#fff" font-size="21" font-weight="700">次回確認日</text><rect x="885" y="335" width="250" height="105" rx="14" fill="#102f43" stroke="#ff6b6b"/><text x="909" y="372" fill="#ff6b6b" font-size="12" font-weight="700">08 BLOCKER</text><text x="909" y="413" fill="#fff" font-size="21" font-weight="700">停止理由</text></g><rect x="255" y="510" width="690" height="64" rx="14" fill="#0e2c3f" stroke="#1f4b62"/><text x="600" y="549" text-anchor="middle" fill="#d8e5ed" font-family="Arial,'Noto Sans JP',sans-serif" font-size="18" font-weight="700">担当と期限だけでなく、完了を判定する条件を持つ</text></svg>

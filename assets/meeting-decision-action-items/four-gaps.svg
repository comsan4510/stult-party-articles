<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#071925"/><text x="60" y="70" fill="#45e0d0" font-family="Arial,'Noto Sans JP',sans-serif" font-size="18" font-weight="700" letter-spacing="3">FOUR EXECUTION GAPS</text><text x="60" y="122" fill="#f4f8fb" font-family="Arial,'Noto Sans JP',sans-serif" font-size="34" font-weight="700">会議後の実行を止める4つの曖昧さ</text><g font-family="Arial,'Noto Sans JP',sans-serif"><rect x="70" y="195" width="500" height="145" rx="18" fill="#102f43" stroke="#c789d9" stroke-width="2"/><text x="100" y="237" fill="#c789d9" font-size="13" font-weight="700">01 DECISION</text><text x="100" y="283" fill="#fff" font-size="25" font-weight="700">決定と意見が混ざる</text><text x="100" y="316" fill="#8ba6b8" font-size="15">何が確定したか分からない</text><rect x="630" y="195" width="500" height="145" rx="18" fill="#102f43" stroke="#ff6b6b" stroke-width="2"/><text x="660" y="237" fill="#ff6b6b" font-size="13" font-weight="700">02 OWNER</text><text x="660" y="283" fill="#fff" font-size="25" font-weight="700">「チーム」が担当になる</text><text x="660" y="316" fill="#8ba6b8" font-size="15">最初に動く人がいない</text><rect x="70" y="385" width="500" height="145" rx="18" fill="#102f43" stroke="#ffb53e" stroke-width="2"/><text x="100" y="427" fill="#ffb53e" font-size="13" font-weight="700">03 DUE</text><text x="100" y="473" fill="#fff" font-size="25" font-weight="700">期限が「次回会議」</text><text x="100" y="506" fill="#8ba6b8" font-size="15">遅延に期限当日まで気付かない</text><rect x="630" y="385" width="500" height="145" rx="18" fill="#143b46" stroke="#45e0d0" stroke-width="2"/><text x="660" y="427" fill="#45e0d0" font-size="13" font-weight="700">04 DONE</text><text x="660" y="473" fill="#fff" font-size="25" font-weight="700">完了が「対応する」</text><text x="660" y="506" fill="#8ba6b8" font-size="15">第三者が終了を判定できない</text></g></svg>

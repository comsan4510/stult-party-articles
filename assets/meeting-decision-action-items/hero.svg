<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#071925"/><text x="60" y="70" fill="#45e0d0" font-family="Arial,'Noto Sans JP',sans-serif" font-size="18" font-weight="700" letter-spacing="3">MEETING TO ACTION</text><text x="60" y="122" fill="#f4f8fb" font-family="Arial,'Noto Sans JP',sans-serif" font-size="34" font-weight="700">会議の決定を、確認可能な次の行動へ</text><g font-family="Arial,'Noto Sans JP',sans-serif" text-anchor="middle"><rect x="65" y="240" width="225" height="170" rx="18" fill="#102f43" stroke="#8ba6b8" stroke-width="2"/><text x="177" y="290" fill="#8ba6b8" font-size="13" font-weight="700">01 DISCUSS</text><text x="177" y="342" fill="#fff" font-size="25" font-weight="700">話し合う</text><text x="177" y="377" fill="#8ba6b8" font-size="14">前提・選択肢</text><path d="M290 325h55" stroke="#6f8da1" stroke-width="3"/><path d="M345 325l-12-8v16z" fill="#6f8da1"/><rect x="345" y="240" width="225" height="170" rx="18" fill="#102f43" stroke="#c789d9" stroke-width="2"/><text x="457" y="290" fill="#c789d9" font-size="13" font-weight="700">02 DECIDE</text><text x="457" y="342" fill="#fff" font-size="25" font-weight="700">決定する</text><text x="457" y="377" fill="#8ba6b8" font-size="14">内容・理由</text><path d="M570 325h55" stroke="#6f8da1" stroke-width="3"/><path d="M625 325l-12-8v16z" fill="#6f8da1"/><rect x="625" y="240" width="225" height="170" rx="18" fill="#102f43" stroke="#ffb53e" stroke-width="2"/><text x="737" y="290" fill="#ffb53e" font-size="13" font-weight="700">03 ASSIGN</text><text x="737" y="342" fill="#fff" font-size="25" font-weight="700">実行へ変換</text><text x="737" y="377" fill="#8ba6b8" font-size="14">担当・期限・完了</text><path d="M850 325h55" stroke="#6f8da1" stroke-width="3"/><path d="M905 325l-12-8v16z" fill="#6f8da1"/><rect x="905" y="240" width="230" height="170" rx="18" fill="#143b46" stroke="#45e0d0" stroke-width="2"/><text x="1020" y="290" fill="#45e0d0" font-size="13" font-weight="700">04 VERIFY</text><text x="1020" y="342" fill="#fff" font-size="25" font-weight="700">確認する</text><text x="1020" y="377" fill="#8ba6b8" font-size="14">成果物・状態</text></g><rect x="260" y="500" width="680" height="64" rx="14" fill="#0e2c3f" stroke="#1f4b62"/><text x="600" y="539" text-anchor="middle" fill="#d8e5ed" font-family="Arial,'Noto Sans JP',sans-serif" font-size="18" font-weight="700">議事録の長さではなく、次の行動が始まるかで測る</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#071925"/><text x="60" y="70" fill="#45e0d0" font-family="Arial,'Noto Sans JP',sans-serif" font-size="18" font-weight="700" letter-spacing="3">FINAL FIVE MINUTES</text><text x="60" y="122" fill="#f4f8fb" font-family="Arial,'Noto Sans JP',sans-serif" font-size="34" font-weight="700">参加者がいる間に、決定と次の行動を確認</text><g font-family="Arial,'Noto Sans JP',sans-serif" text-anchor="middle"><rect x="45" y="240" width="190" height="150" rx="16" fill="#102f43" stroke="#c789d9"/><text x="140" y="281" fill="#c789d9" font-size="12" font-weight="700">01 DECISION</text><text x="140" y="330" fill="#fff" font-size="22" font-weight="700">決定を確認</text><text x="140" y="360" fill="#8ba6b8" font-size="13">一文で読む</text><rect x="275" y="240" width="190" height="150" rx="16" fill="#102f43" stroke="#8ba6b8"/><text x="370" y="281" fill="#8ba6b8" font-size="12" font-weight="700">02 PENDING</text><text x="370" y="330" fill="#fff" font-size="22" font-weight="700">保留を分ける</text><text x="370" y="360" fill="#8ba6b8" font-size="13">未決定を明示</text><rect x="505" y="240" width="190" height="150" rx="16" fill="#102f43" stroke="#45e0d0"/><text x="600" y="281" fill="#45e0d0" font-size="12" font-weight="700">03 ACTION</text><text x="600" y="330" fill="#fff" font-size="22" font-weight="700">作業へ変換</text><text x="600" y="360" fill="#8ba6b8" font-size="13">動詞で書く</text><rect x="735" y="240" width="190" height="150" rx="16" fill="#102f43" stroke="#ffb53e"/><text x="830" y="281" fill="#ffb53e" font-size="12" font-weight="700">04 COMMIT</text><text x="830" y="330" fill="#fff" font-size="22" font-weight="700">担当と期限</text><text x="830" y="360" fill="#8ba6b8" font-size="13">本人と確認</text><rect x="965" y="240" width="190" height="150" rx="16" fill="#143b46" stroke="#45e0d0"/><text x="1060" y="281" fill="#45e0d0" font-size="12" font-weight="700">05 VERIFY</text><text x="1060" y="330" fill="#fff" font-size="22" font-weight="700">完了条件</text><text x="1060" y="360" fill="#8ba6b8" font-size="13">正本と確認日</text></g><rect x="250" y="485" width="700" height="64" rx="14" fill="#0e2c3f" stroke="#1f4b62"/><text x="600" y="524" text-anchor="middle" fill="#d8e5ed" font-family="Arial,'Noto Sans JP',sans-serif" font-size="18" font-weight="700">終了後の解釈ではなく、その場の合意を記録する</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#071925"/><text x="60" y="70" fill="#45e0d0" font-family="Arial,'Noto Sans JP',sans-serif" font-size="18" font-weight="700" letter-spacing="3">TWO RECORDS</text><text x="60" y="122" fill="#f4f8fb" font-family="Arial,'Noto Sans JP',sans-serif" font-size="34" font-weight="700">判断の文脈と、実行の進捗を分ける</text><g font-family="Arial,'Noto Sans JP',sans-serif"><rect x="80" y="195" width="430" height="335" rx="20" fill="#302a3c" stroke="#c789d9" stroke-width="3"/><text x="115" y="242" fill="#c789d9" font-size="14" font-weight="700">DECISION LOG</text><text x="115" y="291" fill="#fff" font-size="29" font-weight="700">決定ログ</text><text x="115" y="345" fill="#d4c8d8" font-size="18">・何を決めたか</text><text x="115" y="386" fill="#d4c8d8" font-size="18">・背景と選択肢</text><text x="115" y="427" fill="#d4c8d8" font-size="18">・理由と見直し条件</text><text x="115" y="468" fill="#d4c8d8" font-size="18">・意思決定者</text><path d="M510 360h180" stroke="#718ea0" stroke-width="4" stroke-dasharray="10 8"/><text x="600" y="341" fill="#8ba6b8" text-anchor="middle" font-size="14">IDで関連付け</text><rect x="690" y="195" width="430" height="335" rx="20" fill="#173b3d" stroke="#45e0d0" stroke-width="3"/><text x="725" y="242" fill="#45e0d0" font-size="14" font-weight="700">ACTION ITEM</text><text x="725" y="291" fill="#fff" font-size="29" font-weight="700">アクション項目</text><text x="725" y="345" fill="#c3ddda" font-size="18">・誰が何を行うか</text><text x="725" y="386" fill="#c3ddda" font-size="18">・期限と確認日</text><text x="725" y="427" fill="#c3ddda" font-size="18">・完了条件</text><text x="725" y="468" fill="#c3ddda" font-size="18">・状態と停止理由</text></g></svg>

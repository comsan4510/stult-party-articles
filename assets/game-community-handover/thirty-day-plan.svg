<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">30日間の引き継ぎ計画</title><desc id="d">発見、並走、主体運営、停止と再点検の4区間</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">30-DAY PLAN</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">交代日ではなく、重なる30日を設計する</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">新担当が主体になる時間を段階的に増やす</text><g font-family="sans-serif"><rect x="90" y="265" width="300" height="330" rx="22" fill="#102c3e" stroke="#45e0c5" stroke-width="3"/><text x="130" y="320" fill="#45e0c5" font-size="22" font-weight="700">DAY 1–7</text><text x="130" y="365" fill="#fff" font-size="24" font-weight="700">発見</text><text x="130" y="415" fill="#dbe7ef" font-size="18">資産台帳を作る</text><text x="130" y="452" fill="#dbe7ef" font-size="18">単独所有を特定</text><text x="130" y="489" fill="#dbe7ef" font-size="18">進行案件を並べる</text><rect x="410" y="265" width="300" height="330" rx="22" fill="#102c3e" stroke="#6ca8ff" stroke-width="3"/><text x="450" y="320" fill="#6ca8ff" font-size="22" font-weight="700">DAY 8–14</text><text x="450" y="365" fill="#fff" font-size="24" font-weight="700">移管・並走</text><text x="450" y="415" fill="#dbe7ef" font-size="18">必要権限を付与</text><text x="450" y="452" fill="#dbe7ef" font-size="18">新担当が実操作</text><text x="450" y="489" fill="#dbe7ef" font-size="18">旧担当は観察</text><rect x="730" y="265" width="300" height="330" rx="22" fill="#102c3e" stroke="#ffbd69" stroke-width="3"/><text x="770" y="320" fill="#ffbd69" font-size="22" font-weight="700">DAY 15–21</text><text x="770" y="365" fill="#fff" font-size="24" font-weight="700">主体運営</text><text x="770" y="415" fill="#dbe7ef" font-size="18">判断と回答を担当</text><text x="770" y="452" fill="#dbe7ef" font-size="18">連絡先を切替</text><text x="770" y="489" fill="#dbe7ef" font-size="18">VERIFIEDへ更新</text><rect x="1050" y="265" width="300" height="330" rx="22" fill="#102c3e" stroke="#f17a8e" stroke-width="3"/><text x="1090" y="320" fill="#f17a8e" font-size="22" font-weight="700">DAY 22–30</text><text x="1090" y="365" fill="#fff" font-size="24" font-weight="700">停止・再点検</text><text x="1090" y="415" fill="#dbe7ef" font-size="18">旧権限を停止</text><text x="1090" y="452" fill="#dbe7ef" font-size="18">復旧先を確認</text><text x="1090" y="489" fill="#dbe7ef" font-size="18">次回レビュー設定</text></g><line x1="120" y1="680" x2="1320" y2="680" stroke="#34566c" stroke-width="5"/><circle cx="120" cy="680" r="10" fill="#45e0c5"/><circle cx="1320" cy="680" r="10" fill="#f17a8e"/><text x="120" y="725" fill="#a9bed0" font-family="sans-serif" font-size="18" text-anchor="middle">旧担当が主体</text><text x="1320" y="725" fill="#a9bed0" font-family="sans-serif" font-size="18" text-anchor="middle">新担当だけで運営</text></svg>

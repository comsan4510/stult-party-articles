<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">資産の6分類</title><desc id="d">活動基盤、公開情報、進行案件、外部導線、運営記録、契約費用</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">ASSET INVENTORY</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">見えない運営資産まで、6分類で棚卸し</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">対象・所有者・期限・復旧先を一行ずつ記録する</text><g font-family="sans-serif"><g fill="#102c3e" stroke="#34566c" stroke-width="2"><rect x="90" y="240" width="390" height="150" rx="20"/><rect x="525" y="240" width="390" height="150" rx="20"/><rect x="960" y="240" width="390" height="150" rx="20"/><rect x="90" y="440" width="390" height="150" rx="20"/><rect x="525" y="440" width="390" height="150" rx="20"/><rect x="960" y="440" width="390" height="150" rx="20"/></g><g font-size="23" font-weight="700"><text x="130" y="295" fill="#45e0c5">01 活動基盤</text><text x="565" y="295" fill="#6ca8ff">02 公開情報</text><text x="1000" y="295" fill="#ffbd69">03 進行案件</text><text x="130" y="495" fill="#f17a8e">04 外部導線</text><text x="565" y="495" fill="#ab8cff">05 運営記録</text><text x="1000" y="495" fill="#7fdb8a">06 契約・費用</text></g><g fill="#dbe7ef" font-size="19"><text x="130" y="340">所有者・管理者・復旧先</text><text x="565" y="340">ルール・FAQ・正本</text><text x="1000" y="340">募集・相談・対応期限</text><text x="130" y="540">SNS・サイト・フォーム</text><text x="565" y="540">判断ログ・当番・保管期限</text><text x="1000" y="540">契約者・更新日・解約条件</text></g></g><rect x="260" y="660" width="920" height="66" rx="18" fill="#0d2b3d" stroke="#f17a8e"/><text x="720" y="702" fill="#fff" font-family="sans-serif" font-size="21" text-anchor="middle">パスワードや復旧コードは台帳に書かず、保管先だけを参照</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">緊急引き継ぎの判断フロー</title><desc id="d">安全確保から旧権限整理までの緊急手順</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607f94"/></marker></defs><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">EMERGENCY HANDOVER</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">突然の不在でも、非公式な回避策を使わない</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">暫定運用の範囲と終了条件を先に決める</text><g stroke="#607f94" stroke-width="4" marker-end="url(#a)"><line x1="315" y1="335" x2="415" y2="335"/><line x1="655" y1="335" x2="755" y2="335"/><line x1="995" y1="335" x2="1095" y2="335"/><line x1="1215" y1="415" x2="1215" y2="535"/><line x1="1095" y1="615" x2="995" y2="615"/><line x1="755" y1="615" x2="655" y2="615"/></g><g font-family="sans-serif"><g fill="#102c3e" stroke-width="3"><rect x="75" y="255" width="240" height="160" rx="22" stroke="#f17a8e"/><rect x="415" y="255" width="240" height="160" rx="22" stroke="#45e0c5"/><rect x="755" y="255" width="240" height="160" rx="22" stroke="#6ca8ff"/><rect x="1095" y="255" width="240" height="160" rx="22" stroke="#ffbd69"/><rect x="1095" y="535" width="240" height="160" rx="22" stroke="#ab8cff"/><rect x="755" y="535" width="240" height="160" rx="22" stroke="#7fdb8a"/><rect x="415" y="535" width="240" height="160" rx="22" stroke="#45e0c5"/></g><g font-size="19" font-weight="700" text-anchor="middle"><text x="195" y="320" fill="#f17a8e">1 安全確認</text><text x="195" y="360" fill="#fff">緊急対応の有無</text><text x="535" y="320" fill="#45e0c5">2 現状記録</text><text x="535" y="360" fill="#fff">人と権限を把握</text><text x="875" y="320" fill="#6ca8ff">3 受付一本化</text><text x="875" y="360" fill="#fff">新規案件を集約</text><text x="1215" y="320" fill="#ffbd69">4 公式復旧</text><text x="1215" y="360" fill="#fff">所有権を申請</text><text x="1215" y="600" fill="#ab8cff">5 暫定告知</text><text x="1215" y="640" fill="#fff">制限と期限を共有</text><text x="875" y="600" fill="#7fdb8a">6 動作確認</text><text x="875" y="640" fill="#fff">新担当が実操作</text><text x="535" y="600" fill="#45e0c5">7 権限整理</text><text x="535" y="640" fill="#fff">暫定アクセス撤回</text></g></g></svg>

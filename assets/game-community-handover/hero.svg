<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">ゲームコミュニティ運営引き継ぎの全体像</title><desc id="d">棚卸し、移管、実操作確認、旧権限停止の順序</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">COMMUNITY HANDOVER</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">運営を止めない、管理者交代の4段階</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">権限を渡す前後に「見つける」と「確かめる」を置く</text><line x1="180" y1="410" x2="1260" y2="410" stroke="#3b566a" stroke-width="6"/><g font-family="sans-serif"><g><circle cx="210" cy="410" r="58" fill="#123247" stroke="#45e0c5" stroke-width="4"/><text x="210" y="401" fill="#45e0c5" font-size="18" text-anchor="middle" font-weight="700">01</text><text x="210" y="430" fill="#fff" font-size="22" text-anchor="middle" font-weight="700">棚卸し</text><text x="210" y="512" fill="#a9bed0" font-size="18" text-anchor="middle">資産と案件を発見</text></g><g><circle cx="550" cy="410" r="58" fill="#123247" stroke="#6ca8ff" stroke-width="4"/><text x="550" y="401" fill="#6ca8ff" font-size="18" text-anchor="middle" font-weight="700">02</text><text x="550" y="430" fill="#fff" font-size="22" text-anchor="middle" font-weight="700">移管</text><text x="550" y="512" fill="#a9bed0" font-size="18" text-anchor="middle">責任・権限・情報</text></g><g><circle cx="890" cy="410" r="58" fill="#123247" stroke="#ffbd69" stroke-width="4"/><text x="890" y="401" fill="#ffbd69" font-size="18" text-anchor="middle" font-weight="700">03</text><text x="890" y="430" fill="#fff" font-size="22" text-anchor="middle" font-weight="700">確認</text><text x="890" y="512" fill="#a9bed0" font-size="18" text-anchor="middle">新担当が実操作</text></g><g><circle cx="1230" cy="410" r="58" fill="#123247" stroke="#f17a8e" stroke-width="4"/><text x="1230" y="401" fill="#f17a8e" font-size="18" text-anchor="middle" font-weight="700">04</text><text x="1230" y="430" fill="#fff" font-size="22" text-anchor="middle" font-weight="700">停止</text><text x="1230" y="512" fill="#a9bed0" font-size="18" text-anchor="middle">旧アクセスを撤回</text></g></g><rect x="330" y="618" width="780" height="88" rx="20" fill="#0d2b3d" stroke="#45e0c5"/><text x="720" y="654" fill="#fff" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="700">完了条件</text><text x="720" y="684" fill="#45e0c5" font-family="sans-serif" font-size="20" text-anchor="middle">新管理者だけで募集・案内・復旧判断を進められる</text></svg>

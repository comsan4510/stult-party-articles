<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">引き継ぎの4層</title><desc id="d">責任、権限、情報、進行案件を個別に確認</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">FOUR LAYERS</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">役職ではなく、4層を別々に移す</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">それぞれに担当者と完了条件を置く</text><g font-family="sans-serif"><rect x="90" y="250" width="285" height="370" rx="22" fill="#102c3e" stroke="#45e0c5" stroke-width="3"/><text x="232" y="315" fill="#45e0c5" font-size="24" text-anchor="middle" font-weight="700">責任</text><text x="232" y="370" fill="#fff" font-size="20" text-anchor="middle">最終判断</text><text x="232" y="410" fill="#fff" font-size="20" text-anchor="middle">参加者対応</text><text x="232" y="450" fill="#fff" font-size="20" text-anchor="middle">緊急連絡</text><text x="232" y="548" fill="#a9bed0" font-size="18" text-anchor="middle">誰が決めるか</text><rect x="415" y="250" width="285" height="370" rx="22" fill="#102c3e" stroke="#6ca8ff" stroke-width="3"/><text x="557" y="315" fill="#6ca8ff" font-size="24" text-anchor="middle" font-weight="700">権限</text><text x="557" y="370" fill="#fff" font-size="20" text-anchor="middle">所有者</text><text x="557" y="410" fill="#fff" font-size="20" text-anchor="middle">管理者</text><text x="557" y="450" fill="#fff" font-size="20" text-anchor="middle">復旧経路</text><text x="557" y="548" fill="#a9bed0" font-size="18" text-anchor="middle">何を操作できるか</text><rect x="740" y="250" width="285" height="370" rx="22" fill="#102c3e" stroke="#ffbd69" stroke-width="3"/><text x="882" y="315" fill="#ffbd69" font-size="24" text-anchor="middle" font-weight="700">情報</text><text x="882" y="370" fill="#fff" font-size="20" text-anchor="middle">ルール</text><text x="882" y="410" fill="#fff" font-size="20" text-anchor="middle">判断記録</text><text x="882" y="450" fill="#fff" font-size="20" text-anchor="middle">運営手順</text><text x="882" y="548" fill="#a9bed0" font-size="18" text-anchor="middle">何を知るべきか</text><rect x="1065" y="250" width="285" height="370" rx="22" fill="#102c3e" stroke="#f17a8e" stroke-width="3"/><text x="1207" y="315" fill="#f17a8e" font-size="24" text-anchor="middle" font-weight="700">進行案件</text><text x="1207" y="370" fill="#fff" font-size="20" text-anchor="middle">募集中</text><text x="1207" y="410" fill="#fff" font-size="20" text-anchor="middle">未回答</text><text x="1207" y="450" fill="#fff" font-size="20" text-anchor="middle">対応中</text><text x="1207" y="548" fill="#a9bed0" font-size="18" text-anchor="middle">次に何をするか</text></g><text x="720" y="700" fill="#fff" font-family="sans-serif" font-size="23" text-anchor="middle" font-weight="700">4層すべてが VERIFIED になって引き継ぎ完了</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">引き継ぎ台帳の状態遷移</title><desc id="d">発見から完了まで5状態で管理する</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607f94"/></marker></defs><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">HANDOVER LEDGER</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">「渡した」と「確認した」を分けて記録</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">状態を5段階に固定し、未検証を検索できるようにする</text><g stroke="#607f94" stroke-width="4" marker-end="url(#a)"><line x1="290" y1="410" x2="380" y2="410"/><line x1="535" y1="410" x2="625" y2="410"/><line x1="780" y1="410" x2="870" y2="410"/><line x1="1025" y1="410" x2="1115" y2="410"/></g><g font-family="sans-serif"><g><rect x="90" y="345" width="200" height="130" rx="22" fill="#102c3e" stroke="#45e0c5" stroke-width="3"/><text x="190" y="400" fill="#45e0c5" font-size="20" text-anchor="middle" font-weight="700">FOUND</text><text x="190" y="438" fill="#fff" font-size="18" text-anchor="middle">対象を発見</text></g><g><rect x="380" y="345" width="200" height="130" rx="22" fill="#102c3e" stroke="#6ca8ff" stroke-width="3"/><text x="480" y="400" fill="#6ca8ff" font-size="20" text-anchor="middle" font-weight="700">PREPARED</text><text x="480" y="438" fill="#fff" font-size="18" text-anchor="middle">移管準備済み</text></g><g><rect x="625" y="345" width="200" height="130" rx="22" fill="#102c3e" stroke="#ffbd69" stroke-width="3"/><text x="725" y="400" fill="#ffbd69" font-size="20" text-anchor="middle" font-weight="700">TRANSFERRED</text><text x="725" y="438" fill="#fff" font-size="18" text-anchor="middle">新担当へ付与</text></g><g><rect x="870" y="345" width="200" height="130" rx="22" fill="#102c3e" stroke="#f17a8e" stroke-width="3"/><text x="970" y="400" fill="#f17a8e" font-size="20" text-anchor="middle" font-weight="700">VERIFIED</text><text x="970" y="438" fill="#fff" font-size="18" text-anchor="middle">新担当が実操作</text></g><g><rect x="1115" y="345" width="200" height="130" rx="22" fill="#102c3e" stroke="#7fdb8a" stroke-width="3"/><text x="1215" y="400" fill="#7fdb8a" font-size="20" text-anchor="middle" font-weight="700">CLOSED</text><text x="1215" y="438" fill="#fff" font-size="18" text-anchor="middle">旧権限を停止</text></g></g><rect x="360" y="590" width="720" height="86" rx="18" fill="#0d2b3d"/><text x="720" y="624" fill="#ffbd69" font-family="sans-serif" font-size="20" text-anchor="middle" font-weight="700">よくある停止位置</text><text x="720" y="654" fill="#fff" font-family="sans-serif" font-size="20" text-anchor="middle">TRANSFERRED のまま放置すると、動作不能と旧権限残存を見逃す</text></svg>

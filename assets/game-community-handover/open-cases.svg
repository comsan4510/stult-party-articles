<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">進行案件の引き継ぎカード</title><desc id="d">状態、期限、担当、次の一手を一枚で渡す</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">OPEN CASES</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">過去ログより「次の一手」を渡す</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">案件ごとに必要な5項目だけを揃える</text><rect x="250" y="235" width="940" height="440" rx="28" fill="#102c3e" stroke="#34566c" stroke-width="3"/><g font-family="sans-serif"><text x="310" y="300" fill="#45e0c5" font-size="20" font-weight="700">CASE #042　募集中の協力プレイ</text><line x1="310" y1="330" x2="1130" y2="330" stroke="#34566c" stroke-width="2"/><text x="310" y="385" fill="#a9bed0" font-size="18">現在の状態</text><text x="540" y="385" fill="#fff" font-size="20" font-weight="700">4人中3人参加、あと1人</text><text x="310" y="445" fill="#a9bed0" font-size="18">期限</text><text x="540" y="445" fill="#fff" font-size="20">10月29日 20:00</text><text x="310" y="505" fill="#a9bed0" font-size="18">新担当</text><text x="540" y="505" fill="#fff" font-size="20">運営B</text><text x="310" y="565" fill="#a9bed0" font-size="18">次の一手</text><rect x="515" y="530" width="575" height="64" rx="14" fill="#0b2232" stroke="#ffbd69"/><text x="545" y="570" fill="#ffbd69" font-size="20" font-weight="700">29日18時に不足人数を確認して再告知</text><text x="310" y="635" fill="#a9bed0" font-size="18">参照先</text><text x="540" y="635" fill="#fff" font-size="20">募集URL・参加条件・会話場所</text></g><text x="720" y="742" fill="#fff" font-family="sans-serif" font-size="21" text-anchor="middle">状態＋期限＋担当＋次の一手＋参照先</text></svg>

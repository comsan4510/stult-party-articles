<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#071925"/><text x="60" y="70" fill="#45e0d0" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700" letter-spacing="3">THREE DIFFERENT JOBS</text><text x="60" y="122" fill="#f4f8fb" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="34" font-weight="700">取得できることと、再開できることは違う</text>
  <g font-family="Arial, 'Noto Sans JP', sans-serif">
    <rect x="65" y="205" width="310" height="260" rx="20" fill="#102f43" stroke="#8ba6b8" stroke-width="2"/><text x="95" y="250" fill="#8ba6b8" font-size="14" font-weight="700">BACKUP</text><text x="95" y="294" fill="#fff" font-size="27" font-weight="700">バックアップ</text><text x="95" y="344" fill="#d0dde5" font-size="17">消失に備えて複製</text><text x="95" y="382" fill="#8ba6b8" font-size="15">成功：保存物を読める</text><rect x="95" y="412" width="250" height="30" rx="7" fill="#16364a"/><text x="220" y="433" text-anchor="middle" fill="#9db3c1" font-size="13">活動の現在値は別途必要</text>
    <rect x="445" y="205" width="310" height="260" rx="20" fill="#102f43" stroke="#ffb53e" stroke-width="2"/><text x="475" y="250" fill="#ffb53e" font-size="14" font-weight="700">EXPORT</text><text x="475" y="294" fill="#fff" font-size="27" font-weight="700">エクスポート</text><text x="475" y="344" fill="#d0dde5" font-size="17">サービス外へ取り出す</text><text x="475" y="382" fill="#8ba6b8" font-size="15">成功：所定形式で取得</text><rect x="475" y="412" width="250" height="30" rx="7" fill="#3b3021"/><text x="600" y="433" text-anchor="middle" fill="#d5b980" font-size="13">別環境での再現は別工程</text>
    <rect x="825" y="205" width="310" height="260" rx="20" fill="#143b46" stroke="#45e0d0" stroke-width="3"/><text x="855" y="250" fill="#45e0d0" font-size="14" font-weight="700">MIGRATION</text><text x="855" y="294" fill="#fff" font-size="27" font-weight="700">移行・復旧</text><text x="855" y="344" fill="#d0dde5" font-size="17">新しい場所で活動を継続</text><text x="855" y="382" fill="#9dc7c3" font-size="15">成功：募集と参加が再開</text><rect x="855" y="412" width="250" height="30" rx="7" fill="#1b5052"/><text x="980" y="433" text-anchor="middle" fill="#a8d8d2" font-size="13">人・権限・習慣まで確認</text>
  </g>
  <text x="600" y="555" text-anchor="middle" fill="#8ea7b7" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17">ZIPファイルの存在ではなく、次の募集を再開できるかで判定する</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#071925"/><text x="60" y="70" fill="#45e0d0" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700" letter-spacing="3">COMMUNITY EXIT PLAN</text><text x="60" y="122" fill="#f4f8fb" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="34" font-weight="700">保存ではなく、活動を再開できる状態をつくる</text><text x="60" y="157" fill="#89a4b7" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="16">障害・アカウント停止・サービス終了に備える出口設計</text>
  <g font-family="Arial, 'Noto Sans JP', sans-serif" text-anchor="middle">
    <rect x="65" y="240" width="225" height="170" rx="18" fill="#102f43" stroke="#45e0d0" stroke-width="2"/><text x="177" y="290" fill="#45e0d0" font-size="13" font-weight="700">01 PEOPLE</text><text x="177" y="342" fill="#fff" font-size="25" font-weight="700">人・連絡</text><text x="177" y="377" fill="#8ba6b8" font-size="14">案内先と代行者</text>
    <path d="M290 325h55" stroke="#6f8da1" stroke-width="3"/><path d="M345 325l-12-8v16z" fill="#6f8da1"/>
    <rect x="345" y="240" width="225" height="170" rx="18" fill="#102f43" stroke="#ffb53e" stroke-width="2"/><text x="457" y="290" fill="#ffb53e" font-size="13" font-weight="700">02 ACTIVE</text><text x="457" y="342" fill="#fff" font-size="25" font-weight="700">募集中案件</text><text x="457" y="377" fill="#8ba6b8" font-size="14">日時・定員・状態</text>
    <path d="M570 325h55" stroke="#6f8da1" stroke-width="3"/><path d="M625 325l-12-8v16z" fill="#6f8da1"/>
    <rect x="625" y="240" width="225" height="170" rx="18" fill="#102f43" stroke="#c789d9" stroke-width="2"/><text x="737" y="290" fill="#c789d9" font-size="13" font-weight="700">03 RULES</text><text x="737" y="342" fill="#fff" font-size="25" font-weight="700">現行基準</text><text x="737" y="377" fill="#8ba6b8" font-size="14">正本・所有者・版</text>
    <path d="M850 325h55" stroke="#6f8da1" stroke-width="3"/><path d="M905 325l-12-8v16z" fill="#6f8da1"/>
    <rect x="905" y="240" width="230" height="170" rx="18" fill="#102f43" stroke="#ff6b6b" stroke-width="2"/><text x="1020" y="290" fill="#ff6b6b" font-size="13" font-weight="700">04 RECOVER</text><text x="1020" y="342" fill="#fff" font-size="25" font-weight="700">活動再開</text><text x="1020" y="377" fill="#8ba6b8" font-size="14">案内・募集・会話</text>
  </g>
  <rect x="260" y="500" width="680" height="64" rx="14" fill="#0e2c3f" stroke="#1f4b62"/><text x="600" y="539" text-anchor="middle" fill="#d8e5ed" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700">出口設計は「移る計画」ではなく「続けられる状態」の設計</text>
</svg>

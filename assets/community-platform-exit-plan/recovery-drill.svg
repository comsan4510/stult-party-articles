<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#071925"/><text x="60" y="70" fill="#45e0d0" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700" letter-spacing="3">60-MINUTE DRILL</text><text x="60" y="122" fill="#f4f8fb" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="34" font-weight="700">削除せず、別担当が再構成できるか試す</text>
  <g font-family="Arial, 'Noto Sans JP', sans-serif" text-anchor="middle">
    <rect x="60" y="225" width="220" height="175" rx="18" fill="#102f43" stroke="#8ba6b8"/><text x="170" y="268" fill="#8ba6b8" font-size="13" font-weight="700">0–10 MIN</text><text x="170" y="318" fill="#fff" font-size="22" font-weight="700">想定を固定</text><text x="170" y="355" fill="#8ba6b8" font-size="14">障害条件を一つ</text>
    <path d="M280 312h35" stroke="#6f8da1" stroke-width="3"/><path d="M315 312l-12-8v16z" fill="#6f8da1"/>
    <rect x="315" y="225" width="220" height="175" rx="18" fill="#102f43" stroke="#ffb53e"/><text x="425" y="268" fill="#ffb53e" font-size="13" font-weight="700">10–20 MIN</text><text x="425" y="318" fill="#fff" font-size="22" font-weight="700">P0を探す</text><text x="425" y="355" fill="#8ba6b8" font-size="14">案内・募集・代行</text>
    <path d="M535 312h35" stroke="#6f8da1" stroke-width="3"/><path d="M570 312l-12-8v16z" fill="#6f8da1"/>
    <rect x="570" y="225" width="220" height="175" rx="18" fill="#102f43" stroke="#45e0d0"/><text x="680" y="268" fill="#45e0d0" font-size="13" font-weight="700">20–35 MIN</text><text x="680" y="318" fill="#fff" font-size="22" font-weight="700">非公開で再作成</text><text x="680" y="355" fill="#8ba6b8" font-size="14">案内文・募集状態</text>
    <path d="M790 312h35" stroke="#6f8da1" stroke-width="3"/><path d="M825 312l-12-8v16z" fill="#6f8da1"/>
    <rect x="825" y="225" width="315" height="175" rx="18" fill="#102f43" stroke="#c789d9"/><text x="982" y="268" fill="#c789d9" font-size="13" font-weight="700">35–60 MIN</text><text x="982" y="318" fill="#fff" font-size="22" font-weight="700">検証して不足を直す</text><text x="982" y="355" fill="#8ba6b8" font-size="14">鮮度・権限・同意・期限</text>
  </g>
  <rect x="250" y="490" width="700" height="64" rx="14" fill="#0e2c3f" stroke="#1f4b62"/><text x="600" y="529" text-anchor="middle" fill="#d8e5ed" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700">「ファイルが開いた」ではなく「募集を再開できた」で合格</text>
</svg>

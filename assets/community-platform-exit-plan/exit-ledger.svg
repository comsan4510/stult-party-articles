<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#071925"/><text x="60" y="70" fill="#45e0d0" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700" letter-spacing="3">EXIT LEDGER</text><text x="60" y="122" fill="#f4f8fb" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="34" font-weight="700">一行一資産で、復旧方法と確認日を持つ</text>
  <g font-family="Arial, 'Noto Sans JP', sans-serif">
    <rect x="60" y="180" width="495" height="390" rx="18" fill="#102f43" stroke="#45e0d0" stroke-width="2"/><text x="90" y="220" fill="#45e0d0" font-size="14" font-weight="700">MINIMUM FIELDS</text><text x="90" y="262" fill="#dce8ef" font-size="17">asset_id / asset_type / source_system</text><text x="90" y="300" fill="#dce8ef" font-size="17">owner_ref / backup_owner_ref</text><text x="90" y="338" fill="#dce8ef" font-size="17">recovery_priority / snapshot_at</text><text x="90" y="376" fill="#dce8ef" font-size="17">recovery_method / destination_ref</text><text x="90" y="414" fill="#dce8ef" font-size="17">consent_required / verified_at</text><text x="90" y="452" fill="#dce8ef" font-size="17">next_review_at</text><rect x="90" y="490" width="405" height="52" rx="10" fill="#173c50"/><text x="292" y="522" text-anchor="middle" fill="#a9c0ce" font-size="15">取得日ではなく、復旧を確認した日を記録</text>
    <rect x="625" y="195" width="220" height="100" rx="15" fill="#173b3d" stroke="#45e0d0"/><text x="650" y="232" fill="#45e0d0" font-size="13" font-weight="700">RESTORE</text><text x="650" y="270" fill="#fff" font-size="22" font-weight="700">データから復元</text>
    <rect x="900" y="195" width="220" height="100" rx="15" fill="#3a2e20" stroke="#ffb53e"/><text x="925" y="232" fill="#ffb53e" font-size="13" font-weight="700">RECREATE</text><text x="925" y="270" fill="#fff" font-size="22" font-weight="700">最新値を再作成</text>
    <rect x="625" y="350" width="220" height="100" rx="15" fill="#302a3c" stroke="#c789d9"/><text x="650" y="387" fill="#c789d9" font-size="13" font-weight="700">REDIRECT</text><text x="650" y="425" fill="#fff" font-size="22" font-weight="700">新拠点へ誘導</text>
    <rect x="900" y="350" width="220" height="100" rx="15" fill="#162f42" stroke="#8ba6b8"/><text x="925" y="387" fill="#8ba6b8" font-size="13" font-weight="700">RETAIN</text><text x="925" y="425" fill="#fff" font-size="22" font-weight="700">旧側へ残す</text>
    <text x="872" y="518" text-anchor="middle" fill="#8ea7b7" font-size="16">全資産を同じ方法でコピーしない</text>
  </g>
</svg>

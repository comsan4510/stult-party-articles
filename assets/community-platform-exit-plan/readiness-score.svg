  <rect x="255" y="525" width="690" height="64" rx="14" fill="#0e2c3f" stroke="#1f4b62"/><text x="600" y="564" text-anchor="middle" fill="#d8e5ed" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700">速さと正確さに加え、移さない判断も品質に含める</text>

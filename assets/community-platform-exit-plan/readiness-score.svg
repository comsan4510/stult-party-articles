    <rect x="810" y="190" width="330" height="115" rx="15" fill="#102f43" stroke="#ffb53e"/><text x="838" y="228" fill="#ffb53e" font-size="13" font-weight="700">03 RECOVERABLE</text><text x="838" y="270" fill="#fff" font-size="22" font-weight="700">復旧可能率</text>
    <rect x="60" y="350" width="330" height="115" rx="15" fill="#102f43" stroke="#c789d9"/><text x="88" y="388" fill="#c789d9" font-size="13" font-weight="700">04 FRESHNESS</text><text x="88" y="430" fill="#fff" font-size="22" font-weight="700">情報の古さ</text>
    <rect x="435" y="350" width="330" height="115" rx="15" fill="#102f43" stroke="#ff6b6b"/><text x="463" y="388" fill="#ff6b6b" font-size="13" font-weight="700">05 SINGLE OWNER</text><text x="463" y="430" fill="#fff" font-size="22" font-weight="700">単独所有率</text>

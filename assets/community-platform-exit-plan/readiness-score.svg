<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#071925"/><text x="60" y="70" fill="#45e0d0" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700" letter-spacing="3">READINESS METRICS</text><text x="60" y="122" fill="#f4f8fb" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="34" font-weight="700">保存量ではなく、復旧できる精度を測る</text>
  <g font-family="Arial, 'Noto Sans JP', sans-serif">
    <rect x="60" y="190" width="330" height="115" rx="15" fill="#102f43" stroke="#45e0d0"/><text x="88" y="228" fill="#45e0d0" font-size="13" font-weight="700">01 P0 COVERAGE</text><text x="88" y="270" fill="#fff" font-size="22" font-weight="700">P0資産の確認率</text>

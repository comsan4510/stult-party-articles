<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">初回プレイ前後の安心設計</title><desc id="d">集合前、プレイ中、終了後の案内</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="80" y="90" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="3">FIRST PLAY</text><text x="80" y="155" fill="#fff" font-size="46" font-weight="800">始まる前と、終わった後を設計する</text><g transform="translate(80 255)" text-anchor="middle" font-weight="700"><g><rect width="360" height="330" rx="28" fill="#12342f" stroke="#61dbc5" stroke-width="3"/><text x="180" y="65" fill="#61dbc5" font-size="24">集合前</text><text x="180" y="135" fill="white" font-size="25">集合時刻</text><text x="180" y="180" fill="white" font-size="25">会話方法</text><text x="180" y="225" fill="white" font-size="25">途中退出</text></g><path d="M380 165H450" stroke="#607b98" stroke-width="6"/><path d="m435 153 24 12-24 12" fill="#607b98"/><g transform="translate(460)"><rect width="360" height="330" rx="28" fill="#172b49" stroke="#7da8ef" stroke-width="3"/><text x="180" y="65" fill="#7da8ef" font-size="24">プレイ中</text><text x="180" y="135" fill="white" font-size="25">名前を呼ぶ</text><text x="180" y="180" fill="white" font-size="25">役割を伝える</text><text x="180" y="225" fill="white" font-size="25">失敗を責めない</text></g><path d="M840 165H910" stroke="#607b98" stroke-width="6"/><path d="m895 153 24 12-24 12" fill="#607b98"/><g transform="translate(920)"><rect width="360" height="330" rx="28" fill="#55452f" stroke="#f0bd63" stroke-width="3"/><text x="180" y="65" fill="#f0bd63" font-size="24">終了後</text><text x="180" y="135" fill="white" font-size="25">感謝を伝える</text><text x="180" y="180" fill="white" font-size="25">次回予定</text><text x="180" y="225" fill="white" font-size="25">募集の作り方</text></g><rect x="340" y="390" width="600" height="70" rx="35" fill="#1b304a"/><text x="640" y="435" fill="#f0bd63" font-size="22">単発で終わらず、再参加の入口を残す</text></g></g></svg>

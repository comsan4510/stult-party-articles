<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">オンボーディングを測る四つの指標</title><desc id="d">募集閲覧、参加表明、初回プレイ、再参加の指標</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="80" y="90" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="3">ONBOARDING METRICS</text><text x="80" y="155" fill="#fff" font-size="46" font-weight="800">参加者数ではなく、次の行動を測る</text><g transform="translate(90 180)" text-anchor="middle" font-weight="700"><g><circle cx="260" cy="165" r="135" fill="#12342f" stroke="#61dbc5" stroke-width="4"/><text x="260" y="125" fill="#61dbc5" font-size="22">01</text><text x="260" y="175" fill="white" font-size="27">募集閲覧率</text><text x="260" y="218" fill="#b8d0cb" font-size="19">24時間以内</text></g><g><circle cx="940" cy="165" r="135" fill="#172b49" stroke="#7da8ef" stroke-width="4"/><text x="940" y="125" fill="#7da8ef" font-size="22">02</text><text x="940" y="175" fill="white" font-size="27">参加表明率</text><text x="940" y="218" fill="#c0cee3" font-size="19">7日以内</text></g><g><circle cx="260" cy="475" r="135" fill="#55452f" stroke="#f0bd63" stroke-width="4"/><text x="260" y="435" fill="#f0bd63" font-size="22">03</text><text x="260" y="485" fill="white" font-size="27">初回プレイ率</text><text x="260" y="528" fill="#ddceb2" font-size="19">表明から完了</text></g><g><circle cx="940" cy="475" r="135" fill="#553d60" stroke="#c991db" stroke-width="4"/><text x="940" y="435" fill="#c991db" font-size="22">04</text><text x="940" y="485" fill="white" font-size="27">7日再参加率</text><text x="940" y="528" fill="#d5bddf" font-size="19">初回後の再行動</text></g><path d="M410 165H790M410 475H790M260 315V325M940 315V325" stroke="#526d88" stroke-width="5"/></g></g></svg>

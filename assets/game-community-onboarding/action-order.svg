<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">行動順のオンボーディング</title><desc id="d">大量の説明ではなく最初の行動へ案内する</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="80" y="90" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="3">ACTION ORDER</text><text x="80" y="155" fill="#fff" font-size="46" font-weight="800">情報順ではなく、行動順に並べる</text><g transform="translate(80 235)" font-weight="700"><rect width="560" height="430" rx="28" fill="#29333f" stroke="#8291a1" stroke-width="2"/><text x="40" y="60" fill="#aeb9c5" font-size="23">説明中心</text><g fill="#e1e6eb" font-size="25"><text x="55" y="135">1　ルールを全部読む</text><text x="55" y="200">2　詳しい自己紹介</text><text x="55" y="265">3　複数の場所を確認</text><text x="55" y="330">4　自力で募集を探す</text></g><text x="280" y="390" text-anchor="middle" fill="#d08f8f" font-size="22">迷って止まりやすい</text><path d="M600 215H680" stroke="#f0bd63" stroke-width="7"/><path d="m665 201 27 14-27 14" fill="#f0bd63"/><rect x="720" width="560" height="430" rx="28" fill="#172b49" stroke="#7da8ef" stroke-width="3"/><text x="760" y="60" fill="#7da8ef" font-size="23">行動中心</text><g fill="white" font-size="25"><text x="775" y="135">1　重要ルールを確認</text><text x="775" y="200">2　募集中の投稿を見る</text><text x="775" y="265">3　参加表明する</text><text x="775" y="330">4　会話方法を確認</text></g><text x="1000" y="390" text-anchor="middle" fill="#61dbc5" font-size="22">最初のプレイへ進む</text></g></g></svg>

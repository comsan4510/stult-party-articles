<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">参加から初回プレイまでのオンボーディング</title><desc id="d">参加から募集確認、参加表明、初回プレイへ進む流れ</desc><rect width="1440" height="810" fill="#081525"/><path d="M0 160H1440M0 320H1440M0 480H1440M0 640H1440M240 0V810M480 0V810M720 0V810M960 0V810M1200 0V810" stroke="#203a52" opacity=".45"/><g font-family="sans-serif"><text x="80" y="90" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="4">COMMUNITY ONBOARDING</text><text x="80" y="175" fill="#f7f9ff" font-size="54" font-weight="800">参加初日から、</text><text x="80" y="245" fill="#f7f9ff" font-size="54" font-weight="800">最初のプレイへつなぐ</text><g transform="translate(70 360)" text-anchor="middle" font-family="sans-serif" font-weight="700"><rect width="1300" height="230" rx="30" fill="#12263c" stroke="#38536d" stroke-width="2"/><g transform="translate(35 55)"><circle cx="90" cy="60" r="58" fill="#123c35" stroke="#61dbc5" stroke-width="3"/><text x="90" y="68" fill="white" font-size="22">参加</text></g><path d="M225 115H385" stroke="#607b98" stroke-width="6"/><path d="m370 103 24 12-24 12" fill="#607b98"/><g transform="translate(390 55)"><circle cx="90" cy="60" r="58" fill="#1d3861" stroke="#7da8ef" stroke-width="3"/><text x="90" y="68" fill="white" font-size="22">募集確認</text></g><path d="M580 115H740" stroke="#607b98" stroke-width="6"/><path d="m725 103 24 12-24 12" fill="#607b98"/><g transform="translate(745 55)"><circle cx="90" cy="60" r="58" fill="#5a4931" stroke="#f0bd63" stroke-width="3"/><text x="90" y="68" fill="white" font-size="22">参加表明</text></g><path d="M935 115H1095" stroke="#607b98" stroke-width="6"/><path d="m1080 103 24 12-24 12" fill="#607b98"/><g transform="translate(1100 55)"><circle cx="90" cy="60" r="58" fill="#563e61" stroke="#c991db" stroke-width="3"/><text x="90" y="68" fill="white" font-size="22">初回プレイ</text></g></g><rect x="370" y="675" width="700" height="64" rx="32" fill="#1b304a"/><text x="7
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">オンボーディングの状態遷移モデル</title><desc id="d">参加から再参加まで六つの状態</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="80" y="90" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="3">STATE MODEL</text><text x="80" y="155" fill="#fff" font-size="46" font-weight="800">どこで止まったかを、状態で見る</text><g transform="translate(80 255)" text-anchor="middle" font-weight="700"><path d="M100 170H1180" stroke="#526d88" stroke-width="8"/><g><circle cx="100" cy="170" r="78" fill="#12342f" stroke="#61dbc5" stroke-width="3"/><text x="100" y="160" fill="white" font-size="21">参加</text><text x="100" y="193" fill="#61dbc5" font-size="17">joined</text></g><g><circle cx="316" cy="170" r="78" fill="#1a454c" stroke="#62c9d6" stroke-width="3"/><text x="316" y="160" fill="white" font-size="21">条件共有</text><text x="316" y="193" fill="#62c9d6" font-size="16">profile_ready</text></g><g><circle cx="532" cy="170" r="78" fill="#172b49" stroke="#7da8ef" stroke-width="3"/><text x="532" y="160" fill="white" font-size="21">募集閲覧</text><text x="532" y="193" fill="#7da8ef" font-size="15">viewed</text></g><g><circle cx="748" cy="170" r="78" fill="#55452f" stroke="#f0bd63" stroke-width="3"/><text x="748" y="160" fill="white" font-size="21">参加表明</text><text x="748" y="193" fill="#f0bd63" font-size="15">participated</text></g><g><circle cx="964" cy="170" r="78" fill="#553d60" stroke="#c991db" stroke-width="3"/><text x="964" y="160" fill="white" font-size="21">初回プレイ</text><text x="964" y="193" fill="#c991db" font-size="15">first_played</text></g><g><circle cx="1180" cy="170" r="78" fill="#285844" stroke="#79dfac" stroke-width="3"/><text x="1180" y="160" fill="white" font-size="21">再参加</text><text x="1180" y="193" fill="#79dfac" font-size="15">returned</text></g><rect x="300" y="340" width="680" height="95" rx="24" fill="#14283d"/><text x="640" y="380" fill="white" font-size="22">各状態の発生日時を記録</text><text x="640" y="415" fill="#f0bd63" font-size="20">前段階を必須にしすぎない</text></g></g></svg>

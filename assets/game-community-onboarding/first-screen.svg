<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">参加直後に見せる三つの情報</title><desc id="d">対象者、重要ルール、最初の行動</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="80" y="90" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="3">FIRST SCREEN</text><text x="80" y="155" fill="#fff" font-size="46" font-weight="800">入口には、三つだけ置く</text><g transform="translate(80 245)" text-anchor="middle" font-weight="700"><g><rect width="390" height="360" rx="28" fill="#12342f" stroke="#61dbc5" stroke-width="3"/><text x="195" y="70" fill="#61dbc5" font-size="24">01　誰向けか</text><text x="195" y="145" fill="white" font-size="29">ゲーム・経験</text><text x="195" y="190" fill="white" font-size="29">時間・遊び方</text><text x="195" y="290" fill="#b7d0ca" font-size="20">参加前の約束と揃える</text></g><g transform="translate(445)"><rect width="390" height="360" rx="28" fill="#172b49" stroke="#7da8ef" stroke-width="3"/><text x="195" y="70" fill="#7da8ef" font-size="24">02　重要ルール</text><text x="195" y="145" fill="white" font-size="29">安全に直結する</text><text x="195" y="190" fill="white" font-size="29">3〜5項目</text><text x="195" y="290" fill="#c0cee3" font-size="20">詳細は別ページへ</text></g><g transform="translate(890)"><rect width="390" height="360" rx="28" fill="#55452f" stroke="#f0bd63" stroke-width="3"/><text x="195" y="70" fill="#f0bd63" font-size="24">03　今の行動</text><text x="195" y="145" fill="white" font-size="29">募集中の投稿を</text><text x="195" y="190" fill="white" font-size="29">一つ確認</text><text x="195" y="290" fill="#ddceb2" font-size="20">代替行動も一つだけ</text></g></g></g></svg>

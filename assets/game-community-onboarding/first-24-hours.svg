<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">参加二十四時間以内の募集マッチング</title><desc id="d">条件に合う募集を提示しなければ次回を作る</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="80" y="90" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="3">FIRST 24 HOURS</text><text x="80" y="155" fill="#fff" font-size="46" font-weight="800">合う募集を一つ提示する</text><g transform="translate(100 210)" text-anchor="middle" font-weight="700"><rect x="0" y="100" width="330" height="220" rx="28" fill="#12342f" stroke="#61dbc5" stroke-width="3"/><text x="165" y="165" fill="#61dbc5" font-size="23">参加者の条件</text><text x="165" y="220" fill="white" font-size="26">ゲーム・時間</text><text x="165" y="260" fill="white" font-size="26">経験・会話</text><path d="M350 210H500" stroke="#607b98" stroke-width="6"/><path d="m485 198 24 12-24 12" fill="#607b98"/><circle cx="620" cy="210" r="105" fill="#1b304a" stroke="#f0bd63" stroke-width="4"/><text x="620" y="200" fill="white" font-size="23">合う募集が</text><text x="620" y="238" fill="#f0bd63" font-size="24">ある？</text><path d="M725 210H875" stroke="#607b98" stroke-width="6"/><path d="m860 198 24 12-24 12" fill="#607b98"/><text x="800" y="188" fill="#79dfac" font-size="20">ある</text><rect x="890" y="55" width="350" height="160" rx="26" fill="#172b49" stroke="#7da8ef" stroke-width="3"/><text x="1065" y="115" fill="#7da8ef" font-size="23">候補を提示</text><text x="1065" y="165" fill="white" font-size="25">参加表明へ</text><path d="M620 315V420" stroke="#607b98" stroke-width="6"/><path d="m608 405 12 24 12-24" fill="#607b98"/><text x="650" y="382" fill="#c991db" font-size="20">ない</text><rect x="445" y="435" width="350" height="145" rx="26" fill="#553d60" stroke="#c991db" stroke-width="3"/><text x="620" y="492" fill="#c991db" font-size="23">次の機会を作る</text><text x="620" y="540" fill="white" font-size="23">予定を具体的に案内</text></g></g></svg>

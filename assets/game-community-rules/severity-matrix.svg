<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">違反レベル判定マトリクス</title><desc id="d">影響と緊急性の二軸で対応を判定する。</desc><rect width="1200" height="650" rx="34" fill="#0e192d"/><g font-family="sans-serif"><text x="64" y="70" fill="#f7f9ff" font-size="34" font-weight="700">影響 × 緊急性で対応を決める</text><path d="M190 530H1080M190 530V130" stroke="#7185a8" stroke-width="3"/><g font-size="22" font-weight="700" text-anchor="middle"><rect x="190" y="330" width="445" height="200" fill="#294f5b"/><text x="412" y="425" fill="white">レベル1：注意</text><text x="412" y="460" fill="#c0d9df" font-size="17">軽微・初回・修正可能</text><rect x="635" y="330" width="445" height="200" fill="#6a573b"/><text x="857" y="425" fill="white">レベル2：警告</text><text x="857" y="460" fill="#e4d3b6" font-size="17">反復・停止要求を無視</text><rect x="190" y="130" width="445" height="200" fill="#534768"/><text x="412" y="225" fill="white">レベル3：一時制限</text><text x="412" y="260" fill="#d8cbe0" font-size="17">被害拡大を先に止める</text><rect x="635" y="130" width="445" height="200" fill="#713e46"/><text x="857" y="225" fill="white">レベル4：退出・通報</text><text x="857" y="260" fill="#e8c5ca" font-size="17">重大・緊急・安全侵害</text></g><text x="190" y="580" fill="#b6c1d7" font-size="19">影響 小</text><text x="970" y="580" fill="#b6c1d7" font-size="19">影響 大</text><text x="85" y="510" fill="#b6c1d7" font-size="19">緊急性 低</text><text x="85" y="155" fill="#b6c1d7" font-size="19">緊急性 高</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">モデレーション記録のデータ構造</title><desc id="d">案件、判定、対応、再確認の最小フィールド。</desc><rect width="1200" height="650" rx="34" fill="#0e192d"/><g font-family="sans-serif"><text x="64" y="70" fill="#f7f9ff" font-size="34" font-weight="700">長文メモではなく、判断を構造化する</text><g transform="translate(65 115)"><rect width="1070" height="445" rx="24" fill="#121f35" stroke="#405c7d" stroke-width="2"/><g font-family="monospace" font-size="19"><g fill="#76ddd5" font-weight="700"><text x="40" y="60">案件</text><text x="300" y="60">判定</text><text x="565" y="60">対応</text><text x="825" y="60">再確認</text></g><g fill="#d8e0ef"><text x="40" y="105">case_id</text><text x="40" y="145">occurred_at</text><text x="40" y="185">reported_at</text><text x="40" y="225">subject_id</text><text x="300" y="105">rule_id</text><text x="300" y="145">severity</text><text x="300" y="185">evidence_ref</text><text x="300" y="225">reason</text><text x="565" y="105">action</text><text x="565" y="145">expires_at</text><text x="565" y="185">decided_by</text><text x="825" y="105">review_at</text><text x="825" y="145">status</text></g><path d="M265 30V380M530 30V380M790 30V380" stroke="#344c6b" stroke-width="2"/><rect x="40" y="285" width="950" height="65" rx="16" fill="#24344e"/><text x="515" y="326" text-anchor="middle" fill="#f2c16c" font-family="sans-serif" font-size="19" font-weight="700">証拠本文を複製せず、可能なら evidence_ref で原本を参照</text></g></g><text x="600" y="610" text-anchor="middle" fill="#b7c3d8" font-size="18">閲覧者・保存期間・削除条件も同時に決める</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">ルール公開前チェックリスト</title><desc id="d">文章、相談、判断、記録の10項目。</desc><rect width="1200" height="650" rx="34" fill="#0e192d"/><g font-family="sans-serif"><text x="64" y="70" fill="#f7f9ff" font-size="34" font-weight="700">公開前に「動くルール」か確認する</text><g font-size="19"><g transform="translate(70 125)"><rect width="500" height="420" rx="24" fill="#14243b"/><text x="40" y="55" fill="#76ddd5" font-size="22" font-weight="700">文章</text><g fill="#d9e1ef"><text x="40" y="105">☑ 価値を1文で示した</text><text x="40" y="155">☑ 行動で具体化した</text><text x="40" y="205">☑ 募集の場面を含めた</text><text x="40" y="255">☑ チャット・ボイスを含めた</text><text x="40" y="305">☑ 変更日を残せる</text></g></g><g transform="translate(630 125)"><rect width="500" height="420" rx="24" fill="#14243b"/><text x="40" y="55" fill="#f2c16c" font-size="22" font-weight="700">運用</text><g fill="#d9e1ef"><text x="40" y="105">☑ 非公開の相談窓口がある</text><text x="40" y="155">☑ 対応段階を決めた</text><text x="40" y="205">☑ 緊急条件を決めた</text><text x="40" y="255">☑ 記録の閲覧者を決めた</text><text x="40" y="305">☑ 保存期間を決めた</text></g></g></g><text x="600" y="600" text-anchor="middle" fill="#b7c3d8" font-size="19">読めるだけでなく、相談から再確認まで迷わず進めるか</text></g></svg>

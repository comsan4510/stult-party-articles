<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">ゲームコミュニティのルール設計</title><desc id="d">価値、行動、対応、相談窓口の4要素を示す。</desc><rect width="1440" height="810" fill="#0b1427"/><path d="M0 150H1440M0 300H1440M0 450H1440M0 600H1440M220 0V810M520 0V810M820 0V810M1120 0V810" stroke="#263956" opacity=".45"/><g font-family="sans-serif"><text x="80" y="100" fill="#72ddd4" font-size="21" font-weight="700" letter-spacing="4">COMMUNITY SAFETY DESIGN</text><text x="80" y="180" fill="#f7f9ff" font-size="54" font-weight="800">ゲームコミュニティの</text><text x="80" y="248" fill="#f7f9ff" font-size="54" font-weight="800">ルールは、運用まで設計する。</text><g transform="translate(80 345)"><rect width="1280" height="270" rx="30" fill="#121f35" stroke="#385475" stroke-width="2"/><g text-anchor="middle" font-weight="700"><g transform="translate(100 65)"><circle cx="65" cy="65" r="58" fill="#256c69" stroke="#87ddd5" stroke-width="3"/><text x="65" y="73" fill="white" font-size="22">価値</text><text x="65" y="158" fill="#b7c5dc" font-size="17">何を守るか</text></g><path d="M230 130H340" stroke="#6883a7" stroke-width="5"/><g transform="translate(340 65)"><circle cx="65" cy="65" r="58" fill="#314d78" stroke="#7ca7ed" stroke-width="3"/><text x="65" y="73" fill="white" font-size="22">行動</text><text x="65" y="158" fill="#b7c5dc" font-size="17">何をするか</text></g><path d="M470 130H580" stroke="#6883a7" stroke-width="5"/><g transform="translate(580 65)"><circle cx="65" cy="65" r="58" fill="#68503a" stroke="#e5ad65" stroke-width="3"/><text x="65" y="73" fill="white" font-size="22">対応</text><text x="65" y="158" fill="#b7c5dc" font-size="17">どう判断するか</text></g><path d="M710 130H820" stroke="#6883a7" stroke-width="5"/><g transform="translate(820 65)"><circle cx="65" cy="65" r="58" fill="#60446c" stroke="#c792dc" stroke-width="3"/><text x="65" y="73" fill="white" font-size="22">相談</text><text x="65" y="158" fill="#b7c5dc" font-size="17">どこへ伝えるか</text></g></g></g
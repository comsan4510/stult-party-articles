<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">ルールの三層構造</title><desc id="d">法令、プラットフォーム規約、コミュニティ固有ルールの関係。</desc><rect width="1200" height="650" rx="34" fill="#0e192d"/><g font-family="sans-serif"><text x="64" y="72" fill="#f6f8ff" font-size="34" font-weight="700">ルールは三層で考える</text><g text-anchor="middle"><path d="M240 510L600 130 960 510z" fill="#16253e" stroke="#416082" stroke-width="3"/><path d="M330 415H870L960 510H240z" fill="#2d465f"/><path d="M430 310H770L870 415H330z" fill="#315f61"/><path d="M600 130L770 310H430z" fill="#65503d"/><text x="600" y="465" fill="white" font-size="25" font-weight="700">法令・安全上の最低線</text><text x="600" y="365" fill="white" font-size="25" font-weight="700">プラットフォーム規約</text><text x="600" y="255" fill="white" font-size="24" font-weight="700">コミュニティ固有ルール</text></g><text x="600" y="585" text-anchor="middle" fill="#f2c16c" font-size="20" font-weight="700">上の層ほど具体的に。下の層と矛盾させない。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">違反対応フロー</title><desc id="d">安全確保から記録までの7段階。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#738aad"/></marker></defs><rect width="1200" height="650" rx="34" fill="#0e192d"/><g font-family="sans-serif"><text x="64" y="70" fill="#f7f9ff" font-size="34" font-weight="700">通報後は、同じ順序で判断する</text><g text-anchor="middle" font-weight="700"><g transform="translate(70 140)"><rect width="260" height="100" rx="20" fill="#713e46"/><text x="130" y="58" fill="white" font-size="21">1 安全確保</text></g><path d="M330 190H455" stroke="#738aad" stroke-width="4" marker-end="url(#a)"/><g transform="translate(470 140)"><rect width="260" height="100" rx="20" fill="#314d78"/><text x="130" y="58" fill="white" font-size="21">2 情報受付</text></g><path d="M730 190H855" stroke="#738aad" stroke-width="4" marker-end="url(#a)"/><g transform="translate(870 140)"><rect width="260" height="100" rx="20" fill="#315f61"/><text x="130" y="58" fill="white" font-size="21">3 ルール特定</text></g><path d="M1000 240V330" stroke="#738aad" stroke-width="4" marker-end="url(#a)"/><g transform="translate(870 345)"><rect width="260" height="100" rx="20" fill="#4d596d"/><text x="130" y="58" fill="white" font-size="21">4 事実確認</text></g><path d="M870 395H745" stroke="#738aad" stroke-width="4" marker-end="url(#a)"/><g transform="translate(470 345)"><rect width="260" height="100" rx="20" fill="#65503d"/><text x="130" y="58" fill="white" font-size="21">5 レベル判断</text></g><path d="M470 395H345" stroke="#738aad" stroke-width="4" marker-end="url(#a)"/><g transform="translate(70 345)"><rect width="260" height="100" rx="20" fill="#60446c"/><text x="130" y="58" fill="white" font-size="21">6 本人へ通知</text></g><path d="M200 445V520" stroke="#738aad" stroke-width="4" marker-end="url(#a)"/><rect x="70" y="535" width="1060" height="65" rx="22" fill="#21324c"/><text x="600" y="577" fill="#f2c16c" font-size="21">7 必要最小限を記録し、再確認日を設定</text></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">モデレーションの役割分担</title><desc id="d">受付、確認、判断、再確認の役割。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#758caf"/></marker></defs><rect width="1200" height="650" rx="34" fill="#0e192d"/><g font-family="sans-serif"><text x="64" y="70" fill="#f7f9ff" font-size="34" font-weight="700">重大判断を一人に集中させない</text><g text-anchor="middle"><g transform="translate(65 165)"><rect width="235" height="190" rx="24" fill="#315f61"/><text x="117" y="60" fill="white" font-size="24" font-weight="700">受付</text><text x="117" y="105" fill="#c3e0dd" font-size="17">安全確認</text><text x="117" y="135" fill="#c3e0dd" font-size="17">必要情報</text></g><path d="M300 260H365" stroke="#758caf" stroke-width="4" marker-end="url(#a)"/><g transform="translate(380 165)"><rect width="235" height="190" rx="24" fill="#314d78"/><text x="117" y="60" fill="white" font-size="24" font-weight="700">確認</text><text x="117" y="105" fill="#c7d7ef" font-size="17">証拠整理</text><text x="117" y="135" fill="#c7d7ef" font-size="17">当事者確認</text></g><path d="M615 260H680" stroke="#758caf" stroke-width="4" marker-end="url(#a)"/><g transform="translate(695 165)"><rect width="235" height="190" rx="24" fill="#65503d"/><text x="117" y="60" fill="white" font-size="24" font-weight="700">判断</text><text x="117" y="105" fill="#ead9bd" font-size="17">ルール照合</text><text x="117" y="135" fill="#ead9bd" font-size="17">対応決定</text></g><path d="M930 260H995" stroke="#758caf" stroke-width="4" marker-end="url(#a)"/><g transform="translate(950 165)"><rect width="185" height="190" rx="24" fill="#60446c"/><text x="92" y="60" fill="white" font-size="24" font-weight="700">再確認</text><text x="92" y="105" fill="#dfcde5" font-size="17">期限確認</text><text x="92" y="135" fill="#dfcde5" font-size="17">再発確認</text></g></g><rect x="250" y="445" width="700" height="82" rx="24" fill="#21324c"/><text x="600" y="495" text-anchor="middle" fill="#f2c16c" font-size="21" font-weight="700">小規模でも重大案件は二者確認</text></g></svg>

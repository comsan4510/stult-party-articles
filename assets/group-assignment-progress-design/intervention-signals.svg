<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#071b27"/><text x="60" y="64" fill="#48e0d1" font-family="Arial,'Noto Sans JP',sans-serif" font-size="18" font-weight="700" letter-spacing="3">SUPPORT SIGNALS</text><text x="60" y="112" fill="#f4f7fb" font-family="Arial,'Noto Sans JP',sans-serif" font-size="34" font-weight="700">教員が支援を始める5つの兆候</text><g font-family="Arial,'Noto Sans JP',sans-serif"><g transform="translate(65 175)"><rect width="330" height="135" rx="17" fill="#14354a" stroke="#7d92a5"/><text x="25" y="37" fill="#8fa8ba" font-size="13" font-weight="700">01 NOT READY</text><text x="25" y="78" fill="#fff" font-size="21" font-weight="700">確認後も担当未確定</text><text x="25" y="108" fill="#abc0ce" font-size="15">proposed のまま</text></g><g transform="translate(435 175)"><rect width="330" height="135" rx="17" fill="#3b262b" stroke="#f06a6a"/><text x="25" y="37" fill="#ff7b7b" font-size="13" font-weight="700">02 BLOCKED</text><text x="25" y="78" fill="#fff" font-size="21" font-weight="700">停止が二授業以上続く</text><text x="25" y="108" fill="#d7a7ad" font-size="15">解除方法がない</text></g><g transform="translate(805 175)"><rect width="330" height="135" rx="17" fill="#3b3020" stroke="#f4b942"/><text x="25" y="37" fill="#ffc857" font-size="13" font-weight="700">03 IMBALANCE</text><text x="25" y="78" fill="#fff" font-size="21" font-weight="700">一人へ担当が集中</text><text x="25" y="108" fill="#d9c59c" font-size="15">成果物の半数以上</text></g><g transform="translate(250 350)"><rect width="330" height="135" rx="17" fill="#293041" stroke="#b58ad7"/><text x="25" y="37" fill="#c99cea" font-size="13" font-weight="700">04 NO REVIEWER</text><text x="25" y="78" fill="#fff" font-size="21" font-weight="700">確認者がいない</text><text x="25" y="108" fill="#c6b6d7" font-size="15">review で停止</text></g><g transform="translate(620 350)"><rect width="330" height="135" rx="17" fill="#183745" stroke="#45d9cc"/><text x="25" y="37" fill="#48e0d1" font-size="13" font-weight="700">05 SUBMISSION RISK</text><text x="25" y="78" fill="#fff" font-size="21" font-weight="700">提出条件が未解決</text><text x="25" y="108" fill="#a9d6d1" font-size="15">期限・形式・提出先</text></g></g><rect x="265" y="540" width="670" height="70" rx="14" fill="#103247"/><text x="600" y="583" text-anchor="middle" fill="#e8f1f6" font-family="Arial,'Noto Sans JP',sans-serif" font-size="19" font-weight="700">投稿数ではなく、成果物と停止状態から支援する</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#071b27"/><text x="60" y="64" fill="#48e0d1" font-family="Arial,'Noto Sans JP',sans-serif" font-size="18" font-weight="700" letter-spacing="3">THREE LAYERS</text><text x="60" y="112" fill="#f4f7fb" font-family="Arial,'Noto Sans JP',sans-serif" font-size="34" font-weight="700">課題・制作進捗・相談を混ぜない</text><g font-family="Arial,'Noto Sans JP',sans-serif"><rect x="115" y="190" width="970" height="105" rx="18" fill="#3b3020" stroke="#f4b942" stroke-width="2"/><text x="160" y="225" fill="#ffc857" font-size="14" font-weight="700">LAYER 01 / 課題・提出</text><text x="160" y="264" fill="#fff" font-size="22" font-weight="700">目的・期限・評価基準・正式提出先</text><text x="970" y="252" text-anchor="end" fill="#d9c59c" font-size="16">教員が正本を管理</text><rect x="115" y="325" width="970" height="105" rx="18" fill="#293041" stroke="#b58ad7" stroke-width="2"/><text x="160" y="360" fill="#c99cea" font-size="14" font-weight="700">LAYER 02 / 制作進捗</text><text x="160" y="399" fill="#fff" font-size="22" font-weight="700">成果物・担当・状態・確認日</text><text x="970" y="387" text-anchor="end" fill="#c6b6d7" font-size="16">グループが更新</text><rect x="115" y="460" width="970" height="105" rx="18" fill="#183745" stroke="#45d9cc" stroke-width="2"/><text x="160" y="495" fill="#48e0d1" font-size="14" font-weight="700">LAYER 03 / 相談</text><text x="160" y="534" fill="#fff" font-size="22" font-weight="700">質問・意見・短い判断記録</text><text x="970" y="522" text-anchor="end" fill="#a9d6d1" font-size="16">会話量を評価へ直結しない</text></g></svg>

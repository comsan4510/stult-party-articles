<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#071b27"/><text x="60" y="64" fill="#48e0d1" font-family="Arial,'Noto Sans JP',sans-serif" font-size="18" font-weight="700" letter-spacing="3">THREE CHECKPOINTS</text><text x="60" y="112" fill="#f4f7fb" font-family="Arial,'Noto Sans JP',sans-serif" font-size="34" font-weight="700">教員の確認は3回、目的を変える</text><g font-family="Arial,'Noto Sans JP',sans-serif"><g transform="translate(80 205)"><rect width="300" height="235" rx="20" fill="#183745" stroke="#45d9cc" stroke-width="2"/><text x="35" y="45" fill="#48e0d1" font-size="14" font-weight="700">CHECK 01</text><text x="35" y="92" fill="#fff" font-size="27" font-weight="700">テーマと問い</text><text x="35" y="135" fill="#abc0ce" font-size="17">目的に合うか</text><text x="35" y="169" fill="#abc0ce" font-size="17">調べられる範囲か</text><text x="35" y="203" fill="#abc0ce" font-size="17">資料へアクセスできるか</text></g><path d="M380 322H450" stroke="#7894a5" stroke-width="3"/><path d="M450 322l-12-8v16z" fill="#7894a5"/><g transform="translate(450 205)"><rect width="300" height="235" rx="20" fill="#293041" stroke="#b58ad7" stroke-width="2"/><text x="35" y="45" fill="#c99cea" font-size="14" font-weight="700">CHECK 02</text><text x="35" y="92" fill="#fff" font-size="27" font-weight="700">構成と根拠</text><text x="35" y="135" fill="#c6b6d7" font-size="17">主張と根拠</text><text x="35" y="169" fill="#c6b6d7" font-size="17">反対意見</text><text x="35" y="203" fill="#c6b6d7" font-size="17">結論へのつながり</text></g><path d="M750 322H820" stroke="#7894a5" stroke-width="3"/><path d="M820 322l-12-8v16z" fill="#7894a5"/><g transform="translate(820 205)"><rect width="300" height="235" rx="20" fill="#3b3020" stroke="#f4b942" stroke-width="2"/><text x="35" y="45" fill="#ffc857" font-size="14" font-weight="700">CHECK 03</text><text x="35" y="92" fill="#fff" font-size="27" font-weight="700">提出条件</text><text x="35" y="135" fill="#d9c59c" font-size="17">形式・出典</text><text x="35" y="169" fill="#d9c59c" font-size="17">閲覧権限</text><text x="35" y="203" fill="#d9c59c" font-size="17">提出先と期限</text></g><rect x="280" y="510" width="640" height="72" rx="14" fill="#103247"/><text x="600" y="554" text-anchor="middle" fill="#e8f1f6" font-size="19" font-weight="700">方向修正 → 論理確認 → 提出事故の防止</text></g></svg>

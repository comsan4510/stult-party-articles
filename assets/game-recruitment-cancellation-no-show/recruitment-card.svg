<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">キャンセルに強い募集文の8項目</title><desc id="d">日時、終了、定員、補欠、状態、期限、確認、連絡先を示す募集カード</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">RECRUITMENT CARD</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">参加前に、変更時の動きまで見せる</text><text x="72" y="174" fill="#9db0c3" font-size="22">日時と人数だけでなく、保留・補欠・再確認を明記する</text><rect x="170" y="230" width="1100" height="480" rx="32" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="220" y="290" fill="#61dbc5" font-size="19" font-weight="700">GAME RECRUITMENT</text><text x="220" y="345" fill="#f4f7fb" font-size="32" font-weight="700">金曜22時｜協力プレイ募集</text><g fill="#c4d0dc" font-size="22"><text x="220" y="405">01 開始　11月6日（金）22:00 JST</text><text x="220" y="452">02 終了目安　24:00</text><text x="220" y="499">03 定員　確定4名</text><text x="220" y="546">04 補欠　2名まで</text><text x="760" y="405">05 状態　確定／保留／辞退</text><text x="760" y="452">06 保留期限　前日20:00</text><text x="760" y="499">07 直前確認　当日20:00</text><text x="760" y="546">08 変更連絡　募集チャット</text></g><rect x="220" y="605" width="470" height="54" rx="14" fill="#143b41"/><text x="455" y="640" text-anchor="middle" fill="#61dbc5" font-size="20" font-weight="700">理由の詳細なしで辞退できます</text><rect x="750" y="605" width="470" height="54" rx="14" fill="#3d3023"/><text x="985" y="640" text-anchor="middle" fill="#f0b566" font-size="20" font-weight="700">空き枠は補欠順に案内します</text></g></svg>

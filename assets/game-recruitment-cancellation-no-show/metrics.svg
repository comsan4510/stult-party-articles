<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">キャンセル・無断欠席対策を測る5つの指標</title><desc id="d">確定参加、事前辞退、保留解消、補欠繰上げ、欠席理由を測る図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">ATTENDANCE METRICS</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">辞退ゼロではなく、実参加の安定を測る</text><text x="72" y="174" fill="#9db0c3" font-size="22">早い連絡と空き枠の回復を評価する</text><g transform="translate(80 270)"><rect width="240" height="310" rx="24" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="30" y="54" fill="#61dbc5" font-size="17" font-weight="700">01 ATTEND</text><text x="30" y="106" fill="#f4f7fb" font-size="26" font-weight="700">確定参加率</text><text x="30" y="170" fill="#c4d0dc" font-size="19">確定から実参加へ</text><text x="30" y="208" fill="#c4d0dc" font-size="19">進んだ割合</text></g><g transform="translate(340 270)"><rect width="240" height="310" rx="24" fill="#10253a" stroke="#8fa8c0" stroke-width="3"/><text x="30" y="54" fill="#9db0c3" font-size="17" font-weight="700">02 CANCEL</text><text x="30" y="106" fill="#f4f7fb" font-size="26" font-weight="700">事前辞退率</text><text x="30" y="170" fill="#c4d0dc" font-size="19">変更を開始前に</text><text x="30" y="208" fill="#c4d0dc" font-size="19">伝えた割合</text></g><g transform="translate(600 270)"><rect width="240" height="310" rx="24" fill="#10253a" stroke="#f0b566" stroke-width="3"/><text x="30" y="54" fill="#f0b566" font-size="17" font-weight="700">03 RESOLVE</text><text x="30" y="106" fill="#f4f7fb" font-size="26" font-weight="700">保留解消率</text><text x="30" y="170" fill="#c4d0dc" font-size="19">期限までに状態を</text><text x="30" y="208" fill="#c4d0dc" font-size="19">更新した割合</text></g><g transform="translate(860 270)"><rect width="240" height="310" rx="24" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="30" y="54" fill="#c991db" font-size="17" font-weight="700">04 WAITLIST</text><text x="30" y="106" fill="#f4f7fb" font-size="26" font-weight="700">補欠成功率</text><text x="30" y="170" fill="#c4d0dc" font-size="19">空き枠を補欠で</text><text x="30" y="208" fill="#c4d0dc" font-size="19">埋めた割合</text></g><g transform="translate(1120 270)"><rect width="240" height="310" rx="24" fill="#10253a" stroke="#e17878" stroke-width="3"/><text x="30" y="54" fill="#e17878" font-size="17" font-weight="700">05 CAUSE</text><text x="30" y="106" fill="#f4f7fb" font-size="26" font-weight="700">欠席理由</text><text x="30" y="170" fill="#c4d0dc" font-size="19">時刻・場所・通知</text><text x="30" y="208" fill="#c4d0dc" font-size="19">技術・不明</text></g><rect x="305" y="665" width="830" height="64" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="707" text-anchor="middle" fill="#f4f7fb" font-size="22" font-weight="700">個人の順位ではなく、募集設計の改善へ使う</text></g></svg>

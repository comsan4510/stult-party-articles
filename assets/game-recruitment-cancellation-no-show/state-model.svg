<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">参加表明の状態遷移と最小データ構造</title><desc id="d">興味、保留、確定、出席と辞退、無断欠席への遷移を示す図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">RSVP STATE MODEL</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">参加者名簿ではなく、状態の変化を記録する</text><text x="72" y="174" fill="#9db0c3" font-size="22">辞退はどの状態からでも選べる</text><g text-anchor="middle"><g transform="translate(70 265)"><rect width="220" height="105" rx="20" fill="#223448" stroke="#8fa8c0" stroke-width="3"/><text x="110" y="46" fill="#9db0c3" font-size="16" font-weight="700">INTERESTED</text><text x="110" y="79" fill="#f4f7fb" font-size="22">興味あり</text></g><g transform="translate(360 265)"><rect width="220" height="105" rx="20" fill="#3d3023" stroke="#f0b566" stroke-width="3"/><text x="110" y="46" fill="#f0b566" font-size="16" font-weight="700">TENTATIVE</text><text x="110" y="79" fill="#f4f7fb" font-size="22">保留</text></g><g transform="translate(650 265)"><rect width="220" height="105" rx="20" fill="#143b41" stroke="#61dbc5" stroke-width="3"/><text x="110" y="46" fill="#61dbc5" font-size="16" font-weight="700">CONFIRMED</text><text x="110" y="79" fill="#f4f7fb" font-size="22">確定</text></g><g transform="translate(940 265)"><rect width="220" height="105" rx="20" fill="#143b41" stroke="#61dbc5" stroke-width="3"/><text x="110" y="46" fill="#61dbc5" font-size="16" font-weight="700">ATTENDED</text><text x="110" y="79" fill="#f4f7fb" font-size="22">出席</text></g></g><g stroke="#7890a8" stroke-width="5"><path d="M290 317h70"/><path d="M580 317h70"/><path d="M870 317h70"/></g><path d="M760 370v95" stroke="#e17878" stroke-width="5"/><g transform="translate(650 465)" text-anchor="middle"><rect width="220" height="100" rx="20" fill="#36252a" stroke="#e17878" stroke-width="3"/><text x="110" y="44" fill="#e17878" font-size="16" font-weight="700">NO SHOW</text><text x="110" y="76" fill="#f4f7fb" font-size="22">無断欠席</text></g><rect x="120" y="620" width="1200" height="110" rx="24" fill="#10253a" stroke="#29465f" stroke-width="3"/><text x="165" y="670" fill="#61dbc5" font-size="18" font-weight="700">MINIMUM FIELDS</text><text x="165" y="705" fill="#f4f7fb" font-size="20">募集ID・参加者・状態・更新時刻・回答期限・再確認・補欠順位・集合確認・理由分類</text><g transform="translate(1080 465)" text-anchor="middle"><rect width="220" height="100" rx="20" fill="#35273c" stroke="#c991db" stroke-width="3"/><text x="110" y="44" fill="#c991db" font-size="16" font-weight="700">CANCELLED</text><text x="110" y="76" fill="#f4f7fb" font-size="22">辞退</text></g><path d="M1080 515H900" stroke="#c991db" stroke-width="4" stroke-dasharray="10 10"/></g></svg>

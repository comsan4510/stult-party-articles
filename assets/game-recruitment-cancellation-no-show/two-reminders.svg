<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">募集前日と開始直前の二段階確認</title><desc id="d">補欠を動かす前日確認と集合を案内する当日確認を分ける図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">TWO REMINDERS, TWO PURPOSES</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">再確認は2回まで、目的を変えて送る</text><text x="72" y="174" fill="#9db0c3" font-size="22">通知回数ではなく、次の行動を明確にする</text><g transform="translate(110 250)"><rect width="540" height="370" rx="30" fill="#10253a" stroke="#f0b566" stroke-width="3"/><text x="45" y="62" fill="#f0b566" font-size="19" font-weight="700">REMINDER 01 — DAY BEFORE</text><text x="45" y="120" fill="#f4f7fb" font-size="32" font-weight="700">枠を確定する</text><text x="45" y="190" fill="#c4d0dc" font-size="22">・保留を確定／辞退へ</text><text x="45" y="240" fill="#c4d0dc" font-size="22">・回答期限を示す</text><text x="45" y="290" fill="#c4d0dc" font-size="22">・空き枠を補欠へ戻す</text><rect x="45" y="320" width="450" height="38" rx="10" fill="#3d3023"/></g><path d="M680 435h80" stroke="#7890a8" stroke-width="6"/><path d="m760 435-22-13v26z" fill="#7890a8"/><g transform="translate(790 250)"><rect width="540" height="370" rx="30" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="45" y="62" fill="#61dbc5" font-size="19" font-weight="700">REMINDER 02 — SAME DAY</text><text x="45" y="120" fill="#f4f7fb" font-size="32" font-weight="700">集合迷子を防ぐ</text><text x="45" y="190" fill="#c4d0dc" font-size="22">・開始と集合場所</text><text x="45" y="240" fill="#c4d0dc" font-size="22">・主催者と遅刻連絡先</text><text x="45" y="290" fill="#c4d0dc" font-size="22">・猶予後の処理</text><rect x="45" y="320" width="450" height="38" rx="10" fill="#143b41"/></g><text x="720" y="705" text-anchor="middle" fill="#f4f7fb" font-size="22" font-weight="700">前日は参加状態、当日は集合情報を確認する</text></g></svg>

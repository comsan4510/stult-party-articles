<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">無断欠席につながる6つの構造的原因</title><desc id="d">日時、状態、場所、文化、確認、変更通知の問題を示す図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">SIX ROOT CAUSES</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">本人の意欲だけでなく、募集の構造を点検する</text><text x="72" y="174" fill="#9db0c3" font-size="22">原因ごとに直す場所は異なる</text><g text-anchor="middle"><g transform="translate(90 255)"><rect width="390" height="150" rx="24" fill="#10253a" stroke="#8fa8c0" stroke-width="3"/><text x="195" y="60" fill="#9db0c3" font-size="18" font-weight="700">01 TIME</text><text x="195" y="108" fill="#f4f7fb" font-size="26" font-weight="700">日時が曖昧</text></g><g transform="translate(525 255)"><rect width="390" height="150" rx="24" fill="#10253a" stroke="#f0b566" stroke-width="3"/><text x="195" y="60" fill="#f0b566" font-size="18" font-weight="700">02 STATUS</text><text x="195" y="108" fill="#f4f7fb" font-size="26" font-weight="700">参加表明の意味が曖昧</text></g><g transform="translate(960 255)"><rect width="390" height="150" rx="24" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="195" y="60" fill="#61dbc5" font-size="18" font-weight="700">03 PLACE</text><text x="195" y="108" fill="#f4f7fb" font-size="26" font-weight="700">募集と集合が分断</text></g><g transform="translate(90 450)"><rect width="390" height="150" rx="24" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="195" y="60" fill="#c991db" font-size="18" font-weight="700">04 CULTURE</text><text x="195" y="108" fill="#f4f7fb" font-size="26" font-weight="700">変更を言い出しにくい</text></g><g transform="translate(525 450)"><rect width="390" height="150" rx="24" fill="#10253a" stroke="#f0b566" stroke-width="3"/><text x="195" y="60" fill="#f0b566" font-size="18" font-weight="700">05 TIMING</text><text x="195" y="108" fill="#f4f7fb" font-size="26" font-weight="700">再確認の時刻が不適切</text></g><g transform="translate(960 450)"><rect width="390" height="150" rx="24" fill="#10253a" stroke="#e17878" stroke-width="3"/><text x="195" y="60" fill="#e17878" font-size="18" font-weight="700">06 UPDATE</text><text x="195" y="108" fill="#f4f7fb" font-size="26" font-weight="700">条件変更が届かない</text></g></g><text x="720" y="700" text-anchor="middle" fill="#f4f7fb" font-size="22" font-weight="700">原因を分類してから、募集文・導線・通知を一つずつ直す</text></g></svg>

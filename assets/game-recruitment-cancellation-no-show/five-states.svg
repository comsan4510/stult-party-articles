<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">ゲーム募集の参加状況を5状態に分ける図</title><desc id="d">興味、保留、確定、辞退、無断欠席の扱いを比較する図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">FIVE RSVP STATES</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">反応した人を、全員「確定」にしない</text><text x="72" y="174" fill="#9db0c3" font-size="22">定員へ数える状態と、次の行動を分ける</text><g transform="translate(65 270)"><rect width="250" height="300" rx="24" fill="#10253a" stroke="#8fa8c0" stroke-width="3"/><text x="30" y="54" fill="#9db0c3" font-size="17" font-weight="700">INTERESTED</text><text x="30" y="108" fill="#f4f7fb" font-size="28" font-weight="700">興味あり</text><text x="30" y="176" fill="#c4d0dc" font-size="20">定員に数えない</text><text x="30" y="220" fill="#c4d0dc" font-size="20">締切までに回答</text></g><g transform="translate(330 270)"><rect width="250" height="300" rx="24" fill="#10253a" stroke="#f0b566" stroke-width="3"/><text x="30" y="54" fill="#f0b566" font-size="17" font-weight="700">TENTATIVE</text><text x="30" y="108" fill="#f4f7fb" font-size="28" font-weight="700">保留</text><text x="30" y="176" fill="#c4d0dc" font-size="20">原則数えない</text><text x="30" y="220" fill="#c4d0dc" font-size="20">回答期限を示す</text></g><g transform="translate(595 270)"><rect width="250" height="300" rx="24" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="30" y="54" fill="#61dbc5" font-size="17" font-weight="700">CONFIRMED</text><text x="30" y="108" fill="#f4f7fb" font-size="28" font-weight="700">確定</text><text x="30" y="176" fill="#c4d0dc" font-size="20">定員に数える</text><text x="30" y="220" fill="#c4d0dc" font-size="20">変更時に連絡</text></g><g transform="translate(860 270)"><rect width="250" height="300" rx="24" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="30" y="54" fill="#c991db" font-size="17" font-weight="700">CANCELLED</text><text x="30" y="108" fill="#f4f7fb" font-size="28" font-weight="700">辞退</text><text x="30" y="176" fill="#c4d0dc" font-size="20">枠を戻す</text><text x="30" y="220" fill="#c4d0dc" font-size="20">補欠へ案内</text></g><g transform="translate(1125 270)"><rect width="250" height="300" rx="24" fill="#10253a" stroke="#e17878" stroke-width="3"/><text x="30" y="54" fill="#e17878" font-size="17" font-weight="700">NO SHOW</text><text x="30" y="108" fill="#f4f7fb" font-size="28" font-weight="700">無断欠席</text><text x="30" y="176" fill="#c4d0dc" font-size="20">事実を確認</text><text x="30" y="220" fill="#c4d0dc" font-size="20">原因を記録</text></g><text x="720" y="680" text-anchor="middle" fill="#f4f7fb" font-size="22" font-weight="700">保留を認め、確定と分けるほど変更を早く伝えやすい</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">収益化を始める前のチェックリスト</title>
  <desc id="desc">価値検証、単発課金、ポリシー整備、法務税務確認、同期設計、月額開始の順序を示すロードマップ。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101530"/><stop offset="1" stop-color="#23173d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#8c7af0"/></marker></defs>
  <rect width="1200" height="590" rx="36" fill="url(#bg)"/>
  <text x="65" y="72" fill="#f7f5ff" font-family="sans-serif" font-size="34" font-weight="700">いきなり月額にしない。順番が重要</text>
  <g font-family="sans-serif">
    <path d="M125 300H1070" stroke="#7266cf" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g text-anchor="middle"><circle cx="145" cy="300" r="48" fill="#3b3472" stroke="#9a88ff" stroke-width="3"/><text x="145" y="309" fill="white" font-size="28" font-weight="700">1</text><text x="145" y="390" fill="white" font-size="21" font-weight="700">価値を検証</text><text x="145" y="421" fill="#bdb7de" font-size="17">会話が自走する</text>
    <circle cx="330" cy="300" r="48" fill="#244d63" stroke="#55d2e6" stroke-width="3"/><text x="330" y="309" fill="white" font-size="28" font-weight="700">2</text><text x="330" y="215" fill="white" font-size="21" font-weight="700">単発で試す</text><text x="330" y="246" fill="#b8dce2" font-size="17">参加費・イベント</text>
    <circle cx="515" cy="300" r="48" fill="#49365b" stroke="#d693e8" stroke-width="3"/><text x="515" y="309" fill="white" font-size="28" font-weight="700">3</text><text x="515" y="390" fill="white" font-size="21" font-weight="700">ルールを公開</text><text x="515" y="421" fill="#d6c2de" font-size="17">返金・解約条件</text>
    <circle cx="700" cy="300" r="48" fill="#5a422a" stroke="#efb05c" stroke-width="3"/><text x="700" y="309" fill="white" font-size="28" font-weight="700">4</text><text x="700" y="215" fill="white" font-size="21" font-weight="700">法務・税務</text><text x="700" y="246" fill="#e7d1b4" font-size="17">特商法・申告</text>
    <circle cx="885" cy="300" r="48" fill="#274d46" stroke="#61d4b8" stroke-width="3"/><text x="885" y="309" fill="white" font-size="28" font-weight="700">5</text><text x="885" y="390" fill="white" font-size="21" font-weight="700">同期を設計</text><text x="885" y="421" fill="#b8ddd4" font-size="17">突合・復旧導線</text>
    <circle cx="1070" cy="300" r="54" fill="#6d5ce7" stroke="#c4baff" stroke-width="4"/><text x="1070" y="309" fill="white" font-size="28" font-weight="700">6</text><text x="1070" y="215" fill="white" font-size="21" font-weight="700">月額を開始</text><text x="1070" y="246" fill="#d9d4f1" font-size="17">小さく運用開始</text></g>
    <rect x="270" y="485" width="660" height="58" rx="29" fill="#2d2858"/><text x="600" y="522" text-anchor="middle" fill="#dcd7ff" font-size="20" font-weight="700">各段階で問題があれば、次へ進まず直す</text>
  </g>
</svg>

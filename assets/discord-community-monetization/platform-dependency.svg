<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">プラットフォーム依存と会員名簿</title>
  <desc id="desc">Discord上のコミュニティと運営者が保有する決済データを分け、運営者がコミュニティの場を所有していないことを表す図。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f1430"/><stop offset="1" stop-color="#21173b"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#77729e" stroke-opacity=".1"/></pattern></defs>
  <rect width="1200" height="620" rx="36" fill="url(#bg)"/><rect width="1200" height="620" rx="36" fill="url(#grid)"/>
  <g font-family="sans-serif"><text x="65" y="72" fill="#f7f5ff" font-size="34" font-weight="700">会員との関係を、どこまで自分で持てているか</text>
    <rect x="65" y="135" width="460" height="385" rx="28" fill="#17203b" stroke="#5b91e0" stroke-width="2"/><text x="105" y="185" fill="#eaf2ff" font-size="25" font-weight="700">プラットフォーム上</text><text x="105" y="217" fill="#9eb2d1" font-size="18">運営者が所有していない領域</text><rect x="105" y="252" width="380" height="188" rx="20" fill="#222d4c"/><rect x="130" y="277" width="70" height="138" rx="14" fill="#2c385b"/><circle cx="165" cy="310" r="15" fill="#5f71d9"/><circle cx="165" cy="355" r="9" fill="#526080"/><circle cx="165" cy="388" r="9" fill="#526080"/><g fill="#334061"><rect x="225" y="279" width="230" height="36" rx="10"/><rect x="225" y="328" width="230" height="36" rx="10"/><rect x="225" y="377" width="230" height="36" rx="10"/></g><text x="105" y="482" fill="#ffb0bf" font-size="18" font-weight="700">BAN・規約変更・障害で場を失う可能性</text>
    <rect x="675" y="135" width="460" height="385" rx="28" fill="#25243f" stroke="#8c79ea" stroke-width="2"/><text x="715" y="185" fill="#f2efff" font-size="25" font-weight="700">運営者が持てるもの</text><text x="715" y="217" fill="#bab3db" font-size="18">決済・同意を得た連絡先・運用記録</text><rect x="715" y="252" width="380" height="188" rx="20" fill="#302c55"/><g fill="#7566dc"><circle cx="770" cy="300" r="15"/><circle cx="770" cy="346" r="15"/><circle cx="770" cy="392" r="15"/></g><g fill="#625b87"><rect x="805" y="291" width="236" height="12" rx="6"/><rect x="805" y="337" width="190" height="12" rx="6"/><rect x="805" y="383" width="218" height="12" rx="6"/></g><path d="M755 300l9 9 18-22M755 346l9 9 18-22M755 392l9 9 18-22" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="715" y="482" fill="#a7ead7" font-size="18" font-weight="700">移行できる連絡手段を、平時から整える</text>
    <path d="M525 330h150" stroke="#8a80c3" stroke-width="3" stroke-dasharray="8 8"/><rect x="548" y="300" width="104" height="60" rx="30" fill="#312b59"/><text x="600" y="338" text-anchor="middle" fill="#d9d4f1" font-size="18" font-weight="700">分離</text>
    <text x="600" y="577" text-anchor="middle" fill="#c9c4df" font-size="20">決済データが残っても、コミュニティの「場」まで自動で戻るわけではない。</text></g>
</svg>

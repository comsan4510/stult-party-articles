<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">決済状態とDiscordロールがズレる仕組み</title>
  <desc id="desc">決済システムとDiscordという2つの真実をWebhookとBotがつなぎ、通知欠落や順序逆転などでズレが起きることを示す図。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111630"/><stop offset="1" stop-color="#20173c"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#82d8eb"/></marker></defs>
  <rect width="1200" height="610" rx="36" fill="url(#bg)"/>
  <text x="65" y="72" fill="#f6f4ff" font-family="sans-serif" font-size="34" font-weight="700">「真実」が2つある</text>
  <g font-family="sans-serif">
    <rect x="65" y="150" width="360" height="230" rx="28" fill="#3b3021" stroke="#e4a749" stroke-width="3"/><circle cx="135" cy="220" r="38" fill="#d98e2d"/><path d="M113 220h44M122 205h26M122 235h26" stroke="white" stroke-width="6" stroke-linecap="round"/><text x="195" y="212" fill="white" font-size="28" font-weight="700">決済システム</text><text x="195" y="250" fill="#f1d6ad" font-size="20">課金状態が正しい</text><text x="245" y="330" text-anchor="middle" fill="#f5c16e" font-size="24" font-weight="700">真実 A</text>
    <rect x="775" y="150" width="360" height="230" rx="28" fill="#24314e" stroke="#5c8ff1" stroke-width="3"/><circle cx="845" cy="220" r="38" fill="#4d78dc"/><path d="M825 231c8-20 32-20 40 0M835 207a10 10 0 1 0 20 0" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/><text x="905" y="212" fill="white" font-size="28" font-weight="700">Discord</text><text x="905" y="250" fill="#c9d7f5" font-size="20">ロール状態が正しい</text><text x="955" y="330" text-anchor="middle" fill="#89b0ff" font-size="24" font-weight="700">真実 B</text>
    <path d="M425 245h120" stroke="#82d8eb" stroke-width="5" marker-end="url(#arrow)"/><path d="M655 245h120" stroke="#82d8eb" stroke-width="5" marker-end="url(#arrow)"/><rect x="545" y="185" width="110" height="120" rx="24" fill="#31305f" stroke="#8d7af0" stroke-width="2"/><text x="600" y="230" text-anchor="middle" fill="white" font-size="20" font-weight="700">Webhook</text><text x="600" y="263" text-anchor="middle" fill="white" font-size="20">+ Bot</text><text x="600" y="292" text-anchor="middle" fill="#b9b3dc" font-size="15">細い接続</text>
    <path d="M595 307v62" stroke="#f06d86" stroke-width="4" stroke-dasharray="8 8"/><path d="M580 350l35 35M615 350l-35 35" stroke="#f06d86" stroke-width="6" stroke-linecap="round"/>
    <rect x="100" y="445" width="1000" height="105" rx="22" fill="#2a2037" stroke="#c95f7d"/><text x="600" y="482" text-anchor="middle" fill="#ffb6c5" font-size="22" font-weight="700">ズレを生む代表例</text><text x="600" y="522" text-anchor="middle" fill="#dbc7d0" font-size="19">順序逆転　・　通知の欠落　・　APIレート制限　・　ID紐付けミス　・　BAN後も課金継続</text>
  </g>
</svg>

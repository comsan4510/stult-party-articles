<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">日本で使えるDiscord収益化の3構成</title>
  <desc id="desc">決済SaaS、Stripeなどと自前Bot、既存課金プラットフォームの責任範囲を比較した図。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10152f"/><stop offset="1" stop-color="#20173d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#8b83c7"/></marker></defs>
  <rect width="1200" height="650" rx="36" fill="url(#bg)"/>
  <text x="65" y="70" fill="#f7f5ff" font-family="sans-serif" font-size="34" font-weight="700">日本で取れる3つの構成</text>
  <g font-family="sans-serif">
    <g transform="translate(55 125)"><rect width="340" height="430" rx="26" fill="#272451" stroke="#7867e9" stroke-width="2"/><rect x="26" y="25" width="70" height="38" rx="19" fill="#6d5ce7"/><text x="48" y="51" fill="white" font-size="20" font-weight="700">A</text><text x="26" y="105" fill="white" font-size="26" font-weight="700">決済SaaS</text><text x="26" y="137" fill="#c8c3eb" font-size="20">+ Discord連携</text><rect x="45" y="178" width="250" height="58" rx="14" fill="#37316c"/><text x="96" y="214" fill="white" font-size="20">決済・同期サービス</text><path d="M170 244v42" stroke="#8b83c7" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="300" width="250" height="58" rx="14" fill="#293c63"/><text x="101" y="336" fill="white" font-size="20">Discordロール</text><text x="26" y="395" fill="#9de7d0" font-size="18">導入: 速い</text><text x="178" y="395" fill="#f2bf7a" font-size="18">手数料: 中〜高</text></g>
    <g transform="translate(430 125)"><rect width="340" height="430" rx="26" fill="#1e334e" stroke="#34bed8" stroke-width="2"/><rect x="26" y="25" width="70" height="38" rx="19" fill="#179cb9"/><text x="48" y="51" fill="white" font-size="20" font-weight="700">B</text><text x="26" y="105" fill="white" font-size="26" font-weight="700">Stripe等</text><text x="26" y="137" fill="#c1e6eb" font-size="20">+ 自前Bot</text><rect x="45" y="178" width="105" height="58" rx="14" fill="#2c526b"/><text x="72" y="214" fill="white" font-size="20">決済</text><path d="M156 207h45" stroke="#8b83c7" stroke-width="3" marker-end="url(#arrow)"/><rect x="207" y="178" width="88" height="58" rx="14" fill="#2c526b"/><text x="231" y="214" fill="white" font-size="20">Bot</text><path d="M251 244v42" stroke="#8b83c7" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="300" width="250" height="58" rx="14" fill="#293c63"/><text x="101" y="336" fill="white" font-size="20">Discordロール</text><text x="26" y="395" fill="#f2bf7a" font-size="18">導入: 長い</text><text x="178" y="395" fill="#9de7d0" font-size="18">手数料: 低い</text></g>
    <g transform="translate(805 125)"><rect width="340" height="430" rx="26" fill="#3a2c31" stroke="#e38c9f" stroke-width="2"/><rect x="26" y="25" width="70" height="38" rx="19" fill="#ce637e"/><text x="48" y="51" fill="white" font-size="20" font-weight="700">C</text><text x="26" y="105" fill="white" font-size="26" font-weight="700">課金プラットフォーム</text><text x="26" y="137" fill="#efd0d8" font-size="20">Discordは特典</text><rect x="45" y="178" width="250" height="58" rx="14" fill="#573c4a"/><text x="76" y="214" fill="white" font-size="20">集客・決済・会員管理</text><path d="M170 244v42" stroke="#8b83c7" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="300" width="250" height="58" rx="14" fill="#293c63"/><text x="91" y="336" fill="white" font-size="20">Discordは会員特典</text><text x="26" y="395" fill="#9de7d0" font-size="18">導入: 速い</text><text x="178" y="395" fill="#f2bf7a" font-size="18">手数料: 高い</text></g>
  </g>
  <text x="600" y="606" text-anchor="middle" fill="#c8c3e5" font-family="sans-serif" font-size="20">共通点: 決済とDiscordは別システム。同期の責任がどこにあるかが違う。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">ゲームコミュニティの問い合わせ4分類</title><desc id="d">使い方、活動相談、改善要望、個別相談を分類する図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">FOUR INQUIRY TYPES</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">最初は4分類だけで、次の行動を決める</text><text x="72" y="174" fill="#9db0c3" font-size="22">分類を増やすより、各種類の扱いを明確にする</text><g transform="translate(80 255)"><rect width="290" height="350" rx="25" fill="#10253a" stroke="#8fa8c0" stroke-width="3"/><text x="34" y="58" fill="#9db0c3" font-size="18" font-weight="700">01 QUESTION</text><text x="34" y="112" fill="#f4f7fb" font-size="29" font-weight="700">使い方</text><text x="34" y="176" fill="#c4d0dc" font-size="20">既存案内で回答</text><text x="34" y="218" fill="#c4d0dc" font-size="20">繰り返せばFAQへ</text><rect x="34" y="282" width="222" height="44" rx="12" fill="#223448"/><text x="145" y="312" text-anchor="middle" fill="#9db0c3" font-size="19" font-weight="700">ANSWER</text></g><g transform="translate(410 255)"><rect width="290" height="350" rx="25" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="34" y="58" fill="#61dbc5" font-size="18" font-weight="700">02 ACTIVITY</text><text x="34" y="112" fill="#f4f7fb" font-size="29" font-weight="700">活動相談</text><text x="34" y="176" fill="#c4d0dc" font-size="20">募集主へ確認</text><text x="34" y="218" fill="#c4d0dc" font-size="20">次回連絡を示す</text><rect x="34" y="282" width="222" height="44" rx="12" fill="#143b41"/><text x="145" y="312" text-anchor="middle" fill="#61dbc5" font-size="19" font-weight="700">CHECK</text></g><g transform="translate(740 255)"><rect width="290" height="350" rx="25" fill="#10253a" stroke="#f0b566" stroke-width="3"/><text x="34" y="58" fill="#f0b566" font-size="18" font-weight="700">03 REQUEST</text><text x="34" y="112" fill="#f4f7fb" font-size="29" font-weight="700">改善要望</text><text x="34" y="176" fill="#c4d0dc" font-size="20">受領を通知</text><text x="34" y="218" fill="#c4d0dc" font-size="20">見直し日を示す</text><rect x="34" y="282" width="222" height="44" rx="12" fill="#3d3023"/><text x="145" y="312" text-anchor="middle" fill="#f0b566" font-size="19" font-weight="700">REVIEW</text></g><g transform="translate(1070 255)"><rect width="290" height="350" rx="25" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="34" y="58" fill="#c991db" font-size="18" font-weight="700">04 PRIVATE</text><text x="34" y="112" fill="#f4f7fb" font-size="29" font-weight="700">個別相談</text><text x="34" y="176" fill="#c4d0dc" font-size="20">公開を避ける</text><text x="34" y="218" fill="#c4d0dc" font-size="20">指定担当へ引継ぎ</text><rect x="34" y="282" width="222" height="44" rx="12" fill="#35273c"/><text x="145" y="312" text-anchor="middle" fill="#c991db" font-size="19" font-weight="700">ESCALATE</text></g><text x="720" y="700" text-anchor="middle" fill="#f4f7fb" font-size="22" font-weight="700">種類が決まれば、窓口・担当・返信の基準が決まる</text></g></svg>

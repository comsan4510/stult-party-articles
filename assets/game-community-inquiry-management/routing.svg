<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">問い合わせ内容に応じた窓口ルーティング</title><desc id="d">一回で回答できるか、複数項目が必要か、個別情報を含むかで窓口を選ぶ図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">INQUIRY ROUTING</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">内容に合わせて、最短で安全な窓口へ</text><text x="72" y="174" fill="#9db0c3" font-size="22">すべてをフォームへ送らず、必要な案件だけ構造化する</text><rect x="95" y="280" width="310" height="120" rx="22" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="250" y="330" text-anchor="middle" fill="#f4f7fb" font-size="24" font-weight="700">一回で回答できる？</text><text x="250" y="368" text-anchor="middle" fill="#9db0c3" font-size="19">既存案内で解決</text><path d="M405 340h170" stroke="#7890a8" stroke-width="5"/><text x="490" y="322" text-anchor="middle" fill="#61dbc5" font-size="18">YES</text><rect x="575" y="280" width="300" height="120" rx="22" fill="#143b41" stroke="#61dbc5" stroke-width="3"/><text x="725" y="330" text-anchor="middle" fill="#61dbc5" font-size="27" font-weight="700">チャット</text><text x="725" y="368" text-anchor="middle" fill="#f4f7fb" font-size="19">その場で回答</text><path d="M250 400v145" stroke="#7890a8" stroke-width="5"/><text x="272" y="478" fill="#f0b566" font-size="18">NO</text><rect x="95" y="545" width="310" height="130" rx="22" fill="#10253a" stroke="#f0b566" stroke-width="3"/><text x="250" y="598" text-anchor="middle" fill="#f4f7fb" font-size="24" font-weight="700">個別情報を含む？</text><text x="250" y="638" text-anchor="middle" fill="#9db0c3" font-size="19">名前・連絡先・事情</text><path d="M405 610h170" stroke="#7890a8" stroke-width="5"/><text x="490" y="592" text-anchor="middle" fill="#61dbc5" font-size="18">NO</text><rect x="575" y="545" width="300" height="130" rx="22" fill="#3d3023" stroke="#f0b566" stroke-width="3"/><text x="725" y="598" text-anchor="middle" fill="#f0b566" font-size="27" font-weight="700">フォーム</text><text x="725" y="638" text-anchor="middle" fill="#f4f7fb" font-size="19">項目を揃えて受付</text><path d="M250 675v40h815" fill="none" stroke="#7890a8" stroke-width="5"/><text x="410" y="704" fill="#c991db" font-size="18">YES</text><rect x="1065" y="545" width="300" height="130" rx="22" fill="#35273c" stroke="#c991db" stroke-width="3"/><text x="1215" y="598" text-anchor="middle" fill="#c991db" font-size="27" font-weight="700">個別経路</text><text x="1215" y="638" text-anchor="middle" fill="#f4f7fb" font-size="19">指定担当へ引継ぎ</text><path d="M875 340h190" stroke="#29465f" stroke-width="4" stroke-dasharray="10 10"/><rect x="1065" y="280" width="300" height="120" rx="22" fill="#10253a" stroke="#29465f" stroke-width="3"/><text x="1215" y="330" text-anchor="middle" fill="#f4f7fb" font-size="24" font-weight="700">繰り返した？</text><text x="1215" y="368" text-anchor="middle" fill="#9db0c3" font-size="19">2回ならFAQ候補</text></g></svg>

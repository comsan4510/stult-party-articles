<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">参加者向け入口と運営者向け台帳の二層構造</title><desc id="d">質問しやすいチャットと状態を追う運営台帳を分ける図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">TWO-LAYER SUPPORT</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">質問する場所と、対応を追う場所を分ける</text><text x="72" y="174" fill="#9db0c3" font-size="22">参加者の使いやすさと、運営者の見落とし防止を両立する</text><rect x="120" y="255" width="1200" height="190" rx="30" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="175" y="315" fill="#61dbc5" font-size="19" font-weight="700">FRONT — PARTICIPANTS</text><text x="175" y="372" fill="#f4f7fb" font-size="32" font-weight="700">分かりやすい質問入口</text><text x="650" y="372" fill="#c4d0dc" font-size="23">Stult Partyの案内用チャット</text><rect x="1025" y="322" width="230" height="60" rx="16" fill="#143b41"/><text x="1140" y="360" text-anchor="middle" fill="#61dbc5" font-size="21" font-weight="700">気軽に聞く</text><path d="M720 445v90" stroke="#f0b566" stroke-width="6"/><path d="m720 535-14-24h28z" fill="#f0b566"/><text x="742" y="500" fill="#f0b566" font-size="18" font-weight="700">複数回の対応だけ</text><rect x="120" y="535" width="1200" height="190" rx="30" fill="#10253a" stroke="#f0b566" stroke-width="3"/><text x="175" y="595" fill="#f0b566" font-size="19" font-weight="700">BACK — OPERATORS</text><text x="175" y="652" fill="#f4f7fb" font-size="32" font-weight="700">一行一案件の受付台帳</text><text x="650" y="652" fill="#c4d0dc" font-size="23">担当・状態・次回連絡を管理</text><rect x="1025" y="602" width="230" height="60" rx="16" fill="#3d3023"/><text x="1140" y="640" text-anchor="middle" fill="#f0b566" font-size="21" font-weight="700">見落とさない</text></g></svg>

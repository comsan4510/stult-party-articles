<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">問い合わせ台帳の項目と状態遷移</title><desc id="d">受付、分類、担当、待機、解決、完了の状態と台帳項目を示す図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">CASE STATE MODEL</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">「対応中」を6つの状態に分ける</text><text x="72" y="174" fill="#9db0c3" font-size="22">担当と次回連絡が見えれば、解決前でも放置を防げる</text><g text-anchor="middle"><g transform="translate(55 250)"><rect width="190" height="105" rx="20" fill="#223448" stroke="#8fa8c0" stroke-width="3"/><text x="95" y="46" fill="#9db0c3" font-size="16" font-weight="700">RECEIVED</text><text x="95" y="78" fill="#f4f7fb" font-size="22">受付</text></g><g transform="translate(275 250)"><rect width="190" height="105" rx="20" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="95" y="46" fill="#61dbc5" font-size="16" font-weight="700">TRIAGED</text><text x="95" y="78" fill="#f4f7fb" font-size="22">分類</text></g><g transform="translate(495 250)"><rect width="190" height="105" rx="20" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="95" y="46" fill="#61dbc5" font-size="16" font-weight="700">ASSIGNED</text><text x="95" y="78" fill="#f4f7fb" font-size="22">担当決定</text></g><g transform="translate(715 250)"><rect width="190" height="105" rx="20" fill="#3d3023" stroke="#f0b566" stroke-width="3"/><text x="95" y="46" fill="#f0b566" font-size="16" font-weight="700">WAITING</text><text x="95" y="78" fill="#f4f7fb" font-size="22">情報待ち</text></g><g transform="translate(935 250)"><rect width="190" height="105" rx="20" fill="#143b41" stroke="#61dbc5" stroke-width="3"/><text x="95" y="46" fill="#61dbc5" font-size="16" font-weight="700">RESOLVED</text><text x="95" y="78" fill="#f4f7fb" font-size="22">回答済み</text></g><g transform="translate(1155 250)"><rect width="190" height="105" rx="20" fill="#35273c" stroke="#c991db" stroke-width="3"/><text x="95" y="46" fill="#c991db" font-size="16" font-weight="700">CLOSED</text><text x="95" y="78" fill="#f4f7fb" font-size="22">完了</text></g></g><g stroke="#7890a8" stroke-width="4"><path d="M245 302h30"/><path d="M465 302h30"/><path d="M685 302h30"/><path d="M905 302h30"/><path d="M1125 302h30"/></g><rect x="105" y="455" width="1230" height="230" rx="28" fill="#10253a" stroke="#29465f" stroke-width="3"/><text x="155" y="510" fill="#61dbc5" font-size="20" font-weight="700">ONE ROW, ONE CASE</text><g fill="#f4f7fb" font-size="22"><text x="155" y="565">案件ID・種類・受付日時</text><text x="155" y="612">要約・関連URL・公開範囲</text><text x="785" y="565">担当者・次回連絡予定</text><text x="785" y="612">最終回答・完了日時</text></g><text x="720" y="750" text-anchor="middle" fill="#9db0c3" font-size="20">回答を送っただけでは完了にせず、質問者へ届いたことを確認する</text></g></svg>

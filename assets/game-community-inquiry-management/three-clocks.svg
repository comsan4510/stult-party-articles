<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">問い合わせ対応を3つの時間で管理する図</title><desc id="d">受付確認、次回連絡、解決の三つの時計を分ける図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">THREE RESPONSE CLOCKS</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">解決できなくても、次の見通しは伝えられる</text><text x="72" y="174" fill="#9db0c3" font-size="22">一つの期限ではなく、受付・連絡・解決を分けて管理する</text><g text-anchor="middle"><g transform="translate(130 270)"><circle cx="180" cy="180" r="165" fill="#10253a" stroke="#8fa8c0" stroke-width="4"/><circle cx="180" cy="180" r="102" fill="none" stroke="#29465f" stroke-width="3"/><path d="M180 180v-68M180 180l52 28" stroke="#8fa8c0" stroke-width="6" stroke-linecap="round"/><text x="180" y="385" fill="#9db0c3" font-size="18" font-weight="700">CLOCK 01</text><text x="180" y="430" fill="#f4f7fb" font-size="30" font-weight="700">受付確認</text><text x="180" y="468" fill="#c4d0dc" font-size="19">届いたことを伝える</text></g><g transform="translate(540 270)"><circle cx="180" cy="180" r="165" fill="#10253a" stroke="#f0b566" stroke-width="4"/><circle cx="180" cy="180" r="102" fill="none" stroke="#29465f" stroke-width="3"/><path d="M180 180v-68M180 180l52 28" stroke="#f0b566" stroke-width="6" stroke-linecap="round"/><text x="180" y="385" fill="#f0b566" font-size="18" font-weight="700">CLOCK 02</text><text x="180" y="430" fill="#f4f7fb" font-size="30" font-weight="700">次回連絡</text><text x="180" y="468" fill="#c4d0dc" font-size="19">進捗を知らせる時刻</text></g><g transform="translate(950 270)"><circle cx="180" cy="180" r="165" fill="#10253a" stroke="#61dbc5" stroke-width="4"/><circle cx="180" cy="180" r="102" fill="none" stroke="#29465f" stroke-width="3"/><path d="M180 180v-68M180 180l52 28" stroke="#61dbc5" stroke-width="6" stroke-linecap="round"/><text x="180" y="385" fill="#61dbc5" font-size="18" font-weight="700">CLOCK 03</text><text x="180" y="430" fill="#f4f7fb" font-size="30" font-weight="700">解決</text><text x="180" y="468" fill="#c4d0dc" font-size="19">回答・変更を確認</text></g></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">問い合わせ対応を改善する5つの指標</title><desc id="d">初回応答、未完了日数、再割り当て、再開、繰り返し質問を測る図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">SUPPORT METRICS</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">返信件数より、放置と再発を見つける</text><text x="72" y="174" fill="#9db0c3" font-size="22">週1回、運営の詰まりを示す5つの数字を確認する</text><g transform="translate(80 260)"><rect width="240" height="330" rx="24" fill="#10253a" stroke="#8fa8c0" stroke-width="3"/><text x="32" y="54" fill="#9db0c3" font-size="17" font-weight="700">01 FIRST REPLY</text><text x="32" y="108" fill="#f4f7fb" font-size="27" font-weight="700">初回応答</text><text x="32" y="170" fill="#c4d0dc" font-size="19">受付を伝える</text><text x="32" y="208" fill="#c4d0dc" font-size="19">までの時間</text><text x="32" y="284" fill="#61dbc5" font-size="42" font-weight="700">↓</text></g><g transform="translate(340 260)"><rect width="240" height="330" rx="24" fill="#10253a" stroke="#f0b566" stroke-width="3"/><text x="32" y="54" fill="#f0b566" font-size="17" font-weight="700">02 AGING</text><text x="32" y="108" fill="#f4f7fb" font-size="27" font-weight="700">未完了日数</text><text x="32" y="170" fill="#c4d0dc" font-size="19">最も古い案件の</text><text x="32" y="208" fill="#c4d0dc" font-size="19">経過日数</text><text x="32" y="284" fill="#61dbc5" font-size="42" font-weight="700">↓</text></g><g transform="translate(600 260)"><rect width="240" height="330" rx="24" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="32" y="54" fill="#c991db" font-size="17" font-weight="700">03 REASSIGN</text><text x="32" y="108" fill="#f4f7fb" font-size="27" font-weight="700">再割り当て</text><text x="32" y="170" fill="#c4d0dc" font-size="19">担当変更の</text><text x="32" y="208" fill="#c4d0dc" font-size="19">回数</text><text x="32" y="284" fill="#61dbc5" font-size="42" font-weight="700">↓</text></g><g transform="translate(860 260)"><rect width="240" height="330" rx="24" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="32" y="54" fill="#61dbc5" font-size="17" font-weight="700">04 REOPEN</text><text x="32" y="108" fill="#f4f7fb" font-size="27" font-weight="700">再開率</text><text x="32" y="170" fill="#c4d0dc" font-size="19">完了後に再び</text><text x="32" y="208" fill="#c4d0dc" font-size="19">開いた割合</text><text x="32" y="284" fill="#61dbc5" font-size="42" font-weight="700">↓</text></g><g transform="translate(1120 260)"><rect width="240" height="330" rx="24" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="32" y="54" fill="#61dbc5" font-size="17" font-weight="700">05 REPEAT</text><text x="32" y="108" fill="#f4f7fb" font-size="27" font-weight="700">繰り返し質問</text><text x="32" y="170" fill="#c4d0dc" font-size="19">同じ意図の</text><text x="32" y="208" fill="#c4d0dc" font-size="19">質問割合</text><text x="32" y="284" fill="#61dbc5" font-size="42" font-weight="700">↓</text></g><rect x="285" y="670" width="870" height="64" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="712" text-anchor="middle" fill="#f4f7fb" font-size="22" font-weight="700">数字が高い場所に、分類・担当・案内の改善余地がある</text></g></svg>

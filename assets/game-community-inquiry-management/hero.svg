<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">問い合わせを受付から回答、FAQ改善へつなぐ全体像</title><desc id="d">質問、受付、担当、回答、案内改善が循環する図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">FROM QUESTION TO IMPROVEMENT</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">質問を回答して終わらせず、案内改善へつなぐ</text><text x="72" y="174" fill="#9db0c3" font-size="22">受付・担当・回答・FAQを一つの循環として設計する</text><g text-anchor="middle"><circle cx="220" cy="420" r="105" fill="#10253a" stroke="#8fa8c0" stroke-width="4"/><text x="220" y="410" fill="#9db0c3" font-size="19" font-weight="700">QUESTION</text><text x="220" y="452" fill="#f4f7fb" font-size="30" font-weight="700">質問</text><circle cx="555" cy="420" r="105" fill="#10253a" stroke="#f0b566" stroke-width="4"/><text x="555" y="410" fill="#f0b566" font-size="19" font-weight="700">TRIAGE</text><text x="555" y="452" fill="#f4f7fb" font-size="30" font-weight="700">受付・分類</text><circle cx="890" cy="420" r="105" fill="#10253a" stroke="#61dbc5" stroke-width="4"/><text x="890" y="410" fill="#61dbc5" font-size="19" font-weight="700">RESPONSE</text><text x="890" y="452" fill="#f4f7fb" font-size="30" font-weight="700">回答</text><circle cx="1225" cy="420" r="105" fill="#10253a" stroke="#c991db" stroke-width="4"/><text x="1225" y="410" fill="#c991db" font-size="19" font-weight="700">IMPROVE</text><text x="1225" y="452" fill="#f4f7fb" font-size="30" font-weight="700">案内改善</text></g><g stroke="#7890a8" stroke-width="6"><path d="M325 420h125"/><path d="M660 420h125"/><path d="M995 420h125"/></g><g fill="#7890a8"><path d="m450 420-22-13v26z"/><path d="m785 420-22-13v26z"/><path d="m1120 420-22-13v26z"/></g><path d="M1225 560c0 120-1005 120-1005 0" fill="none" stroke="#61dbc5" stroke-width="5" stroke-dasharray="12 12"/><path d="m220 560 15 23-30 0z" fill="#61dbc5"/><rect x="310" y="690" width="820" height="64" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="732" text-anchor="middle" fill="#f4f7fb" font-size="22" font-weight="700">Stult Partyのチャットを、迷わない質問入口にする</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">コミュニティプラットフォーム6サービス比較</title><desc id="d">会話、知識、収益、所有の4軸で6サービスを比較する図。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#091222"/><stop offset="1" stop-color="#1d263f"/></linearGradient><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#7784b4" stroke-opacity=".09"/></pattern></defs><rect width="1440" height="810" fill="url(#b)"/><rect width="1440" height="810" fill="url(#g)"/><g font-family="sans-serif"><text x="85" y="95" fill="#78a8ff" font-size="20" font-weight="700" letter-spacing="4">COMMUNITY PLATFORM GUIDE 2026</text><text x="85" y="165" fill="#f6f8ff" font-size="51" font-weight="800">コミュニティの中心行動から、</text><text x="85" y="228" fill="#f6f8ff" font-size="51" font-weight="800">使う場所を選ぶ。</text><text x="88" y="276" fill="#aeb9d4" font-size="22">Discord・Slack・Discourse・Circle・Mighty Networks・Stult Party</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">流れる会話と残る知識</title><desc id="d">リアルタイム会話から検索可能な知識までの違い。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0b1528"/><stop offset="1" stop-color="#1b2740"/></linearGradient><linearGradient id="l"><stop stop-color="#668cff"/><stop offset="1" stop-color="#65d0bf"/></linearGradient></defs><rect width="1200" height="600" rx="36" fill="url(#b)"/><g font-family="sans-serif"><text x="65" y="72" fill="#f5f7ff" font-size="34" font-weight="700">会話は流れ、知識は積み上がる</text><rect x="80" y="155" width="1040" height="14" rx="7" fill="url(#l)"/><text x="80" y="205" fill="#9fafe0" font-size="19">いま反応する</text><text x="995" y="205" fill="#a7d8d1" font-size="19">あとで探す</text>
<g text-anchor="middle"><g transform="translate(155 320)"><circle r="55" fill="#405795" stroke="#829dff" stroke-width="3"/><text y="7" fill="white" font-size="18" font-weight="700">Discord</text><text y="98" fill="#b8c3e0" font-size="17">雑談・ボイス</text></g><g transform="translate(340 320)"><circle r="55" fill="#3f546b" stroke="#77a2cb" stroke-width="3"/><text y="7" fill="white" font-size="18" font-weight="700">Slack</text><text y="98" fill="#b8c3e0" font-size="17">業務会話</text></g><g transform="translate(550 320)"><circle r="55" fill="#2e716d" stroke="#81ded6" stroke-width="3"/><text y="-3" fill="white" font-size="15" font-weight="700">Stult</text><text y="17" fill="white" font-size="15" font-weight="700">Party</text><text y="98" fill="#b8dcd7" font-size="17">交流・募集</text></g><g transform="translate(750 320)"><circle r="55" fill="#58466b" stroke="#b98bd3" stroke-width="3"/><text y="7" fill="white" font-size="18" font-weight="700">Circle</text><text y="98" fill="#d1c0dc" font-size="17">投稿・講座</text></g><g transform="translate(1025 320)"><circle r="61" fill="#356363" stroke="#66ccc3" stroke-width="3"/><text y="7" fill="white" font-size="17" font-weight="700">Discourse</text><text y="104" fill="#b9d9d6" font-size="17">Q&amp;A・検索</text></g></g><rect x="225" y="495" width="750" height="58" rx="29" fill="#202d45"/><text x="600" y="532" text-anchor="middle" fill="#f0c377" font-size="19" font-weight="700">関係を作る会話と、資産になる会話は設計が違う</text></g></svg>

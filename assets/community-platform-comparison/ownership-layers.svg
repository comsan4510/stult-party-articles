<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">移行できるデータと移せない関係性</title><desc id="d">ファイル、投稿、会員ID、通知設定、関係性、習慣の移行難易度を層で示す。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0b1528"/><stop offset="1" stop-color="#1b2740"/></linearGradient></defs><rect width="1200" height="620" rx="36" fill="url(#b)"/><g font-family="sans-serif"><text x="65" y="72" fill="#f5f7ff" font-size="34" font-weight="700">内側にあるものほど、移行しにくい</text><text x="65" y="108" fill="#aeb8d1" font-size="19">エクスポート機能があっても、コミュニティ全体を持ち出せるわけではない。</text><g text-anchor="middle"><circle cx="600" cy="355" r="210" fill="#26334e" stroke="#51678f" stroke-width="2"/><circle cx="600" cy="355" r="170" fill="#2d3b55" stroke="#60749a" stroke-width="2"/><circle cx="600" cy="355" r="130" fill="#35445d" stroke="#7182a5" stroke-width="2"/><circle cx="600" cy="355" r="90" fill="#405168" stroke="#8291b0" stroke-width="2"/><circle cx="600" cy="355" r="50" fill="#5b4967" stroke="#ba8ecd" stroke-width="3"/><text x="600" y="181" fill="#d5dcf0" font-size="18">ファイル・投稿</text><text x="600" y="231" fill="#d5dcf0" font-size="18">会員ID・料金プラン</text><text x="600" y="281" fill="#d5dcf0" font-size="18">権限・通知設定</text><text x="600" y="333" fill="#f0e9f4" font-size="18">人間関係</text><text x="600" y="362" fill="white" font-size="18" font-weight="700">習慣</text></g><g><rect x="70" y="210" width="250" height="80" rx="20" fill="#24334b"/><text x="195" y="245" text-anchor="middle" fill="#9fd7ce" font-size="18" font-weight="700">比較的持ち出せる</text><text x="195" y="271" text-anchor="middle" fill="#bbc5dc" font-size="16">CSV・バックアップ</text><rect x="880" y="420" width="250" height="80" rx="20" fill="#3e3044"/><text x="1005" y="455" text-anchor="middle" fill="#f0b8c6" font-size="18" font-weight="700">ほとんど移せない</text><text x="1005" y="481" text-anchor="middle" fill="#d2c0d7" font-size="16">関係性・日常行動</text></g><text x="600" y="595" text-anchor="middle" fill="#f0c477" font-size="19" font-weight="700">移行計画はデータではなく、習慣の再形成から考える</text></g></svg>

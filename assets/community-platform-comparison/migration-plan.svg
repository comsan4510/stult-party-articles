<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">安全なコミュニティ移行の4段階</title><desc id="d">準備、試行、併用、切り替えの順で移行する図。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0b1528"/><stop offset="1" stop-color="#1b2740"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#69c9bf"/></marker></defs><rect width="1200" height="600" rx="36" fill="url(#b)"/><g font-family="sans-serif"><text x="65" y="72" fill="#f5f7ff" font-size="34" font-weight="700">一斉移行しない。段階で進める</text><path d="M140 305H1060" stroke="#4c777c" stroke-width="5" marker-end="url(#a)"/><g text-anchor="middle"><g transform="translate(165 305)"><circle r="65" fill="#2f405e" stroke="#6e89bb" stroke-width="3"/><text y="-5" fill="white" font-size="25" font-weight="700">1</text><text y="25" fill="white" font-size="20" font-weight="700">準備</text><text y="115" fill="#bec8df" font-size="17">目的・データ</text><text y="140" fill="#bec8df" font-size="17">戻す条件</text></g><g transform="translate(455 305)"><circle r="65" fill="#34515f" stroke="#6aa8b7" stroke-width="3"/><text y="-5" fill="white" font-size="25" font-weight="700">2</text><text y="25" fill="white" font-size="20" font-weight="700">試行</text><text y="115" fill="#bed2da" font-size="17">運営と少人数</text><text y="140" fill="#bed2da" font-size="17">中心行動を確認</text></g><g transform="translate(745 305)"><circle r="65" fill="#35615f" stroke="#67ccc3" stroke-width="3"/><text y="-5" fill="white" font-size="25" font-weight="700">3</text><text y="25" fill="white" font-size="20" font-weight="700">併用</text><text y="115" fill="#bfdad7" font-size="17">2〜4週間</text><text y="140" fill="#bfdad7" font-size="17">導線を一本化</text></g><g transform="translate(1035 305)"><circle r="72" fill="#2b8d82" stroke="#a8f6ed" stroke-width="4"/><text y="-7" fill="white" font-size="26" font-weight="700">4</text><text y="26" fill="white" font-size="20" font-weight="700">切替</text><text y="123" fill="#c8e8e4" font-size="17">旧サービスを</text><text y="148" fill="#c8e8e4" font-size="17">読み取り専用へ</text></g></g><rect x="260" y="510" width="680" height="55" rx="28" fill="#243148"/><text x="600" y="545" text-anchor="middle" fill="#f0c477" font-size="19" font-weight="700">移行率ではなく、移行後も活動が続くかを測る</text></g></svg>

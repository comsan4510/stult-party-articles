<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">コミュニティ運営の総コスト</title><desc id="d">月額固定費、人数課金、決済手数料、外部ツール、運営工数、障害対応の合計。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0b1528"/><stop offset="1" stop-color="#1b2740"/></linearGradient></defs><rect width="1200" height="620" rx="36" fill="url(#b)"/><g font-family="sans-serif"><text x="65" y="72" fill="#f5f7ff" font-size="34" font-weight="700">「無料」でも総コストはゼロではない</text><text x="65" y="108" fill="#aeb8d1" font-size="19">契約画面に出ない費用まで含めて比較する。</text><g transform="translate(70 170)"><rect width="1060" height="270" rx="28" fill="#152238" stroke="#334c72" stroke-width="2"/><g text-anchor="middle"><g transform="translate(100 55)"><rect width="145" height="150" rx="20" fill="#2e4163"/><text x="72" y="50" fill="white" font-size="20" font-weight="700">固定費</text><text x="72" y="85" fill="#c3cde3" font-size="16">月額プラン</text><text x="72" y="112" fill="#c3cde3" font-size="16">ホスティング</text></g><text x="270" y="138" fill="#7992bd" font-size="32">+</text><g transform="translate(300 55)"><rect width="145" height="150" rx="20" fill="#354863"/><text x="72" y="50" fill="white" font-size="20" font-weight="700">変動費</text><text x="72" y="85" fill="#c3cde3" font-size="16">人数課金</text><text x="72" y="112" fill="#c3cde3" font-size="16">決済手数料</text></g><text x="470" y="138" fill="#7992bd" font-size="32">+</text><g transform="translate(500 55)"><rect width="145" height="150" rx="20" fill="#3f445e"/><text x="72" y="50" fill="white" font-size="20" font-weight="700">連携費</text><text x="72" y="85" fill="#c3cde3" font-size="16">Bot</text><text x="72" y="112" fill="#c3cde3" font-size="16">外部ツール</text></g><text x="670" y="138" fill="#7992bd" font-size="32">+</text><g transform="translate(700 55)"><rect width="145" height="150" rx="20" fill="#4d3f4b"/><text x="72" y="50" fill="white" font-size="20" font-weight="700">人件費</text><text x="72" y="85" fill="#d8c5d3" font-size="16">運営工数</text><text x="72" y="112" fill="#d8c5d3" font-size="16">問い合わせ</text></g><text x="870" y="138" fill="#7992bd" font-size="32">+</text><g transform="translate(900 55)"><rect width="145" height="150" rx="20" fill="#5c412e"/><text x="72" y="50" fill="white" font-size="20" font-weight="700">リスク</text><text x="72" y="85" fill="#dec9b6" font-size="16">障害対応</text><text x="72" y="112" fill="#dec9b6" font-size="16">移行</text></g></g></g><rect x="250" y="490" width="700" height="75" rx="24" fill="#233148"/><text x="600" y="522" text-anchor="middle" fill="#f3c679" font-size="20" font-weight="700">100人・500人・1,000人で試算する</text><text x="600" y="549" text-anchor="middle" fill="#c4cee2" font-size="17">何が人数とともに増えるかを確認</text></g></svg>

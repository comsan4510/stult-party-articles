<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">SIX DELIVERY GAPS</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">告知が届かない原因は、参加者の注意力だけではない</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">場所・件名・対象・版・行動・計測を点検する</text><g font-family="Arial,sans-serif" font-weight="700"><g fill="#102a3e"><rect x="72" y="245" width="390" height="150" rx="20" stroke="#7f9bb1" stroke-width="3"/><rect x="525" y="245" width="390" height="150" rx="20" stroke="#ffb84d" stroke-width="3"/><rect x="978" y="245" width="390" height="150" rx="20" stroke="#55e6cf" stroke-width="3"/><rect x="72" y="455" width="390" height="150" rx="20" stroke="#d998e8" stroke-width="3"/><rect x="525" y="455" width="390" height="150" rx="20" stroke="#ffb84d" stroke-width="3"/><rect x="978" y="455" width="390" height="150" rx="20" stroke="#ff7070" stroke-width="3"/></g><g fill="#fff" font-size="24" text-anchor="middle"><text x="267" y="335">会話に埋もれる</text><text x="720" y="335">重要度が同じ</text><text x="1173" y="335">全員へ一斉通知</text><text x="267" y="545">旧版が残る</text><text x="720" y="545">行動が不明</text><text x="1173" y="545">到達を測らない</text></g><g font-size="13" text-anchor="middle"><text x="267" y="292" fill="#7f9bb1">01 PLACE</text><text x="720" y="292" fill="#ffb84d">02 PRIORITY</text><text x="1173" y="292" fill="#55e6cf">03 SCOPE</text><text x="267" y="502" fill="#d998e8">04 VERSION</text><text x="720" y="502" fill="#ffb84d">05 ACTION</text><text x="1173" y="502" fill="#ff7070">06 MEASURE</text></g></g><rect x="340" y="680" width="760" height="58" rx="14" fill="#102a3e" stroke="#25455e"/><text x="720" y="717" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">投稿回数ではなく、情報の構造を直す</text></svg>

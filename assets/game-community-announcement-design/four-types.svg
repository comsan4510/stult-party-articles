<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">FOUR MESSAGE TYPES</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">すべてを「重要なお知らせ」にしない</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">種類ごとに対象・行動・再案内の強さを変える</text><g font-family="Arial,sans-serif"><g fill="#102a3e"><rect x="60" y="260" width="300" height="310" rx="22" stroke="#ff7070" stroke-width="3"/><rect x="400" y="260" width="300" height="310" rx="22" stroke="#ffb84d" stroke-width="3"/><rect x="740" y="260" width="300" height="310" rx="22" stroke="#55e6cf" stroke-width="3"/><rect x="1080" y="260" width="300" height="310" rx="22" stroke="#d998e8" stroke-width="3"/></g><g text-anchor="middle" font-weight="700"><text x="210" y="320" fill="#ff7070" font-size="14">ALERT</text><text x="210" y="375" fill="#fff" font-size="31">速報</text><text x="550" y="320" fill="#ffb84d" font-size="14">CHANGE</text><text x="550" y="375" fill="#fff" font-size="31">変更</text><text x="890" y="320" fill="#55e6cf" font-size="14">RECRUITMENT</text><text x="890" y="375" fill="#fff" font-size="31">募集</text><text x="1230" y="320" fill="#d998e8" font-size="14">DIGEST</text><text x="1230" y="375" fill="#fff" font-size="31">定期</text></g><g fill="#b8c7d4" font-size="18" text-anchor="middle"><text x="210" y="445">速さと代替手順</text><text x="210" y="488">状況変化時に更新</text><text x="550" y="445">新旧差分と期限</text><text x="550" y="488">未確認者へ再案内</text><text x="890" y="445">条件と回答方法</text><text x="890" y="488">締切前に一度</text><text x="1230" y="445">一覧性と記録</text><text x="1230" y="488">原則再案内なし</text></g></g><rect x="300" y="650" width="840" height="60" rx="14" fill="#102a3e" stroke="#25455e"/><text x="720" y="688" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">種類を先に決めると、通知の過不足を防げる</text></svg>

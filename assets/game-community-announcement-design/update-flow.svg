<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">SINGLE SOURCE UPDATE</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">訂正のたびに、全文コピーを増やさない</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">正本を更新し、差分だけを対象者へ再案内する</text><g font-family="Arial,sans-serif"><rect x="70" y="300" width="270" height="190" rx="22" fill="#102a3e" stroke="#7f9bb1" stroke-width="3"/><text x="205" y="350" fill="#7f9bb1" font-size="14" font-weight="700" text-anchor="middle">01 CHANGE</text><text x="205" y="410" fill="#fff" font-size="27" font-weight="700" text-anchor="middle">変更が発生</text><path d="M340 395H435" stroke="#7894aa" stroke-width="5"/><path d="M435 395l-18-12v24z" fill="#7894aa"/><rect x="435" y="270" width="330" height="250" rx="22" fill="#102a3e" stroke="#55e6cf" stroke-width="4"/><text x="600" y="325" fill="#55e6cf" font-size="14" font-weight="700" text-anchor="middle">02 SOURCE</text><text x="600" y="385" fill="#fff" font-size="27" font-weight="700" text-anchor="middle">正本を更新</text><text x="600" y="430" fill="#b8c7d4" font-size="18" text-anchor="middle">新旧差分・更新日時</text><text x="600" y="465" fill="#b8c7d4" font-size="18" text-anchor="middle">最新版を一か所に集約</text><path d="M765 395H860" stroke="#7894aa" stroke-width="5"/><path d="M860 395l-18-12v24z" fill="#7894aa"/><rect x="860" y="300" width="270" height="190" rx="22" fill="#102a3e" stroke="#ffb84d" stroke-width="3"/><text x="995" y="350" fill="#ffb84d" font-size="14" font-weight="700" text-anchor="middle">03 DIFFERENCE</text><text x="995" y="410" fill="#fff" font-size="27" font-weight="700" text-anchor="middle">差分を案内</text><path d="M1130 395H1200" stroke="#7894aa" stroke-width="5"/><path d="M1200 395l-18-12v24z" fill="#7894aa"/><rect x="1200" y="300" width="180" height="190" rx="22" fill="#102a3e" stroke="#d998e8" stroke-width="3"/><text x="1290" y="350" fill="#d998e8" font-size="14" font-weight="700" text-anchor="middle">04 CHECK</text><text x="1290" y="400" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">対象者</text><text x="1290" y="435" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">だけ確認</text></g><rect x="310" y="620" width="820" height="64" rx="15" fill="#102a3e" stroke="#25455e"/><text x="720" y="660" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">古い場所には最新版への導線だけを残す</text></svg>

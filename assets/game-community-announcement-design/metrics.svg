<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">DELIVERY METRICS</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">閲覧数より、対象者の期限内行動を測る</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">告知の量ではなく、到達・行動・更新の精度を改善する</text><g font-family="Arial,sans-serif"><g fill="#102a3e"><rect x="45" y="275" width="250" height="300" rx="22" stroke="#55e6cf" stroke-width="3"/><rect x="320" y="275" width="250" height="300" rx="22" stroke="#7f9bb1" stroke-width="3"/><rect x="595" y="275" width="250" height="300" rx="22" stroke="#ffb84d" stroke-width="3"/><rect x="870" y="275" width="250" height="300" rx="22" stroke="#d998e8" stroke-width="3"/><rect x="1145" y="275" width="250" height="300" rx="22" stroke="#ff7070" stroke-width="3"/></g><g text-anchor="middle" font-weight="700"><text x="170" y="330" fill="#55e6cf" font-size="13">01 REACH</text><text x="170" y="390" fill="#fff" font-size="24">対象者</text><text x="170" y="425" fill="#fff" font-size="24">到達率</text><text x="445" y="330" fill="#7f9bb1" font-size="13">02 ACTION</text><text x="445" y="390" fill="#fff" font-size="24">期限内</text><text x="445" y="425" fill="#fff" font-size="24">行動率</text><text x="720" y="330" fill="#ffb84d" font-size="13">03 FOLLOW-UP</text><text x="720" y="390" fill="#fff" font-size="24">再案内率</text><text x="995" y="330" fill="#d998e8" font-size="13">04 VERSION</text><text x="995" y="390" fill="#fff" font-size="24">旧版参照</text><text x="995" y="425" fill="#fff" font-size="24">件数</text><text x="1270" y="330" fill="#ff7070" font-size="13">05 QUESTION</text><text x="1270" y="390" fill="#fff" font-size="24">告知由来</text><text x="1270" y="425" fill="#fff" font-size="24">質問率</text></g><g fill="#b8c7d4" font-size="16" text-anchor="middle"><text x="170" y="500">対象者を分母にする</text><text x="445" y="500">閲覧と回答を分ける</text><text x="720" y="500">初回導線を点検</text><text x="995" y="500">コピー残存を発見</text><text x="1270" y="500">不明点を次へ反映</text></g></g><rect x="350" y="650" width="740" height="58" rx="14" fill="#102a3e" stroke="#25455e"/><text x="720" y="687" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">数字は個人評価ではなく、告知設計の改善に使う</text></svg>

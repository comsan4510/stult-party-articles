<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">VERSIONED DATA MODEL</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">告知本体と対象者の確認状態を分ける</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">すべての投稿に既読を求めず、必要な告知だけ関連付ける</text><g font-family="Arial,sans-serif"><rect x="90" y="235" width="500" height="400" rx="24" fill="#102a3e" stroke="#55e6cf" stroke-width="3"/><text x="140" y="290" fill="#55e6cf" font-size="15" font-weight="700">ANNOUNCEMENT</text><text x="140" y="340" fill="#fff" font-size="28" font-weight="700">版付きの告知本体</text><g fill="#b8c7d4" font-size="18"><text x="140" y="395">announcement_id</text><text x="140" y="435">type / audience_rule</text><text x="140" y="475">source_location / version</text><text x="140" y="515">published_at / updated_at</text><text x="140" y="555">action_type / action_due_at</text><text x="140" y="595">owner_ref / status</text></g><path d="M590 440H810" stroke="#7894aa" stroke-width="5"/><path d="M810 440l-20-13v26z" fill="#7894aa"/><text x="700" y="415" fill="#9db0c3" font-size="15" text-anchor="middle">必要な場合だけ</text><rect x="810" y="275" width="540" height="330" rx="24" fill="#102a3e" stroke="#ffb84d" stroke-width="3"/><text x="860" y="330" fill="#ffb84d" font-size="15" font-weight="700">AUDIENCE STATUS</text><text x="860" y="380" fill="#fff" font-size="28" font-weight="700">対象者ごとの確認状態</text><g fill="#b8c7d4" font-size="18"><text x="860" y="435">participant_ref</text><text x="860" y="475">delivery_scope_checked_at</text><text x="860" y="515">acknowledged_at / responded_at</text><text x="860" y="555">followed_up_at</text></g></g><rect x="350" y="690" width="740" height="55" rx="13" fill="#102a3e" stroke="#25455e"/><text x="720" y="725" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">対象者だけを分母にして、期限内の行動を測る</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">ANNOUNCEMENT ROUTE</text><text x="72" y="132" fill="#f4f7fb" font-family="Arial,sans-serif" font-size="38" font-weight="700">通知を増やさず、最新版へ戻れる導線を作る</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">対象・要点・行動・期限・正本を一本の流れにする</text><g font-family="Arial,sans-serif"><rect x="72" y="300" width="240" height="160" rx="22" fill="#102a3e" stroke="#55e6cf" stroke-width="3"/><text x="192" y="355" text-anchor="middle" fill="#55e6cf" font-size="14" font-weight="700">01 AUDIENCE</text><text x="192" y="405" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">対象を決める</text><path d="M312 380H385" stroke="#7894aa" stroke-width="5"/><path d="M385 380l-18-12v24z" fill="#7894aa"/><rect x="385" y="300" width="240" height="160" rx="22" fill="#102a3e" stroke="#ffb84d" stroke-width="3"/><text x="505" y="355" text-anchor="middle" fill="#ffb84d" font-size="14" font-weight="700">02 MESSAGE</text><text x="505" y="405" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">要点を示す</text><path d="M625 380H698" stroke="#7894aa" stroke-width="5"/><path d="M698 380l-18-12v24z" fill="#7894aa"/><rect x="698" y="300" width="240" height="160" rx="22" fill="#102a3e" stroke="#d998e8" stroke-width="3"/><text x="818" y="355" text-anchor="middle" fill="#d998e8" font-size="14" font-weight="700">03 SOURCE</text><text x="818" y="405" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">正本へ集める</text><path d="M938 380H1011" stroke="#7894aa" stroke-width="5"/><path d="M1011 380l-18-12v24z" fill="#7894aa"/><rect x="1011" y="300" width="300" height="160" rx="22" fill="#102a3e" stroke="#55e6cf" stroke-width="3"/><text x="1161" y="355" text-anchor="middle" fill="#55e6cf" font-size="14" font-weight="700">04 ACTION</text><text x="1161" y="405" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">期限内に行動</text><rect x="285" y="560" width="870" height="66" rx="16" fill="#102a3e" stroke="#25455e"/><text x="720" y="602" text-anchor="middle" fill="#f4f7fb" font-size="20" font-weight="700">届いたかではなく、対象者が次の行動を完了できたかを見る</text></g></svg>

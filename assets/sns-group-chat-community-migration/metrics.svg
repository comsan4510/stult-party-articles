<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">移行後の5つの検証指標</title><desc id="d">招待到達、初回参加、募集集約、プレイ到達、二重転記時間を順に確認する図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">MIGRATION METRICS</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">登録者数ではなく、遊べるまでの流れを測る</text><text x="72" y="174" fill="#9db0c3" font-size="22">上流から順に確認すると、離脱箇所と運営負担が分かる</text><g transform="translate(80 275)"><rect width="240" height="280" rx="24" fill="#10253a" stroke="#8fa8c0" stroke-width="3"/><text x="34" y="54" fill="#9db0c3" font-size="18" font-weight="700">01 REACH</text><text x="34" y="105" fill="#f4f7fb" font-size="28" font-weight="700">招待到達</text><text x="34" y="170" fill="#c4d0dc" font-size="20">案内を確認</text><text x="34" y="210" fill="#c4d0dc" font-size="20">できた割合</text></g><g transform="translate(340 275)"><rect width="240" height="280" rx="24" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="34" y="54" fill="#c991db" font-size="18" font-weight="700">02 JOIN</text><text x="34" y="105" fill="#f4f7fb" font-size="28" font-weight="700">初回参加</text><text x="34" y="170" fill="#c4d0dc" font-size="20">募集を一件</text><text x="34" y="210" fill="#c4d0dc" font-size="20">確認できた割合</text></g><g transform="translate(600 275)"><rect width="240" height="280" rx="24" fill="#10253a" stroke="#f0b566" stroke-width="3"/><text x="34" y="54" fill="#f0b566" font-size="18" font-weight="700">03 FOCUS</text><text x="34" y="105" fill="#f4f7fb" font-size="28" font-weight="700">募集集約</text><text x="34" y="170" fill="#c4d0dc" font-size="20">新規募集が</text><text x="34" y="210" fill="#c4d0dc" font-size="20">新拠点にある割合</text></g><g transform="translate(860 275)"><rect width="240" height="280" rx="24" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="34" y="54" fill="#61dbc5" font-size="18" font-weight="700">04 PLAY</text><text x="34" y="105" fill="#f4f7fb" font-size="28" font-weight="700">プレイ到達</text><text x="34" y="170" fill="#c4d0dc" font-size="20">参加表明から</text><text x="34" y="210" fill="#c4d0dc" font-size="20">遊べた割合</text></g><g transform="translate(1120 275)"><rect width="240" height="280" rx="24" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="34" y="54" fill="#61dbc5" font-size="18" font-weight="700">05 LOAD</text><text x="34" y="105" fill="#f4f7fb" font-size="28" font-weight="700">二重転記</text><text x="34" y="170" fill="#c4d0dc" font-size="20">同じ更新に</text><text x="34" y="210" fill="#c4d0dc" font-size="20">使った時間</text></g><path d="M200 620h1040" stroke="#29465f" stroke-width="5"/><path d="m1240 620-22-13v26z" fill="#61dbc5"/><text x="720" y="685" text-anchor="middle" fill="#f4f7fb" font-size="22" font-weight="700">案内 → 参加 → 募集 → プレイ → 運営負担</text></g></svg>

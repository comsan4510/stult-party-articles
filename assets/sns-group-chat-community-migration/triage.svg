<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">残す・移す・保管するの判断フロー</title><desc id="d">今後の活動に必要か、最新状態か、権限限定が必要かで扱いを判断する図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">CONTENT TRIAGE</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">取得できるかではなく、今後必要かで選ぶ</text><text x="72" y="174" fill="#9db0c3" font-size="22">会話ログをそのまま資産と見なさない</text><rect x="100" y="260" width="330" height="120" rx="22" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="265" y="310" text-anchor="middle" fill="#f4f7fb" font-size="24" font-weight="700">今後の活動に必要？</text><text x="265" y="346" text-anchor="middle" fill="#9db0c3" font-size="19">募集・ルール・連絡先</text><path d="M430 320h150" stroke="#7890a8" stroke-width="5"/><text x="505" y="302" text-anchor="middle" fill="#61dbc5" font-size="18">YES</text><rect x="580" y="260" width="330" height="120" rx="22" fill="#10253a" stroke="#f0b566" stroke-width="3"/><text x="745" y="310" text-anchor="middle" fill="#f4f7fb" font-size="24" font-weight="700">現在も有効？</text><text x="745" y="346" text-anchor="middle" fill="#9db0c3" font-size="19">担当者が最新値を確認</text><path d="M910 320h150" stroke="#7890a8" stroke-width="5"/><text x="985" y="302" text-anchor="middle" fill="#61dbc5" font-size="18">YES</text><rect x="1060" y="250" width="290" height="140" rx="22" fill="#143b41" stroke="#61dbc5" stroke-width="3"/><text x="1205" y="310" text-anchor="middle" fill="#61dbc5" font-size="26" font-weight="700">移す</text><text x="1205" y="350" text-anchor="middle" fill="#f4f7fb" font-size="20">新拠点で再作成</text><path d="M265 380v135" stroke="#7890a8" stroke-width="5"/><text x="286" y="454" fill="#f0b566" font-size="18">NO</text><rect x="100" y="515" width="330" height="130" rx="22" fill="#223448" stroke="#8fa8c0" stroke-width="3"/><text x="265" y="568" text-anchor="middle" fill="#f4f7fb" font-size="25" font-weight="700">必要な判断記録？</text><text x="265" y="608" text-anchor="middle" fill="#9db0c3" font-size="19">YESなら権限限定で保管</text><path d="M745 380v135" stroke="#7890a8" stroke-width="5"/><text x="766" y="454" fill="#f0b566" font-size="18">NO</text><rect x="580" y="515" width="330" height="130" rx="22" fill="#3d3023" stroke="#f0b566" stroke-width="3"/><text x="745" y="568" text-anchor="middle" fill="#f0b566" font-size="25" font-weight="700">更新してから移す</text><text x="745" y="608" text-anchor="middle" fill="#f4f7fb" font-size="19">古い条件は複製しない</text><rect x="1060" y="515" width="290" height="130" rx="22" fill="#2a2632" stroke="#c991db" stroke-width="3"/><text x="1205" y="568" text-anchor="middle" fill="#c991db" font-size="25" font-weight="700">移さない</text><text x="1205" y="608" text-anchor="middle" fill="#f4f7fb" font-size="19">雑談・終了済み募集</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">移行台帳の状態遷移と主要フィールド</title><desc id="d">発見、選定、再作成、検証、終了の状態と担当、同意、次の行動を管理する図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">MIGRATION LEDGER</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">「移行済み」を5つの状態に分解する</text><text x="72" y="174" fill="#9db0c3" font-size="22">一行一項目で、未検証の作業を見落とさない</text><g transform="translate(70 250)"><rect width="220" height="105" rx="20" fill="#223448" stroke="#8fa8c0" stroke-width="3"/><text x="110" y="48" text-anchor="middle" fill="#9db0c3" font-size="18" font-weight="700">FOUND</text><text x="110" y="80" text-anchor="middle" fill="#f4f7fb" font-size="23">発見</text></g><path d="M290 302h60" stroke="#7890a8" stroke-width="5"/><g transform="translate(350 250)"><rect width="220" height="105" rx="20" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="110" y="48" text-anchor="middle" fill="#c991db" font-size="18" font-weight="700">SELECTED</text><text x="110" y="80" text-anchor="middle" fill="#f4f7fb" font-size="23">対象決定</text></g><path d="M570 302h60" stroke="#7890a8" stroke-width="5"/><g transform="translate(630 250)"><rect width="220" height="105" rx="20" fill="#3d3023" stroke="#f0b566" stroke-width="3"/><text x="110" y="48" text-anchor="middle" fill="#f0b566" font-size="18" font-weight="700">RECREATED</text><text x="110" y="80" text-anchor="middle" fill="#f4f7fb" font-size="23">再作成</text></g><path d="M850 302h60" stroke="#7890a8" stroke-width="5"/><g transform="translate(910 250)"><rect width="220" height="105" rx="20" fill="#143b41" stroke="#61dbc5" stroke-width="3"/><text x="110" y="48" text-anchor="middle" fill="#61dbc5" font-size="18" font-weight="700">VERIFIED</text><text x="110" y="80" text-anchor="middle" fill="#f4f7fb" font-size="23">確認済み</text></g><path d="M1130 302h60" stroke="#7890a8" stroke-width="5"/><g transform="translate(1190 250)"><rect width="180" height="105" rx="20" fill="#173047" stroke="#61dbc5" stroke-width="3"/><text x="90" y="48" text-anchor="middle" fill="#61dbc5" font-size="18" font-weight="700">CLOSED</text><text x="90" y="80" text-anchor="middle" fill="#f4f7fb" font-size="23">終了</text></g><rect x="130" y="455" width="1180" height="220" rx="28" fill="#10253a" stroke="#29465f" stroke-width="3"/><text x="180" y="510" fill="#61dbc5" font-size="20" font-weight="700">REQUIRED FIELDS</text><g fill="#f4f7fb" font-size="23"><text x="180" y="565">項目ID・種類・作成先</text><text x="180" y="620">担当者・次の行動</text><text x="760" y="565">本人同意の要否</text><text x="760" y="620">最終確認日時</text></g><text x="720" y="735" text-anchor="middle" fill="#9db0c3" font-size="21">作成者とは別の担当者が確認してから、旧側の役割を閉じる</text></g></svg>

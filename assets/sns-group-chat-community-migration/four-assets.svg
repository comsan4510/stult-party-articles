<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">移行時に扱う4種類の資産</title><desc id="d">人間関係、募集中案件、運営ルール、過去記録を異なる方法で扱う図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">FOUR ASSETS</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">一括コピーせず、資産ごとに扱いを変える</text><text x="72" y="174" fill="#9db0c3" font-size="22">移行の単位を分けると、関係性と必要情報を守れる</text><g transform="translate(80 250)"><rect width="290" height="350" rx="24" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="34" y="58" fill="#61dbc5" font-size="18" font-weight="700">01 PEOPLE</text><text x="34" y="112" fill="#f4f7fb" font-size="30" font-weight="700">人間関係</text><text x="34" y="180" fill="#c4d0dc" font-size="21">説明して招待</text><text x="34" y="224" fill="#c4d0dc" font-size="21">本人が参加を選ぶ</text><rect x="34" y="278" width="222" height="42" rx="12" fill="#143b41"/><text x="145" y="306" text-anchor="middle" fill="#61dbc5" font-size="19" font-weight="700">INVITE</text></g><g transform="translate(410 250)"><rect width="290" height="350" rx="24" fill="#10253a" stroke="#f0b566" stroke-width="3"/><text x="34" y="58" fill="#f0b566" font-size="18" font-weight="700">02 ACTIVE</text><text x="34" y="112" fill="#f4f7fb" font-size="30" font-weight="700">募集中案件</text><text x="34" y="180" fill="#c4d0dc" font-size="21">最新条件を確認</text><text x="34" y="224" fill="#c4d0dc" font-size="21">状態として再作成</text><rect x="34" y="278" width="222" height="42" rx="12" fill="#3d3023"/><text x="145" y="306" text-anchor="middle" fill="#f0b566" font-size="19" font-weight="700">RECREATE</text></g><g transform="translate(740 250)"><rect width="290" height="350" rx="24" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="34" y="58" fill="#c991db" font-size="18" font-weight="700">03 CURRENT</text><text x="34" y="112" fill="#f4f7fb" font-size="30" font-weight="700">運営ルール</text><text x="34" y="180" fill="#c4d0dc" font-size="21">現行版を一つ選ぶ</text><text x="34" y="224" fill="#c4d0dc" font-size="21">担当者が確認</text><rect x="34" y="278" width="222" height="42" rx="12" fill="#35273c"/><text x="145" y="306" text-anchor="middle" fill="#c991db" font-size="19" font-weight="700">PUBLISH</text></g><g transform="translate(1070 250)"><rect width="290" height="350" rx="24" fill="#10253a" stroke="#8fa8c0" stroke-width="3"/><text x="34" y="58" fill="#9db0c3" font-size="18" font-weight="700">04 HISTORY</text><text x="34" y="112" fill="#f4f7fb" font-size="30" font-weight="700">過去記録</text><text x="34" y="180" fill="#c4d0dc" font-size="21">必要部分だけ保存</text><text x="34" y="224" fill="#c4d0dc" font-size="21">閲覧権限を限定</text><rect x="34" y="278" width="222" height="42" rx="12" fill="#223448"/><text x="145" y="306" text-anchor="middle" fill="#9db0c3" font-size="19" font-weight="700">ARCHIVE</text></g><text x="720" y="700" text-anchor="middle" fill="#f4f7fb" font-size="23" font-weight="700">全履歴を同じ場所へ運ぶことが、移行の成功ではない</text></g></svg>

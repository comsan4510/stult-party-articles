<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">会話から最新の募集状態へ変換するカード</title><desc id="d">複数の発言からゲーム、日時、人数、条件、ボイス、主催者、状態の最新値を再作成する図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">STATE, NOT MESSAGES</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">会話の順番ではなく、募集の最新値を移す</text><text x="72" y="174" fill="#9db0c3" font-size="22">変更と辞退を反映し、参加判断に必要な情報を一枚へ</text><g transform="translate(80 245)"><rect width="440" height="400" rx="28" fill="#10253a" stroke="#8fa8c0" stroke-width="3"/><text x="38" y="58" fill="#9db0c3" font-size="18" font-weight="700">GROUP CHAT</text><rect x="38" y="95" width="300" height="58" rx="18" fill="#223448"/><text x="58" y="132" fill="#c4d0dc" font-size="19">金曜21時、あと3人！</text><rect x="100" y="176" width="300" height="58" rx="18" fill="#2a3040"/><text x="120" y="213" fill="#c4d0dc" font-size="19">22時なら参加できます</text><rect x="38" y="257" width="340" height="58" rx="18" fill="#223448"/><text x="58" y="294" fill="#c4d0dc" font-size="19">開始を22時に変更します</text><rect x="100" y="338" width="250" height="42" rx="16" fill="#2a3040"/><text x="120" y="366" fill="#c4d0dc" font-size="18">1人辞退しました</text></g><path d="M550 445h220" stroke="#61dbc5" stroke-width="6"/><path d="m770 445-24-14v28z" fill="#61dbc5"/><text x="660" y="414" text-anchor="middle" fill="#61dbc5" font-size="18" font-weight="700">NORMALIZE</text><g transform="translate(810 225)"><rect width="540" height="440" rx="28" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="42" y="58" fill="#61dbc5" font-size="18" font-weight="700">CURRENT RECRUITMENT</text><text x="42" y="112" fill="#f4f7fb" font-size="30" font-weight="700">金曜ゲーム募集</text><g fill="#c4d0dc" font-size="21"><text x="42" y="168">開始　金曜 22:00</text><text x="42" y="210">定員　5人 ／ 現在3人</text><text x="42" y="252">条件　初心者歓迎</text><text x="42" y="294">ボイス　使用・聞き専可</text><text x="42" y="336">主催　確認済み</text></g><rect x="42" y="370" width="210" height="44" rx="12" fill="#143b41"/><text x="147" y="400" text-anchor="middle" fill="#61dbc5" font-size="20" font-weight="700">募集中</text></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">SNSを入口、Stult Partyをゲーム活動の拠点にする構成</title><desc id="d">SNSの発見と告知から、Stult Partyの募集、チャット、ボイスへつなぐ図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">MOVE THE ACTIVITY, NOT THE HISTORY</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">SNSは入口に、ゲーム活動は一つの拠点に</text><text x="72" y="174" fill="#9db0c3" font-size="22">関係性を残し、これから遊ぶための状態だけを移す</text><g transform="translate(100 270)"><rect width="430" height="300" rx="28" fill="#10253a" stroke="#8fa8c0" stroke-width="3"/><text x="42" y="64" fill="#9db0c3" font-size="18" font-weight="700">KEEP IN SNS</text><text x="42" y="122" fill="#f4f7fb" font-size="34" font-weight="700">発見と告知</text><text x="42" y="190" fill="#c4d0dc" font-size="23">新しい人との接点</text><text x="42" y="238" fill="#c4d0dc" font-size="23">短い案内・参加リンク</text></g><path d="M570 420h280" stroke="#61dbc5" stroke-width="6"/><path d="m850 420-24-14v28z" fill="#61dbc5"/><g transform="translate(890 240)"><rect width="450" height="360" rx="28" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="42" y="64" fill="#61dbc5" font-size="18" font-weight="700">STULT PARTY</text><text x="42" y="122" fill="#f4f7fb" font-size="34" font-weight="700">ゲーム活動の拠点</text><rect x="42" y="168" width="366" height="46" rx="12" fill="#163149"/><text x="225" y="199" text-anchor="middle" fill="#f4f7fb" font-size="22">ゲーム募集</text><rect x="42" y="232" width="366" height="46" rx="12" fill="#163149"/><text x="225" y="263" text-anchor="middle" fill="#f4f7fb" font-size="22">チャット</text><rect x="42" y="296" width="366" height="46" rx="12" fill="#163149"/><text x="225" y="327" text-anchor="middle" fill="#f4f7fb" font-size="22">ボイス</text></g><rect x="300" y="680" width="840" height="66" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="722" text-anchor="middle" fill="#f4f7fb" font-size="22" font-weight="700">無料で始め、募集からプレイまでの導線を検証する</text></g></svg>

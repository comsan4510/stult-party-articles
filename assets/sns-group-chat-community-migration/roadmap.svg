<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">SNSから21日で活動拠点を切り替える工程</title><desc id="d">棚卸し、構築、再作成、テスト、招待、受付一本化を21日で進める図</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="72" y="62" fill="#61dbc5" font-size="20" font-weight="700" letter-spacing="4">21-DAY ROADMAP</text><text x="72" y="126" fill="#f4f7fb" font-size="40" font-weight="700">空の拠点へ招待せず、段階的に切り替える</text><text x="72" y="174" fill="#9db0c3" font-size="22">準備と少人数テストを終えてから、受付先を一本化する</text><line x1="130" y1="420" x2="1310" y2="420" stroke="#29465f" stroke-width="8"/><g text-anchor="middle"><circle cx="150" cy="420" r="34" fill="#143b41" stroke="#61dbc5" stroke-width="4"/><text x="150" y="428" fill="#f4f7fb" font-size="20" font-weight="700">1</text><text x="150" y="350" fill="#61dbc5" font-size="18" font-weight="700">DAY 1–3</text><text x="150" y="500" fill="#f4f7fb" font-size="22" font-weight="700">棚卸し</text><text x="150" y="536" fill="#9db0c3" font-size="17">範囲と指標</text><circle cx="380" cy="420" r="34" fill="#143b41" stroke="#61dbc5" stroke-width="4"/><text x="380" y="428" fill="#f4f7fb" font-size="20" font-weight="700">2</text><text x="380" y="350" fill="#61dbc5" font-size="18" font-weight="700">DAY 4–7</text><text x="380" y="500" fill="#f4f7fb" font-size="22" font-weight="700">構築</text><text x="380" y="536" fill="#9db0c3" font-size="17">最小構成</text><circle cx="610" cy="420" r="34" fill="#3d3023" stroke="#f0b566" stroke-width="4"/><text x="610" y="428" fill="#f4f7fb" font-size="20" font-weight="700">3</text><text x="610" y="350" fill="#f0b566" font-size="18" font-weight="700">DAY 8–10</text><text x="610" y="500" fill="#f4f7fb" font-size="22" font-weight="700">再作成</text><text x="610" y="536" fill="#9db0c3" font-size="17">開催前募集</text><circle cx="840" cy="420" r="34" fill="#3d3023" stroke="#f0b566" stroke-width="4"/><text x="840" y="428" fill="#f4f7fb" font-size="20" font-weight="700">4</text><text x="840" y="350" fill="#f0b566" font-size="18" font-weight="700">DAY 11–14</text><text x="840" y="500" fill="#f4f7fb" font-size="22" font-weight="700">一巡テスト</text><text x="840" y="536" fill="#9db0c3" font-size="17">募集からボイス</text><circle cx="1070" cy="420" r="34" fill="#35273c" stroke="#c991db" stroke-width="4"/><text x="1070" y="428" fill="#f4f7fb" font-size="20" font-weight="700">5</text><text x="1070" y="350" fill="#c991db" font-size="18" font-weight="700">DAY 15–18</text><text x="1070" y="500" fill="#f4f7fb" font-size="22" font-weight="700">招待</text><text x="1070" y="536" fill="#9db0c3" font-size="17">理由と選択肢</text><circle cx="1300" cy="420" r="34" fill="#143b41" stroke="#61dbc5" stroke-width="4"/><text x="1300" y="428" fill="#f4f7fb" font-size="20" font-weight="700">6</text><text x="1300" y="350" fill="#61dbc5" font-size="18" font-weight="700">DAY 19–21</text><text x="1300" y="500" fill="#f4f7fb" font-size="22" font-weight="700">一本化</text><text x="1300" y="536" fill="#9db0c3" font-size="17">新規募集の受付</text></g><rect x="290" y="650" width="860" height="66" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="692" text-anchor="middle" fill="#f4f7fb" font-size="22" font-weight="700">元グループは削除せず、告知と参照へ役割を縮める</text></g></svg>

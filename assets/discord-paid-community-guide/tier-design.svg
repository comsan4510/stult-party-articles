<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">最小限の料金プランとロール設計</title><desc id="d">無料、有料、運営の3系統に分けた権限設計。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0c1728"/><stop offset="1" stop-color="#14323b"/></linearGradient></defs><rect width="1200" height="620" rx="36" fill="url(#b)"/><g font-family="sans-serif"><text x="65" y="72" fill="#effffc" font-size="34" font-weight="700">最初は「無料・有料・運営」だけ</text><text x="65" y="108" fill="#9fbdc0" font-size="19">料金プランと権限ロールを一対一に近づけるほど、同期の分岐が減る。</text><g text-anchor="middle"><g transform="translate(70 170)"><rect width="320" height="300" rx="28" fill="#1a3040" stroke="#4f8d9b" stroke-width="2"/><circle cx="160" cy="72" r="38" fill="#3d6877"/><text x="160" y="82" fill="white" font-size="28" font-weight="700">0</text><text x="160" y="145" fill="white" font-size="27" font-weight="700">無料メンバー</text><text x="160" y="185" fill="#b1cdcf" font-size="18">公開案内・通常交流</text><rect x="50" y="222" width="220" height="42" rx="21" fill="#263f4d"/><text x="160" y="249" fill="#bcd5d6" font-size="17">参加時に付与</text></g><g transform="translate(440 145)"><rect width="320" height="350" rx="28" fill="#1e483f" stroke="#62d1aa" stroke-width="3"/><circle cx="160" cy="78" r="44" fill="#2ca27e"/><path d="M141 78l13 13 27-33" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/><text x="160" y="160" fill="white" font-size="28" font-weight="700">有料メンバー</text><text x="160" y="202" fill="#bee7d8" font-size="18">限定チャンネル</text><text x="160" y="230" fill="#bee7d8" font-size="18">定例会・特典</text><rect x="45" y="277" width="230" height="45" rx="22" fill="#256252"/><text x="160" y="306" fill="#d9fff1" font-size="17">課金状態と自動同期</text></g><g transform="translate(810 170)"><rect width="320" height="300" rx="28" fill="#372f42" stroke="#a781bd" stroke-width="2"/><circle cx="160" cy="72" r="38" fill="#72578a"/><path d="M145 83h30M150 69a10 10 0 1 0 20 0" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/><text x="160" y="145" fill="white" font-size="27" font-weight="700">運営</text><text x="160" y="185" fill="#d1c0da" font-size="18">管理・モデレーション</text><rect x="50" y="222" width="220" height="42" rx="21" fill="#493b55"/><text x="160" y="249" fill="#decfe6" font-size="17">手動のみ</text></g></g><rect x="250" y="540" width="700" height="48" rx="24" fill="#27343d"/><text x="600" y="571" text-anchor="middle" fill="#f1c379" font-size="19" font-weight="700">課金ロールを、お礼・招待・運営権限に流用しない</text></g></svg>

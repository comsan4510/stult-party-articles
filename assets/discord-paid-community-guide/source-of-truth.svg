<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">決済を正とする会員データ設計</title><desc id="d">Webhookをきっかけに決済APIへ最新状態を問い合わせ、会員テーブルを更新してDiscordロールへ反映する図。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0c1728"/><stop offset="1" stop-color="#14323a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#5bd0c4"/></marker></defs><rect width="1200" height="620" rx="36" fill="url(#b)"/><g font-family="sans-serif"><text x="65" y="72" fill="#effffc" font-size="34" font-weight="700">Webhookは命令ではなく「確認のきっかけ」</text><text x="65" y="108" fill="#9fbdc0" font-size="19">決済APIの最新状態を正として、会員データとDiscordをそこへ収束させる。</text>
<g text-anchor="middle"><g transform="translate(80 205)"><rect width="250" height="150" rx="26" fill="#4a3824" stroke="#e3a64a" stroke-width="2"/><text x="125" y="50" fill="white" font-size="23" font-weight="700">Webhook</text><text x="125" y="85" fill="#ead7b8" font-size="17">支払い・解約など</text><text x="125" y="115" fill="#ead7b8" font-size="17">重複・順序逆転あり</text></g><g transform="translate(475 180)"><rect width="250" height="200" rx="26" fill="#24483e" stroke="#5ed0a9" stroke-width="3"/><text x="125" y="50" fill="white" font-size="23" font-weight="700">決済API</text><rect x="50" y="78" width="150" height="45" rx="22" fill="#27785f"/><text x="125" y="107" fill="#e4fff5" font-size="17">最新状態 = 正</text><text x="125" y="158" fill="#b9dfd2" font-size="17">active / past_due</text><text x="125" y="182" fill="#b9dfd2" font-size="17">canceled</text></g><g transform="translate(870 205)"><rect width="250" height="150" rx="26" fill="#263b55" stroke="#6d9ee5" stroke-width="2"/><text x="125" y="50" fill="white" font-size="23" font-weight="700">Discord</text><text x="125" y="85" fill="#c1d3e9" font-size="17">有料ロール</text><text x="125" y="115" fill="#c1d3e9" font-size="17">結果として反映</text></g></g><path d="M330 280h130" stroke="#59c9bf" stroke-width="4" marker-end="url(#a)"/><path d="M725 280h130" stroke="#59c9bf" stroke-width="4" marker-end="url(#a)"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">有料コミュニティの日常運用ループ</title><desc id="d">自動同期、日次突合、問い合わせ復旧、月次見直しを循環する運用図。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0c1728"/><stop offset="1" stop-color="#14323a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#5bd0c4"/></marker></defs><rect width="1200" height="620" rx="36" fill="url(#b)"/><g font-family="sans-serif"><text x="65" y="72" fill="#effffc" font-size="34" font-weight="700">公開後は「ズレを直す」運用が中心</text><text x="65" y="108" fill="#9fbdc0" font-size="19">自動化だけに頼らず、定期確認と手動復旧を組み合わせる。</text><circle cx="600" cy="340" r="115" fill="#24483f" stroke="#5ed1aa" stroke-width="3"/><text x="600" y="325" text-anchor="middle" fill="white" font-size="25" font-weight="700">会員体験を</text><text x="600" y="360" text-anchor="middle" fill="white" font-size="25" font-weight="700">正常に保つ</text><text x="600" y="394" text-anchor="middle" fill="#b6dbd1" font-size="17">支払い → 利用 → 退会</text>
<g text-anchor="middle"><g transform="translate(95 160)"><rect width="300" height="110" rx="24" fill="#203846" stroke="#53a9aa" stroke-width="2"/><text x="150" y="45" fill="white" font-size="22" font-weight="700">自動同期</text><text x="150" y="77" fill="#aecacb" font-size="17">Webhook・ロール反映</text></g><g transform="translate(805 160)"><rect width="300" height="110" rx="24" fill="#203846" stroke="#53a9aa" stroke-width="2"/><text x="150" y="45" fill="white" font-size="22" font-weight="700">日次突合</text><text x="150" y="77" fill="#aecacb" font-size="17">決済とDiscordを全件比較</text></g><g transform="translate(805 455)"><rect width="300" height="110" rx="24" fill="#3b342b" stroke="#d9a451" stroke-width="2"/><text x="150" y="45" fill="white" font-size="22" font-weight="700">問い合わせ・復旧</text><text x="150" y="77" fill="#dccbb1" font-size="17">状態確認・手動再同期</text></g><g transform="translate(95 455)"><rect width="300" height="110" rx="24" fill="#343043" stroke="#9a82b3" stroke-width="2"/><text x="150" y="45" fill="white" font-size="22" font-weight="700">月次見直し</text><text x="150" y="77" fill="#cec2d7" font-size="17">継続価値・解約理由</text></g></g><path d="M395 215c120-110 290-115 410 0M955 270v185M805 510c-120 90-290 90-410 0M245 455V270" fill="none" stroke="#58c9bf" stroke-width="4" marker-end="url(#a)"/></g></svg>

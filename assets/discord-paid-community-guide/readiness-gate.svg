<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">月額課金へ進む判断ゲート</title><desc id="d">無料コミュニティの自走、継続価値、単発課金の検証を通過して月額を始める図。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0c1728"/><stop offset="1" stop-color="#15323a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#5dd0c4"/></marker></defs><rect width="1200" height="620" rx="36" fill="url(#b)"/><g font-family="sans-serif"><text x="65" y="72" fill="#f1fffd" font-size="34" font-weight="700">月額へ進む前の3つのゲート</text><path d="M125 305H1065" stroke="#397b80" stroke-width="5" marker-end="url(#a)"/>
<g text-anchor="middle"><g transform="translate(205 305)"><rect x="-135" y="-105" width="270" height="210" rx="26" fill="#183044" stroke="#4c9ba2" stroke-width="2"/><circle cy="-42" r="30" fill="#2f7f83"/><path d="M-13-41l9 9 19-23" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/><text y="21" fill="white" font-size="23" font-weight="700">無料で自走</text><text y="55" fill="#a8c8ca" font-size="17">運営が黙っても</text><text y="80" fill="#a8c8ca" font-size="17">会話が続く</text></g><g transform="translate(515 305)"><rect x="-135" y="-105" width="270" height="210" rx="26" fill="#183044" stroke="#4c9ba2" stroke-width="2"/><circle cy="-42" r="30" fill="#2f7f83"/><path d="M-13-41l9 9 19-23" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/><text y="21" fill="white" font-size="23" font-weight="700">継続価値</text><text y="55" fill="#a8c8ca" font-size="17">3か月分の提供内容を</text><text y="80" fill="#a8c8ca" font-size="17">説明できる</text></g><g transform="translate(825 305)"><rect x="-135" y="-105" width="270" height="210" rx="26" fill="#183044" stroke="#4c9ba2" stroke-width="2"/><circle cy="-42" r="30" fill="#2f7f83"/><path d="M-13-41l9 9 19-23" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/><text y="21" fill="white" font-size="23" font-weight="700">単発で検証</text><text y="55" fill="#a8c8ca" font-size="17">実際に支払う人が</text><text y="80" fill="#a8c8ca" font-size="17">存在する</text></g><g transform="translate(1080 305)"><circle r="72" fill="#27a397" stroke="#b8fff7" stroke-width="4"/><text y="-5" fill="white" font-size="24" font-weight="700">月額</text><text y="28" fill="white" font-size="24" font-weight="700">開始</text></g></g><rect x="285" y="500" width="630" height="58" rx="29" fill="#26333b"/><text x="600" y="537" text-anchor="middle" fill="#f3c577" font-size="20" font-weight="700">1つでも未確認なら、無料または単発へ戻る</text></g></svg>

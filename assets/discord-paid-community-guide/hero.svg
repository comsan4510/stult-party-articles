<rect width="1440" height="810" fill="url(#b)"/><rect width="1440" height="810" fill="url(#g)"/><g font-family="sans-serif"><text x="86" y="98" fill="#64d5c7" font-size="20" font-weight="700" letter-spacing="4">PAID COMMUNITY PLAYBOOK</text><text x="86" y="168" fill="#f3fffd" font-size="52" font-weight="800">Discord有料コミュニティを</text><text x="86" y="232" fill="#f3fffd" font-size="52" font-weight="800">6ステップで立ち上げる。</text><text x="89" y="280" fill="#a9c7c8" font-size="22">価値設計から解約対応まで、運営全体を一枚につなぐ</text></g>

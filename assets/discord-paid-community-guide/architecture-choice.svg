<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">有料Discordの構成選択フロー</title><desc id="d">開発と保守の可否、既存プラットフォームの利用状況から3構成を選ぶ判断図。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0c1728"/><stop offset="1" stop-color="#12313a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#5bcfc3"/></marker></defs><rect width="1200" height="650" rx="36" fill="url(#b)"/><g font-family="sans-serif"><text x="65" y="72" fill="#effffc" font-size="34" font-weight="700">誰が半年後も保守するかで選ぶ</text><rect x="420" y="115" width="360" height="85" rx="22" fill="#213a49" stroke="#63d3c8" stroke-width="2"/><text x="600" y="151" text-anchor="middle" fill="white" font-size="22" font-weight="700">開発・障害対応を</text><text x="600" y="179" text-anchor="middle" fill="white" font-size="22" font-weight="700">継続できる？</text><path d="M515 200L270 300" stroke="#54b8b2" stroke-width="4" marker-end="url(#a)"/><path d="M685 200L930 300" stroke="#54b8b2" stroke-width="4" marker-end="url(#a)"/><text x="375" y="240" fill="#b9d7d7" font-size="18">できない</text><text x="805" y="240" fill="#b9d7d7" font-size="18">できる</text>
<rect x="95" y="300" width="350" height="105" rx="24" fill="#213a49" stroke="#63d3c8" stroke-width="2"/><text x="270" y="340" text-anchor="middle" fill="white" font-size="21" font-weight="700">既存の会員基盤がある？</text><text x="270" y="372" text-anchor="middle" fill="#a8c8ca" font-size="17">note / Patreon / Fantiaなど</text><path d="M190 405l-45 93" stroke="#54b8b2" stroke-width="4" marker-end="url(#a)"/><path d="M350 405l45 93" stroke="#54b8b2" stroke-width="4" marker-end="url(#a)"/><text x="125" y="453" fill="#b9d7d7" font-size="17">ない</text><text x="377" y="453" fill="#b9d7d7" font-size="17">ある</text>
<g text-anchor="middle"><g transform="translate(145 505)"><rect x="-110" width="220" height="105" rx="22" fill="#25364b" stroke="#5597c8" stroke-width="2"/><text y="37" fill="white" font-size="20" font-weight="700">決済SaaS</text><text y="68" fill="#abc5db" font-size="16">最短で開始</text><text y="91" fill="#abc5db" font-size="16">同期も委託</text></g><g transform="translate(395 505)"><rect x="-110" width="220" height="105" rx="22" fill="#3a3143" stroke="#c586af" stroke-width="2"/><text y="37" fill="white" font-size="20" font-weight="700">既存基盤</text><text y="68" fill="#dbc0d2" font-size="16">Discordは</text><text y="91" fill="#dbc0d2" font-size="16">会員特典</text></g><g transform="translate(930 300)"><rect x="-175" width="350" height="185" rx="26" fill="#244438" stroke="#5bd3a6" stroke-width="2"/><text y="47" fill="white" font-size="24" font-weight="700">決済 + 自前Bot</text><text y="84" fill="#b8ddcf" font-size="17">自由度とデータ所有</text><path d="M-120 112h240" stroke="#4f826f"/><text y="145" fill="#f2c578" font-size="17">同期・障害・問い合わせも自分</text></g></g></g></svg>

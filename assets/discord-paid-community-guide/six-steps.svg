<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">有料コミュニティ立ち上げの6ステップ</title><desc id="d">価値、構成、料金、本人確認、同期、運用を順番に進める図。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0c1728"/><stop offset="1" stop-color="#12313b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#55cfc3"/></marker></defs><rect width="1200" height="650" rx="36" fill="url(#b)"/><g font-family="sans-serif"><text x="65" y="72" fill="#effffc" font-size="34" font-weight="700">ツールより先に、順番を決める</text><text x="65" y="108" fill="#9fbdc0" font-size="19">前のステップが曖昧なまま次へ進むと、料金と権限を作り直すことになる。</text>

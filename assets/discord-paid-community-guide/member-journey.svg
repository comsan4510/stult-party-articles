<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">購入者とDiscordアカウントを紐づける入会フロー</title><desc id="d">販売ページ、Discord OAuth、決済、サーバー参加、ロール付与の順序。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0c1728"/><stop offset="1" stop-color="#13323b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#5bd0c4"/></marker></defs><rect width="1200" height="620" rx="36" fill="url(#b)"/><g font-family="sans-serif"><text x="65" y="72" fill="#effffc" font-size="34" font-weight="700">支払い前に「誰か」を確定する</text><text x="65" y="108" fill="#9fbdc0" font-size="19">ユーザー名の手入力ではなく、OAuth2でDiscordユーザーIDを取得する。</text><path d="M125 300H1075" stroke="#3b8185" stroke-width="5" marker-end="url(#a)"/><g text-anchor="middle"><g transform="translate(130 300)"><circle r="52" fill="#263f4e" stroke="#59bfc0" stroke-width="3"/><text y="9" fill="white" font-size="27" font-weight="700">1</text><text y="100" fill="white" font-size="20" font-weight="700">販売ページ</text><text y="130" fill="#a8c8ca" font-size="16">内容を確認</text></g><g transform="translate(365 300)"><circle r="58" fill="#285b59" stroke="#64d7ca" stroke-width="4"/><text y="9" fill="white" font-size="27" font-weight="700">2</text><text y="100" fill="white" font-size="20" font-weight="700">Discord OAuth</text><text y="130" fill="#b7ded9" font-size="16">本人IDを取得</text></g><g transform="translate(600 300)"><circle r="52" fill="#4b3d28" stroke="#e5a94b" stroke-width="3"/><text y="9" fill="white" font-size="27" font-weight="700">3</text><text y="100" fill="white" font-size="20" font-weight="700">決済</text><text y="130" fill="#e4d0af" font-size="16">顧客IDを保存</text></g><g transform="translate(835 300)"><circle r="52" fill="#283c55" stroke="#6d9ee5" stroke-width="3"/><text y="9" fill="white" font-size="27" font-weight="700">4</text><text y="100" fill="white" font-size="20" font-weight="700">サーバー参加</text><text y="130" fill="#b9cde7" font-size="16">本人が参加</text></g><g transform="translate(1070 300)"><circle r="58" fill="#2c9d79" stroke="#b7ffe9" stroke-width="4"/><path d="M1045-1l16 16 33-40" transform="translate(-1070)" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/><text y="100" fill="white" font-size="20" font-weight="700">ロール付与</text><text y="130" fill="#c9eee2" font-size="16">限定エリアへ</text></g></g><rect x="270" y="490" width="660" height="70" rx="22" fill="#26333d"/><text x="600" y="520" text-anchor="middle" fill="#f0c278" font-size="19" font-weight="700">保存する対応</text><text x="600" y="547" text-anchor="middle" fill="#d4e2e1" font-size="18">DiscordユーザーID ⇄ 決済顧客ID ⇄ 契約ID</text></g></svg>

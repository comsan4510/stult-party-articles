<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">RESPONSE METRICS</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">速度だけでなく、判断精度と再発を測る</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">個人評価ではなく対応手順の改善に使う</text><g font-family="Arial,sans-serif"><g fill="#102a3e"><rect x="45" y="275" width="250" height="300" rx="22" stroke="#55e6cf" stroke-width="3"/><rect x="320" y="275" width="250" height="300" rx="22" stroke="#7f9bb1" stroke-width="3"/><rect x="595" y="275" width="250" height="300" rx="22" stroke="#ffb84d" stroke-width="3"/><rect x="870" y="275" width="250" height="300" rx="22" stroke="#d998e8" stroke-width="3"/><rect x="1145" y="275" width="250" height="300" rx="22" stroke="#ff7070" stroke-width="3"/></g><g text-anchor="middle" font-weight="700"><text x="170" y="330" fill="#55e6cf" font-size="13">01 DETECT</text><text x="170" y="395" fill="#fff" font-size="24">検知時間</text><text x="445" y="330" fill="#7f9bb1" font-size="13">02 CONTAIN</text><text x="445" y="395" fill="#fff" font-size="24">封じ込め時間</text><text x="720" y="330" fill="#ffb84d" font-size="13">03 SCOPE</text><text x="720" y="395" fill="#fff" font-size="24">影響場所数</text><text x="995" y="330" fill="#d998e8" font-size="13">04 FALSE POSITIVE</text><text x="995" y="380" fill="#fff" font-size="24">通常参加者の</text><text x="995" y="415" fill="#fff" font-size="24">誤制限数</text><text x="1270" y="330" fill="#ff7070" font-size="13">05 RECURRENCE</text><text x="1270" y="380" fill="#fff" font-size="24">復旧後の</text><text x="1270" y="415" fill="#fff" font-size="24">再発件数</text></g><g fill="#b8c7d4" font-size="16" text-anchor="middle"><text x="170" y="500">通報窓口と当番</text><text x="445" y="500">権限と入口台帳</text><text x="720" y="500">拡大範囲を確認</text><text x="995" y="500">判断精度を改善</text><text x="1270" y="500">復旧条件を見直す</text></g></g><rect x="350" y="650" width="740" height="58" rx="14" fill="#102a3e" stroke="#25455e"/><text x="720" y="687" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">早さと正確さの両方で、次の初動を改善する</text></svg>

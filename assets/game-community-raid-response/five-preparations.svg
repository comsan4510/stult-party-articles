<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">FIVE PREPARATIONS</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">発生前に、止める場所と戻す条件を決める</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">平常時の台帳が初動速度を決める</text><g font-family="Arial,sans-serif"><g fill="#102a3e"><rect x="45" y="275" width="250" height="300" rx="22" stroke="#55e6cf" stroke-width="3"/><rect x="320" y="275" width="250" height="300" rx="22" stroke="#7f9bb1" stroke-width="3"/><rect x="595" y="275" width="250" height="300" rx="22" stroke="#ffb84d" stroke-width="3"/><rect x="870" y="275" width="250" height="300" rx="22" stroke="#d998e8" stroke-width="3"/><rect x="1145" y="275" width="250" height="300" rx="22" stroke="#ff7070" stroke-width="3"/></g><g text-anchor="middle" font-weight="700"><text x="170" y="330" fill="#55e6cf" font-size="13">01 CONTACT</text><text x="170" y="390" fill="#fff" font-size="24">緊急連絡先</text><text x="445" y="330" fill="#7f9bb1" font-size="13">02 ENTRY</text><text x="445" y="390" fill="#fff" font-size="24">入口一覧</text><text x="720" y="330" fill="#ffb84d" font-size="13">03 SOURCE</text><text x="720" y="390" fill="#fff" font-size="24">案内の正本</text><text x="995" y="330" fill="#d998e8" font-size="13">04 EVIDENCE</text><text x="995" y="390" fill="#fff" font-size="24">記録項目</text><text x="1270" y="330" fill="#ff7070" font-size="13">05 EXIT</text><text x="1270" y="390" fill="#fff" font-size="24">復旧条件</text></g><g fill="#b8c7d4" font-size="16" text-anchor="middle"><text x="170" y="500">主担当と代行</text><text x="445" y="500">招待・公開募集</text><text x="720" y="500">更新場所を一つ</text><text x="995" y="500">対象・時刻・措置</text><text x="1270" y="500">再開の判断基準</text></g></g><rect x="340" y="650" width="760" height="58" rx="14" fill="#102a3e" stroke="#25455e"/><text x="720" y="687" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">担当者が不在でも最初の対応を始められる</text></svg>

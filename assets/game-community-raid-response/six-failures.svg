<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">SIX RESPONSE FAILURES</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">焦って動くほど、被害範囲が見えなくなる</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">対応の順番と役割を固定する</text><g font-family="Arial,sans-serif" font-weight="700"><g fill="#102a3e"><rect x="70" y="245" width="390" height="150" rx="20" stroke="#7f9bb1" stroke-width="3"/><rect x="525" y="245" width="390" height="150" rx="20" stroke="#ff7070" stroke-width="3"/><rect x="980" y="245" width="390" height="150" rx="20" stroke="#ffb84d" stroke-width="3"/><rect x="70" y="455" width="390" height="150" rx="20" stroke="#d998e8" stroke-width="3"/><rect x="525" y="455" width="390" height="150" rx="20" stroke="#55e6cf" stroke-width="3"/><rect x="980" y="455" width="390" height="150" rx="20" stroke="#ff7070" stroke-width="3"/></g><g fill="#fff" font-size="23" text-anchor="middle"><text x="265" y="335">一人で追跡</text><text x="720" y="335">公開で議論</text><text x="1175" y="335">記録前に削除</text><text x="265" y="545">無期限の全面停止</text><text x="720" y="545">入口を放置</text><text x="1175" y="545">即時全面復旧</text></g><g font-size="13" text-anchor="middle"><text x="265" y="292" fill="#7f9bb1">01 ROLE</text><text x="720" y="292" fill="#ff7070">02 REACTION</text><text x="1175" y="292" fill="#ffb84d">03 EVIDENCE</text><text x="265" y="502" fill="#d998e8">04 OVERBLOCK</text><text x="720" y="502" fill="#55e6cf">05 ENTRY</text><text x="1175" y="502" fill="#ff7070">06 RECOVERY</text></g></g><rect x="340" y="680" width="760" height="58" rx="14" fill="#102a3e" stroke="#25455e"/><text x="720" y="717" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">封じ込めと通常参加者の復帰を両立する</text></svg>

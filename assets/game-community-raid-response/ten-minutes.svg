<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">FIRST TEN MINUTES</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">最初の10分を、4つの目的に分ける</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">事実確認から参加者案内までを止めずに進める</text><g font-family="Arial,sans-serif"><rect x="60" y="285" width="300" height="280" rx="22" fill="#102a3e" stroke="#7f9bb1" stroke-width="3"/><rect x="400" y="285" width="300" height="280" rx="22" fill="#102a3e" stroke="#ff7070" stroke-width="3"/><rect x="740" y="285" width="300" height="280" rx="22" fill="#102a3e" stroke="#ffb84d" stroke-width="3"/><rect x="1080" y="285" width="300" height="280" rx="22" fill="#102a3e" stroke="#55e6cf" stroke-width="3"/><g text-anchor="middle" font-weight="700"><text x="210" y="340" fill="#7f9bb1" font-size="13">0–2 MIN</text><text x="210" y="400" fill="#fff" font-size="27">範囲を確認</text><text x="550" y="340" fill="#ff7070" font-size="13">2–5 MIN</text><text x="550" y="400" fill="#fff" font-size="27">拡大を止める</text><text x="890" y="340" fill="#ffb84d" font-size="13">5–7 MIN</text><text x="890" y="400" fill="#fff" font-size="27">記録を固定</text><text x="1230" y="340" fill="#55e6cf" font-size="13">7–10 MIN</text><text x="1230" y="400" fill="#fff" font-size="27">短く案内</text></g><g fill="#b8c7d4" font-size="17" text-anchor="middle"><text x="210" y="475">事実・場所・継続</text><text x="550" y="475">入口・投稿・アクセス</text><text x="890" y="475">対象・時刻・前後</text><text x="1230" y="475">範囲・行動・次回</text></g></g><rect x="300" y="645" width="840" height="58" rx="14" fill="#102a3e" stroke="#25455e"/><text x="720" y="682" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">公開討論より、被害を増やさない処理を優先</text></svg>

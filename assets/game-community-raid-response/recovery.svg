<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">STAGED RECOVERY</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">全面解除ではなく、3段階で通常運用へ戻す</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">影響の小さい場所から再開し、再発を監視する</text><g font-family="Arial,sans-serif"><rect x="95" y="285" width="350" height="300" rx="24" fill="#102a3e" stroke="#7f9bb1" stroke-width="3"/><rect x="545" y="285" width="350" height="300" rx="24" fill="#102a3e" stroke="#ffb84d" stroke-width="3"/><rect x="995" y="285" width="350" height="300" rx="24" fill="#102a3e" stroke="#55e6cf" stroke-width="3"/><g text-anchor="middle" font-weight="700"><text x="270" y="345" fill="#7f9bb1" font-size="14">STAGE 1</text><text x="270" y="410" fill="#fff" font-size="29">読み取り中心</text><text x="720" y="345" fill="#ffb84d" font-size="14">STAGE 2</text><text x="720" y="410" fill="#fff" font-size="29">限定して再開</text><text x="1170" y="345" fill="#55e6cf" font-size="14">STAGE 3</text><text x="1170" y="410" fill="#fff" font-size="29">通常運用＋監視</text></g><g fill="#b8c7d4" font-size="18" text-anchor="middle"><text x="270" y="485">正本と募集状態を確認</text><text x="720" y="485">影響の小さい場所から</text><text x="1170" y="485">新規参加と同文投稿</text></g><path d="M445 435H545" stroke="#7894aa" stroke-width="5"/><path d="M545 435l-18-12v24z" fill="#7894aa"/><path d="M895 435H995" stroke="#7894aa" stroke-width="5"/><path d="M995 435l-18-12v24z" fill="#7894aa"/></g><rect x="330" y="650" width="780" height="58" rx="14" fill="#102a3e" stroke="#25455e"/><text x="720" y="687" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">再発時は封じ込めへ戻し、同じ事案に関連付ける</text></svg>

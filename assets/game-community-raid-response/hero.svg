<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">RAID RESPONSE ROUTE</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">公開で反応する前に、影響範囲を止める</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">検知・封じ込め・記録・案内・復旧を順番に進める</text><g font-family="Arial,sans-serif"><g fill="#102a3e"><rect x="50" y="300" width="240" height="170" rx="22" stroke="#7f9bb1" stroke-width="3"/><rect x="325" y="300" width="240" height="170" rx="22" stroke="#ff7070" stroke-width="3"/><rect x="600" y="300" width="240" height="170" rx="22" stroke="#ffb84d" stroke-width="3"/><rect x="875" y="300" width="240" height="170" rx="22" stroke="#55e6cf" stroke-width="3"/><rect x="1150" y="300" width="240" height="170" rx="22" stroke="#d998e8" stroke-width="3"/></g><g text-anchor="middle" font-weight="700"><text x="170" y="355" fill="#7f9bb1" font-size="13">01 DETECT</text><text x="170" y="415" fill="#fff" font-size="26">検知</text><text x="445" y="355" fill="#ff7070" font-size="13">02 CONTAIN</text><text x="445" y="415" fill="#fff" font-size="26">封じ込め</text><text x="720" y="355" fill="#ffb84d" font-size="13">03 RECORD</text><text x="720" y="415" fill="#fff" font-size="26">記録</text><text x="995" y="355" fill="#55e6cf" font-size="13">04 INFORM</text><text x="995" y="415" fill="#fff" font-size="26">案内</text><text x="1270" y="355" fill="#d998e8" font-size="13">05 RECOVER</text><text x="1270" y="415" fill="#fff" font-size="26">復旧</text></g></g><rect x="310" y="610" width="820" height="60" rx="14" fill="#102a3e" stroke="#25455e"/><text x="720" y="648" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">通常参加者の入口と、判断できる記録を守る</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">未成年が参加するゲームコミュニティの安全設計</title><desc id="d">公開交流から相談、初動、外部連携までをつなぐ全体像</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">SAFETY BY DESIGN</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="42" font-weight="700">注意喚起だけでなく、接触経路を設計する</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">危険を減らし、違和感を相談でき、迷わず外部へつなぐ</text>
<g font-family="sans-serif" text-anchor="middle"><g transform="translate(80 290)"><rect width="275" height="225" rx="22" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><circle cx="137" cy="62" r="31" fill="#153f49"/><path d="M121 62h32M137 46v32" stroke="#61dbc5" stroke-width="6" stroke-linecap="round"/><text x="137" y="125" fill="#f4f7fb" font-size="27" font-weight="700">公開交流</text><text x="137" y="166" fill="#9db0c3" font-size="18">募集と集合を</text><text x="137" y="195" fill="#9db0c3" font-size="18">複数人が見える場所へ</text></g><g transform="translate(415 290)"><rect width="275" height="225" rx="22" fill="#10253a" stroke="#7da8ef" stroke-width="3"/><circle cx="137" cy="62" r="31" fill="#24395e"/><text x="137" y="71" fill="#7da8ef" font-size="28" font-weight="700">?</text><text x="137" y="125" fill="#f4f7fb" font-size="27" font-weight="700">相談</text><text x="137" y="166" fill="#9db0c3" font-size="18">違和感の段階で</text><text x="137" y="195" fill="#9db0c3" font-size="18">短く送れる入口</text></g><g transform="translate(750 290)"><rect width="275" height="225" rx="22" fill="#10253a" stroke="#f0bd63" stroke-width="3"/><circle cx="137" cy="62" r="31" fill="#4a3822"/><text x="137" y="71" fill="#f0bd63" font-size="27" font-weight="700">!</text><text x="137" y="125" fill="#f4f7fb" font-size="27" font-weight="700">初動</text><text x="137" y="166" fill="#9db0c3" font-size="18">安全確認と</text><text x="137" y="195" fill="#9db0c3" font-size="18">接触停止を優先</text></g><g transform="translate(1085 290)"><rect width="275" height="225" rx="22" fill="#10253a" stroke="#c991db" stroke-width="3"/><circle cx="137" cy="62" r="31" fill="#42304f"/><path d="M118 69h38M137 45v48" stroke="#c991db" stroke-width="6" stroke-linecap="round"/><text x="137" y="125" fill="#f4f7fb" font-size="27" font-weight="700">外部連携</text><text x="137" y="166" fill="#9db0c3" font-size="18">公的窓口と</text><text x="137" y="195" fill="#9db0c3" font-size="18">専門家へつなぐ</text></g></g><g stroke="#7890a8" stroke-width="4"><path d="M355 402h48M690 402h48M1025 402h48"/></g><g fill="#7890a8"><path d="m403 402-15-9v18z"/><path d="m738 402-15-9v18z"/><path d="m1073 402-15-9v18z"/></g><rect x="210" y="620" width="1020" height="91" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="658" text-anchor="middle" fill="#f4f7fb" font-family="sans-serif" font-size="23" font-weight="700">運営者の役割は、捜査ではなく安全確保と接続</text><text x="720" y="691" text-anchor="middle" fill="#79dfac" font-family="sans-serif" font-size="19">本人の安全を、記録や処分より先に置く</text></svg>

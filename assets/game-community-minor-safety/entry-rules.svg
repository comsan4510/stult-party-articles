<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">参加時に示す短い安全ルール</title><desc id="d">参加者が見分けられる行動として示す5項目</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">ENTRY RULES</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">入口では、判断できる5項目だけ見せる</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">「不適切」ではなく、見た行動をそのまま相談できる言葉にする</text>
<g font-family="sans-serif"><rect x="110" y="230" width="820" height="500" rx="28" fill="#10253a" stroke="#29465f" stroke-width="3"/><text x="165" y="290" fill="#f4f7fb" font-size="26" font-weight="700">安全に参加するための5項目</text><g font-size="21"><rect x="155" y="325" width="730" height="62" rx="12" fill="#153f49"/><text x="180" y="365" fill="#d0f1eb">1　学校・住所・顔写真を公開しない</text><rect x="155" y="401" width="730" height="62" rx="12" fill="#182e49"/><text x="180" y="441" fill="#d4e2f5">2　外部SNSや個別連絡へ誘わない</text><rect x="155" y="477" width="730" height="62" rx="12" fill="#3b3020"/><text x="180" y="517" fill="#f5ddb0">3　ボイス・聞き専・テキストを選べる</text><rect x="155" y="553" width="730" height="62" rx="12" fill="#352943"/><text x="180" y="593" fill="#ead6f0">4　金品と引き換えに要求しない</text><rect x="155" y="629" width="730" height="62" rx="12" fill="#204235"/><text x="180" y="669" fill="#d2f2e2">5　秘密や面会の誘いは運営へ相談する</text></g>
<g transform="translate(1010 270)"><rect width="320" height="350" rx="24" fill="#0e2134" stroke="#61dbc5" stroke-width="3"/><text x="34" y="58" fill="#61dbc5" font-size="18" font-weight="700">DO NOT REQUIRE</text><text x="34" y="110" fill="#f4f7fb" font-size="25" font-weight="700">公開自己紹介に</text><text x="34" y="149" fill="#f4f7fb" font-size="25" font-weight="700">求めない情報</text><text x="34" y="210" fill="#c4d0dc" font-size="20">× 生年月日</text><text x="34" y="252" fill="#c4d0dc" font-size="20">× 学校・学年</text><text x="34" y="294" fill="#c4d0dc" font-size="20">× 住んでいる地域</text></g></g></svg>

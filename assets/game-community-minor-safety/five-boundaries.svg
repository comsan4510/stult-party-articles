<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">未成年の安全を守る5つの境界</title><desc id="d">個人情報、個別連絡、ボイス、金品、面会の境界</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">FIVE BOUNDARIES</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">全参加者に共通する5つの安全境界</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">年齢の公開ではなく、危険につながる行動を制限する</text><g font-family="sans-serif" text-anchor="middle">
<g transform="translate(55 276)"><rect width="250" height="272" rx="22" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="125" y="62" fill="#61dbc5" font-size="19" font-weight="700">01</text><text x="125" y="111" fill="#f4f7fb" font-size="26" font-weight="700">個人情報</text><text x="125" y="158" fill="#9db0c3" font-size="18">学校・住所・顔写真を</text><text x="125" y="190" fill="#9db0c3" font-size="18">公開しない</text><path d="M91 226h68" stroke="#61dbc5" stroke-width="5"/><path d="m145 211 18 15-18 15" fill="none" stroke="#61dbc5" stroke-width="5"/></g>
<g transform="translate(325 276)"><rect width="250" height="272" rx="22" fill="#10253a" stroke="#7da8ef" stroke-width="3"/><text x="125" y="62" fill="#7da8ef" font-size="19" font-weight="700">02</text><text x="125" y="111" fill="#f4f7fb" font-size="26" font-weight="700">個別連絡</text><text x="125" y="158" fill="#9db0c3" font-size="18">外部SNSへ</text><text x="125" y="190" fill="#9db0c3" font-size="18">繰り返し誘わない</text><circle cx="125" cy="226" r="25" fill="none" stroke="#7da8ef" stroke-width="5"/><path d="M108 226h34" stroke="#7da8ef" stroke-width="5"/></g>
<g transform="translate(595 276)"><rect width="250" height="272" rx="22" fill="#10253a" stroke="#f0bd63" stroke-width="3"/><text x="125" y="62" fill="#f0bd63" font-size="19" font-weight="700">03</text><text x="125" y="111" fill="#f4f7fb" font-size="26" font-weight="700">ボイス</text><text x="125" y="158" fill="#9db0c3" font-size="18">参加・聞き専・テキストを</text><text x="125" y="190" fill="#9db0c3" font-size="18">自分で選べる</text><path d="M105 211v30c0 22 40 22 40 0v-30M96 237c0 36 58 36 58 0M125 271v-12" fill="none" stroke="#f0bd63" stroke-width="5"/></g>
<g transform="translate(865 276)"><rect width="250" height="272" rx="22" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="125" y="62" fill="#c991db" font-size="19" font-weight="700">04</text><text x="125" y="111" fill="#f4f7fb" font-size="26" font-weight="700">金品・アイテム</text><text x="125" y="158" fill="#9db0c3" font-size="18">見返りとして要求を</text><text x="125" y="190" fill="#9db0c3" font-size="18">組み合わせない</text><rect x="98" y="207" width="54" height="42" rx="7" fill="none" stroke="#c991db" stroke-width="5"/><path d="M125 207v42M98 226h54" stroke="#c991db" stroke-width="4"/></g>
<g transform="translate(1135 276)"><rect width="250" height="272" rx="22" fill="#10253a" stroke="#79dfac" stroke-width="3"/><text x="125" y="62" fill="#79dfac" font-size="19" font-weight="700">05</text><text x="125" y="111" fill="#f4f7fb" font-size="26" font-weight="700">面会</text><text x="125" y="158" fill="#9db0c3" font-size="18">秘密・二人きりの誘いを</text><text x="125" y="190" fill="#9db0c3" font-size="18">即時相談する</text><path d="M105 248v-24c0-22 40-22 40 0v24M115 205v-11a10 10 0 0 1 20 0v11" fill="none" stroke="#79dfac" stroke-width="5"/></g></g><rect x="320" y="646" width="800" height="66" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="688" text-anchor="middle" fill="#f4f7fb" font-family="sans-serif" font-size="22" font-weight="700">迷ったら、公開範囲を狭めず接触を公開側へ戻す</text></svg>

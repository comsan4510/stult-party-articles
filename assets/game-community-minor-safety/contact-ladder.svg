<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">公開交流から高リスク接触へ進む段階</title><desc id="d">公開交流、閉鎖化、秘密化、対価化、現実接触の段階</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">CONTACT LADDER</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">話題より、接触が閉じていく流れを見る</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">秘密・対価・現実接触が重なるほど優先度を上げる</text>
<g font-family="sans-serif"><g transform="translate(90 580)"><rect width="240" height="112" rx="18" fill="#153f49" stroke="#61dbc5" stroke-width="3"/><text x="25" y="42" fill="#61dbc5" font-size="17">LEVEL 1</text><text x="25" y="82" fill="#f4f7fb" font-size="25" font-weight="700">公開交流</text></g><g transform="translate(345 480)"><rect width="240" height="212" rx="18" fill="#182e49" stroke="#7da8ef" stroke-width="3"/><text x="25" y="42" fill="#7da8ef" font-size="17">LEVEL 2</text><text x="25" y="82" fill="#f4f7fb" font-size="25" font-weight="700">閉鎖化</text><text x="25" y="125" fill="#c4d0dc" font-size="18">外部SNSや</text><text x="25" y="155" fill="#c4d0dc" font-size="18">個別連絡へ誘う</text></g><g transform="translate(600 380)"><rect width="240" height="312" rx="18" fill="#302c43" stroke="#c991db" stroke-width="3"/><text x="25" y="42" fill="#c991db" font-size="17">LEVEL 3</text><text x="25" y="82" fill="#f4f7fb" font-size="25" font-weight="700">秘密化</text><text x="25" y="125" fill="#c4d0dc" font-size="18">「誰にも言わないで」</text><text x="25" y="155" fill="#c4d0dc" font-size="18">と求める</text></g><g transform="translate(855 280)"><rect width="240" height="412" rx="18" fill="#3b3020" stroke="#f0bd63" stroke-width="3"/><text x="25" y="42" fill="#f0bd63" font-size="17">LEVEL 4</text><text x="25" y="82" fill="#f4f7fb" font-size="25" font-weight="700">対価化</text><text x="25" y="125" fill="#c4d0dc" font-size="18">金品・アイテムと</text><text x="25" y="155" fill="#c4d0dc" font-size="18">要求を交換する</text></g><g transform="translate(1110 220)"><rect width="240" height="472" rx="18" fill="#412531" stroke="#f07e9c" stroke-width="3"/><text x="25" y="42" fill="#f07e9c" font-size="17">LEVEL 5</text><text x="25" y="82" fill="#f4f7fb" font-size="25" font-weight="700">現実接触</text><text x="25" y="125" fill="#c4d0dc" font-size="18">写真・住所・面会を</text><text x="25" y="155" fill="#c4d0dc" font-size="18">求める</text><text x="120" y="425" text-anchor="middle" fill="#f7bdcc" font-size="19" font-weight="700">即時に安全確認</text></g></g><path d="M210 548 465 448 720 348 975 248 1230 188" fill="none" stroke="#7890a8" stroke-width="4" stroke-dasharray="8 10"/><path d="m1230 188-19 1 8 17z" fill="#7890a8"/></svg>

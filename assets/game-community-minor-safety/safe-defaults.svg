<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">募集・チャット・ボイスの安全な初期状態</title><desc id="d">ゲーム募集、チャット、ボイスで最初から設定する安全運用</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">SAFE DEFAULTS</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">活動場所ごとに、安全な初期状態を作る</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">公開・選択・複数人の三原則で、閉じた接触を減らす</text><g font-family="sans-serif">
<g transform="translate(80 250)"><rect width="400" height="400" rx="25" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="35" y="58" fill="#61dbc5" font-size="18" font-weight="700">GAME RECRUITMENT</text><text x="35" y="107" fill="#f4f7fb" font-size="31" font-weight="700">ゲーム募集</text><text x="35" y="170" fill="#c4d0dc" font-size="20">✓ 集合を公開募集へ書く</text><text x="35" y="220" fill="#c4d0dc" font-size="20">✓ 主催者以外も参加を把握</text><text x="35" y="270" fill="#c4d0dc" font-size="20">✓ 終了目安を先に表示</text><text x="35" y="320" fill="#c4d0dc" font-size="20">× 年齢・性別を条件にしない</text></g><g transform="translate(520 250)"><rect width="400" height="400" rx="25" fill="#10253a" stroke="#7da8ef" stroke-width="3"/><text x="35" y="58" fill="#7da8ef" font-size="18" font-weight="700">CHAT</text><text x="35" y="107" fill="#f4f7fb" font-size="31" font-weight="700">チャット</text><text x="35" y="170" fill="#c4d0dc" font-size="20">✓ 日程変更は公開場所で</text><text x="35" y="220" fill="#c4d0dc" font-size="20">✓ 個人情報を再投稿しない</text><text x="35" y="270" fill="#c4d0dc" font-size="20">✓ 相談窓口を常に表示</text><text x="35" y="320" fill="#c4d0dc" font-size="20">× 外部連絡を迫らない</text></g><g transform="translate(960 250)"><rect width="400" height="400" rx="25" fill="#10253a" stroke="#f0bd63" stroke-width="3"/><text x="35" y="58" fill="#f0bd63" font-size="18" font-weight="700">VOICE</text><text x="35" y="107" fill="#f4f7fb" font-size="31" font-weight="700">ボイス</text><text x="35" y="170" fill="#c4d0dc" font-size="20">✓ 参加方法を選べる</text><text x="35" y="220" fill="#c4d0dc" font-size="20">✓ 初参加者を一人にしない</text><text x="35" y="270" fill="#c4d0dc" font-size="20">✓ 録音・配信を事前告知</text><text x="35" y="320" fill="#c4d0dc" font-size="20">× 退出を不利益にしない</text></g></g><rect x="365" y="703" width="710" height="55" rx="27" fill="#153f49"/><text x="720" y="739" text-anchor="middle" fill="#61dbc5" font-family="sans-serif" font-size="21" font-weight="700">安全は参加後の注意ではなく、参加前の初期値で作る</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">安全案件を管理する状態と最小データ</title><desc id="d">受付、判定、接触停止、外部連携、終了の状態遷移</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">CASE MODEL</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">案件の状態と、証拠への参照を分ける</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">個人情報を複製せず、担当と次の行動を追跡する</text><g font-family="sans-serif" text-anchor="middle">
<g transform="translate(45 270)"><rect width="230" height="120" rx="20" fill="#10253a" stroke="#7890a8" stroke-width="3"/><text x="115" y="48" fill="#9db0c3" font-size="17">received</text><text x="115" y="86" fill="#f4f7fb" font-size="25" font-weight="700">受付</text></g><g transform="translate(325 270)"><rect width="230" height="120" rx="20" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="115" y="48" fill="#61dbc5" font-size="17">triaged</text><text x="115" y="86" fill="#f4f7fb" font-size="25" font-weight="700">緊急度判定</text></g><g transform="translate(605 270)"><rect width="230" height="120" rx="20" fill="#10253a" stroke="#7da8ef" stroke-width="3"/><text x="115" y="48" fill="#7da8ef" font-size="17">contained</text><text x="115" y="86" fill="#f4f7fb" font-size="25" font-weight="700">接触停止</text></g><g transform="translate(885 270)"><rect width="230" height="120" rx="20" fill="#10253a" stroke="#f0bd63" stroke-width="3"/><text x="115" y="48" fill="#f0bd63" font-size="17">referred</text><text x="115" y="86" fill="#f4f7fb" font-size="25" font-weight="700">外部連携</text></g><g transform="translate(1165 270)"><rect width="230" height="120" rx="20" fill="#10253a" stroke="#79dfac" stroke-width="3"/><text x="115" y="48" fill="#79dfac" font-size="17">closed</text><text x="115" y="86" fill="#f4f7fb" font-size="25" font-weight="700">終了確認</text></g></g><g stroke="#7890a8" stroke-width="4"><path d="M275 330h38M555 330h38M835 330h38M1115 330h38"/></g><g fill="#7890a8"><path d="m313 330-15-9v18z"/><path d="m593 330-15-9v18z"/><path d="m873 330-15-9v18z"/><path d="m1153 330-15-9v18z"/></g>
<g font-family="sans-serif"><rect x="130" y="500" width="1180" height="190" rx="24" fill="#0e2134" stroke="#29465f"/><text x="175" y="550" fill="#61dbc5" font-size="19" font-weight="700">MINIMUM DATA</text><text x="175" y="596" fill="#f4f7fb" font-size="21">case_id　 reported_at　 reporter_ref　 subject_ref　 surface</text><text x="175" y="637" fill="#f4f7fb" font-size="21">risk_signals　 immediate_risk　 evidence_refs　 owner　 review_at</text><text x="175" y="675" fill="#9db0c3" font-size="18">原文や画像そのものではなく、保管場所への参照を持つ</text></g><rect x="405" y="735" width="630" height="48" rx="24" fill="#153f49"/><text x="720" y="767" text-anchor="middle" fill="#61dbc5" font-family="sans-serif" font-size="19" font-weight="700">処分ではなく、安全確認と引き継ぎ完了で閉じる</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">通報受付から外部連携までの初動フロー</title><desc id="d">安全確認、接触停止、事実保全、引き継ぎの順序</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">RESPONSE FLOW</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">通報後は、本人の安全から確認する</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">詳しい事情聴取より、接触の継続と緊急性を先に判定</text><g font-family="sans-serif" text-anchor="middle">
<g transform="translate(75 300)"><rect width="285" height="220" rx="22" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="142" y="55" fill="#61dbc5" font-size="18">STEP 1</text><text x="142" y="109" fill="#f4f7fb" font-size="28" font-weight="700">安全確認</text><text x="142" y="156" fill="#9db0c3" font-size="18">いま安全か</text><text x="142" y="186" fill="#9db0c3" font-size="18">接触が続いているか</text></g><g transform="translate(410 300)"><rect width="285" height="220" rx="22" fill="#10253a" stroke="#7da8ef" stroke-width="3"/><text x="142" y="55" fill="#7da8ef" font-size="18">STEP 2</text><text x="142" y="109" fill="#f4f7fb" font-size="28" font-weight="700">接触停止</text><text x="142" y="156" fill="#9db0c3" font-size="18">返信・面会・参加を</text><text x="142" y="186" fill="#9db0c3" font-size="18">必要に応じて止める</text></g><g transform="translate(745 300)"><rect width="285" height="220" rx="22" fill="#10253a" stroke="#f0bd63" stroke-width="3"/><text x="142" y="55" fill="#f0bd63" font-size="18">STEP 3</text><text x="142" y="109" fill="#f4f7fb" font-size="28" font-weight="700">事実保全</text><text x="142" y="156" fill="#9db0c3" font-size="18">時刻・場所・原文を</text><text x="142" y="186" fill="#9db0c3" font-size="18">最小限記録する</text></g><g transform="translate(1080 300)"><rect width="285" height="220" rx="22" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="142" y="55" fill="#c991db" font-size="18">STEP 4</text><text x="142" y="109" fill="#f4f7fb" font-size="28" font-weight="700">引き継ぎ</text><text x="142" y="156" fill="#9db0c3" font-size="18">責任者と外部窓口へ</text><text x="142" y="186" fill="#9db0c3" font-size="18">緊急度に応じて渡す</text></g></g><g stroke="#7890a8" stroke-width="4"><path d="M360 410h38M695 410h38M1030 410h38"/></g><g fill="#7890a8"><path d="m398 410-15-9v18z"/><path d="m733 410-15-9v18z"/><path d="m1068 410-15-9v18z"/></g><rect x="260" y="627" width="920" height="85" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="661" text-anchor="middle" fill="#f4f7fb" font-family="sans-serif" font-size="22" font-weight="700">通報者と対象者を同じ場で対話させない</text><text x="720" y="692" text-anchor="middle" fill="#f07e9c" font-family="sans-serif" font-size="18">証拠を増やすために危険な会話を続けさせない</text></svg>

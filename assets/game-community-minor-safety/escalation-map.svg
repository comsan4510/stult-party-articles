<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">緊急度から外部相談先を選ぶ判断表</title><desc id="d">緊急通報、警察相談、児童相談所、人権相談、相談窓口一覧への接続</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">ESCALATION MAP</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">運営内で止めず、危険度で外部へつなぐ</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">日本国内向けの一般的な相談先。個別判断は専門機関へ</text><g font-family="sans-serif">
<g transform="translate(90 230)"><rect width="1260" height="88" rx="18" fill="#412531" stroke="#f07e9c" stroke-width="3"/><text x="35" y="38" fill="#f07e9c" font-size="17" font-weight="700">IMMEDIATE</text><text x="35" y="68" fill="#f4f7fb" font-size="22" font-weight="700">いま事件・事故の危険がある</text><text x="1215" y="57" text-anchor="end" fill="#f7bdcc" font-size="27" font-weight="700">110番など緊急通報</text></g>
<g transform="translate(90 336)"><rect width="1260" height="88" rx="18" fill="#3b3020" stroke="#f0bd63" stroke-width="3"/><text x="35" y="38" fill="#f0bd63" font-size="17" font-weight="700">SAFETY CONCERN</text><text x="35" y="68" fill="#f4f7fb" font-size="22" font-weight="700">緊急ではないが犯罪・安全上の不安</text><text x="1215" y="57" text-anchor="end" fill="#f5ddb0" font-size="27" font-weight="700">最寄りの警察署 / #9110</text></g>
<g transform="translate(90 442)"><rect width="1260" height="88" rx="18" fill="#352943" stroke="#c991db" stroke-width="3"/><text x="35" y="38" fill="#c991db" font-size="17" font-weight="700">CHILD WELFARE</text><text x="35" y="68" fill="#f4f7fb" font-size="22" font-weight="700">虐待の可能性がある</text><text x="1215" y="57" text-anchor="end" fill="#ead6f0" font-size="27" font-weight="700">児童相談所 189</text></g>
<g transform="translate(90 548)"><rect width="1260" height="88" rx="18" fill="#182e49" stroke="#7da8ef" stroke-width="3"/><text x="35" y="38" fill="#7da8ef" font-size="17" font-weight="700">HUMAN RIGHTS</text><text x="35" y="68" fill="#f4f7fb" font-size="22" font-weight="700">いじめ・誹謗中傷・人権侵害</text><text x="1215" y="57" text-anchor="end" fill="#d4e2f5" font-size="27" font-weight="700">法務省の人権相談</text></g>
<g transform="translate(90 654)"><rect width="1260" height="88" rx="18" fill="#153f49" stroke="#61dbc5" stroke-width="3"/><text x="35" y="38" fill="#61dbc5" font-size="17" font-weight="700">FIND SUPPORT</text><text x="35" y="68" fill="#f4f7fb" font-size="22" font-weight="700">本人・保護者が相談先を探している</text><text x="1215" y="57" text-anchor="end" fill="#d0f1eb" font-size="27" font-weight="700">こども家庭庁の相談窓口一覧</text></g></g></svg>

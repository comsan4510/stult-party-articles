<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">匿名・記名を選ぶ判断表</title><desc id="d">個別連絡の必要性から匿名か記名かを選択</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">IDENTITY CHOICE</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">匿名・記名は、回答後の行動で選ぶ</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">率直さの印象だけで決めない</text><g font-family="sans-serif"><rect x="120" y="245" width="550" height="400" rx="28" fill="#102d40" stroke="#45e0c5" stroke-width="3"/><text x="395" y="315" fill="#45e0c5" font-size="26" text-anchor="middle" font-weight="700">匿名</text><text x="180" y="385" fill="#fff" font-size="20">・個別返信が不要</text><text x="180" y="435" fill="#fff" font-size="20">・集計だけで改善可能</text><text x="180" y="485" fill="#fff" font-size="20">・運営への不満を確認</text><text x="180" y="555" fill="#a9bed0" font-size="18">個人と意見を結びつけない</text><rect x="770" y="245" width="550" height="400" rx="28" fill="#102d40" stroke="#ffbd69" stroke-width="3"/><text x="1045" y="315" fill="#ffbd69" font-size="26" text-anchor="middle" font-weight="700">記名・連絡先</text><text x="830" y="385" fill="#fff" font-size="20">・追加確認が必要</text><text x="830" y="435" fill="#fff" font-size="20">・抽選や謝礼の連絡</text><text x="830" y="485" fill="#fff" font-size="20">・重複回答を制御</text><text x="830" y="555" fill="#a9bed0" font-size="18">利用目的を取得前に明示</text></g><text x="720" y="720" fill="#fff" font-family="sans-serif" font-size="21" text-anchor="middle">連絡先だけ別フォームに分ける選択肢もある</text></svg>

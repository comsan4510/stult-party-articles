<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">ゲームコミュニティアンケートの全体像</title><desc id="d">決める、聞く、分類、改善、共有のサイクル</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607f94"/></marker></defs><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">SURVEY TO ACTION</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">回答を集めず、改善を一つ決める</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">質問から結果共有までを一つの運営サイクルに</text><g stroke="#607f94" stroke-width="4" marker-end="url(#a)"><line x1="300" y1="410" x2="370" y2="410"/><line x1="560" y1="410" x2="630" y2="410"/><line x1="820" y1="410" x2="890" y2="410"/><line x1="1080" y1="410" x2="1150" y2="410"/></g><g font-family="sans-serif"><g fill="#102d40" stroke-width="3"><rect x="80" y="330" width="220" height="160" rx="22" stroke="#45e0c5"/><rect x="370" y="330" width="190" height="160" rx="22" stroke="#6ca8ff"/><rect x="630" y="330" width="190" height="160" rx="22" stroke="#ffbd69"/><rect x="890" y="330" width="190" height="160" rx="22" stroke="#f17a8e"/><rect x="1150" y="330" width="210" height="160" rx="22" stroke="#7fdb8a"/></g><g text-anchor="middle" font-weight="700"><text x="190" y="395" fill="#45e0c5" font-size="21">決める</text><text x="190" y="438" fill="#fff" font-size="18">判断を一つ</text><text x="465" y="395" fill="#6ca8ff" font-size="21">聞く</text><text x="465" y="438" fill="#fff" font-size="18">5問だけ</text><text x="725" y="395" fill="#ffbd69" font-size="21">分類</text><text x="725" y="438" fill="#fff" font-size="18">参加段階別</text><text x="985" y="395" fill="#f17a8e" font-size="21">改善</text><text x="985" y="438" fill="#fff" font-size="18">一つ試す</text><text x="1255" y="395" fill="#7fdb8a" font-size="21">返す</text><text x="1255" y="438" fill="#fff" font-size="18">結果を共有</text></g></g><rect x="330" y="620" width="780" height="76" rx="18" fill="#0d2b3d"/><text x="720" y="668" fill="#fff" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="700">アンケートの成果物＝実施した改善</text></svg>

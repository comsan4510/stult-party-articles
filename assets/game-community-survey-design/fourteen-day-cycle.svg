<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">14日で回すアンケート改善サイクル</title><desc id="d">設計、配布、分類、変更共有の14日計画</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">14-DAY CYCLE</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">14日以内に、一つ変えて結果を返す</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">回答を集めたままにしない</text><g font-family="sans-serif"><rect x="90" y="265" width="300" height="330" rx="22" fill="#102d40" stroke="#45e0c5" stroke-width="3"/><text x="130" y="325" fill="#45e0c5" font-size="21" font-weight="700">DAY 1–2</text><text x="130" y="375" fill="#fff" font-size="24" font-weight="700">設計</text><text x="130" y="430" fill="#dbe7ef" font-size="18">判断を一つ決める</text><text x="130" y="470" fill="#dbe7ef" font-size="18">5問をテスト</text><rect x="410" y="265" width="300" height="330" rx="22" fill="#102d40" stroke="#6ca8ff" stroke-width="3"/><text x="450" y="325" fill="#6ca8ff" font-size="21" font-weight="700">DAY 3–7</text><text x="450" y="375" fill="#fff" font-size="24" font-weight="700">配布</text><text x="450" y="430" fill="#dbe7ef" font-size="18">対象者へ案内</text><text x="450" y="470" fill="#dbe7ef" font-size="18">締切・目的を表示</text><rect x="730" y="265" width="300" height="330" rx="22" fill="#102d40" stroke="#ffbd69" stroke-width="3"/><text x="770" y="325" fill="#ffbd69" font-size="21" font-weight="700">DAY 8–10</text><text x="770" y="375" fill="#fff" font-size="24" font-weight="700">分類</text><text x="770" y="430" fill="#dbe7ef" font-size="18">参加段階別に集計</text><text x="770" y="470" fill="#dbe7ef" font-size="18">改善を一つ選ぶ</text><rect x="1050" y="265" width="300" height="330" rx="22" fill="#102d40" stroke="#f17a8e" stroke-width="3"/><text x="1090" y="325" fill="#f17a8e" font-size="21" font-weight="700">DAY 11–14</text><text x="1090" y="375" fill="#fff" font-size="24" font-weight="700">変更・共有</text><text x="1090" y="430" fill="#dbe7ef" font-size="18">試行を開始</text><text x="1090" y="470" fill="#dbe7ef" font-size="18">判断理由を返す</text></g><line x1="120" y1="675" x2="1320" y2="675" stroke="#34566c" stroke-width="5"/><circle cx="120" cy="675" r="10" fill="#45e0c5"/><circle cx="1320" cy="675" r="10" fill="#f17a8e"/><text x="720" y="725" fill="#fff" font-family="sans-serif" font-size="21" text-anchor="middle">次回確認日まで公開する</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">改善優先度の4条件</title><desc id="d">影響、対象範囲、実行容易性、検証可能性で評価</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">PRIORITY MATRIX</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">票数だけで改善を決めない</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">4条件を0〜2点で確認する</text><g font-family="sans-serif"><rect x="110" y="250" width="560" height="150" rx="22" fill="#102d40" stroke="#f17a8e" stroke-width="3"/><text x="160" y="310" fill="#f17a8e" font-size="22" font-weight="700">影響</text><text x="160" y="355" fill="#fff" font-size="19">好み → 不便 → 参加不能</text><rect x="770" y="250" width="560" height="150" rx="22" fill="#102d40" stroke="#45e0c5" stroke-width="3"/><text x="820" y="310" fill="#45e0c5" font-size="22" font-weight="700">対象範囲</text><text x="820" y="355" fill="#fff" font-size="19">少数 → 特定区分 → 複数区分</text><rect x="110" y="455" width="560" height="150" rx="22" fill="#102d40" stroke="#ffbd69" stroke-width="3"/><text x="160" y="515" fill="#ffbd69" font-size="22" font-weight="700">実行容易性</text><text x="160" y="560" fill="#fff" font-size="19">困難 → 準備必要 → すぐ試せる</text><rect x="770" y="455" width="560" height="150" rx="22" fill="#102d40" stroke="#6ca8ff" stroke-width="3"/><text x="820" y="515" fill="#6ca8ff" font-size="22" font-weight="700">検証可能性</text><text x="820" y="560" fill="#fff" font-size="19">測れない → 定性 → 数字で比較</text></g><rect x="360" y="675" width="720" height="54" rx="15" fill="#0d2b3d"/><text x="720" y="710" fill="#fff" font-family="sans-serif" font-size="19" text-anchor="middle">安全課題は票数が少なくても優先</text></svg>

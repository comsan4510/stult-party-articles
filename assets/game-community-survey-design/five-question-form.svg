<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">5問アンケートの構成</title><desc id="d">対象、障壁、改善案、再参加、自由記述の順序</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">FIVE QUESTIONS</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">最初は5問で、答えやすい順に聞く</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">自由記述は最後に一問だけ</text><g font-family="sans-serif"><g fill="#102d40" stroke-width="3"><rect x="80" y="275" width="240" height="280" rx="22" stroke="#45e0c5"/><rect x="340" y="275" width="240" height="280" rx="22" stroke="#6ca8ff"/><rect x="600" y="275" width="240" height="280" rx="22" stroke="#ffbd69"/><rect x="860" y="275" width="240" height="280" rx="22" stroke="#f17a8e"/><rect x="1120" y="275" width="240" height="280" rx="22" stroke="#7fdb8a"/></g><g text-anchor="middle" font-weight="700"><text x="200" y="340" fill="#45e0c5" font-size="21">1 対象</text><text x="200" y="395" fill="#fff" font-size="18">どこまで体験？</text><text x="460" y="340" fill="#6ca8ff" font-size="21">2 障壁</text><text x="460" y="395" fill="#fff" font-size="18">最も困った段階</text><text x="720" y="340" fill="#ffbd69" font-size="21">3 改善案</text><text x="720" y="395" fill="#fff" font-size="18">一つ選ぶなら</text><text x="980" y="340" fill="#f17a8e" font-size="21">4 再参加</text><text x="980" y="395" fill="#fff" font-size="18">30日以内の見込み</text><text x="1240" y="340" fill="#7fdb8a" font-size="21">5 自由記述</text><text x="1240" y="395" fill="#fff" font-size="18">変えるなら一つ</text></g></g><rect x="340" y="640" width="760" height="68" rx="18" fill="#0d2b3d"/><text x="720" y="682" fill="#fff" font-family="sans-serif" font-size="21" text-anchor="middle">回答後に使わない質問は削除</text></svg>

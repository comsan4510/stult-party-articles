<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">アンケート目的を運営判断へ変える</title><desc id="d">曖昧な知りたいことを変更可能な判断へ変換</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607f94"/></marker></defs><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">DECISION FIRST</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">質問より先に、回答後の判断を書く</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">知りたいことを、変更可能な運営判断へ</text><g font-family="sans-serif"><rect x="100" y="270" width="480" height="330" rx="28" fill="#102d40" stroke="#f17a8e" stroke-width="3"/><text x="340" y="335" fill="#f17a8e" font-size="23" text-anchor="middle" font-weight="700">曖昧な目的</text><text x="160" y="410" fill="#fff" font-size="21">満足度を知りたい</text><text x="160" y="465" fill="#fff" font-size="21">参加者の意見を知りたい</text><text x="160" y="520" fill="#fff" font-size="21">活性化したい</text><line x1="600" y1="435" x2="820" y2="435" stroke="#607f94" stroke-width="5" marker-end="url(#a)"/><rect x="840" y="270" width="500" height="330" rx="28" fill="#102d40" stroke="#45e0c5" stroke-width="3"/><text x="1090" y="335" fill="#45e0c5" font-size="23" text-anchor="middle" font-weight="700">判断できる目的</text><text x="900" y="410" fill="#fff" font-size="20">最初に直す案内を決める</text><text x="900" y="465" fill="#fff" font-size="20">募集時間を2候補から選ぶ</text><text x="900" y="520" fill="#fff" font-size="20">再参加の障壁を一つ減らす</text></g><text x="720" y="700" fill="#fff" font-family="sans-serif" font-size="21" text-anchor="middle">一回のアンケートで決めることは一つ</text></svg>

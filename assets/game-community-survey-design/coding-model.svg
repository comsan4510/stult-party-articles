<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">自由記述を改善対象へ分類するモデル</title><desc id="d">参加段階、接点、問題、影響、実行可能性による分類</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">CODING MODEL</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">感情ではなく、改善対象で分類する</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">自由記述を実行可能な変更案へ</text><g font-family="sans-serif"><g fill="#102d40" stroke="#34566c" stroke-width="2"><rect x="90" y="250" width="240" height="280" rx="22"/><rect x="345" y="250" width="240" height="280" rx="22"/><rect x="600" y="250" width="240" height="280" rx="22"/><rect x="855" y="250" width="240" height="280" rx="22"/><rect x="1110" y="250" width="240" height="280" rx="22"/></g><g text-anchor="middle" font-weight="700"><text x="210" y="315" fill="#45e0c5" font-size="21">参加段階</text><text x="465" y="315" fill="#6ca8ff" font-size="21">接点</text><text x="720" y="315" fill="#ffbd69" font-size="21">問題</text><text x="975" y="315" fill="#f17a8e" font-size="21">影響</text><text x="1230" y="315" fill="#7fdb8a" font-size="21">実行可能性</text></g><g fill="#dbe7ef" font-size="18" text-anchor="middle"><text x="210" y="380">初参加</text><text x="210" y="420">常連・休眠</text><text x="465" y="380">募集・参加</text><text x="465" y="420">チャット・ボイス</text><text x="720" y="380">情報・時間</text><text x="720" y="420">人数・安全</text><text x="975" y="380">参加不能</text><text x="975" y="420">遅延・不便</text><text x="1230" y="380">今すぐ</text><text x="1230" y="420">後で・対象外</text></g></g><rect x="350" y="625" width="740" height="72" rx="18" fill="#0d2b3d" stroke="#45e0c5"/><text x="720" y="670" fill="#fff" font-family="sans-serif" font-size="21" text-anchor="middle">分類 → 担当者 → 変更案 → 再確認日</text></svg>

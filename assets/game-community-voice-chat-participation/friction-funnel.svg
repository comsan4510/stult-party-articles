<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">ボイス参加を止める5つの不明点</title><desc id="d">人、話し方、時間、目的、失敗時の不明点</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">FRICTION MAP</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">入室直前の「分からない」を減らす</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">性格ではなく、足りない判断材料を見つける</text><g font-family="sans-serif"><g fill="#102d40" stroke="#34566c" stroke-width="2"><rect x="90" y="250" width="240" height="150" rx="20"/><rect x="345" y="250" width="240" height="150" rx="20"/><rect x="600" y="250" width="240" height="150" rx="20"/><rect x="855" y="250" width="240" height="150" rx="20"/><rect x="1110" y="250" width="240" height="150" rx="20"/></g><g text-anchor="middle" font-weight="700"><text x="210" y="310" fill="#45e0c5" font-size="22">人</text><text x="465" y="310" fill="#6ca8ff" font-size="22">話し方</text><text x="720" y="310" fill="#ffbd69" font-size="22">時間</text><text x="975" y="310" fill="#f17a8e" font-size="22">目的</text><text x="1230" y="310" fill="#ab8cff" font-size="22">失敗時</text></g><g fill="#dbe7ef" font-size="18" text-anchor="middle"><text x="210" y="355">誰が参加中？</text><text x="465" y="355">すぐ発話が必要？</text><text x="720" y="355">いつ退出できる？</text><text x="975" y="355">攻略？ 雑談？</text><text x="1230" y="355">音声不調なら？</text></g><path d="M150 465H1290L1120 635H320Z" fill="#0d2b3d" stroke="#45e0c5" stroke-width="3"/><text x="720" y="535" fill="#a9bed0" font-size="20" text-anchor="middle">募集文と事前チャットで解消</text><text x="720" y="585" fill="#fff" font-size="25" text-anchor="middle" font-weight="700">入室前に「自分で選べる」状態へ</text></g></svg>

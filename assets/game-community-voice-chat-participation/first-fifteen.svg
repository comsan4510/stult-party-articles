<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">初参加者を迎える最初の15分</title><desc id="d">状態確認、目的共有、小さな行動、任意発話の時間設計</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">FIRST 15 MINUTES</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">入室直後だけ、進行を台本化する</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">自己紹介の一周から始めない</text><g font-family="sans-serif"><rect x="90" y="270" width="250" height="320" rx="22" fill="#102d40" stroke="#45e0c5" stroke-width="3"/><text x="130" y="325" fill="#45e0c5" font-size="21" font-weight="700">0–2分</text><text x="130" y="375" fill="#fff" font-size="23" font-weight="700">状態確認</text><text x="130" y="425" fill="#dbe7ef" font-size="18">ミュートでOK</text><text x="130" y="462" fill="#dbe7ef" font-size="18">チャットで丸</text><rect x="370" y="270" width="300" height="320" rx="22" fill="#102d40" stroke="#6ca8ff" stroke-width="3"/><text x="410" y="325" fill="#6ca8ff" font-size="21" font-weight="700">2–5分</text><text x="410" y="375" fill="#fff" font-size="23" font-weight="700">目的共有</text><text x="410" y="425" fill="#dbe7ef" font-size="18">今日やること</text><text x="410" y="462" fill="#dbe7ef" font-size="18">終了時刻</text><rect x="700" y="270" width="300" height="320" rx="22" fill="#102d40" stroke="#ffbd69" stroke-width="3"/><text x="740" y="325" fill="#ffbd69" font-size="21" font-weight="700">5–10分</text><text x="740" y="375" fill="#fff" font-size="23" font-weight="700">小さな行動</text><text x="740" y="425" fill="#dbe7ef" font-size="18">集合・装備確認</text><text x="740" y="462" fill="#dbe7ef" font-size="18">発話なしでも完了</text><rect x="1030" y="270" width="320" height="320" rx="22" fill="#102d40" stroke="#f17a8e" stroke-width="3"/><text x="1070" y="325" fill="#f17a8e" font-size="21" font-weight="700">10–15分</text><text x="1070" y="375" fill="#fff" font-size="23" font-weight="700">任意の発話</text><text x="1070" y="425" fill="#dbe7ef" font-size="18">必要場面を予告</text><text x="1070" y="462" fill="#dbe7ef" font-size="18">代替手段も案内</text></g><line x1="120" y1="675" x2="1320" y2="675" stroke="#34566c" stroke-width="5"/><circle cx="120" cy="675" r="10" fill="#45e0c5"/><circle cx="1320" cy="675" r="10" fill="#f17a8e"/><text x="720" y="725" fill="#fff" font-family="sans-serif" font-size="21" text-anchor="middle">予測できる進行が、最初の負担を下げる</text></svg>

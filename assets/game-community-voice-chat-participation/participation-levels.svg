<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">聞き専から会話までの5段階</title><desc id="d">見学前、聞く、反応、必要時発話、会話の参加段階</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">PARTICIPATION LEVELS</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">「話す・話さない」を5段階に分ける</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">次へ進むかは本人が選ぶ</text><g font-family="sans-serif"><rect x="90" y="515" width="240" height="130" rx="18" fill="#102d40" stroke="#34566c" stroke-width="3"/><rect x="345" y="455" width="240" height="190" rx="18" fill="#102d40" stroke="#45e0c5" stroke-width="3"/><rect x="600" y="395" width="240" height="250" rx="18" fill="#102d40" stroke="#6ca8ff" stroke-width="3"/><rect x="855" y="335" width="240" height="310" rx="18" fill="#102d40" stroke="#ffbd69" stroke-width="3"/><rect x="1110" y="275" width="240" height="370" rx="18" fill="#102d40" stroke="#f17a8e" stroke-width="3"/><g text-anchor="middle" font-weight="700"><text x="210" y="565" fill="#a9bed0" font-size="20">0 見学前</text><text x="210" y="605" fill="#fff" font-size="18">条件を確認</text><text x="465" y="515" fill="#45e0c5" font-size="20">1 聞く</text><text x="465" y="555" fill="#fff" font-size="18">ミュート入室</text><text x="720" y="455" fill="#6ca8ff" font-size="20">2 反応</text><text x="720" y="495" fill="#fff" font-size="18">チャット併用</text><text x="975" y="395" fill="#ffbd69" font-size="20">3 必要時</text><text x="975" y="435" fill="#fff" font-size="18">短い確認だけ</text><text x="1230" y="335" fill="#f17a8e" font-size="20">4 会話</text><text x="1230" y="375" fill="#fff" font-size="18">雑談・相談</text></g></g><text x="720" y="725" fill="#fff" font-family="sans-serif" font-size="21" text-anchor="middle">段階が低い＝参加価値が低い、ではない</text></svg>

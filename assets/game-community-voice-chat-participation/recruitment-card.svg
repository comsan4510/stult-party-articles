<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">ボイス募集文の7項目</title><desc id="d">目的、日時、人数、ボイス、発話、途中退出、進行役</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">RECRUITMENT CARD</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">参加判断に必要な7項目を先に見せる</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">「VC必須」だけでは発話条件が分からない</text><rect x="250" y="225" width="940" height="500" rx="28" fill="#102d40" stroke="#34566c" stroke-width="3"/><g font-family="sans-serif"><text x="310" y="285" fill="#45e0c5" font-size="22" font-weight="700">初見ステージ協力募集</text><line x1="310" y1="315" x2="1130" y2="315" stroke="#34566c" stroke-width="2"/><g font-size="19"><text x="310" y="365" fill="#a9bed0">01 目的</text><text x="520" y="365" fill="#fff">初見ステージを一緒に進める</text><text x="310" y="415" fill="#a9bed0">02 日時</text><text x="520" y="415" fill="#fff">10月30日 21:00〜22:30</text><text x="310" y="465" fill="#a9bed0">03 人数</text><text x="520" y="465" fill="#fff">4人／初参加枠2人</text><text x="310" y="515" fill="#a9bed0">04 ボイス</text><text x="520" y="515" fill="#45e0c5">聞き専から開始可</text><text x="310" y="565" fill="#a9bed0">05 発話</text><text x="520" y="565" fill="#fff">挨拶不要・チャット併用可</text><text x="310" y="615" fill="#a9bed0">06 途中退出</text><text x="520" y="615" fill="#fff">参加・退出ともに可</text><text x="310" y="665" fill="#a9bed0">07 進行役</text><text x="520" y="665" fill="#fff">運営A／事前質問はチャットへ</text></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">ボイス進行役の6つのルール</title><desc id="d">沈黙、指名、重複、内輪、聞き専、退出に関するルール</desc><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">HOST PLAYBOOK</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">進行役が、参加者を目立たせない</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">会話量を増やすより、順番と選択肢を守る</text><g font-family="sans-serif"><g fill="#102d40" stroke="#34566c" stroke-width="2"><rect x="90" y="240" width="390" height="150" rx="20"/><rect x="525" y="240" width="390" height="150" rx="20"/><rect x="960" y="240" width="390" height="150" rx="20"/><rect x="90" y="440" width="390" height="150" rx="20"/><rect x="525" y="440" width="390" height="150" rx="20"/><rect x="960" y="440" width="390" height="150" rx="20"/></g><g font-size="21" font-weight="700"><text x="130" y="295" fill="#45e0c5">01 沈黙を待つ</text><text x="565" y="295" fill="#6ca8ff">02 指名を予告</text><text x="1000" y="295" fill="#ffbd69">03 発話を重ねない</text><text x="130" y="495" fill="#f17a8e">04 内輪前提を説明</text><text x="565" y="495" fill="#ab8cff">05 聞き専を話題にしない</text><text x="1000" y="495" fill="#7fdb8a">06 退出を引き止めない</text></g><g fill="#dbe7ef" font-size="18"><text x="130" y="340">数秒の考える時間</text><text x="565" y="340">突然話させない</text><text x="1000" y="340">進行役が順番を整理</text><text x="130" y="540">略語・過去話を補足</text><text x="565" y="540">発話しない選択を守る</text><text x="1000" y="540">感謝して送り出す</text></g></g><rect x="300" y="655" width="840" height="70" rx="18" fill="#0d2b3d" stroke="#45e0c5"/><text x="720" y="699" fill="#fff" font-family="sans-serif" font-size="21" text-anchor="middle">安心の責任を、初参加者ではなく進行役が持つ</text></svg>

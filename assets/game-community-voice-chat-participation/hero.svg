<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">ボイスチャット参加導線の全体像</title><desc id="d">募集から次回参加までの5段階</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5f7e94"/></marker></defs><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">VOICE ONBOARDING</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">話す前に、選べる参加導線をつくる</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">募集・チャット・ボイスを一つの流れとして設計</text><g stroke="#5f7e94" stroke-width="4" marker-end="url(#a)"><line x1="295" y1="405" x2="365" y2="405"/><line x1="555" y1="405" x2="625" y2="405"/><line x1="815" y1="405" x2="885" y2="405"/><line x1="1075" y1="405" x2="1145" y2="405"/></g><g font-family="sans-serif"><g fill="#102d40" stroke-width="3"><rect x="75" y="320" width="220" height="170" rx="22" stroke="#45e0c5"/><rect x="365" y="320" width="190" height="170" rx="22" stroke="#6ca8ff"/><rect x="625" y="320" width="190" height="170" rx="22" stroke="#ffbd69"/><rect x="885" y="320" width="190" height="170" rx="22" stroke="#f17a8e"/><rect x="1145" y="320" width="220" height="170" rx="22" stroke="#7fdb8a"/></g><g text-anchor="middle" font-weight="700"><text x="185" y="380" fill="#45e0c5" font-size="20">01 募集</text><text x="185" y="430" fill="#fff" font-size="20">条件を確認</text><text x="460" y="380" fill="#6ca8ff" font-size="20">02 事前</text><text x="460" y="430" fill="#fff" font-size="20">チャット確認</text><text x="720" y="380" fill="#ffbd69" font-size="20">03 見学</text><text x="720" y="430" fill="#fff" font-size="20">ミュート入室</text><text x="980" y="380" fill="#f17a8e" font-size="20">04 参加</text><text x="980" y="430" fill="#fff" font-size="20">任意の発話</text><text x="1255" y="380" fill="#7fdb8a" font-size="20">05 継続</text><text x="1255" y="430" fill="#fff" font-size="20">次回を選ぶ</text></g></g><rect x="285" y="610" width="870" height="78" rx="18" fill="#0d2b3d" stroke="#45e0c5"/><text x="720" y="658" fill="#fff" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="700">どの段階でも「参加」として扱う</text></svg>

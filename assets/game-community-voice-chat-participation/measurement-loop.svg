<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">ボイス参加導線の計測モデル</title><desc id="d">閲覧、参加表明、初参加、15分滞在、30日再参加を計測</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607f94"/></marker></defs><rect width="1440" height="810" fill="#071927"/><text x="72" y="72" fill="#45e0c5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="3">MEASUREMENT LOOP</text><text x="72" y="132" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">入室人数ではなく、段階の移動を見る</text><text x="72" y="174" fill="#a9bed0" font-family="sans-serif" font-size="22">個人の発話内容や発話時間は収集しない</text><g stroke="#607f94" stroke-width="4" marker-end="url(#a)"><line x1="300" y1="400" x2="380" y2="400"/><line x1="570" y1="400" x2="650" y2="400"/><line x1="840" y1="400" x2="920" y2="400"/><line x1="1110" y1="400" x2="1190" y2="400"/></g><g font-family="sans-serif"><g fill="#102d40" stroke-width="3"><rect x="80" y="325" width="220" height="150" rx="20" stroke="#45e0c5"/><rect x="380" y="325" width="190" height="150" rx="20" stroke="#6ca8ff"/><rect x="650" y="325" width="190" height="150" rx="20" stroke="#ffbd69"/><rect x="920" y="325" width="190" height="150" rx="20" stroke="#f17a8e"/><rect x="1190" y="325" width="180" height="150" rx="20" stroke="#7fdb8a"/></g><g text-anchor="middle" font-weight="700"><text x="190" y="385" fill="#45e0c5" font-size="19">募集閲覧</text><text x="190" y="428" fill="#fff" font-size="18">条件が見えた</text><text x="475" y="385" fill="#6ca8ff" font-size="19">参加表明</text><text x="475" y="428" fill="#fff" font-size="18">意思を示した</text><text x="745" y="385" fill="#ffbd69" font-size="19">初参加</text><text x="745" y="428" fill="#fff" font-size="18">初めて入室</text><text x="1015" y="385" fill="#f17a8e" font-size="19">15分滞在</text><text x="1015" y="428" fill="#fff" font-size="18">入口を通過</text><text x="1280" y="385" fill="#7fdb8a" font-size="19">30日再参加</text><text x="1280" y="428" fill="#fff" font-size="18">次回も選択</text></g></g><rect x="260" y="610" width="920" height="86" rx="18" fill="#0d2b3d"/><text x="720" y="646" fill="#ffbd69" font-family="sans-serif" font-size="20" text-anchor="middle" font-weight="700">落ちた段階だけを改善</text><text x="720" y="676" fill="#fff" font-family="sans-serif" font-size="19" text-anchor="middle">事前案内／最初の15分／終了後フォローを切り分ける</text></svg>

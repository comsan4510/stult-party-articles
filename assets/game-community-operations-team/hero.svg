<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">ゲームコミュニティの運営体制</title><desc id="d">受付、判断、実行、記録を分ける運営体制</desc><rect width="1440" height="810" fill="#081525"/><path d="M0 160H1440M0 320H1440M0 480H1440M0 640H1440M240 0V810M480 0V810M720 0V810M960 0V810M1200 0V810" stroke="#203a52" opacity=".45"/><g font-family="sans-serif"><text x="80" y="90" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="4">OPERATIONS TEAM</text><text x="80" y="175" fill="#f7f9ff" font-size="54" font-weight="800">一人の頑張りから、</text><text x="80" y="245" fill="#f7f9ff" font-size="54" font-weight="800">休める運営体制へ</text><g transform="translate(80 355)" text-anchor="middle" font-weight="700"><rect width="1280" height="240" rx="30" fill="#12263c" stroke="#38536d" stroke-width="2"/><g transform="translate(45 58)"><circle cx="100" cy="62" r="60" fill="#123c35" stroke="#61dbc5" stroke-width="3"/><text x="100" y="70" fill="white" font-size="23">受付</text></g><path d="M250 120H400" stroke="#607b98" stroke-width="6"/><path d="m385 108 24 12-24 12" fill="#607b98"/><g transform="translate(405 58)"><circle cx="100" cy="62" r="60" fill="#1d3861" stroke="#7da8ef" stroke-width="3"/><text x="100" y="70" fill="white" font-size="23">判断</text></g><path d="M610 120H760" stroke="#607b98" stroke-width="6"/><path d="m745 108 24 12-24 12" fill="#607b98"/><g transform="translate(765 58)"><circle cx="100" cy="62" r="60" fill="#5a4931" stroke="#f0bd63" stroke-width="3"/><text x="100" y="70" fill="white" font-size="23">実行</text></g><path d="M970 120H1120" stroke="#607b98" stroke-width="6"/><path d="m1105 108 24 12-24 12" fill="#607b98"/><g transform="translate(1125 58)"><circle cx="100" cy="62" r="60" fill="#563e61" stroke="#c991db" stroke-width="3"/><text x="100" y="70" fill="white" font-size="23">記録</text></g></g><rect x="360" y="670" width="720" height="65" rx="32" fill="#1b304a"/><text x="720" y="713" text-anchor="middle" fill="#f0bd63" font-size="22" font-weight="700">不在でも止まらない責任分界をつくる</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">一人運営の限界を示す六つの兆候</title><desc id="d">運営が個人へ依存している兆候を六つ示す</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="80" y="85" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="3">SIX SIGNALS</text><text x="80" y="150" fill="#fff" font-size="45" font-weight="800">三つ以上あれば、役割分担を始める</text><g transform="translate(80 220)" font-weight="700"><g><rect width="390" height="145" rx="22" fill="#12342f" stroke="#61dbc5"/><text x="28" y="45" fill="#61dbc5" font-size="20">01</text><text x="28" y="88" fill="white" font-size="25">不在日に募集が止まる</text><text x="28" y="120" fill="#b2cdc8" font-size="18">作業が一人へ集中</text></g><g transform="translate(405)"><rect width="390" height="145" rx="22" fill="#172b49" stroke="#7da8ef"/><text x="28" y="45" fill="#7da8ef" font-size="20">02</text><text x="28" y="88" fill="white" font-size="25">回答が人で変わる</text><text x="28" y="120" fill="#b8c9e4" font-size="18">判断基準が共有されない</text></g><g transform="translate(810)"><rect width="390" height="145" rx="22" fill="#55452f" stroke="#f0bd63"/><text x="28" y="45" fill="#f0bd63" font-size="20">03</text><text x="28" y="88" fill="white" font-size="25">通報が個別連絡に埋もれる</text><text x="28" y="120" fill="#dccaa9" font-size="18">受付場所が分散</text></g><g transform="translate(0 165)"><rect width="390" height="145" rx="22" fill="#553d60" stroke="#c991db"/><text x="28" y="45" fill="#c991db" font-size="20">04</text><text x="28" y="88" fill="white" font-size="25">案内を毎回手入力</text><text x="28" y="120" fill="#d5bddf" font-size="18">定型作業が未整備</text></g><g transform="translate(405 165)"><rect width="390" height="145" rx="22" fill="#285844" stroke="#79dfac"/><text x="28" y="45" fill="#79dfac" font-size="20">05</text><text x="28" y="88" fill="white" font-size="25">休む前の説明が長い</text><text x="28" y="120" fill="#bed8ca" font-size="18">引き継ぎが頭の中</text></g><g transform="translate(810 165)"><rect width="390" height="145" rx="22" fill="#34404f" stroke="#9ba9b8"/><text x="28" y="45" fill="#b4c0cc" font-size="20">06</text><text x="28" y="88" fill="white" font-size="25">任せる範囲が曖昧</text><text x="28" y="120" fill="#c2cbd4" font-size="18">手伝い役が第二窓口に</text></g><rect x="300" y="365" width="600" height="110" rx="25" fill="#14283d"/><text x="600" y="413" text-anchor="middle" fill="#f0bd63" font-size="24">副管理者を増やす前に</text><text x="600" y="450" text-anchor="middle" fill="white" font-size="23">仕事と判断範囲を分ける</text></g></g></svg>

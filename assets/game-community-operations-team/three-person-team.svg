<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">三人運営チームの配置例</title><desc id="d">三人が五つの役割を兼任し代替する例</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="80" y="85" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="3">3-PERSON TEAM</text><text x="80" y="150" fill="#fff" font-size="45" font-weight="800">三人でも、判断・日常・安全を分けられる</text><g transform="translate(80 235)" text-anchor="middle" font-weight="700"><path d="M290 190 640 70 990 190 640 410Z" fill="none" stroke="#526d88" stroke-width="5"/><g><circle cx="290" cy="190" r="135" fill="#12342f" stroke="#61dbc5" stroke-width="4"/><text x="290" y="150" fill="#61dbc5" font-size="24">A</text><text x="290" y="195" fill="white" font-size="27">最終責任者</text><text x="290" y="235" fill="#b8d0cb" font-size="19">＋ 基盤・文書</text></g><g><circle cx="990" cy="190" r="135" fill="#172b49" stroke="#7da8ef" stroke-width="4"/><text x="990" y="150" fill="#7da8ef" font-size="24">B</text><text x="990" y="195" fill="white" font-size="27">日常運営</text><text x="990" y="235" fill="#c0cee3" font-size="19">＋ 募集支援</text></g><g><circle cx="640" cy="410" r="135" fill="#553d60" stroke="#c991db" stroke-width="4"/><text x="640" y="370" fill="#c991db" font-size="24">C</text><text x="640" y="415" fill="white" font-size="27">安全対応</text><text x="640" y="455" fill="#d5bddf" font-size="19">＋ 日常運営の代替</text></g><circle cx="640" cy="145" r="70" fill="#55452f" stroke="#f0bd63" stroke-width="3"/><text x="640" y="136" fill="white" font-size="20">重大判断は</text><text x="640" y="168" fill="#f0bd63" font-size="20">Aへ上げる</text></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">週単位で回す運営当番表</title><desc id="d">主当番、代替、確認時間を三週間で回す</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="80" y="85" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="3">DUTY ROSTER</text><text x="80" y="150" fill="#fff" font-size="45" font-weight="800">常時監視ではなく、確認時間を決める</text><g transform="translate(80 225)" font-weight="700"><rect width="1280" height="430" rx="28" fill="#12263c" stroke="#38536d" stroke-width="2"/><g transform="translate(35 35)"><rect width="380" height="300" rx="24" fill="#12342f" stroke="#61dbc5" stroke-width="2"/><text x="30" y="55" fill="#61dbc5" font-size="22">第1週</text><text x="30" y="115" fill="white" font-size="28">主当番　A</text><text x="30" y="165" fill="#c3d5d1" font-size="22">代替　B</text><path d="M30 200H350" stroke="#315a54"/><text x="30" y="245" fill="white" font-size="21">確認　20時・23時</text></g><g transform="translate(450 35)"><rect width="380" height="300" rx="24" fill="#172b49" stroke="#7da8ef" stroke-width="2"/><text x="30" y="55" fill="#7da8ef" font-size="22">第2週</text><text x="30" y="115" fill="white" font-size="28">主当番　B</text><text x="30" y="165" fill="#c5d1e4" font-size="22">代替　C</text><path d="M30 200H350" stroke="#35527e"/><text x="30" y="245" fill="white" font-size="21">確認　20時・23時</text></g><g transform="translate(865 35)"><rect width="380" height="300" rx="24" fill="#55452f" stroke="#f0bd63" stroke-width="2"/><text x="30" y="55" fill="#f0bd63" font-size="22">第3週</text><text x="30" y="115" fill="white" font-size="28">主当番　C</text><text x="30" y="165" fill="#dfcfb2" font-size="22">代替　A</text><path d="M30 200H350" stroke="#6f5a3c"/><text x="30" y="245" fill="white" font-size="21">確認　20時・23時</text></g><text x="640" y="390" text-anchor="middle" fill="#f0bd63" font-size="21">対応できない日は、開始前に代替へ渡す</text></g></g></svg>

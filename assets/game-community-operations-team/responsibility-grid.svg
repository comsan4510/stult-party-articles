<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">受付実行決定代替の責任分界</title><desc id="d">業務ごとに四つの責任を割り当てる表</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="80" y="85" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="3">RESPONSIBILITY GRID</text><text x="80" y="150" fill="#fff" font-size="45" font-weight="800">「みんなで対応」を、四つの責任に分ける</text><g transform="translate(80 225)" font-weight="700"><rect width="1280" height="450" rx="28" fill="#12263c" stroke="#38536d" stroke-width="2"/><g text-anchor="middle"><rect x="30" y="30" width="280" height="95" rx="18" fill="#12342f" stroke="#61dbc5"/><text x="170" y="70" fill="#61dbc5" font-size="21">受付</text><text x="170" y="102" fill="white" font-size="18">最初に受け取る</text><rect x="340" y="30" width="280" height="95" rx="18" fill="#172b49" stroke="#7da8ef"/><text x="480" y="70" fill="#7da8ef" font-size="21">実行</text><text x="480" y="102" fill="white" font-size="18">手順に沿って作業</text><rect x="650" y="30" width="280" height="95" rx="18" fill="#55452f" stroke="#f0bd63"/><text x="790" y="70" fill="#f0bd63" font-size="21">決定</text><text x="790" y="102" fill="white" font-size="18">例外を確定</text><rect x="960" y="30" width="280" height="95" rx="18" fill="#553d60" stroke="#c991db"/><text x="1100" y="70" fill="#c991db" font-size="21">代替</text><text x="1100" y="102" fill="white" font-size="18">不在時に引き継ぐ</text></g><path d="M170 125V210H1100V125" fill="none" stroke="#526d88" stroke-width="4"/><circle cx="635" cy="210" r="70" fill="#1b304a" stroke="#8aa1ba" stroke-width="3"/><text x="635" y="202" text-anchor="middle" fill="white" font-size="22">業務ごとに</text><text x="635" y="234" text-anchor="middle" fill="#f0bd63" font-size="20">一つずつ置く</text><g fill="#c2cfdd" font-size="20"><text x="70" y="335">新規質問</text><text x="330" y="335">募集の不足</text><text x="590" y="335">安全通報</text><text x="850" y="335">ルール変更</text><text x="1080" y="335">運営休止</text></g><path d="M50 365H1230" stroke="#38536d" stroke-width="3"/><text x="640" y="410" text-anchor="middle" fill="#f0bd63" font-size="21">決定者は一人、受付と実行は当番で回せる</text></g></g></svg>

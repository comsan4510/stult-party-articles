<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">運営引き継ぎの最小データ構造</title><desc id="d">案件の事実、判断、次の行動、期限を記録する</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="80" y="85" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="3">HANDOFF SCHEMA</text><text x="80" y="150" fill="#fff" font-size="45" font-weight="800">事実・判断・次の行動を混ぜない</text><g transform="translate(80 220)" font-weight="700"><rect width="1280" height="470" rx="28" fill="#12263c" stroke="#38536d" stroke-width="2"/><g transform="translate(35 35)"><rect width="370" height="300" rx="22" fill="#12342f" stroke="#61dbc5"/><text x="28" y="50" fill="#61dbc5" font-size="21">FACTS</text><text x="28" y="105" fill="white" font-size="25">確認できた事実</text><text x="28" y="155" fill="#b8d0cb" font-size="19">・発生日時</text><text x="28" y="195" fill="#b8d0cb" font-size="19">・観察した行動</text><text x="28" y="235" fill="#b8d0cb" font-size="19">・参照したルール</text></g><path d="M425 185H455" stroke="#607b98" stroke-width="5"/><g transform="translate(455 35)"><rect width="370" height="300" rx="22" fill="#172b49" stroke="#7da8ef"/><text x="28" y="50" fill="#7da8ef" font-size="21">DECISION</text><text x="28" y="105" fill="white" font-size="25">決定済みの内容</text><text x="28" y="155" fill="#c0cee3" font-size="19">・判断者</text><text x="28" y="195" fill="#c0cee3" font-size="19">・決定内容</text><text x="28" y="235" fill="#c0cee3" font-size="19">・決定日時</text></g><path d="M845 185H875" stroke="#607b98" stroke-width="5"/><g transform="translate(875 35)"><rect width="370" height="300" rx="22" fill="#55452f" stroke="#f0bd63"/><text x="28" y="50" fill="#f0bd63" font-size="21">NEXT ACTION</text><text x="28" y="105" fill="white" font-size="25">次に行うこと</text><text x="28" y="155" fill="#ddceb2" font-size="19">・現在の担当</text><text x="28" y="195" fill="#ddceb2" font-size="19">・確認期限</text><text x="28" y="235" fill="#ddceb2" font-size="19">・案件状態</text></g><rect x="325" y="370" width="630" height="65" rx="32" fill="#1b304a"/><text x="640" y="412" text-anchor="middle" fill="#f0bd63" font-size="21">open / waiting / resolved の3状態で管理</text></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">ゲームコミュニティ運営の五つの役割</title><desc id="d">責任者、日常運営、募集支援、安全対応、基盤文書の役割</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="80" y="85" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="3">FIVE ROLES</text><text x="80" y="150" fill="#fff" font-size="45" font-weight="800">肩書ではなく、発生する仕事で分ける</text><g transform="translate(720 460)" text-anchor="middle" font-weight="700"><circle r="105" fill="#162b45" stroke="#f0bd63" stroke-width="4"/><text y="-5" fill="white" font-size="27">運営体制</text><text y="32" fill="#f0bd63" font-size="20">兼任しても記録</text><path d="M0-110V-205M105-35 205-75M65 90 130 185M-65 90-130 185M-105-35-205-75" stroke="#627c98" stroke-width="4"/><g><rect x="-175" y="-310" width="350" height="105" rx="22" fill="#12342f" stroke="#61dbc5"/><text y="-262" fill="#61dbc5" font-size="21">最終責任者</text><text y="-227" fill="white" font-size="19">例外と重大判断</text></g><g><rect x="205" y="-130" width="350" height="105" rx="22" fill="#172b49" stroke="#7da8ef"/><text x="380" y="-82" fill="#7da8ef" font-size="21">日常運営</text><text x="380" y="-47" fill="white" font-size="19">質問と案内の受付</text></g><g><rect x="55" y="185" width="350" height="105" rx="22" fill="#55452f" stroke="#f0bd63"/><text x="230" y="233" fill="#f0bd63" font-size="21">募集支援</text><text x="230" y="268" fill="white" font-size="19">募集形式を整える</text></g><g><rect x="-405" y="185" width="350" height="105" rx="22" fill="#553d60" stroke="#c991db"/><text x="-230" y="233" fill="#c991db" font-size="21">安全対応</text><text x="-230" y="268" fill="white" font-size="19">受付・記録・一次対応</text></g><g><rect x="-555" y="-130" width="350" height="105" rx="22" fill="#285844" stroke="#79dfac"/><text x="-380" y="-82" fill="#79dfac" font-size="21">基盤・文書</text><text x="-380" y="-47" fill="white" font-size="19">ルールと案内を保守</text></g></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">NAME • DESCRIPTION • EXAMPLE</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">名前だけに、すべてを背負わせない</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">予測できる名前、境界が分かる説明、最初の投稿例を一組にする</text><rect x="150" y="235" width="1140" height="455" rx="28" fill="#102a3e" stroke="#55e6cf" stroke-width="3"/><g font-family="Arial,sans-serif"><text x="210" y="300" fill="#55e6cf" font-size="15" font-weight="700">PLAY-RECRUIT</text><text x="210" y="360" fill="#fff" font-size="34" font-weight="700">募集｜一緒に遊ぶ人を集める</text><line x1="210" y1="395" x2="1230" y2="395" stroke="#25455e" stroke-width="2"/><text x="210" y="450" fill="#9db0c3" font-size="17">目的</text><text x="390" y="450" fill="#fff" font-size="21">ゲーム、日時、人数、条件を示して参加者を募る</text><text x="210" y="510" fill="#9db0c3" font-size="17">投稿例</text><text x="390" y="510" fill="#fff" font-size="21">11月6日 22時｜協力プレイ｜確定3名＋補欠1名</text><text x="210" y="570" fill="#9db0c3" font-size="17">別の場所</text><text x="390" y="570" fill="#fff" font-size="21">感想は会話へ、参加後の集合は指定ボイスへ</text><rect x="865" y="615" width="365" height="48" rx="12" fill="#153f45"/><text x="1047" y="646" fill="#55e6cf" font-size="16" font-weight="700" text-anchor="middle">一場所一目的を説明できる</text></g></svg>

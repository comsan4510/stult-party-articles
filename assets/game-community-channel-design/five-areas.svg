<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">MINIMUM FIVE AREAS</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">最初は5領域、ゲーム別の細分化は後から</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">案内・募集・会話・ボイス・運営で行動を受け止める</text><g font-family="Arial,sans-serif"><g fill="#102a3e"><rect x="45" y="270" width="250" height="310" rx="22" stroke="#7f9bb1" stroke-width="3"/><rect x="320" y="270" width="250" height="310" rx="22" stroke="#55e6cf" stroke-width="3"/><rect x="595" y="270" width="250" height="310" rx="22" stroke="#ffb84d" stroke-width="3"/><rect x="870" y="270" width="250" height="310" rx="22" stroke="#d998e8" stroke-width="3"/><rect x="1145" y="270" width="250" height="310" rx="22" stroke="#ff7070" stroke-width="3"/></g><g text-anchor="middle" font-weight="700"><text x="170" y="330" fill="#7f9bb1" font-size="13">GUIDE</text><text x="170" y="400" fill="#fff" font-size="29">はじめに</text><text x="445" y="330" fill="#55e6cf" font-size="13">RECRUIT</text><text x="445" y="400" fill="#fff" font-size="29">募集</text><text x="720" y="330" fill="#ffb84d" font-size="13">CHAT</text><text x="720" y="400" fill="#fff" font-size="29">会話</text><text x="995" y="330" fill="#d998e8" font-size="13">VOICE</text><text x="995" y="400" fill="#fff" font-size="29">ボイス</text><text x="1270" y="330" fill="#ff7070" font-size="13">OPERATIONS</text><text x="1270" y="400" fill="#fff" font-size="29">運営</text></g><g fill="#b8c7d4" font-size="17" text-anchor="middle"><text x="170" y="475">ルールと使い方</text><text x="445" y="475">日時・人数・条件</text><text x="720" y="475">感想・質問・雑談</text><text x="995" y="475">募集後の集合</text><text x="1270" y="475">安全・改善・記録</text></g></g><rect x="310" y="650" width="820" height="58" rx="14" fill="#102a3e" stroke="#25455e"/><text x="720" y="687" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">実際の混雑を観察してから、必要な場所だけ増やす</text></svg>

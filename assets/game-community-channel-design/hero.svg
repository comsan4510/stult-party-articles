<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">CHANNEL ARCHITECTURE</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">場所を増やす前に、参加者の次の行動を決める</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">募集・会話・集合を一本の導線にする</text><g font-family="Arial,sans-serif"><rect x="80" y="300" width="290" height="170" rx="22" fill="#102a3e" stroke="#55e6cf" stroke-width="3"/><text x="225" y="355" fill="#55e6cf" font-size="14" font-weight="700" text-anchor="middle">01 RECRUIT</text><text x="225" y="415" fill="#fff" font-size="29" font-weight="700" text-anchor="middle">募集を見つける</text><path d="M370 385H465" stroke="#7894aa" stroke-width="5"/><path d="M465 385l-18-12v24z" fill="#7894aa"/><rect x="465" y="300" width="290" height="170" rx="22" fill="#102a3e" stroke="#ffb84d" stroke-width="3"/><text x="610" y="355" fill="#ffb84d" font-size="14" font-weight="700" text-anchor="middle">02 TALK</text><text x="610" y="415" fill="#fff" font-size="29" font-weight="700" text-anchor="middle">条件を確認する</text><path d="M755 385H850" stroke="#7894aa" stroke-width="5"/><path d="M850 385l-18-12v24z" fill="#7894aa"/><rect x="850" y="300" width="290" height="170" rx="22" fill="#102a3e" stroke="#d998e8" stroke-width="3"/><text x="995" y="355" fill="#d998e8" font-size="14" font-weight="700" text-anchor="middle">03 VOICE</text><text x="995" y="415" fill="#fff" font-size="29" font-weight="700" text-anchor="middle">集合して遊ぶ</text><rect x="1165" y="320" width="195" height="130" rx="20" fill="#153f45" stroke="#55e6cf" stroke-width="3"/><text x="1262" y="370" fill="#55e6cf" font-size="13" font-weight="700" text-anchor="middle">ONE PURPOSE</text><text x="1262" y="414" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">一場所一目的</text><rect x="315" y="585" width="810" height="62" rx="15" fill="#102a3e" stroke="#25455e"/><text x="720" y="624" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">分類の美しさではなく、行動のつながりで設計する</text></g></svg>

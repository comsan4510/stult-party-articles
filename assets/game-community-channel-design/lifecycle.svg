<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">CHANNEL LIFECYCLE</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">作った後の、分割・統合・終了まで決める</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">チャンネルを永久資産にしない</text><g font-family="Arial,sans-serif"><circle cx="225" cy="390" r="108" fill="#102a3e" stroke="#7f9bb1" stroke-width="3"/><text x="225" y="372" fill="#7f9bb1" font-size="13" font-weight="700" text-anchor="middle">01 PROPOSE</text><text x="225" y="420" fill="#fff" font-size="28" font-weight="700" text-anchor="middle">目的を定義</text><path d="M333 390H448" stroke="#7894aa" stroke-width="5"/><path d="M448 390l-18-12v24z" fill="#7894aa"/><circle cx="560" cy="390" r="108" fill="#102a3e" stroke="#55e6cf" stroke-width="3"/><text x="560" y="372" fill="#55e6cf" font-size="13" font-weight="700" text-anchor="middle">02 ACTIVE</text><text x="560" y="420" fill="#fff" font-size="28" font-weight="700" text-anchor="middle">利用を観察</text><path d="M668 390H783" stroke="#7894aa" stroke-width="5"/><path d="M783 390l-18-12v24z" fill="#7894aa"/><circle cx="895" cy="390" r="108" fill="#102a3e" stroke="#ffb84d" stroke-width="3"/><text x="895" y="372" fill="#ffb84d" font-size="13" font-weight="700" text-anchor="middle">03 REVIEW</text><text x="895" y="420" fill="#fff" font-size="28" font-weight="700" text-anchor="middle">30日で棚卸し</text><path d="M1003 390H1118" stroke="#7894aa" stroke-width="5"/><path d="M1118 390l-18-12v24z" fill="#7894aa"/><rect x="1118" y="275" width="250" height="230" rx="24" fill="#102a3e" stroke="#d998e8" stroke-width="3"/><text x="1243" y="330" fill="#d998e8" font-size="13" font-weight="700" text-anchor="middle">04 DECIDE</text><text x="1243" y="385" fill="#fff" font-size="25" font-weight="700" text-anchor="middle">維持・分割</text><text x="1243" y="425" fill="#fff" font-size="25" font-weight="700" text-anchor="middle">統合・終了</text></g><rect x="315" y="625" width="810" height="62" rx="15" fill="#102a3e" stroke="#25455e"/><text x="720" y="664" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">混雑は分割、目的重複は統合、役目終了は閉鎖</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">CHANNEL DATA MODEL</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">名前と権限だけでなく、作成理由と見直し日を持つ</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">担当者不在・目的重複・期限超過を検出する</text><g font-family="Arial,sans-serif"><rect x="85" y="230" width="540" height="440" rx="26" fill="#102a3e" stroke="#55e6cf" stroke-width="3"/><text x="135" y="290" fill="#55e6cf" font-size="15" font-weight="700">MINIMUM FIELDS</text><text x="135" y="345" fill="#fff" font-size="29" font-weight="700">チャンネルの台帳</text><g fill="#b8c7d4" font-size="18"><text x="135" y="405">channel_id / purpose</text><text x="135" y="445">audience_rule / content_examples</text><text x="135" y="485">redirect_to / owner_ref</text><text x="135" y="525">visibility / linked_recruitment</text><text x="135" y="565">created_at / review_at</text><text x="135" y="605">status / close_reason</text></g><rect x="755" y="250" width="575" height="400" rx="26" fill="#102a3e" stroke="#ffb84d" stroke-width="3"/><text x="805" y="310" fill="#ffb84d" font-size="15" font-weight="700">STATE TRANSITION</text><g font-size="21" font-weight="700"><rect x="805" y="355" width="180" height="72" rx="14" fill="#1a3043" stroke="#7f9bb1"/><text x="895" y="400" fill="#fff" text-anchor="middle">proposed</text><path d="M985 391H1065" stroke="#7894aa" stroke-width="4"/><path d="M1065 391l-15-10v20z" fill="#7894aa"/><rect x="1065" y="355" width="180" height="72" rx="14" fill="#153f45" stroke="#55e6cf"/><text x="1155" y="400" fill="#fff" text-anchor="middle">active</text><path d="M1155 427V490" stroke="#7894aa" stroke-width="4"/><path d="M1155 490l-10-15h20z" fill="#7894aa"/><rect x="1065" y="490" width="180" height="72" rx="14" fill="#47361e" stroke="#ffb84d"/><text x="1155" y="535" fill="#fff" text-anchor="middle">merging</text><path d="M1065 526H985" stroke="#7894aa" stroke-width="4"/><path d="M985 526l15-10v20z" fill="#7894aa"/><rect x="805" y="490" width="180" height="72" rx="14" fill="#402432" stroke="#d998e8"/><text x="895" y="535" fill="#fff" text-anchor="middle">closed</text></g><text x="1042" y="610" fill="#b8c7d4" font-size="17" text-anchor="middle">状態を変えるたび、理由と移動先を記録</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">MONTHLY CHANNEL AUDIT</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">投稿量だけでなく、迷いと放置を測る</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">月1回、分割・統合・終了の材料をそろえる</text><g font-family="Arial,sans-serif"><g fill="#102a3e"><rect x="45" y="275" width="250" height="300" rx="22" stroke="#55e6cf" stroke-width="3"/><rect x="320" y="275" width="250" height="300" rx="22" stroke="#7f9bb1" stroke-width="3"/><rect x="595" y="275" width="250" height="300" rx="22" stroke="#ffb84d" stroke-width="3"/><rect x="870" y="275" width="250" height="300" rx="22" stroke="#d998e8" stroke-width="3"/><rect x="1145" y="275" width="250" height="300" rx="22" stroke="#ff7070" stroke-width="3"/></g><g text-anchor="middle" font-weight="700"><text x="170" y="330" fill="#55e6cf" font-size="13">01 ACTIVE</text><text x="170" y="395" fill="#fff" font-size="24">活動場所率</text><text x="445" y="330" fill="#7f9bb1" font-size="13">02 CONCENTRATION</text><text x="445" y="395" fill="#fff" font-size="24">投稿集中率</text><text x="720" y="330" fill="#ffb84d" font-size="13">03 REDIRECT</text><text x="720" y="380" fill="#fff" font-size="24">移動案内</text><text x="720" y="415" fill="#fff" font-size="24">件数</text><text x="995" y="330" fill="#d998e8" font-size="13">04 FIRST ACTION</text><text x="995" y="380" fill="#fff" font-size="24">初回投稿</text><text x="995" y="415" fill="#fff" font-size="24">到達時間</text><text x="1270" y="330" fill="#ff7070" font-size="13">05 OWNER</text><text x="1270" y="380" fill="#fff" font-size="24">所有者</text><text x="1270" y="415" fill="#fff" font-size="24">不在数</text></g><g fill="#b8c7d4" font-size="16" text-anchor="middle"><text x="170" y="500">空の場所を発見</text><text x="445" y="500">混雑と分散を確認</text><text x="720" y="500">名前と境界を改善</text><text x="995" y="500">参加導線を短縮</text><text x="1270" y="500">放置を早期発見</text></g></g><rect x="350" y="650" width="740" height="58" rx="14" fill="#102a3e" stroke="#25455e"/><text x="720" y="687" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">数字はチャンネルを増やすためでなく、迷いを減らすために使う</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">最初の三十人を集める三段階</title><desc id="d">核の五人、条件の合う十人、公開経路の十五人へ広げる</desc><rect width="1440" height="810" fill="#091426"/><g font-family="sans-serif"><text x="80" y="90" fill="#6edbd2" font-size="22" font-weight="700" letter-spacing="3">FIRST 30 MEMBERS</text><text x="80" y="155" fill="#fff" font-size="46" font-weight="800">一度に集めず、成立体験を積み上げる</text><g transform="translate(100 250)" text-anchor="middle" font-weight="700"><path d="M0 420 190 100 380 420Z" fill="#183f48" stroke="#6edbd2" stroke-width="3"/><text x="190" y="330" fill="white" font-size="52">5人</text><text x="190" y="380" fill="#b9dcd9" font-size="23">核メンバー</text><path d="M430 420 620 55 810 420Z" fill="#243f66" stroke="#7fa9ed" stroke-width="3"/><text x="620" y="310" fill="white" font-size="52">10人</text><text x="620" y="360" fill="#c9d8ef" font-size="23">条件の合う人</text><path d="M860 420 1050 10 1240 420Z" fill="#5d4938" stroke="#e1ad68" stroke-width="3"/><text x="1050" y="290" fill="white" font-size="52">15人</text><text x="1050" y="340" fill="#ead4b7" font-size="23">公開経路から</text><path d="M0 475H1240" stroke="#4f6685" stroke-width="4"/><text x="190" y="530" fill="#6edbd2" font-size="22">導線を試す</text><text x="620" y="530" fill="#7fa9ed" font-size="22">相性を確かめる</text><text x="1050" y="530" fill="#e1ad68" font-size="22">実績を伝える</text></g></g></svg>

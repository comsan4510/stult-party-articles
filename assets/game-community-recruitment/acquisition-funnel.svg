<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">告知から初回プレイまでの集客ファネル</title><desc id="d">集客の六段階と離脱原因を示す図</desc><rect width="1440" height="810" fill="#091426"/><g font-family="sans-serif"><text x="80" y="80" fill="#6edbd2" font-size="22" font-weight="700" letter-spacing="3">ACQUISITION FUNNEL</text><text x="80" y="140" fill="#fff" font-size="44" font-weight="800">人数が落ちる場所で、直すものを決める</text><g transform="translate(145 170)" text-anchor="middle" font-weight="700"><path d="M0 0H1150L1030 90H120Z" fill="#183a4a" stroke="#6edbd2"/><text x="575" y="56" fill="white" font-size="25">1　告知を見る</text><path d="M120 100H1030L925 190H225Z" fill="#1d4160" stroke="#7fa9ed"/><text x="575" y="156" fill="white" font-size="25">2　自分向けだと理解</text><path d="M225 200H925L835 290H315Z" fill="#33476a" stroke="#91aee4"/><text x="575" y="256" fill="white" font-size="25">3　約束に納得</text><path d="M315 300H835L755 390H395Z" fill="#594835" stroke="#e1ad68"/><text x="575" y="356" fill="white" font-size="25">4　参加</text><path d="M395 400H755L690 490H460Z" fill="#5a3f66" stroke="#ca94dd"/><text x="575" y="456" fill="white" font-size="25">5　募集を選ぶ</text><path d="M460 500H690L640 590H510Z" fill="#316153" stroke="#7de1b4"/><text x="575" y="556" fill="white" font-size="25">6　初回プレイ</text></g><g fill="#aab9ce" font-size="20"><text x="1160" y="345">説明の不一致</text><text x="1160" y="445">参加導線の迷い</text><text x="1160" y="545">募集条件の不一致</text></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">募集文の四ブロック構造</title><desc id="d">誰向け、できること、安心材料、次の一歩の順で書く</desc><rect width="1440" height="810" fill="#091426"/><g font-family="sans-serif"><text x="80" y="90" fill="#6edbd2" font-size="22" font-weight="700" letter-spacing="3">RECRUITMENT COPY</text><text x="80" y="155" fill="#fff" font-size="46" font-weight="800">参加判断に必要な情報を、上から順に</text><g transform="translate(80 225)" font-weight="700"><rect width="1280" height="120" rx="22" fill="#183f48" stroke="#6edbd2" stroke-width="2"/><text x="45" y="52" fill="#6edbd2" font-size="22">01　誰向けか</text><text x="330" y="76" fill="white" font-size="30">ゲーム・経験・活動時間</text><rect y="140" width="1280" height="120" rx="22" fill="#243f66" stroke="#7fa9ed" stroke-width="2"/><text x="45" y="192" fill="#7fa9ed" font-size="22">02　何ができるか</text><text x="330" y="216" fill="white" font-size="30">募集頻度・遊び方・会話方法</text><rect y="280" width="1280" height="120" rx="22" fill="#5d4938" stroke="#e1ad68" stroke-width="2"/><text x="45" y="332" fill="#e1ad68" font-size="22">03　安心材料</text><text x="330" y="356" fill="white" font-size="30">大切にするルール・認めない行為</text><rect y="420" width="1280" height="120" rx="22" fill="#593e65" stroke="#ca94dd" stroke-width="2"/><text x="45" y="472" fill="#ca94dd" font-size="22">04　次の一歩</text><text x="330" y="496" fill="white" font-size="30">参加後に見る場所・最初にする行動</text></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">集客計測の最小データ構造</title><desc id="d">流入元とキャンペーンと行動日時を関連付ける図</desc><rect width="1440" height="810" fill="#091426"/><g font-family="sans-serif"><text x="80" y="90" fill="#6edbd2" font-size="22" font-weight="700" letter-spacing="3">MINIMUM DATA MODEL</text><text x="80" y="155" fill="#fff" font-size="46" font-weight="800">個人属性より、経路と行動を記録する</text><g transform="translate(80 225)" font-weight="700"><rect width="360" height="430" rx="26" fill="#132238" stroke="#6edbd2" stroke-width="2"/><text x="35" y="58" fill="#6edbd2" font-size="23">ACQUISITION</text><text x="35" y="120" fill="white" font-size="28">source_id</text><text x="35" y="160" fill="#9cb0c9" font-size="20">どこから来たか</text><path d="M35 195H325" stroke="#344d6b"/><text x="35" y="250" fill="white" font-size="28">campaign_id</text><text x="35" y="290" fill="#9cb0c9" font-size="20">どの募集文か</text><path d="M360 215H480" stroke="#7fa9ed" stroke-width="6"/><path d="m465 202 24 13-24 13" fill="#7fa9ed"/><rect x="490" width="790" height="430" rx="26" fill="#132238" stroke="#7fa9ed" stroke-width="2"/><text x="525" y="58" fill="#7fa9ed" font-size="23">JOURNEY</text><g fill="white" font-size="27"><text x="525" y="125">joined_at</text><text x="525" y="225">first_action_at</text><text x="525" y="325">first_play_at</text></g><g fill="#9cb0c9" font-size="20"><text x="880" y="125">参加日時</text><text x="880" y="225">最初の行動日時</text><text x="880" y="325">初回プレイ日時</text></g><path d="M525 160H1245M525 260H1245" stroke="#344d6b"/></g><rect x="370" y="700" width="700" height="62" rx="31" fill="#1e2f49"/><text x="720" y="741" text-anchor="middle" fill="#f2c16c" font-family="sans-serif" font-size="22" font-weight="700">同じIDを使い続け、経路ごとに比較する</text></g></svg>

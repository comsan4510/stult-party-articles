<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">ゲームコミュニティ集客の全体像</title><desc id="d">対象を決め、募集文から初回プレイまでつなぐ流れ</desc><rect width="1440" height="810" fill="#091426"/><path d="M0 160H1440M0 320H1440M0 480H1440M0 640H1440M240 0V810M480 0V810M720 0V810M960 0V810M1200 0V810" stroke="#243955" opacity=".42"/><g font-family="sans-serif"><text x="80" y="95" fill="#6edbd2" font-size="22" font-weight="700" letter-spacing="4">COMMUNITY RECRUITMENT</text><text x="80" y="180" fill="#f7f9ff" font-size="56" font-weight="800">合う人を集め、</text><text x="80" y="250" fill="#f7f9ff" font-size="56" font-weight="800">最初のプレイまでつなぐ</text><g transform="translate(80 350)" text-anchor="middle" font-weight="700"><rect width="1280" height="250" rx="30" fill="#111f35" stroke="#375576" stroke-width="2"/><g transform="translate(55 55)"><circle cx="80" cy="70" r="62" fill="#315f61" stroke="#79d8d0" stroke-width="3"/><text x="80" y="78" fill="white" font-size="24">対象</text></g><path d="M225 125H390" stroke="#7187a8" stroke-width="6"/><path d="m380 114 20 11-20 11" fill="#7187a8"/><g transform="translate(395 55)"><circle cx="80" cy="70" r="62" fill="#314d78" stroke="#7fa9ed" stroke-width="3"/><text x="80" y="78" fill="white" font-size="24">募集文</text></g><path d="M565 125H730" stroke="#7187a8" stroke-width="6"/><path d="m720 114 20 11-20 11" fill="#7187a8"/><g transform="translate(735 55)"><circle cx="80" cy="70" r="62" fill="#65503d" stroke="#e1ad68" stroke-width="3"/><text x="80" y="78" fill="white" font-size="24">参加</text></g><path d="M905 125H1070" stroke="#7187a8" stroke-width="6"/><path d="m1060 114 20 11-20 11" fill="#7187a8"/><g transform="translate(1075 55)"><circle cx="80" cy="70" r="62" fill="#60446c" stroke="#ca94dd" stroke-width="3"/><text x="80" y="78" fill="white" font-size="24">初回プレイ</text></g></g><rect x="370" y="670" width="700" height="65" rx="32" fill="#1e2f49"/><text x="720" y="713" text-anchor="middle"
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">移行の成否を測る四つの指標</title><desc id="d">移行参加率、募集移行率、初回プレイ、転記時間を測る</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="80" y="80" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="3">MIGRATION METRICS</text><text x="80" y="140" fill="#fff" font-size="44" font-weight="800">登録数だけで、移行成功と判断しない</text><g transform="translate(80 150)" text-anchor="middle" font-weight="700"><g><circle cx="285" cy="170" r="135" fill="#12342f" stroke="#61dbc5" stroke-width="4"/><text x="285" y="130" fill="#61dbc5" font-size="22">01</text><text x="285" y="180" fill="white" font-size="29">移行参加率</text><text x="285" y="222" fill="#b6d2cd" font-size="20">定例メンバー基準</text></g><g><circle cx="915" cy="170" r="135" fill="#172b49" stroke="#7da8ef" stroke-width="4"/><text x="915" y="130" fill="#7da8ef" font-size="22">02</text><text x="915" y="180" fill="white" font-size="29">募集移行率</text><text x="915" y="222" fill="#becde5" font-size="20">作成場所を確認</text></g><g><circle cx="285" cy="485" r="135" fill="#55452f" stroke="#f0bd63" stroke-width="4"/><text x="285" y="445" fill="#f0bd63" font-size="22">03</text><text x="285" y="495" fill="white" font-size="29">初回プレイ</text><text x="285" y="537" fill="#dccaa9" font-size="20">実際に遊べたか</text></g><g><circle cx="915" cy="485" r="135" fill="#553d60" stroke="#c991db" stroke-width="4"/><text x="915" y="445" fill="#c991db" font-size="22">04</text><text x="915" y="495" fill="white" font-size="29">転記時間</text><text x="915" y="537" fill="#d7bfdf" font-size="20">運営負担が減ったか</text></g><path d="M435 170H765M435 485H765M285 320V335M915 320V335" stroke="#516b87" stroke-width="5"/></g></g></svg>

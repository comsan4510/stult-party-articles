<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">移行案内に必要な六項目</title><desc id="d">理由、利点、開始日、期限、旧グループ、問い合わせ先</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="80" y="90" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="3">ANNOUNCEMENT TEMPLATE</text><text x="80" y="155" fill="#fff" font-size="46" font-weight="800">参加者の「どうなる？」を先に答える</text><g transform="translate(80 230)" font-weight="700"><rect width="1280" height="470" rx="30" fill="#13263b" stroke="#35516d" stroke-width="2"/><g transform="translate(40 45)"><rect width="370" height="105" rx="20" fill="#12342f" stroke="#61dbc5"/><text x="28" y="43" fill="#61dbc5" font-size="19">01　変更理由</text><text x="28" y="78" fill="white" font-size="23">募集が埋もれないように</text></g><g transform="translate(455 45)"><rect width="370" height="105" rx="20" fill="#172b49" stroke="#7da8ef"/><text x="28" y="43" fill="#7da8ef" font-size="19">02　参加者の利点</text><text x="28" y="78" fill="white" font-size="23">募集中のゲームが分かる</text></g><g transform="translate(870 45)"><rect width="370" height="105" rx="20" fill="#55452f" stroke="#f0bd63"/><text x="28" y="43" fill="#f0bd63" font-size="19">03　開始日</text><text x="28" y="78" fill="white" font-size="23">いつから変わるか</text></g><g transform="translate(40 200)"><rect width="370" height="105" rx="20" fill="#553d60" stroke="#c991db"/><text x="28" y="43" fill="#c991db" font-size="19">04　移行期限</text><text x="28" y="78" fill="white" font-size="23">いつまでに参加するか</text></g><g transform="translate(455 200)"><rect width="370" height="105" rx="20" fill="#285844" stroke="#79dfac"/><text x="28" y="43" fill="#79dfac" font-size="19">05　旧グループ</text><text x="28" y="78" fill="white" font-size="23">残す・閉じる・参照のみ</text></g><g transform="translate(870 200)"><rect width="370" height="105" rx="20" fill="#34404f" stroke="#9ba9b8"/><text x="28" y="43" fill="#b4c0cc" font-size="19">06　問い合わせ先</text><text x="28" y="78" fill="white" font-size="23">困った時の連絡方法</text></g><path d="M200 380H1080" stroke="#526d88" stroke-width="4"/><text x="640" y="423" text-anchor="middle" fill="#f0bd63" font-size="21">ツールへの不満ではなく、参加者の変化を伝える</text></g></g></svg>

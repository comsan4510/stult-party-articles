<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">継続・併用・移行を決める判断表</title><desc id="d">募集頻度と整理負担で三つの運用方針を判断する</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="80" y="90" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="3">DECISION MATRIX</text><text x="80" y="155" fill="#fff" font-size="46" font-weight="800">人数より、募集頻度と整理負担を見る</text><g transform="translate(120 235)" font-weight="700"><path d="M110 480V0M110 480H1160" stroke="#69819c" stroke-width="4"/><path d="m110 0-12 24h24zm1050 480-24-12v24z" fill="#69819c"/><text x="75" y="20" fill="#b8c6d8" font-size="20" transform="rotate(-90 75 20)">運営の整理負担</text><text x="930" y="530" fill="#b8c6d8" font-size="20">募集を繰り返す頻度</text><rect x="155" y="300" width="285" height="125" rx="24" fill="#12342f" stroke="#61dbc5" stroke-width="3"/><text x="297" y="355" text-anchor="middle" fill="#61dbc5" font-size="24">継続</text><text x="297" y="395" text-anchor="middle" fill="white" font-size="20">友人への連絡中心</text><rect x="470" y="165" width="285" height="125" rx="24" fill="#55452f" stroke="#f0bd63" stroke-width="3"/><text x="612" y="220" text-anchor="middle" fill="#f0bd63" font-size="24">併用</text><text x="612" y="260" text-anchor="middle" fill="white" font-size="20">入口と募集を分ける</text><rect x="785" y="30" width="330" height="125" rx="24" fill="#1c3560" stroke="#7da8ef" stroke-width="3"/><text x="950" y="85" text-anchor="middle" fill="#7da8ef" font-size="24">移行</text><text x="950" y="125" text-anchor="middle" fill="white" font-size="20">募集の反復運用</text></g></g></svg>

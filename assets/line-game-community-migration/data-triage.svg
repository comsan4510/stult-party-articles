<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">移行データを選別する仕分け図</title><desc id="d">現在状態を持っていき過去ログをLINEに残す</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="80" y="90" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="3">DATA TRIAGE</text><text x="80" y="155" fill="#fff" font-size="46" font-weight="800">会話ログではなく、現在の運営状態を移す</text><g transform="translate(80 230)" font-weight="700"><rect width="530" height="430" rx="28" fill="#172b49" stroke="#7da8ef" stroke-width="3"/><text x="45" y="65" fill="#7da8ef" font-size="24">持っていく</text><g fill="white" font-size="25"><text x="45" y="130">目的・対象者・活動時間</text><text x="45" y="190">現在有効なルール</text><text x="45" y="250">担当者と権限</text><text x="45" y="310">ゲーム募集の形式</text><text x="45" y="370">現在も有効なFAQ</text></g><rect x="670" width="530" height="430" rx="28" fill="#26313d" stroke="#8291a1" stroke-width="3"/><text x="715" y="65" fill="#aeb9c5" font-size="24">LINE側に残す</text><g fill="white" font-size="25"><text x="715" y="130">過去の雑談</text><text x="715" y="190">終了した募集</text><text x="715" y="250">重複した案内</text><text x="715" y="310">古いルール</text><text x="715" y="370">一時共有ファイル</text></g><path d="M565 215H635" stroke="#f0bd63" stroke-width="7"/><circle cx="600" cy="215" r="50" fill="#4b402f" stroke="#f0bd63" stroke-width="3"/><text x="600" y="208" text-anchor="middle" fill="#f0bd63" font-size="18">今後も</text><text x="600" y="233" text-anchor="middle" fill="#f0bd63" font-size="18">必要？</text></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">四週間の段階的な移行ロードマップ</title><desc id="d">目的決定、試行、二重運用、切替判定の四段階</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="80" y="90" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="3">4-WEEK ROADMAP</text><text x="80" y="155" fill="#fff" font-size="46" font-weight="800">一気に閉じず、役割を段階的に切り替える</text><g transform="translate(80 270)" text-anchor="middle" font-weight="700"><path d="M100 165H1180" stroke="#526d88" stroke-width="10"/><g transform="translate(0)"><circle cx="150" cy="165" r="72" fill="#12342f" stroke="#61dbc5" stroke-width="4"/><text x="150" y="157" fill="white" font-size="31">第1週</text><text x="150" y="195" fill="#61dbc5" font-size="20">目的を決定</text><rect x="25" y="280" width="250" height="95" rx="18" fill="#14283d"/><text x="150" y="320" fill="white" font-size="20">成功条件を</text><text x="150" y="350" fill="white" font-size="20">行動で決める</text></g><g transform="translate(300)"><circle cx="150" cy="165" r="72" fill="#172b49" stroke="#7da8ef" stroke-width="4"/><text x="150" y="157" fill="white" font-size="31">第2週</text><text x="150" y="195" fill="#7da8ef" font-size="20">5人で試行</text><rect x="25" y="280" width="250" height="95" rx="18" fill="#14283d"/><text x="150" y="320" fill="white" font-size="20">募集からボイスまで</text><text x="150" y="350" fill="white" font-size="20">実際に通す</text></g><g transform="translate(600)"><circle cx="150" cy="165" r="72" fill="#55452f" stroke="#f0bd63" stroke-width="4"/><text x="150" y="157" fill="white" font-size="31">第3週</text><text x="150" y="195" fill="#f0bd63" font-size="20">二重運用</text><rect x="25" y="280" width="250" height="95" rx="18" fill="#14283d"/><text x="150" y="320" fill="white" font-size="20">旧側は要約と</text><text x="150" y="350" fill="white" font-size="20">入口だけにする</text></g><g transform="translate(900)"><circle cx="150" cy="165" r="72" fill="#553d60" stroke="#c991db" stroke-width="4"/><text x="150" y="157" fill="white" font-size="31">第4週</text><text x="150" y="195" fill="#c991db" font-size="20">切替判定</text><rect x="25" y="280" width="250" height="95" rx="18" fill="#14283d"/><text x="150" y="320" fill="white" font-size="20">募集成立と</text><text x="150" y="350" fill="white" font-size="20">負担減を確認</text></g></g></g></svg>

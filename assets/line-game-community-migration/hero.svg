<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">LINE運営を継続するか移行するかの全体像</title><desc id="d">連絡中心の運営からゲーム募集中心の運営へ役割を分ける図</desc><rect width="1440" height="810" fill="#081525"/><path d="M0 160H1440M0 320H1440M0 480H1440M0 640H1440M240 0V810M480 0V810M720 0V810M960 0V810M1200 0V810" stroke="#203a52" opacity=".45"/><g font-family="sans-serif"><text x="80" y="90" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="4">PLATFORM MIGRATION</text><text x="80" y="175" fill="#f7f9ff" font-size="54" font-weight="800">連絡の場所と、</text><text x="80" y="245" fill="#f7f9ff" font-size="54" font-weight="800">ゲーム募集の場所を整理する</text><g transform="translate(80 350)" font-weight="700"><rect width="535" height="245" rx="30" fill="#12342f" stroke="#61dbc5" stroke-width="3"/><text x="48" y="60" fill="#61dbc5" font-size="22">LINE</text><text x="48" y="118" fill="white" font-size="34">友人同士の連絡</text><text x="48" y="165" fill="#b2cdc8" font-size="23">雑談・写真・既存の関係</text><rect x="745" width="535" height="245" rx="30" fill="#172b49" stroke="#7da8ef" stroke-width="3"/><text x="793" y="60" fill="#7da8ef" font-size="22">STULT PARTY</text><text x="793" y="118" fill="white" font-size="34">反復するゲーム募集</text><text x="793" y="165" fill="#b8c9e4" font-size="23">募集・チャット・ボイス</text><path d="M570 122H710" stroke="#f0bd63" stroke-width="7"/><path d="m695 107 28 15-28 15" fill="#f0bd63"/><text x="640" y="92" text-anchor="middle" fill="#f0bd63" font-size="19">役割を移す</text></g><rect x="370" y="680" width="700" height="64" rx="32" fill="#1b304a"/><text x="720" y="722" text-anchor="middle" fill="#f0bd63" font-family="sans-serif" font-size="22" font-weight="700">ツールではなく、運営課題で判断する</text></g></svg>

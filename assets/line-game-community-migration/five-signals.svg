<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">LINE運営の限界を示す五つの兆候</title><desc id="d">埋没、転記、人数確認、通話案内、長い説明の五つ</desc><rect width="1440" height="810" fill="#081525"/><g font-family="sans-serif"><text x="80" y="90" fill="#61dbc5" font-size="22" font-weight="700" letter-spacing="3">FIVE SIGNALS</text><text x="80" y="155" fill="#fff" font-size="46" font-weight="800">手作業が構造を補い始めたら見直す</text><g transform="translate(80 235)" font-weight="700"><g><rect width="390" height="190" rx="25" fill="#12342f" stroke="#61dbc5" stroke-width="2"/><text x="35" y="58" fill="#61dbc5" font-size="22">01</text><text x="35" y="110" fill="white" font-size="29">募集が埋もれる</text><text x="35" y="150" fill="#abc7c2" font-size="20">同じ質問が繰り返される</text></g><g transform="translate(405)"><rect width="390" height="190" rx="25" fill="#1c3560" stroke="#7da8ef" stroke-width="2"/><text x="35" y="58" fill="#7da8ef" font-size="22">02</text><text x="35" y="110" fill="white" font-size="29">条件を転記する</text><text x="35" y="150" fill="#b7c8e2" font-size="20">ゲーム・日時・人数を再入力</text></g><g transform="translate(810)"><rect width="390" height="190" rx="25" fill="#55452f" stroke="#f0bd63" stroke-width="2"/><text x="35" y="58" fill="#f0bd63" font-size="22">03</text><text x="35" y="110" fill="white" font-size="29">人数を数え直す</text><text x="35" y="150" fill="#dbc8a5" font-size="20">表明と確定が分かれる</text></g><g transform="translate(202 215)"><rect width="390" height="190" rx="25" fill="#553d60" stroke="#c991db" stroke-width="2"/><text x="35" y="58" fill="#c991db" font-size="22">04</text><text x="35" y="110" fill="white" font-size="29">通話先を案内する</text><text x="35" y="150" fill="#d4bbdc" font-size="20">遊ぶ組ごとに誘導が必要</text></g><g transform="translate(607 215)"><rect width="390" height="190" rx="25" fill="#285844" stroke="#79dfac" stroke-width="2"/><text x="35" y="58" fill="#79dfac" font-size="22">05</text><text x="35" y="110" fill="white" font-size="29">説明が長くなる</text><text x="35" y="150" fill="#b7d5c6" font-size="20">参加後の手順が暗黙知</text></g></g><rect x="390" y="690" width="660" height="62" rx="31" fill="#1b304a"/><text x="720" y="731" text-anchor="middle" fill="#f0bd63" font-size="21" font-weight="700">三つ以上重なったら、移行を試す</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">REFERRAL DATA MODEL</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">参加・初回プレイ・再参加を別の状態で測る</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">個人情報を増やさず、受け入れ導線の改善に使う</text><g font-family="Arial,sans-serif"><rect x="80" y="235" width="500" height="410" rx="26" fill="#102a3e" stroke="#55e6cf" stroke-width="3"/><text x="130" y="295" fill="#55e6cf" font-size="15" font-weight="700">MINIMUM FIELDS</text><g fill="#b8c7d4" font-size="18"><text x="130" y="360">referral_id / campaign_code</text><text x="130" y="405">invite_link_id / joined_at</text><text x="130" y="450">first_action_at</text><text x="130" y="495">first_play_at / returned_at</text><text x="130" y="540">day14_status / support_count</text><text x="130" y="585">safety_case_flag</text></g><path d="M580 440H700" stroke="#7894aa" stroke-width="5"/><path d="M700 440l-18-12v24z" fill="#7894aa"/><rect x="700" y="270" width="660" height="340" rx="26" fill="#102a3e" stroke="#ffb84d" stroke-width="3"/><text x="750" y="330" fill="#ffb84d" font-size="15" font-weight="700">STATE ROUTE</text><g font-size="20" font-weight="700"><rect x="750" y="385" width="150" height="75" rx="14" fill="#1a3043" stroke="#7f9bb1"/><text x="825" y="432" fill="#fff" text-anchor="middle">joined</text><path d="M900 423H970" stroke="#7894aa" stroke-width="4"/><path d="M970 423l-14-10v20z" fill="#7894aa"/><rect x="970" y="385" width="150" height="75" rx="14" fill="#153f45" stroke="#55e6cf"/><text x="1045" y="432" fill="#fff" text-anchor="middle">first play</text><path d="M1120 423H1190" stroke="#7894aa" stroke-width="4"/><path d="M1190 423l-14-10v20z" fill="#7894aa"/><rect x="1190" y="385" width="120" height="75" rx="14" fill="#47361e" stroke="#ffb84d"/><text x="1250" y="432" fill="#fff" text-anchor="middle">return</text></g><text x="1030" y="530" fill="#b8c7d4" font-size="18" text-anchor="middle">招待数ではなく、活動への接続を評価</text></g></svg>

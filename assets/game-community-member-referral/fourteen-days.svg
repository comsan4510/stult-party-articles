<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">FIRST 14 DAYS</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">紹介者へ丸投げせず、運営が初回プレイへつなぐ</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">参加直後・24時間・7日・14日の役割を分ける</text><g font-family="Arial,sans-serif"><rect x="60" y="285" width="300" height="280" rx="22" fill="#102a3e" stroke="#7f9bb1" stroke-width="3"/><rect x="400" y="285" width="300" height="280" rx="22" fill="#102a3e" stroke="#55e6cf" stroke-width="3"/><rect x="740" y="285" width="300" height="280" rx="22" fill="#102a3e" stroke="#ffb84d" stroke-width="3"/><rect x="1080" y="285" width="300" height="280" rx="22" fill="#102a3e" stroke="#d998e8" stroke-width="3"/><g text-anchor="middle" font-weight="700"><text x="210" y="340" fill="#7f9bb1" font-size="13">JOIN</text><text x="210" y="400" fill="#fff" font-size="27">運営が迎える</text><text x="550" y="340" fill="#55e6cf" font-size="13">24 HOURS</text><text x="550" y="400" fill="#fff" font-size="27">次の一歩</text><text x="890" y="340" fill="#ffb84d" font-size="13">7 DAYS</text><text x="890" y="400" fill="#fff" font-size="27">初回プレイ</text><text x="1230" y="340" fill="#d998e8" font-size="13">14 DAYS</text><text x="1230" y="400" fill="#fff" font-size="27">再参加を確認</text></g><g fill="#b8c7d4" font-size="17" text-anchor="middle"><text x="210" y="475">ルールと質問場所</text><text x="550" y="475">募集・会話を一つ</text><text x="890" y="475">相性のよい募集へ</text><text x="1230" y="475">迷いと運営負担</text></g></g><rect x="300" y="645" width="840" height="58" rx="14" fill="#102a3e" stroke="#25455e"/><text x="720" y="682" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">紹介者との一度きりの参加から、コミュニティの再参加へ</text></svg>

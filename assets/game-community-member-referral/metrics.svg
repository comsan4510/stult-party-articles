<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">REFERRAL QUALITY METRICS</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">招待の量より、参加後の活動と負担を見る</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">紹介制度を人数競争にしない</text><g font-family="Arial,sans-serif"><g fill="#102a3e"><rect x="45" y="275" width="250" height="300" rx="22" stroke="#55e6cf" stroke-width="3"/><rect x="320" y="275" width="250" height="300" rx="22" stroke="#7f9bb1" stroke-width="3"/><rect x="595" y="275" width="250" height="300" rx="22" stroke="#ffb84d" stroke-width="3"/><rect x="870" y="275" width="250" height="300" rx="22" stroke="#d998e8" stroke-width="3"/><rect x="1145" y="275" width="250" height="300" rx="22" stroke="#ff7070" stroke-width="3"/></g><g text-anchor="middle" font-weight="700"><text x="170" y="330" fill="#55e6cf" font-size="13">01 ACCEPT</text><text x="170" y="385" fill="#fff" font-size="24">招待</text><text x="170" y="420" fill="#fff" font-size="24">受諾率</text><text x="445" y="330" fill="#7f9bb1" font-size="13">02 ACTION</text><text x="445" y="385" fill="#fff" font-size="24">初回</text><text x="445" y="420" fill="#fff" font-size="24">行動率</text><text x="720" y="330" fill="#ffb84d" font-size="13">03 PLAY</text><text x="720" y="385" fill="#fff" font-size="24">初回</text><text x="720" y="420" fill="#fff" font-size="24">プレイ率</text><text x="995" y="330" fill="#d998e8" font-size="13">04 RETURN</text><text x="995" y="385" fill="#fff" font-size="24">14日</text><text x="995" y="420" fill="#fff" font-size="24">再参加率</text><text x="1270" y="330" fill="#ff7070" font-size="13">05 LOAD</text><text x="1270" y="385" fill="#fff" font-size="24">運営負担</text></g><g fill="#b8c7d4" font-size="16" text-anchor="middle"><text x="170" y="500">案内から参加へ</text><text x="445" y="500">募集・会話へ到達</text><text x="720" y="500">実際に遊べたか</text><text x="995" y="500">もう一度活動</text><text x="1270" y="500">案内と個別調整</text></g></g><rect x="350" y="650" width="740" height="58" rx="14" fill="#102a3e" stroke="#25455e"/><text x="720" y="687" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">紹介者の順位ではなく、受け入れ導線を改善する</text></svg>

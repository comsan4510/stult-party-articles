<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">FIVE PROGRAM DECISIONS</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">紹介を頼む前に、受け入れ条件を決める</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">人数目標ではなく、活動上の不足から逆算する</text><g font-family="Arial,sans-serif"><g fill="#102a3e"><rect x="45" y="275" width="250" height="300" rx="22" stroke="#55e6cf" stroke-width="3"/><rect x="320" y="275" width="250" height="300" rx="22" stroke="#7f9bb1" stroke-width="3"/><rect x="595" y="275" width="250" height="300" rx="22" stroke="#ffb84d" stroke-width="3"/><rect x="870" y="275" width="250" height="300" rx="22" stroke="#d998e8" stroke-width="3"/><rect x="1145" y="275" width="250" height="300" rx="22" stroke="#ff7070" stroke-width="3"/></g><g text-anchor="middle" font-weight="700"><text x="170" y="330" fill="#55e6cf" font-size="13">01 WHY</text><text x="170" y="395" fill="#fff" font-size="25">募集理由</text><text x="445" y="330" fill="#7f9bb1" font-size="13">02 WHO</text><text x="445" y="395" fill="#fff" font-size="25">対象者</text><text x="720" y="330" fill="#ffb84d" font-size="13">03 EXCLUDE</text><text x="720" y="395" fill="#fff" font-size="25">対象外</text><text x="995" y="330" fill="#d998e8" font-size="13">04 CAPACITY</text><text x="995" y="380" fill="#fff" font-size="25">受け入れ</text><text x="995" y="415" fill="#fff" font-size="25">可能人数</text><text x="1270" y="330" fill="#ff7070" font-size="13">05 PERIOD</text><text x="1270" y="395" fill="#fff" font-size="25">実施期間</text></g><g fill="#b8c7d4" font-size="16" text-anchor="middle"><text x="170" y="500">活動の不足を一文に</text><text x="445" y="500">時間・方針・会話</text><text x="720" y="500">無断転載など</text><text x="995" y="500">案内できる範囲</text><text x="1270" y="500">14〜30日で試行</text></g></g><rect x="340" y="650" width="760" height="58" rx="14" fill="#102a3e" stroke="#25455e"/><text x="720" y="687" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">紹介者が判断でき、運営が迎えられる範囲に限定する</text></svg>

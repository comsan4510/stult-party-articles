<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">MEMBER REFERRAL ROUTE</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">紹介数ではなく、初回プレイまでを設計する</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">対象・招待・受け入れ・再参加を一つの流れにする</text><g font-family="Arial,sans-serif"><circle cx="180" cy="390" r="105" fill="#102a3e" stroke="#7f9bb1" stroke-width="3"/><text x="180" y="375" fill="#7f9bb1" font-size="13" font-weight="700" text-anchor="middle">01 TARGET</text><text x="180" y="420" fill="#fff" font-size="25" font-weight="700" text-anchor="middle">対象を決める</text><path d="M285 390H395" stroke="#7894aa" stroke-width="5"/><path d="M395 390l-18-12v24z" fill="#7894aa"/><circle cx="500" cy="390" r="105" fill="#102a3e" stroke="#55e6cf" stroke-width="3"/><text x="500" y="375" fill="#55e6cf" font-size="13" font-weight="700" text-anchor="middle">02 INVITE</text><text x="500" y="420" fill="#fff" font-size="25" font-weight="700" text-anchor="middle">リンクを共有</text><path d="M605 390H715" stroke="#7894aa" stroke-width="5"/><path d="M715 390l-18-12v24z" fill="#7894aa"/><circle cx="820" cy="390" r="105" fill="#102a3e" stroke="#ffb84d" stroke-width="3"/><text x="820" y="375" fill="#ffb84d" font-size="13" font-weight="700" text-anchor="middle">03 WELCOME</text><text x="820" y="420" fill="#fff" font-size="25" font-weight="700" text-anchor="middle">運営が案内</text><path d="M925 390H1035" stroke="#7894aa" stroke-width="5"/><path d="M1035 390l-18-12v24z" fill="#7894aa"/><circle cx="1140" cy="390" r="105" fill="#102a3e" stroke="#d998e8" stroke-width="3"/><text x="1140" y="375" fill="#d998e8" font-size="13" font-weight="700" text-anchor="middle">04 PLAY</text><text x="1140" y="420" fill="#fff" font-size="25" font-weight="700" text-anchor="middle">初回プレイ</text><rect x="1265" y="325" width="125" height="130" rx="18" fill="#153f45" stroke="#55e6cf" stroke-width="3"/><text x="1327" y="375" fill="#55e6cf" font-size="12" font-weight="700" text-anchor="middle">DAY 14</text><text x="1327" y="415" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">再参加</text><rect x="300" y="600" width="840" height="60" rx="14" fill="#102a3e" stroke="#25455e"/><text x="720" y="638" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">招待した時点を成功にせず、一緒に遊べたかを見る</text></g></svg>

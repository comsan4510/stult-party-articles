<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">INVITE LINK LEDGER</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">招待リンクを、用途・期限・上限で管理する</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">無期限の共通リンクから、停止できる入口へ</text><g font-family="Arial,sans-serif"><rect x="90" y="235" width="1260" height="415" rx="26" fill="#102a3e" stroke="#55e6cf" stroke-width="3"/><text x="145" y="295" fill="#55e6cf" font-size="15" font-weight="700">LINK REF-NOV-A</text><g font-size="19"><text x="145" y="360" fill="#9db0c3">施策</text><text x="350" y="360" fill="#fff">11月紹介週間</text><text x="145" y="415" fill="#9db0c3">共有方法</text><text x="350" y="415" fill="#fff">本人への直接共有</text><text x="145" y="470" fill="#9db0c3">発行</text><text x="350" y="470" fill="#fff">11月6日 09:00</text><text x="720" y="360" fill="#9db0c3">期限</text><text x="920" y="360" fill="#fff">11月20日 23:59</text><text x="720" y="415" fill="#9db0c3">使用</text><text x="920" y="415" fill="#fff">2 / 5</text><text x="720" y="470" fill="#9db0c3">担当</text><text x="920" y="470" fill="#fff">運営・案内担当</text></g><rect x="145" y="535" width="500" height="70" rx="15" fill="#153f45"/><text x="395" y="578" fill="#55e6cf" font-size="18" font-weight="700" text-anchor="middle">受け入れ上限に達したら停止</text><rect x="720" y="535" width="500" height="70" rx="15" fill="#47361e"/><text x="970" y="578" fill="#ffb84d" font-size="18" font-weight="700" text-anchor="middle">意図しない転載を確認したら無効化</text></g></svg>

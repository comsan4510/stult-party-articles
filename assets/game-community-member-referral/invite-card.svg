<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">REFERRAL BRIEF</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">紹介者が、そのまま転送できる案内を作る</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">対象、参加後の流れ、リンク条件を一枚にまとめる</text><rect x="145" y="225" width="1150" height="475" rx="28" fill="#102a3e" stroke="#55e6cf" stroke-width="3"/><g font-family="Arial,sans-serif"><text x="205" y="285" fill="#55e6cf" font-size="15" font-weight="700">MEMBER REFERRAL</text><text x="205" y="340" fill="#fff" font-size="30" font-weight="700">平日22時の協力プレイメンバー</text><line x1="205" y1="375" x2="1235" y2="375" stroke="#25455e" stroke-width="2"/><text x="205" y="425" fill="#9db0c3" font-size="16">探している方</text><text x="430" y="425" fill="#fff" font-size="20">活動時間・ゲーム・遊び方が合う</text><text x="205" y="480" fill="#9db0c3" font-size="16">参加後</text><text x="430" y="480" fill="#fff" font-size="20">案内確認 → 募集選択 → 初回プレイ</text><text x="205" y="535" fill="#9db0c3" font-size="16">共有方法</text><text x="430" y="535" fill="#fff" font-size="20">本人へ直接。公開投稿への転載はしない</text><text x="205" y="590" fill="#9db0c3" font-size="16">リンク条件</text><text x="430" y="590" fill="#fff" font-size="20">11月20日まで・最大5回</text><rect x="875" y="620" width="360" height="48" rx="12" fill="#153f45"/><text x="1055" y="651" fill="#55e6cf" font-size="16" font-weight="700" text-anchor="middle">参加意思を確認してから共有</text></g></svg>

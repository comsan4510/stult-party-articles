<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#071827"/><text x="72" y="70" fill="#55e6cf" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">SIX REFERRAL RISKS</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">紹介者の善意だけに依存しない</text><text x="72" y="172" fill="#9db0c3" font-family="Arial,sans-serif" font-size="18">対象・説明・リンク・受け入れ・評価・責任を点検する</text><g font-family="Arial,sans-serif" font-weight="700"><g fill="#102a3e"><rect x="70" y="245" width="390" height="150" rx="20" stroke="#7f9bb1" stroke-width="3"/><rect x="525" y="245" width="390" height="150" rx="20" stroke="#ffb84d" stroke-width="3"/><rect x="980" y="245" width="390" height="150" rx="20" stroke="#55e6cf" stroke-width="3"/><rect x="70" y="455" width="390" height="150" rx="20" stroke="#d998e8" stroke-width="3"/><rect x="525" y="455" width="390" height="150" rx="20" stroke="#ff7070" stroke-width="3"/><rect x="980" y="455" width="390" height="150" rx="20" stroke="#ffb84d" stroke-width="3"/></g><g fill="#fff" font-size="23" text-anchor="middle"><text x="265" y="335">対象が曖昧</text><text x="720" y="335">説明を丸投げ</text><text x="1175" y="335">無期限リンク</text><text x="265" y="545">案内担当なし</text><text x="720" y="545">人数だけ評価</text><text x="1175" y="545">紹介者が連帯責任</text></g><g font-size="13" text-anchor="middle"><text x="265" y="292" fill="#7f9bb1">01 TARGET</text><text x="720" y="292" fill="#ffb84d">02 EXPLAIN</text><text x="1175" y="292" fill="#55e6cf">03 LINK</text><text x="265" y="502" fill="#d998e8">04 WELCOME</text><text x="720" y="502" fill="#ff7070">05 METRIC</text><text x="1175" y="502" fill="#ffb84d">06 RESPONSIBILITY</text></g></g><rect x="340" y="680" width="760" height="58" rx="14" fill="#102a3e" stroke="#25455e"/><text x="720" y="717" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">紹介は入口、参加後の運営責任はコミュニティが持つ</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">対立発生直後の2時間で行うこと</title><desc id="d">公開応酬停止、期限提示、事実保全、安全相談の4項目</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">FIRST TWO HOURS</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">結論より先に、公開の応酬を止める</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">一時停止は処罰ではなく、状況を悪化させない措置</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(85 275)"><rect width="290" height="285" rx="24" fill="#10253a" stroke="#f07e9c" stroke-width="3"/><text x="145" y="62" fill="#f07e9c" font-size="18">00:00</text><text x="145" y="116" fill="#f4f7fb" font-size="27" font-weight="700">応酬を停止</text><text x="145" y="168" fill="#9db0c3" font-size="18">返信・引用・拡散を</text><text x="145" y="198" fill="#9db0c3" font-size="18">いったん止める</text></g><g transform="translate(415 275)"><rect width="290" height="285" rx="24" fill="#10253a" stroke="#7da8ef" stroke-width="3"/><text x="145" y="62" fill="#7da8ef" font-size="18">00:15</text><text x="145" y="116" fill="#f4f7fb" font-size="27" font-weight="700">期限を提示</text><text x="145" y="168" fill="#9db0c3" font-size="18">次の報告時刻と</text><text x="145" y="198" fill="#9db0c3" font-size="18">担当者を知らせる</text></g><g transform="translate(745 275)"><rect width="290" height="285" rx="24" fill="#10253a" stroke="#f0bd63" stroke-width="3"/><text x="145" y="62" fill="#f0bd63" font-size="18">00:30</text><text x="145" y="116" fill="#f4f7fb" font-size="27" font-weight="700">事実を保全</text><text x="145" y="168" fill="#9db0c3" font-size="18">時刻・場所・原文を</text><text x="145" y="198" fill="#9db0c3" font-size="18">変更せず参照する</text></g><g transform="translate(1075 275)"><rect width="290" height="285" rx="24" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="145" y="62" fill="#61dbc5" font-size="18">00:45–02:00</text><text x="145" y="116" fill="#f4f7fb" font-size="27" font-weight="700">安全を確認</text><text x="145" y="168" fill="#9db0c3" font-size="18">脅迫・晒し・接触の</text><text x="145" y="198" fill="#9db0c3" font-size="18">継続がないか確認</text></g></g><rect x="275" y="650" width="890" height="66" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="692" text-anchor="middle" fill="#f4f7fb" font-family="sans-serif" font-size="22" font-weight="700">多数決・合同ボイス・運営者の即断はまだ行わない</text></svg>

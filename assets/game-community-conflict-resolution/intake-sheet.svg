<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">事実・影響・必要条件・許容範囲を聞くシート</title><desc id="d">当事者へ別々に同じ4項目を確認する図</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">SEPARATE INTAKE</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">別々に、同じ4項目を聞く</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">人物評価を、観察できる条件へ変換する</text><g font-family="sans-serif"><g transform="translate(85 245)"><rect width="600" height="190" rx="22" fill="#10253a" stroke="#7da8ef" stroke-width="3"/><text x="35" y="51" fill="#7da8ef" font-size="18" font-weight="700">01 FACTS</text><text x="35" y="100" fill="#f4f7fb" font-size="29" font-weight="700">実際に起きたこと</text><text x="35" y="145" fill="#9db0c3" font-size="19">発言・行動・日時・場所</text></g><g transform="translate(755 245)"><rect width="600" height="190" rx="22" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="35" y="51" fill="#c991db" font-size="18" font-weight="700">02 IMPACTS</text><text x="35" y="100" fill="#f4f7fb" font-size="29" font-weight="700">参加へ出た影響</text><text x="35" y="145" fill="#9db0c3" font-size="19">募集停止・退出・発言困難など</text></g><g transform="translate(85 475)"><rect width="600" height="190" rx="22" fill="#10253a" stroke="#f0bd63" stroke-width="3"/><text x="35" y="51" fill="#f0bd63" font-size="18" font-weight="700">03 NEEDS</text><text x="35" y="100" fill="#f4f7fb" font-size="29" font-weight="700">今後守ってほしい条件</text><text x="35" y="145" fill="#9db0c3" font-size="19">経験・ボイス・終了時刻など</text></g><g transform="translate(755 475)"><rect width="600" height="190" rx="22" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="35" y="51" fill="#61dbc5" font-size="18" font-weight="700">04 RANGE</text><text x="35" y="100" fill="#f4f7fb" font-size="29" font-weight="700">受け入れられる範囲</text><text x="35" y="145" fill="#9db0c3" font-size="19">別募集・時間分離・距離を置く</text></g></g><rect x="400" y="718" width="640" height="50" rx="25" fill="#153f49"/><text x="720" y="751" text-anchor="middle" fill="#61dbc5" font-family="sans-serif" font-size="19" font-weight="700">「相手をどう思うか」は聞かない</text></svg>

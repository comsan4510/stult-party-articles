<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">意見対立案件の状態遷移モデル</title><desc id="d">受付から停止、個別確認、論点化、選択肢、試行、終了へ進む状態</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">CASE STATES</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">「対応中」を7つの状態へ分ける</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">誰が何を待っているかを明確にする</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(35 280)"><rect width="175" height="115" rx="18" fill="#10253a" stroke="#7890a8" stroke-width="3"/><text x="87" y="45" fill="#9db0c3" font-size="15">received</text><text x="87" y="82" fill="#f4f7fb" font-size="23" font-weight="700">受付</text></g><g transform="translate(235 280)"><rect width="175" height="115" rx="18" fill="#10253a" stroke="#f07e9c" stroke-width="3"/><text x="87" y="45" fill="#f07e9c" font-size="15">paused</text><text x="87" y="82" fill="#f4f7fb" font-size="23" font-weight="700">公開停止</text></g><g transform="translate(435 280)"><rect width="175" height="115" rx="18" fill="#10253a" stroke="#7da8ef" stroke-width="3"/><text x="87" y="45" fill="#7da8ef" font-size="15">intake</text><text x="87" y="82" fill="#f4f7fb" font-size="23" font-weight="700">個別確認</text></g><g transform="translate(635 280)"><rect width="175" height="115" rx="18" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="87" y="45" fill="#c991db" font-size="15">framed</text><text x="87" y="82" fill="#f4f7fb" font-size="23" font-weight="700">論点化</text></g><g transform="translate(835 280)"><rect width="175" height="115" rx="18" fill="#10253a" stroke="#f0bd63" stroke-width="3"/><text x="87" y="45" fill="#f0bd63" font-size="15">options</text><text x="87" y="82" fill="#f4f7fb" font-size="23" font-weight="700">選択肢</text></g><g tran
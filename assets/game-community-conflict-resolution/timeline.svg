<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">72時間で仲裁を進めるタイムライン</title><desc id="d">停止、個別確認、論点化、選択肢、決定、試行開始の時系列</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">72-HOUR TIMELINE</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">72時間で、次の行動まで決める</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">完全解決ではなく、試行と見直し日を確定する</text><path d="M120 405H1320" stroke="#29465f" stroke-width="12" stroke-linecap="round"/><g font-family="sans-serif" text-anchor="middle"><g transform="translate(140 405)"><circle r="60" fill="#412531" stroke="#f07e9c" stroke-width="4"/><text y="-5" fill="#f07e9c" font-size="17">0–2h</text><text y="27" fill="#f4f7fb" font-size="21" font-weight="700">停止</text><text y="110" fill="#f4f7fb" font-size="19">応酬と安全</text></g><g transform="translate(370 405)"><circle r="60" fill="#24395e" stroke="#7da8ef" stroke-width="4"/><text y="-5" fill="#7da8ef" font-size="17">2–24h</text><text y="27" fill="#f4f7fb" font-size="21" font-weight="700">個別確認</text><text y="110" fill="#f4f7fb" font-size="19">4項目を聞く</text></g><g transform="translate(600 405)"><circle r="60" fill="#42304f" stroke="#c991db" stroke-width="4"/><text y="-5" fill="#c991db" font-size="17">24–36h</text><text y="27" fill="#f4f7fb" font-size="21" font-weight="700">論点化</text><text y="110" fill="#f4f7fb" font-size="19">守る条件を置く</text></g><g transform="translate(830 405)"><circle r="60" fill="#4a3822" stroke="#f0bd63" stroke-width="4"/><text y="-5" fill="#f0bd63" font-size="17">36–48h</text><text y="27" fill="#f4f7fb" font-size="21" font-weight="700">3案</text><text y="110" fill="#f4f7fb" font-size="19">共存案を作る</text></g><g transform="translate(1060 405)"><circle r="60" fill="#153f49" stroke="#61dbc5" stroke-width="4"/><text y="-5" fill="#61dbc5" font-size="17">48–72h</text><text y="27" fill="#f4f7fb" font-size="21" font-weight="700">決定</text><text y="110" fill="#f4f7fb" font-size="19">理由と期限</text></g><g transform="translate(1290 405)"><circle r="60" fill="#204235" stroke="#79dfac" stroke-width="4"/><text y="-5" fill="#79dfac" font-size="17">NEXT</text><text y="27" fill="#f4f7fb" font-size="21" font-weight="700">試行</text><text y="110" fill="#f4f7fb" font-size="19">結果を観察</text></g></g><rect x="280" y="650" width="880" height="69" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="693" text-anchor="middle" fill="#f4f7fb" font-family="sans-serif" font-size="22" font-weight="700">謝罪の強制ではなく、行動と募集設計を変える</text></svg>

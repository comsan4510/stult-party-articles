<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">募集分割・時間分割・期限付き試行の3選択肢</title><desc id="d">対立を共存へ変える3つの設計パターン</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">THREE OPTIONS</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">合意案を一つに絞らず、3案を作る</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">受け入れるか拒否するかの二択を避ける</text><g font-family="sans-serif"><g transform="translate(80 255)"><rect width="400" height="410" rx="26" fill="#10253a" stroke="#7da8ef" stroke-width="3"/><text x="40" y="63" fill="#7da8ef" font-size="18" font-weight="700">OPTION A</text><text x="40" y="118" fill="#f4f7fb" font-size="32" font-weight="700">募集を分ける</text><text x="40" y="185" fill="#c4d0dc" font-size="20">勝利優先 / 経験者</text><text x="40" y="228" fill="#9db0c3" font-size="18">と</text><text x="40" y="271" fill="#c4d0dc" font-size="20">練習中心 / 初心者</text><text x="40" y="340" fill="#d4e2f5" font-size="19">遊び方を選べる</text></g><g transform="translate(520 255)"><rect width="400" height="410" rx="26" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="40" y="63" fill="#c991db" font-size="18" font-weight="700">OPTION B</text><text x="40" y="118" fill="#f4f7fb" font-size="32" font-weight="700">時間を分ける</text><text x="40" y="185" fill="#c4d0dc" font-size="20">前半：練習</text><text x="40" y="228" fill="#9db0c3" font-size="18">または</text><text x="40" y="271" fill="#c4d0dc" font-size="20">曜日ごとに交代</text><text x="40" y="340" fill="#ead6f0" font-size="19">資源競合を減らす</text></g><g transform="translate(960 255)"><rect width="400" height="410" rx="26" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="40" y="63" fill="#61dbc5" font-size="18" font-weight="700">OPTION C</text><text x="40" y="118" fill="#f4f7fb" font-size="32" font-weight="700">期限付きで試す</text><text x="40" y="185" fill="#c4d0dc" font-size="20">期間：次の4募集</text><text x="40" y="228" fill="#c4d0dc" font-size="20">指標：成立・退出</text><text x="40" y="271" fill="#c4d0dc" font-size="20">見直し日を固定</text><text x="40" y="340" fill="#d0f1eb" font-size="19">結果で標準を決める</text></g></g><rect x="330" y="712" width="780" height="52" rx="26" fill="#153f49"/><text x="720" y="746" text-anchor="middle" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700">共存できる案を先に作り、人物の排除を最初にしない</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">違反・利害対立・認識違い・設計不足の分類</title><desc id="d">対立を5種類に分けて最初の対応を選ぶ図</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">CLASSIFY FIRST</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">話し合う前に、問題の種類を分ける</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">安全上の違反と、共存できる意見差を混ぜない</text><g font-family="sans-serif"><g fill="#10253a" stroke-width="3"><rect x="55" y="265" width="250" height="300" rx="22" stroke="#f07e9c"/><rect x="325" y="265" width="250" height="300" rx="22" stroke="#7da8ef"/><rect x="595" y="265" width="250" height="300" rx="22" stroke="#c991db"/><rect x="865" y="265" width="250" height="300" rx="22" stroke="#f0bd63"/><rect x="1135" y="265" width="250" height="300" rx="22" stroke="#79dfac"/></g><g font-size="18" font-weight="700"><text x="85" y="310" fill="#f07e9c">01</text><text x="355" y="310" fill="#7da8ef">02</text><text x="625" y="310" fill="#c991db">03</text><text x="895" y="310" fill="#f0bd63">04</text><text x="1165" y="310" fill="#79dfac">05</text></g><g fill="#f4f7fb" font-size="25" font-weight="700"><text x="85" y="363">明確な違反</text><text x="355" y="363">利害対立</text><text x="625" y="363">認識違い</text><text x="895" y="363">資源競合</text><text x="1165" y="363">設計不足</text></g><g fill="#9db0c3" font-size="17"><text x="85" y="415">脅迫・差別・晒し</text><text x="355" y="415">ガチ / カジュアル</text><text x="625" y="415">「初心者」の定義</text><text x="895" y="415">時間・枠・担当</text><text x="1165" y="415">条件・決定者が不明</text><text x="85" y="500" fill="#f7bdcc">先に安全確保</text><text x="355" y="500">希望条件を整理</text><text x="625" y="500">用語を明文化</text><text x="895" y="500">時間と場所を分離</text><text x="1165" y="500">運営手順を修正</text></g></g><rect x="330" y="660" width="780" height="64" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="701" text-anchor="middle" fill="#f4f7fb" font-family="sans-serif" font-size="22" font-weight="700">違反だけを仲裁しない。意見差だけを処罰しない</text></svg>

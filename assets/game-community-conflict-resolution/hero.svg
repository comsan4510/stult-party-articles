<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">ゲームコミュニティの意見対立を解決する全体フロー</title><desc id="d">公開討論停止から個別整理、論点化、選択肢、試行へ進む流れ</desc><rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">CONFLICT TO DESIGN</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="42" font-weight="700">意見を一致させず、参加条件を設計する</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">人物の勝ち負けではなく、次の募集を改善する</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(55 295)"><rect width="240" height="220" rx="22" fill="#10253a" stroke="#f07e9c" stroke-width="3"/><text x="120" y="61" fill="#f07e9c" font-size="18">STEP 1</text><text x="120" y="113" fill="#f4f7fb" font-size="25" font-weight="700">公開停止</text><text x="120" y="158" fill="#9db0c3" font-size="17">応酬を止める</text><text x="120" y="187" fill="#9db0c3" font-size="17">期限を伝える</text></g><g transform="translate(327 295)"><rect width="240" height="220" rx="22" fill="#10253a" stroke="#7da8ef" stroke-width="3"/><text x="120" y="61" fill="#7da8ef" font-size="18">STEP 2</text><text x="120" y="113" fill="#f4f7fb" font-size="25" font-weight="700">個別整理</text><text x="120" y="158" fill="#9db0c3" font-size="17">事実と影響を</text><text x="120" y="187" fill="#9db0c3" font-size="17">別々に聞く</text></g><g transform="translate(599 295)"><rect width="240" height="220" rx="22" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="120" y="61" fill="#c991db" font-size="18">STEP 3</text><text x="120" y="113" fill="#f4f7fb" font-size="25" font-weight="700">論点化</text><text x="120" y="158" fill="#9db0c3" font-size="17">人物評価を</text><text x="120" y="187" fill="#9db0c3" font-size="17">参加条件へ変える</text></g><g transform="translate(871 295)"><rect width="240" height="220" rx="22" fill="#10253a" stroke="#f0bd63" stroke-width="3"/><text x="120" y="61" fill="#f0bd63" font-size="18">STEP 4</text><text x="120" y="113" fill="#f4f7fb" font-size="25" font-weight="700">選択肢</text><text x="120" y="158" fill="#9db0c3" font-size="17">募集・時間・期間を</text><text x="120" y="187" fill="#9db0c3" font-size="17">分ける</text></g><g transform="translate(1143 295)"><rect width="240" height="220" rx="22" fill="#10253a" stroke="#79dfac" stroke-width="3"/><text x="120" y="61" fill="#79dfac" font-size="18">STEP 5</text><text x="120" y="113" fill="#f4f7fb" font-size="25" font-weight="700">期限付き試行</text><text x="120" y="158" fill="#9db0c3" font-size="17">結果を比較し</text><text x="120" y="187" fill="#9db0c3" font-size="17">標準を決める</text></g></g><g stroke="#7890a8" stroke-width="4"><path d="M295 405h20M567 405h20M839 405h20M1111 405h20"/></g><g fill="#7890a8"><path d="m315 405-13-8v16z"/><path d="m587 405-13-8v16z"/><path d="m859 405-13-8v16z"/><path d="m1131 405-13-8v16z"/></g><rect x="230" y="625" width="980" height="84" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="660" text-anchor="middle" fill="#f4f7fb" font-family="sans-serif" font-size="23" font-weight="700">運営者の役割は、全員を同じ意見にすることではない</text><text x="720" y="692" text-anchor="middle" fill="#61dbc5" font-family="sans-serif" font-size="19">共存できる募集条件と見直し日を作る</text></svg>

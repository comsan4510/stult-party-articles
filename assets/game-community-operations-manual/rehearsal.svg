<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#071925"/><text x="60" y="70" fill="#45e0d0" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700" letter-spacing="3">REHEARSAL TEST</text><text x="60" y="122" fill="#f4f8fb" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="34" font-weight="700">作成者以外が、口頭補足なしで試す</text>
  <g font-family="Arial, 'Noto Sans JP', sans-serif" text-anchor="middle">
    <rect x="65" y="225" width="235" height="175" rx="18" fill="#102f43" stroke="#45e0d0"/><text x="182" y="272" fill="#45e0d0" font-size="13" font-weight="700">01 FIND</text><text x="182" y="322" fill="#fff" font-size="23" font-weight="700">正本を探す</text><text x="182" y="359" fill="#8ba6b8" font-size="14">入口と名称</text>
    <path d="M300 312h45" stroke="#6f8da1" stroke-width="3"/><path d="M345 312l-12-8v16z" fill="#6f8da1"/>
    <rect x="345" y="225" width="235" height="175" rx="18" fill="#102f43" stroke="#ffb53e"/><text x="462" y="272" fill="#ffb53e" font-size="13" font-weight="700">02 EXECUTE</text><text x="462" y="322" fill="#fff" font-size="23" font-weight="700">手順を実行</text><text x="462" y="359" fill="#8ba6b8" font-size="14">一動作ずつ</text>
    <path d="M580 312h45" stroke="#6f8da1" stroke-width="3"/><path d="M625 312l-12-8v16z" fill="#6f8da1"/>
    <rect x="625" y="225" width="235" height="175" rx="18" fill="#102f43" stroke="#ff6b6b"/><text x="742" y="272" fill="#ff6b6b" font-size="13" font-weight="700">03 STOP</text><text x="742" y="322" fill="#fff" font-size="23" font-weight="700">境界で止まる</text><text x="742" y="359" fill="#8ba6b8" font-size="14">相談情報を確認</text>
    <path d="M860 312h45" stroke="#6f8da1" stroke-width="3"/><path d="M905 312l-12-8v16z" fill="#6f8da1"/>
    <rect x="905" y="225" width="230" height="175" rx="18" fill="#102f43" stroke="#c789d9"/><text x="1020" y="272" fill="#c789d9" font-size="13" font-weight="700">04 RECORD</text><text x="1020" y="322" fill="#fff" font-size="23" font-weight="700">迷いを記録</text><text x="1020" y="359" fill="#8ba6b8" font-size="14">質問位置・結果</text>
  </g>
  <rect x="250" y="490" width="700" height="64" rx="14" fill="#0e2c3f" stroke="#1f4b62"/><text x="600" y="529" text-anchor="middle" fill="#d8e5ed" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700">質問は担当者の失敗ではなく、文書を直すためのデータ</text>
</svg>

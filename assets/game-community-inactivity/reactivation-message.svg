<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">休眠メンバーへ送る選択肢付き案内</title><desc id="desc">変更点、具体的な日程、4つの選択肢、催促しない方針を含む案内</desc><rect width="1440" height="810" fill="#081525"/>
<text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">REACTIVATION MESSAGE</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">休眠メンバーへは、一度だけ具体的に</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">「戻って」ではなく、変わった点と選べる返答を示す</text>
<g font-family="sans-serif"><rect x="90" y="230" width="810" height="480" rx="28" fill="#10253a" stroke="#29465f" stroke-width="3"/><circle cx="145" cy="290" r="28" fill="#153f49"/><path d="M130 290h30M145 275v30" stroke="#61dbc5" stroke-width="5" stroke-linecap="round"/><text x="195" y="282" fill="#f4f7fb" font-size="24" font-weight="700">募集の時間帯と参加方法を見直しました</text><text x="195" y="317" fill="#9db0c3" font-size="19">毎週金曜21時／初心者・復帰者歓迎</text>
<g font-size="20"><rect x="140" y="365" width="710" height="58" rx="12" fill="#153f49"/><text x="166" y="402" fill="#cbeee7">1　日程が合えば参加したい</text><rect x="140" y="437" width="710" height="58" rx="12" fill="#182e49"/><text x="166" y="474" fill="#d4e2f5">2　別の曜日・時間なら参加したい</text><rect x="140" y="509" width="710" height="58" rx="12" fill="#3b3020"/><text x="166" y="546" fill="#f5ddb0">3　別のゲームなら参加したい</text><rect x="140" y="581" width="710" height="58" rx="12" fill="#352943"/><text x="166" y="618" fill="#ead6f0">4　今は参加予定がない</text></g><text x="140" y="678" fill="#9db0c3" font-size="18">返信がなくても追加の催促はしません</text>
<g transform="translate(985 270)"><rect width="355" height="360" rx="25" fill="#0e2134" stroke="#61dbc5" stroke-width="3"/><text x="36" y="63" fill="#61dbc5" font-size="18" font-weight="700">INCLUDE</text><text x="36" y="112" fill="#f4f7fb" font-size="25" font-weight="700">案内に含める4点</text><text x="36" y="168" fill="#c4d0dc" font-size="20">✓ 何を変えたか</text><text x="36" y="214" fill="#c4d0dc" font-size="20">✓ いつ参加できるか</text><text x="36" y="260" fill="#c4d0dc" font-size="20">✓ 返信の選択肢</text><text x="36" y="306" fill="#c4d0dc" font-size="20">✓ 催促しない約束</text></g></g></svg>

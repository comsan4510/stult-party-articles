<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">過疎化を4種類へ分ける診断図</title><desc id="desc">募集供給、条件不一致、参加摩擦、再参加断絶の4分類</desc>
<rect width="1440" height="810" fill="#081525"/><text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">FOUR TYPES</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">「静かになった」を4種類へ分ける</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">症状ではなく、流れが止まった位置を特定する</text>
<g font-family="sans-serif"><g transform="translate(80 240)"><rect width="610" height="205" rx="22" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="32" y="48" fill="#61dbc5" font-size="18" font-weight="700">TYPE 01</text><text x="32" y="94" fill="#f4f7fb" font-size="30" font-weight="700">募集供給型</text><text x="32" y="133" fill="#c4d0dc" font-size="20">募集を作る人が運営者だけ</text><text x="32" y="169" fill="#9db0c3" font-size="18">見る：募集作成者数・作成時の迷い</text><circle cx="520" cy="103" r="49" fill="#153f49"/><path d="M495 110h50M520 85v50" stroke="#61dbc5" stroke-width="8" stroke-linecap="round"/></g>
<g transform="translate(750 240)"><rect width="610" height="205" rx="22" fill="#10253a" stroke="#7da8ef" stroke-width="3"/><text x="32" y="48" fill="#7da8ef" font-size="18" font-weight="700">TYPE 02</text><text x="32" y="94" fill="#f4f7fb" font-size="30" font-weight="700">条件不一致型</text><text x="32" y="133" fill="#c4d0dc" font-size="20">募集はあるが必要人数が集まらない</text><text x="32" y="169" fill="#9db0c3" font-size="18">見る：時間・人数・経験・会話方法</text><circle cx="520" cy="103" r="49" fill="#24395e"/><path d="m493 91 22 24 35-43" fill="none" stroke="#7da8ef" stroke-width="8" stroke-linecap="round"/></g>
<g transform="translate(80 488)"><rect width="610" height="205" rx="22" fill="#10253a" stroke="#f0bd63" stroke-width="3"/><text x="32" y="48" fill="#f0bd63" font-size="18" font-weight="700">TYPE 03</text><text x="32" y="94" fill="#f4f7fb" font-size="30" font-weight="700">参加摩擦型</text><text x="32" y="133" fill="#c4d0dc" font-size="20">表明後に実際のプレイへ進まない</text><text x="32" y="169" fill="#9db0c3" font-size="18">見る：再通知・集合・初参加者対応</text><circle cx="520" cy="103" r="49" fill="#4a3822"/><path d="M486 103h68M520 69v68" stroke="#f0bd63" stroke-width="8" stroke-linecap="round"/></g>
<g transform="translate(750 488)"><rect width="610" height="205" rx="22" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="32" y="48" fill="#c991db" font-size="18" font-weight="700">TYPE 04</text><text x="32" y="94" fill="#f4f7fb" font-size="30" font-weight="700">再参加断絶型</text><text x="32" y="133" fill="#c4d0dc" font-size="20">一度遊んだ人が別の日に戻らない</text><text x="32" y="169" fill="#9db0c3" font-size="18">見る：次回案内・7日以内の再活動</text><circle cx="520" cy="103" r="49" fill="#42304f"/><path d="M545 91a31 31 0 1 0 2 29" fill="none" stroke="#c991db" stroke-width="8" stroke-linecap="round"/><path d="m548 72 2 25-24-4" fill="#c991db"/></g></g></svg>

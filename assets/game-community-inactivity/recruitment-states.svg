<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">募集を管理する状態遷移モデル</title><desc id="desc">下書きから受付中、成立、プレイ完了へ進み、中止と期限終了を分ける状態遷移</desc><rect width="1440" height="810" fill="#081525"/>
<text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">STATE MODEL</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">募集件数ではなく、状態の変化を記録する</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">未成立と中止を分けると、成立率を正しく評価できる</text>
<g font-family="sans-serif" text-anchor="middle"><g transform="translate(75 280)"><rect width="260" height="130" rx="22" fill="#10253a" stroke="#7890a8" stroke-width="3"/><text x="130" y="53" fill="#9db0c3" font-size="18">draft</text><text x="130" y="94" fill="#f4f7fb" font-size="28" font-weight="700">下書き</text></g><g transform="translate(400 280)"><rect width="260" height="130" rx="22" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="130" y="53" fill="#61dbc5" font-size="18">open</text><text x="130" y="94" fill="#f4f7fb" font-size="28" font-weight="700">参加受付中</text></g><g transform="translate(725 280)"><rect width="260" height="130" rx="22" fill="#10253a" stroke="#7da8ef" stroke-width="3"/><text x="130" y="53" fill="#7da8ef" font-size="18">filled</text><text x="130" y="94" fill="#f4f7fb" font-size="28" font-weight="700">必要人数到達</text></g><g transform="translate(1050 280)"><rect width="315" height="130" rx="22" fill="#10253a" stroke="#79dfac" stroke-width="3"/><text x="157.5" y="53" fill="#79dfac" font-size="18">played</text><text x="157.5" y="94" fill="#f4f7fb" font-size="28" font-weight="700">プレイ完了</text></g>
<g transform="translate(400 565)"><rect width="260" height="118" rx="22" fill="#211d2b" stroke="#c991db" stroke-width="3"/><text x="130" y="49" fill="#c991db" font-size="18">expired</text><text x="130" y="88" fill="#f4f7fb" font-size="26" font-weight="700">未成立で終了</text></g><g transform="translate(725 565)"><rect width="260" height="118" rx="22" fill="#30251d" stroke="#f0bd63" stroke-width="3"/><text x="130" y="49" fill="#f0bd63" font-size="18">cancelled</text><text x="130" y="88" fill="#f4f7fb" font-size="26" font-weight="700">別事情で中止</text></g></g>
<g stroke="#7890a8" stroke-width="4" fill="none"><path d="M335 345h53"/><path d="M660 345h53"/><path d="M985 345h53"/><path d="M530 410v143"/><path d="M855 410v143"/></g><g fill="#7890a8"><path d="m388 345-15-9v18z"/><path d="m713 345-15-9v18z"/><path d="m1038 345-15-9v18z"/><path d="m530 553-9-15h18z"/><path d="m855 553-9-15h18z"/></g>
<text x="530" y="516" text-anchor="middle" fill="#c991db" font-family="sans-serif" font-size="17">人数不足</text><text x="855" y="516" text-anchor="middle" fill="#f0bd63" font-family="sans-serif" font-size="17">主催都合など</text><rect x="370" y="728" width="700" height="50" rx="25" fill="#153f49"/><text x="720" y="761" text-anchor="middle" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700">created_at / filled_at / played_at / closed_at</text></svg>

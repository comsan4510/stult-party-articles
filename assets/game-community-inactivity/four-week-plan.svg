<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">4週間の過疎化回復ロードマップ</title><desc id="desc">診断、条件集中、作成者拡大、比較を1週間ずつ行う計画</desc><rect width="1440" height="810" fill="#081525"/>
<text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">4-WEEK PLAN</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">一度に一つ、4週間で回復を検証する</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">毎週の目的を固定し、施策前後を同じ定義で比べる</text>
<g font-family="sans-serif"><path d="M150 380H1290" stroke="#29465f" stroke-width="12" stroke-linecap="round"/><g text-anchor="middle"><g transform="translate(170 380)"><circle r="72" fill="#153f49" stroke="#61dbc5" stroke-width="4"/><text y="-7" fill="#61dbc5" font-size="18" font-weight="700">WEEK 1</text><text y="31" fill="#f4f7fb" font-size="27" font-weight="700">診断</text><text y="130" fill="#f4f7fb" font-size="22" font-weight="700">止まった型を選ぶ</text><text y="163" fill="#9db0c3" font-size="18">過去4週間を集計</text></g><g transform="translate(530 380)"><circle r="72" fill="#24395e" stroke="#7da8ef" stroke-width="4"/><text y="-7" fill="#7da8ef" font-size="18" font-weight="700">WEEK 2</text><text y="31" fill="#f4f7fb" font-size="27" font-weight="700">集中</text><text y="130" fill="#f4f7fb" font-size="22" font-weight="700">成立条件を絞る</text><text y="163" fill="#9db0c3" font-size="18">時間帯と書式を統一</text></g><g transform="translate(890 380)"><circle r="72" fill="#4a3822" stroke="#f0bd63" stroke-width="4"/><text y="-7" fill="#f0bd63" font-size="18" font-weight="700">WEEK 3</text><text y="31" fill="#f4f7fb" font-size="27" font-weight="700">拡大</text><text y="130" fill="#f4f7fb" font-size="22" font-weight="700">作成者を一人増やす</text><text y="163" fill="#9db0c3" font-size="18">共同で募集を作る</text></g><g transform="translate(1250 380)"><circle r="72" fill="#204235" stroke="#79dfac" stroke-width="4"/><text y="-7" fill="#79dfac" font-size="18" font-weight="700">WEEK 4</text><text y="31" fill="#f4f7fb" font-size="27" font-weight="700">比較</text><text y="130" fill="#f4f7fb" font-size="22" font-weight="700">残す施策を決める</text><text y="163" fill="#9db0c3" font-size="18">同じ指標で再集計</text></g></g></g>
<rect x="262" y="654" width="916" height="72" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="699" text-anchor="middle" fill="#f4f7fb" font-family="sans-serif" font-size="23" font-weight="700">改善しなかった施策は続けず、次の原因を検証</text></svg>

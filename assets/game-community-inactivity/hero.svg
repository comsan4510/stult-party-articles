<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">ゲームコミュニティ過疎化対策の全体像</title><desc id="desc">人数を増やす前に募集から再参加までの停止地点を診断する流れ</desc>
  <rect width="1440" height="810" fill="#081525"/><path d="M0 710H1440M0 620H1440M0 530H1440" stroke="#132b40"/>
  <text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">RECOVERY MAP</text>
  <text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">人数を足す前に、止まった流れを直す</text>
  <text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">募集作成 → 成立 → プレイ → 再参加の順に診断</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(80 278)"><rect width="270" height="238" rx="22" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><circle cx="135" cy="62" r="30" fill="#153f49"/><text x="135" y="72" fill="#61dbc5" font-size="28" font-weight="700">1</text><text x="135" y="128" fill="#f4f7fb" font-size="27" font-weight="700">募集を作る</text><text x="135" y="169" fill="#9db0c3" font-size="18">作成者はいるか</text><text x="135" y="199" fill="#9db0c3" font-size="18">入力負担は小さいか</text></g>
    <g transform="translate(417 278)"><rect width="270" height="238" rx="22" fill="#10253a" stroke="#7da8ef" stroke-width="3"/><circle cx="135" cy="62" r="30" fill="#24395e"/><text x="135" y="72" fill="#7da8ef" font-size="28" font-weight="700">2</text><text x="135" y="128" fill="#f4f7fb" font-size="27" font-weight="700">人数が集まる</text><text x="135" y="169" fill="#9db0c3" font-size="18">時間・人数・経験が</text><text x="135" y="199" fill="#9db0c3" font-size="18">参加者と合うか</text></g>
    <g transform="translate(754 278)"><rect width="270" height="238" rx="22" fill="#10253a" stroke="#f0bd63" stroke-width="3"/><circle cx="135" cy="62" r="30" fill="#4a3822"/><text x="135" y="72" fill="#f0bd63" font-size="28" font-weight="700">3</text><text x="135" y="128" fill="#f4f7fb" font-size="27" font-weight="700">実際に遊ぶ</text><text x="135" y="169" fill="#9db0c3" font-size="18">集合と会話方法が</text><text x="135" y="199" fill="#9db0c3" font-size="18">一文で分かるか</text></g>
    <g transform="translate(1091 278)"><rect width="270" height="238" rx="22" fill="#10253a" stroke="#c991db" stroke-width="3"/><circle cx="135" cy="62" r="30" fill="#42304f"/><text x="135" y="72" fill="#c991db" font-size="28" font-weight="700">4</text><text x="135" y="128" fill="#f4f7fb" font-size="27" font-weight="700">また参加する</text><text x="135" y="169" fill="#9db0c3" font-size="18">次回募集が見えるか</text><text x="135" y="199" fill="#9db0c3" font-size="18">初参加者が戻れるか</text></g>
  </g>
  <g fill="none" stroke="#7890a8" stroke-width="4"><path d="M354 397H405"/><path d="M691 397H742"/><path d="M1028 397H1079"/></g><g fill="#7890a8"><path d="m405 397-14-9v18z"/><path d="m742 397-14-9v18z"/><path d="m1079 397-14-9v18z"/></g>
  <rect x="225" y="614" width="990" height="96" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="654" text-anchor="middle" fill="#f4f7fb" font-family="sans-serif" font-size="24" font-weight="700">止まった地点を一つ選び、4週間だけ同じ定義で比較</text><text x="720" y="690" text-anchor="middle" fill="#79dfac" font-family="sans-serif" font-size="19">登録者数ではなく、募集の流れを回復させる</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">参加表明からプレイまでの摩擦点</title><desc id="desc">再通知、集合場所、会話方法、初参加者対応を順に確認する図</desc><rect width="1440" height="810" fill="#081525"/>
<text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">FRICTION MAP</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">参加表明のあとに、4つの橋をかける</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">意欲を疑う前に、開始直前の案内を確認</text>
<g font-family="sans-serif" text-anchor="middle"><g transform="translate(80 285)"><rect width="275" height="220" rx="22" fill="#10253a" stroke="#61dbc5" stroke-width="3"/><text x="137.5" y="58" fill="#61dbc5" font-size="18" font-weight="700">30–60分前</text><text x="137.5" y="112" fill="#f4f7fb" font-size="27" font-weight="700">再通知</text><text x="137.5" y="156" fill="#9db0c3" font-size="18">開始時刻を</text><text x="137.5" y="185" fill="#9db0c3" font-size="18">一度だけ知らせる</text></g>
<g transform="translate(415 285)"><rect width="275" height="220" rx="22" fill="#10253a" stroke="#7da8ef" stroke-width="3"/><text x="137.5" y="58" fill="#7da8ef" font-size="18" font-weight="700">WHERE</text><text x="137.5" y="112" fill="#f4f7fb" font-size="27" font-weight="700">集合場所</text><text x="137.5" y="156" fill="#9db0c3" font-size="18">一文で迷わず</text><text x="137.5" y="185" fill="#9db0c3" font-size="18">到着できる</text></g>
<g transform="translate(750 285)"><rect width="275" height="220" rx="22" fill="#10253a" stroke="#f0bd63" stroke-width="3"/><text x="137.5" y="58" fill="#f0bd63" font-size="18" font-weight="700">VOICE</text><text x="137.5" y="112" fill="#f4f7fb" font-size="27" font-weight="700">会話方法</text><text x="137.5" y="156" fill="#9db0c3" font-size="18">必須・任意・聞き専</text><text x="137.5" y="185" fill="#9db0c3" font-size="18">期待値を明記</text></g>
<g transform="translate(1085 285)"><rect width="275" height="220" rx="22" fill="#10253a" stroke="#c991db" stroke-width="3"/><text x="137.5" y="58" fill="#c991db" font-size="18" font-weight="700">WELCOME</text><text x="137.5" y="112" fill="#f4f7fb" font-size="27" font-weight="700">声かけ担当</text><text x="137.5" y="156" fill="#9db0c3" font-size="18">初参加者を迎える</text><text x="137.5" y="185" fill="#9db0c3" font-size="18">一人を決める</text></g></g>
<g fill="#7890a8"><path d="m399 395-18-11v22z"/><path d="m734 395-18-11v22z"/><path d="m1069 395-18-11v22z"/></g><g stroke="#7890a8" stroke-width="4"><path d="M355 395h44M690 395h44M1025 395h44"/></g>
<rect x="205" y="603" width="1030" height="106" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="646" text-anchor="middle" fill="#f4f7fb" font-family="sans-serif" font-size="24" font-weight="700">開始時刻・場所・ボイス・終了予定を同じ書式で送る</text><text x="720" y="684" text-anchor="middle" fill="#79dfac" font-family="sans-serif" font-size="19">案内先を増やさず、募集からプレイまでの移動を減らす</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">登録者数ではなく見る5つの指標</title><desc id="desc">募集作成者から7日以内の再活動までの5指標</desc><rect width="1440" height="810" fill="#081525"/>
<text x="72" y="62" fill="#61dbc5" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4">FLOW METRICS</text><text x="72" y="126" fill="#f4f7fb" font-family="sans-serif" font-size="43" font-weight="700">累計人数ではなく、週ごとの流れを見る</text><text x="72" y="174" fill="#9db0c3" font-family="sans-serif" font-size="22">同じ定義で4週間並べると、停止地点が見える</text>
<path d="M140 392H1300" stroke="#29465f" stroke-width="10" stroke-linecap="round"/><g font-family="sans-serif" text-anchor="middle">
<g transform="translate(150 392)"><circle r="66" fill="#153f49" stroke="#61dbc5" stroke-width="4"/><text y="10" fill="#61dbc5" font-size="34" font-weight="700">01</text><text y="118" fill="#f4f7fb" font-size="23" font-weight="700">募集作成者数</text><text y="151" fill="#9db0c3" font-size="18">供給者の広がり</text></g>
<g transform="translate(435 392)"><circle r="66" fill="#24395e" stroke="#7da8ef" stroke-width="4"/><text y="10" fill="#7da8ef" font-size="34" font-weight="700">02</text><text y="118" fill="#f4f7fb" font-size="23" font-weight="700">募集数</text><text y="151" fill="#9db0c3" font-size="18">週内の機会数</text></g>
<g transform="translate(720 392)"><circle r="66" fill="#4a3822" stroke="#f0bd63" stroke-width="4"/><text y="10" fill="#f0bd63" font-size="34" font-weight="700">03</text><text y="118" fill="#f4f7fb" font-size="23" font-weight="700">成立率</text><text y="151" fill="#9db0c3" font-size="18">必要人数への到達</text></g>
<g transform="translate(1005 392)"><circle r="66" fill="#42304f" stroke="#c991db" stroke-width="4"/><text y="10" fill="#c991db" font-size="34" font-weight="700">04</text><text y="118" fill="#f4f7fb" font-size="23" font-weight="700">プレイ率</text><text y="151" fill="#9db0c3" font-size="18">表明から実施へ</text></g>
<g transform="translate(1290 392)"><circle r="66" fill="#204235" stroke="#79dfac" stroke-width="4"/><text y="10" fill="#79dfac" font-size="34" font-weight="700">05</text><text y="118" fill="#f4f7fb" font-size="23" font-weight="700">7日再活動率</text><text y="151" fill="#9db0c3" font-size="18">次の参加へ</text></g></g>
<rect x="230" y="641" width="980" height="82" rx="18" fill="#0e2134" stroke="#29465f"/><text x="720" y="692" text-anchor="middle" fill="#f4f7fb" font-family="sans-serif" font-size="24" font-weight="700">低下した指標の一つ手前に、改善対象がある</text></svg>
